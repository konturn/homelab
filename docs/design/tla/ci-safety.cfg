\* CI seed: S1-S11 on the playbook topology (ci-pages.cfg covers the page class), one delivery per alert.
SPECIFICATION Spec
CONSTANTS
  MUT = "none"
  MaxRuns = 1
  MaxDeliveries = 1
  Redeliver = {}
  Fps = {"mqtt", "zig", "app", "appdup"}
INVARIANTS S1_OneActionPerTarget S2_OnlyAllowedActions S3_KillSwitchStops S4_RateLimit S5_BreakerHolds S6_OneRootCause S7_NoActDuringDeploy S8_NoDoubleAction S9_PageClassPaged S10_NoActInMaint S11_PageInMaint
