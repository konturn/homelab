\* Liveness (and safety again) on a smaller instance: the dependency pair
\* (mqtt -> zigbee) and one playbook-backed container, one delivery each.
SPECIFICATION Spec
CONSTANTS
  MUT = "none"
  MaxRuns = 1
  MaxDeliveries = 1
  Redeliver = {}
  Fps = {"mqtt", "zig", "app"}
  OcRecovers = FALSE
  FallbackFps = {}
  Delivery = TRUE
  SuppFps = {"app"}
INVARIANTS S1_OneActionPerTarget S2_OnlyAllowedActions S3_KillSwitchStops S4_RateLimit S5_BreakerHolds S6_OneRootCause S7_NoActDuringDeploy S8_NoDoubleAction S9_PageClassPaged S10_NoActInMaint S11_PageInMaint S12_HandledNotForwarded
PROPERTIES L1_EveryIncidentHandled L3_BreakerPages L5_LocksReleased L6_SuppressionsExpire L7_WindowsClose L8_RecoveryAfterWindow
