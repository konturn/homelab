\* Correlation only when an event arrives: the root cause arriving second does not stop the symptom's playbook (doc 12.6 b).
\* expect: S6_OneRootCause
SPECIFICATION Spec
CONSTANTS
  MUT = "CorrelateOnArrivalOnly"
  MaxRuns = 1
  MaxDeliveries = 2
  Redeliver = {"app"}
  Fps = {"mqtt", "zig", "app", "appdup", "sec"}
INVARIANTS S6_OneRootCause
