\* Correlation only while the router still works on the root cause: once it is escalated, dependents act (doc 12.6 e).
\* expect: S6_OneRootCause
SPECIFICATION Spec
CONSTANTS
  MUT = "CorrelateWhileActiveOnly"
  MaxRuns = 1
  MaxDeliveries = 2
  Redeliver = {"app"}
  Fps = {"mqtt", "zig", "app", "appdup", "sec"}
INVARIANTS S6_OneRootCause
