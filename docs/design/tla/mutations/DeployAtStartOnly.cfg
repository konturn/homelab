\* Deploy lock checked only at playbook start, not by the executor (doc 12.6 a).
\* expect: S7_NoActDuringDeploy
SPECIFICATION Spec
CONSTANTS
  MUT = "DeployAtStartOnly"
  MaxRuns = 1
  MaxDeliveries = 2
  Redeliver = {"app"}
  Fps = {"mqtt", "zig", "app", "appdup", "sec"}
INVARIANTS S7_NoActDuringDeploy
