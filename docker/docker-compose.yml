    hostname: nkontur.com
    ports:
      - "443:80"
    # Memory (2026-09-01): reverted to 3G after the 2026-07-02 right-size to 1536M
    # was proven wrong in production. The 1536M limit first took effect when the
    # container was recreated on 2026-08-30 00:00 UTC; at 2026-09-01 03:48:36 UTC
    # nextcloud hit the cap and the kernel memcg OOM-killer killed an apache2 child
    # (memcg /docker/4a33dea8..., UID 33). Telegraf recorded usage 1260M = 82.1% of
    # limit with memcg fail_count=1 in that window.
    # The "148 MB peak" the old comment sized against was measured entirely inside a
    # quiet period; the real workload spikes to ~1.2-1.5G on an infrequent cycle, so
    # a short observation window never sees it. Under the previous 3G limit the
