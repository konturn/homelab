    ports:
      - "8200:8200"
    deploy:
      resources:
        limits:
          memory: 256M
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK    # Lock memory to prevent secrets from being swapped
      - CHOWN       # File ownership changes during startup
      - DAC_OVERRIDE # Access files regardless of permissions
      - FOWNER      # Modify file ownership metadata
      - SETUID      # Process UID changes
      - SETGID      # Process GID changes
    security_opt:
      - no-new-privileges=true
    volumes:
      - vault_data:/vault/file
      - '{{ docker_persistent_data_path }}/vault/config:/vault/config:ro'
      - '{{ docker_persistent_data_path }}/certs:/vault/certs:ro'
      - '{{ docker_persistent_data_path }}/vault/scripts/auto-unseal.sh:/vault/scripts/auto-unseal.sh:ro'
      - '{{ docker_persistent_data_path }}/vault/unseal:/vault/unseal:ro'
      - '{{ docker_persistent_data_path }}/vault/logs:/vault/logs'
    environment:
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_API_ADDR=https://{{ vault_ip }}:8200
      - VAULT_CACERT=/vault/certs/nkontur.com/live/iot.lab.nkontur.com-0003/chain.pem
      # Skip TLS verify for healthcheck using loopback
      - VAULT_SKIP_VERIFY=true
      # Path to unseal keys file inside the container
      - VAULT_UNSEAL_KEYS_FILE=/vault/unseal/unseal-keys
    entrypoint: /bin/sh
    command: ["/vault/scripts/auto-unseal.sh"]
    healthcheck:
      test: ["CMD", "sh", "-c", "vault status -address=https://127.0.0.1:8200; [ $$? -le 2 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # JIT Approval Service - Credential brokering with Telegram approval flow
  # Receives credential requests from openclaw, sends approval prompts via Telegram,
  # and issues short-lived Vault tokens on approval.
  jit-approval-svc:
    image: gitlab-registry.lab.nkontur.com:443/root/homelab/jit-approval-svc:latest
    container_name: jit-approval-svc
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      internal:
        ipv4_address: {{ jit_approval_svc_ip }}
      jit-bridge:
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - VAULT_ADDR=https://vault.lab.nkontur.com:8200
      - VAULT_ROLE_ID={{ vault_jit_approle_role_id | replace("$", "$$") }}
      - VAULT_SECRET_ID={{ vault_jit_approle_secret_id | replace("$", "$$") }}
      - TELEGRAM_BOT_TOKEN={{ vault_jit_telegram_bot_token | replace("$", "$$") }}
      - TELEGRAM_CHAT_ID=8531859108
      - TELEGRAM_WEBHOOK_SECRET={{ vault_jit_telegram_webhook_secret | replace("$", "$$") }}
      - LISTEN_ADDR=:8080
      - REQUEST_TIMEOUT=300
      - ALLOWED_REQUESTERS=prometheus
      - JIT_API_KEY={{ vault_jit_api_key | replace("$", "$$") }}
      - GITLAB_URL=https://gitlab.lab.nkontur.com
      - GITLAB_ADMIN_TOKEN={{ vault_jit_gitlab_admin_token | replace("$", "$$") }}
      - SSH_VAULT_PATH=ssh-client-signer
      - TAILSCALE_API_URL=https://api.tailscale.com
      - TELEGRAM_WEBHOOK_URL=https://jit-webhook.nkontur.com/telegram/webhook
      - PAPERLESS_URL=https://paperless-ngx.lab.nkontur.com
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  deluge:
    container_name: deluge
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SETUID         # s6-overlay drops to PUID/configured user
      - SETGID         # s6-overlay drops to PGID/configured group
      - CHOWN          # s6-overlay chowns data directories at startup
      - DAC_OVERRIDE   # s6-overlay reads/writes files across users during init
    ports:
      - "443:8112"
    image: 'lscr.io/linuxserver/deluge:2.2.0@sha256:dddd1f95b4fcea607813b12bd821396519e5fcc250e5ce138eb7e0dbf147e995'
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: {{ deluge_ip }}
    # Memory (2026-09-01, 30d max): 8192M of 8192M = 100.0% -- capped, OOM risk.
    # Growth pattern 4G->6G->8G->12G indicates a libtorrent leak; tracked in #122.
    # 12G is headroom, not a fix.
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 3G
    volumes:
      - '{{ docker_persistent_data_path }}/deluge:/config'
      - '/mpool/samba_share/nfs:/downloads'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8112"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  bitwarden:
    container_name: bitwarden
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    ports:
      - "443:80"
    image: 'vaultwarden/server:1.37.2-alpine@sha256:d16a304c2476fd787634ddde2c00be8fdfa1a72539438c626ece3686b5b88ab4'
    restart: unless-stopped
    networks:
      - external
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - '{{ docker_persistent_data_path }}/bitwarden/data/:/data/'
    env_file:
      - '{{ docker_persistent_data_path }}/bitwarden/global.override.env'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  blog:
    image: wordpress:7.1.0-php8.3-apache@sha256:8801a1239d7ba9fb340a5fc5ba0bf7f8d3652adbd64893e3fba7992ba618108e
    container_name: wordpress
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # Apache master binds to port 80 and forks workers as www-data;
    # entrypoint chowns wp-content directories.
    cap_add:
      - CHOWN            # chown wp-content and uploads directories
      - DAC_OVERRIDE     # read/write config files across www-data/root
      - NET_BIND_SERVICE # Apache binds to port 80
      - SETGID           # Apache workers drop to www-data group
      - SETUID           # Apache workers drop to www-data user
    ports:
      - "443:80"
    networks:
      - external
      - wordpress_internal
    # Memory (2026-09-01, 30d max): 125M. 384M gives 3.1x headroom.
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      WORDPRESS_DB_HOST: wordpress_db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: {{ vault_wordpress_db_password | default(lookup('env', 'WORDPRESS_DB_PASSWORD')) | trim | replace("$", "$$") }}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - {{ docker_persistent_data_path }}/wordpress/html:/var/www/html
      - {{ docker_persistent_data_path }}/wordpress/config:/etc/wordpress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  wordpress_db:
    image: mysql:9.7.2-oraclelinux9@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
    container_name: wordpress_db
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    networks:
      - wordpress_internal
    restart: unless-stopped
    # MySQL entrypoint chowns data dir and drops to mysql user
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - SYS_NICE         # MySQL IO thread scheduling priority
    deploy:
      resources:
        limits:
          memory: 768M
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: {{ vault_wordpress_db_password | default(lookup('env', 'WORDPRESS_DB_PASSWORD')) | trim | replace("$", "$$") }}
      MYSQL_ROOT_PASSWORD: {{ vault_wordpress_db_password | default(lookup('env', 'WORDPRESS_DB_PASSWORD')) | trim | replace("$", "$$") }}
    volumes:
      - wordpress_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  diagram:
    container_name: diagram
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    ports:
      - "443:8080"
    networks:
      internal:
    image: jgraph/drawio:31.4.2@sha256:19d71d91d092e65132ea22b2e1cfcddf9716402a01386fbaae7190cf689adeb0
    restart: unless-stopped
    # Memory right-sized (March 2026 audit): 7-day peak 158MB, avg 140MB.
    # 768M was 5x peak. 384M gives 2.4x headroom over peak.
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  homeassistant:
    container_name: homeassistant
    networks:
      - internal
      - iot
      - external
    ports:
      - "443:8123"
    devices: 
      - "/dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller_ETDRb11A920-if00-port0:/dev/ttyUSB0"
      - "/dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller-if00-port0:/dev/ttyUSB1"
    image: "homeassistant/home-assistant:2026.9.0@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - "{{ docker_persistent_data_path }}/homeassistant:/config"
      - /etc/localtime:/etc/localtime:ro
    command:
      - /bin/bash
      - -c
      - |
        # Pin HA's default route to the internal VLAN gateway (10.3.0.1).
        #
        # This replaces `ip route del default; ip route add default via 10.3.0.1 dev eth1`,
        # which had two failure modes:
        #   1. `dev eth1` assumed Docker attached the `internal` network as eth1. HA is on
        #      three macvlan networks (internal/iot/external) and interface ordering is NOT
        #      guaranteed across container recreates, so the add failed with
        #      "RTNETLINK answers: Network unreachable" whenever eth1 was not the 10.3 leg.
        #   2. The unconditional `del` had already run, so a failed add left the container
        #      with NO default route at all -- silently, for days.
        #
        # `ip route replace` is atomic (never leaves a gap) and resolves the outbound
        # device from the on-link subnet route, so it does not care what the leg is named.
        for _ in 1 2 3; do
          ip route replace default via 10.3.0.1 && break
          sleep 2
        done
        if ip route show default | grep -q "via 10.3.0.1"; then
          echo "[net] default route via 10.3.0.1 OK"
        else
          echo "[net] ERROR: could not set default route via 10.3.0.1 -- outbound internet, DNS and cloud integrations (Home Connect, HACS) will fail" >&2
        fi
        exec /init
    cap_drop:
      - ALL
    cap_add:
      # Required: the entrypoint runs `ip route replace default via 10.3.0.1` to force HA
      # traffic onto the internal VLAN (10.3.x.x) instead of whatever Docker assigns.
      # Without NET_ADMIN the route change fails and HA falls back to the wrong gateway.
      - NET_ADMIN
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8123/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  snapserver:
    container_name: snapserver
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    hostname: snapserver
