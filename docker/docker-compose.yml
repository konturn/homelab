volumes:
  nextcloud_db:
  wordpress_db:
  ombi:
  fifos:
  # registry volume removed - using GitLab registry instead
  mosquitto:
  vault_data:
  headway_frontend_data:
  headway_travelmux_data:
  headway_pelias_config:
  headway_pelias_elasticsearch:
  headway_pelias_placeholder:
  nextcloud:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mpool/nextcloud/nextcloud
  influxdb-storage:
  grafana-storage:
  otp_data:
  tempo-storage:
  tautulli_config:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
networks:
  mgmt:
    driver: macvlan
    ipam:
      config:
          - subnet: 10.4.0.0/16
            ip_range: 10.4.0.0/18
            aux_addresses:
              shim4: 10.4.0.2
    driver_opts:
      parent: bond0.4
  iot:
    driver: macvlan
    ipam:
      config:
          - subnet: 10.6.0.0/16
            ip_range: 10.6.0.0/18
            aux_addresses:
              shim6: 10.6.0.2
    driver_opts:
      parent: bond0.6
  external:
    driver: macvlan
    ipam:
      config:
          - subnet: 10.2.0.0/16
            ip_range: 10.2.0.0/18
            aux_addresses:
              shim3: 10.2.0.2
    driver_opts:
      parent: bond0.2
  internal:
    driver: macvlan
    ipam:
      config:
          - subnet: 10.3.0.0/16
            ip_range: 10.3.0.0/18
            aux_addresses:
              shim2: 10.3.0.2
    driver_opts:
      parent: bond0.3
  guest:
    driver: macvlan
    ipam:
      config:
          - subnet: 10.5.0.0/16
            ip_range: 10.5.0.0/18
            aux_addresses:
              shim2: 10.5.0.2
    driver_opts:
      parent: bond0.5
  wordpress_internal:
    driver: bridge
  nextcloud_internal:
    driver: bridge
  jit-bridge:
    driver: bridge
    internal: true
  openclaw-nginx-bridge:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  proxy-internal:
    driver: bridge
    internal: true
  loki-backend:
    driver: bridge
    internal: true
services:
  # Docker socket proxy - filtered access for CI builds
  # Only allows build/image operations, blocks exec/start/stop
  # TLS termination handled by lab_nginx on the proxy-internal network
  docker-socket-proxy:
    container_name: docker-socket-proxy
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    networks:
      proxy-internal:
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Allow build operations
      - BUILD=1
      - IMAGES=1
      - COMMIT=1
      # Allow auth for registry push
      - AUTH=1
      # Deny dangerous operations
      - CONTAINERS=0
      - EXEC=0
      - NETWORKS=0
      - VOLUMES=0
      - POST=1  # Needed for build/push
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  plex:
    container_name: plex
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SETUID         # s6-overlay drops to PUID/configured user
      - SETGID         # s6-overlay drops to PGID/configured group
      - CHOWN          # s6-overlay chowns data directories at startup
      - DAC_OVERRIDE   # s6-overlay reads/writes files across users during init
    ports:
      - "32400/tcp"
    image: plexinc/pms-docker:1.43.3.10896-cb3ebc72d@sha256:83a425ae9e133b1cb2cc3b809556e01c61cd8ff65c582e41b4374bc2210bac9e
    networks:
      - external
      - internal
    restart: unless-stopped
    # GPU disabled until NVML driver/library mismatch is fixed
    # runtime: nvidia
    # Memory right-sized: 7-day peak 5186MB, OOM kills detected (3178 samples).
    # Previous 6G limit caused OOM under transcoding/library scan bursts.
    # 8G gives ~1.5x headroom over observed peak.
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 3G
    environment:
      - TZ=America/New_York
      # Advertise lab nginx IP so cross-VLAN clients (Apple TV on IoT) can
      # discover and direct-connect via the nginx stream proxy on port 32400.
      # Without this, Plex only advertises Docker container IPs which are
      # unreachable from other VLANs, forcing clients to use the cloud relay.
      - ADVERTISE_IP=http://{{ lab_nginx_ip }}:32400
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - /mpool/plex/config:/config
      - /mpool/plex/transcode:/transcode
      - /mpool/plex:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  tautulli:
    container_name: tautulli
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SETUID         # s6-overlay drops to PUID/configured user
      - SETGID         # s6-overlay drops to PGID/configured group
      - CHOWN          # s6-overlay chowns data directories at startup
      - DAC_OVERRIDE   # s6-overlay reads/writes files across users during init
    image: lscr.io/linuxserver/tautulli:18993091-ls1@sha256:9d4cd2f0342d4a2e31f4bcf22d9acad1b2e13fc5997a55ceec11344d699c0976
    networks:
      - internal
      - external
    ports:
      - "8181/tcp"
    # Memory (2026-09-01, 30d max): 99M. 256M gives 2.6x headroom.
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - tautulli_config:/config
    depends_on:
      plex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  pihole:
    container_name: pihole
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN            # pihole user/group setup changes file ownership
      - DAC_OVERRIDE     # access config files across pihole/root users
      - FOWNER           # chmod on gravity.db during gravity updates
      - NET_ADMIN        # DHCP server and network interface management
      - NET_BIND_SERVICE # DNS listener on port 53
      - NET_RAW          # DHCP raw socket access
      - SETGID           # drop to pihole group
      - SETUID           # drop to pihole user
    image: pihole/pihole:2026.07.2@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    ports:
      - "443:80"
    networks:
      internal:
        ipv4_address: {{ pihole_ip }}
    deploy:
      resources:
        limits:
          memory: 192M
    environment:
      TZ: America/New_York
      WEBPASSWORD: {{ vault_pihole_password | default(lookup('env', 'PIHOLE_PASSWORD')) | trim | replace("$", "$$") }}
      DNSMASQ_USER: root
    volumes:
      - {{ docker_persistent_data_path }}/pihole/conf:/etc/pihole
      - {{ docker_persistent_data_path }}/pihole/dnsmasq:/etc/dnsmasq.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dig", "+short", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  iperf3:
    container_name: iperf3
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    image: networkstatic/iperf3:latest@sha256:07dcca91c0e47d82d83d91de8c3d46b840eef4180499456b4fa8d6dadb46b6c8
    ports:
      - "5201/tcp"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
    command:
      - "-s"
    restart: unless-stopped
    healthcheck:
      # networkstatic/iperf3 ships no procps, so `pgrep` exits 127 and this
      # container has never once reported healthy (failing_streak reached
      # 180045 before it was recreated on 2026-08-30). Probe the listening
      # socket instead: 5201 == 0x1451 in the hex local_address column of
      # /proc/net/tcp. Same probe as promtail, which reports healthy.
      test: ["CMD-SHELL", "grep -q ':1451' /proc/net/tcp6 2>/dev/null || grep -q ':1451' /proc/net/tcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  nginx: 
    image: nginx:1.31.2-alpine3.23-perl@sha256:b3b337e1ef5b1bc8253dec68bc4522d9027920666a428bf51a022ceb7e3396bc
    container_name: nginx
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # nginx master runs as root, workers drop to nginx user; binds to port 80
    cap_add:
      - CHOWN            # manage log/pid file ownership
      - DAC_OVERRIDE     # read config and write logs across users
      - NET_BIND_SERVICE # bind to port 80
      - SETGID           # worker processes drop to nginx group
      - SETUID           # worker processes drop to nginx user
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    networks:
      external:
        ipv4_address: {{ nginx_ip }}
      jit-bridge:
      openclaw-nginx-bridge:
        ipv4_address: 172.30.0.10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - {{ docker_persistent_data_path }}/nginx/conf:/etc/nginx
      - {{ docker_persistent_data_path }}/nginx/webroot:/data/webroot
      - /var/log/nginx:/data/log
      - {{ docker_persistent_data_path }}/certs:/data/certs
  lab_nginx: 
    image: nginx:1.31.2-alpine3.23-perl@sha256:b3b337e1ef5b1bc8253dec68bc4522d9027920666a428bf51a022ceb7e3396bc
    container_name: lab_nginx
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # Same as nginx above
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    networks:
      internal:
        ipv4_address: {{ lab_nginx_ip }}
      proxy-internal:
      loki-backend:
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - {{ docker_persistent_data_path }}/lab_nginx/conf:/etc/nginx
      - /var/log/lab_nginx:/data/log
      - {{ docker_persistent_data_path }}/certs:/data/certs
      - {{ docker_persistent_data_path }}/docker-proxy-tls:/data/docker-proxy-tls:ro
  iot_nginx: 
    image: nginx:1.31.2-alpine3.23-perl@sha256:b3b337e1ef5b1bc8253dec68bc4522d9027920666a428bf51a022ceb7e3396bc
    container_name: iot_nginx
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # Same as nginx above
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    networks:
      iot:
        ipv4_address: {{ iot_nginx_ip }}
    restart: unless-stopped
    # Memory right-sized 2026-07-01: 30-day peak 29 MB, avg 22 MB. 128M gives 4.4x headroom.
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - {{ docker_persistent_data_path }}/iot_nginx/conf:/etc/nginx
      - /var/log/iot_nginx:/data/log
      - {{ docker_persistent_data_path }}/certs:/data/certs
  ombi:
    image: linuxserver/ombi:4.53.10@sha256:db3642d3fd492c399e1c879fe38fe77b59db6ca2e966b0d3df2aad7d376489da
    container_name: ombi
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SETUID         # s6-overlay drops to PUID/configured user
      - SETGID         # s6-overlay drops to PGID/configured group
      - CHOWN          # s6-overlay chowns data directories at startup
      - DAC_OVERRIDE   # s6-overlay reads/writes files across users during init
    networks:
      - external
      - internal
    # Memory (2026-09-01, 30d max): 662M of 768M = 86.2%. 1G gives 1.5x headroom.
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - BASE_URL=/plex-requests
    volumes:
      - ombi:/config
      - /etc/ssl/certs:/etc/ssl/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3579/api/v1/Status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  # nzbget.conf is NOT managed by ansible — it's mutated by the web UI.
  # Path overrides (MainDir=/remote, DestDir/TempDir/etc under /remote) were
  # applied manually to /persistent_data/application/nzbget/nzbget.conf.
  nzbget:
    image: linuxserver/nzbget:26.3.20260827@sha256:5f3d3fa71029004156eff2cbf4ef4455ce4ce59517cf13fa7d1d7c8a4cd2c8a4
    container_name: nzbget
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SETUID         # s6-overlay drops to PUID/configured user
      - SETGID         # s6-overlay drops to PGID/configured group
      - CHOWN          # s6-overlay chowns data directories at startup
      - DAC_OVERRIDE   # s6-overlay reads/writes files across users during init
      - FOWNER         # s6-overlay chmods config files owned by PUID
    ports:
      - "127.0.0.1:6789:6789"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - {{ docker_persistent_data_path }}/nzbget:/config
      - /mpool/plex/Movies:/movies
      - /mpool/samba_share/nfs:/remote
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:6789 | grep -qE '200|401'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  radarr:
    image: linuxserver/radarr:6.3.0.10514-ls314@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    container_name: radarr
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SETUID         # s6-overlay drops to PUID/configured user
      - SETGID         # s6-overlay drops to PGID/configured group
      - CHOWN          # s6-overlay chowns data directories at startup
      - DAC_OVERRIDE   # s6-overlay reads/writes files across users during init
    ports:
      - "443:7878"
    networks:
      - internal
    # Memory increased from 1G to 2G: library has 5300+ movies (28MB API payload).
    # 1G limit causes memory pressure during large serialization + concurrent tasks.
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      # LinuxServer.io mod: install ffmpeg/ffprobe at startup so Radarr's
      # sample-detection / media-analysis steps work (the base image ships
      # without them).
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PACKAGES=ffmpeg
    volumes:
      - {{ docker_persistent_data_path }}/radarr:/config
      - /mpool/plex/Movies:/movies
      - /mpool/samba_share/nfs:/remote
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  jackett:
    image: linuxserver/jackett:0.24.2520@sha256:d9536db7cc9f0e31bf7c1bb4bdfc477842a124bae4091046dd040b02fe5ce378
    container_name: jackett
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SETUID         # s6-overlay drops to PUID/configured user
      - SETGID         # s6-overlay drops to PGID/configured group
      - CHOWN          # s6-overlay chowns data directories at startup
      - DAC_OVERRIDE   # s6-overlay reads/writes files across users during init
    ports:
      - "443:9117"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - {{ docker_persistent_data_path }}/jackett:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117/UI/Login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  sonarr:
    image: linuxserver/sonarr:4.0.19.2979-ls322@sha256:c19aa4ecdf03d73e1d5c901da33744cb7eb4d921f89bafed1ca264601d7fa224
    container_name: sonarr
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SETUID         # s6-overlay drops to PUID/configured user
      - SETGID         # s6-overlay drops to PGID/configured group
      - CHOWN          # s6-overlay chowns data directories at startup
      - DAC_OVERRIDE   # s6-overlay reads/writes files across users during init
    ports:
      - "443:8989"
    networks:
    - internal
    # 308K history records — Sonarr benefits from memory headroom for DB operations.
    # Memory (2026-09-01, 30d max): 1889M of 2048M = 92.2%. 3G gives 1.6x headroom.
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      # LinuxServer.io mod: install ffmpeg/ffprobe at startup so Sonarr's
      # sample-detection / media-analysis steps work (the base image ships
      # without them).
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PACKAGES=ffmpeg
    volumes:
      - {{ docker_persistent_data_path }}/sonarr:/config
      - /mpool/plex/TV:/tv
      - /mpool/samba_share/nfs:/remote
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  booksonic:
    image: izderadicka/audioserve:latest@sha256:aac13420d5ef2cf322fdffecd49108708b82096d6a04b1db88ec7e7e9fc39fb3
    container_name: audioserve
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    ports:
      - "443:3000"
    networks:
      - external
    # Memory right-sized: 7-day peak 12MB, avg 7MB. 512M was 43x peak.
    # 128M gives 11x headroom over peak.
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - AUDIOSERVE_SHARED_SECRET={{ vault_audioserve_secret | default(lookup('env', 'AUDIOSERVE_SECRET')) | trim | replace("$", "$$") }}
      - VIRTUAL_HOST=audioserve.nkontur.com
      - LETSENCRYPT_HOST=audioserve.nkontur.com
    command: /audiobooks
    volumes:
      - /mpool/audioserve/audiobooks:/audiobooks
      - /mpool/audioserve/data:/data
    restart: unless-stopped
    healthcheck:
      # izderadicka/audioserve ships no wget, so the HTTP probe exits 127 and
      # this container has never once reported healthy. Probe the listening
      # socket instead: 3000 == 0x0BB8 in the hex local_address column of
      # /proc/net/tcp. Same probe as promtail, which reports healthy.
      test: ["CMD-SHELL", "grep -q ':0BB8' /proc/net/tcp6 2>/dev/null || grep -q ':0BB8' /proc/net/tcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  influxdb:
    container_name: influxdb
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # Entrypoint chowns data dirs and switches to influxdb user
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    ports:
      - "443:8086"
    networks:
      internal:
        ipv4_address: {{ influxdb_ip }}
      iot:
        ipv4_address: {{ influxdb_iot_ip }}
    image: influxdb:2.8.0@sha256:8e911da5f7b482230e61fe4bad9af0697d97a75e087f19f5f0ddfee62c2bd686
    restart: unless-stopped
    # Memory (2026-09-01, 30d max): 2719M of 4096M = 66.4%; OOM-killed 2026-07-13
    # at 4.15G anon-rss during a compaction spike. 6G covers the spike.
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G
    volumes:
        - influxdb-storage:/var/lib/influxdb2
        - {{ docker_persistent_data_path }}/influxdb/config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD={{ vault_influxdb_password | default(lookup('env', 'INFLUXDB_PASSWORD')) | trim | replace("$", "$$") }}
      - DOCKER_INFLUXDB_INIT_ORG=homelab
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN={{ vault_influxdb_admin_token | default(lookup('env', 'INFLUXDB_ADMIN_TOKEN')) | trim | replace("$", "$$") }}
      - INFLUXD_PPROF_DISABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  grafana:
    container_name: grafana
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: grafana/grafana:12.4.10-ubuntu@sha256:5d45861c3c7609c39be168e68eee120adcb3235e5760f5946108526259e7ea33
    ports:
      - "443:3000"
    networks:
      - internal
      - loki-backend
    restart: unless-stopped
    # Memory right-sized: 7-day peak 146MB (14.3%), 30d peak 158 MiB, avg 125MB.
    # 384M gives ~50% headroom above 30-day peak.
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M
    volumes:
      - grafana-storage:/var/lib/grafana
      - {{ docker_persistent_data_path }}/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD={{ vault_grafana_admin_password | default(lookup('env', 'GRAFANA_ADMIN_PASSWORD')) | trim | replace("$", "$$") }}
      - GF_SERVER_ROOT_URL=https://grafana.lab.nkontur.com
      - GF_USERS_ALLOW_SIGN_UP=false
      - INFLUXDB_TOKEN={{ vault_influxdb_grafana_read_token | default(vault_influxdb_admin_token) | default(lookup('env', 'INFLUXDB_ADMIN_TOKEN')) | trim | replace("$", "$$") }}
      # SMTP for email alerts
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=konoahko@gmail.com
      - GF_SMTP_PASSWORD={{ vault_grafana_smtp_password | default(lookup('env', 'GRAFANA_SMTP_PASSWORD')) | trim | replace("$", "$$") }}
      - GF_SMTP_FROM_ADDRESS=konoahko@gmail.com
      - GF_SMTP_FROM_NAME=Grafana Homelab
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      # OpenTelemetry tracing — export Grafana's own traces via OTLP gRPC
      - GF_TRACING_OPENTELEMETRY_OTLP_ADDRESS=otel-collector:4317
      - GF_TRACING_OPENTELEMETRY_SAMPLER_TYPE=const
      - GF_TRACING_OPENTELEMETRY_SAMPLER_PARAM=1
      # Alert state history -> Loki. The default SQLite "annotations" backend
      # fails every minute with "too many SQL variables" because multi-series
      # rules (e.g. container-health-failure) batch-insert more bind params
      # than SQLite allows, silently dropping all alert state history. Grafana
      # already shares the loki-backend network with the loki container.
      - GF_UNIFIED_ALERTING_STATE_HISTORY_BACKEND=loki
      - GF_UNIFIED_ALERTING_STATE_HISTORY_LOKI_REMOTE_URL=http://loki:3100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  loki:
    container_name: loki
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    networks:
      loki-backend:
    restart: unless-stopped
    # Memory (2026-09-01, 30d max): 791M. 1536M gives 1.9x headroom.
    deploy:
      resources:
        limits:
          memory: 1536M
    volumes:
      - {{ docker_persistent_data_path }}/loki/data:/loki
      - {{ docker_persistent_data_path }}/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    # Loki uses default json-file logging to avoid circular dependency
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  promtail:
    image: grafana/promtail:3.5.8@sha256:2a7c5469d687377de5cb7c8356cf96090c0069814d90ef35f9874db445999609
    container_name: promtail
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /etc/machine-id:/etc/machine-id:ro
      - {{ docker_persistent_data_path }}/promtail:/tmp/positions
      - {{ docker_persistent_data_path }}/promtail/config.yml:/etc/promtail/config.yml:ro
      - {{ docker_persistent_data_path }}/vault/logs:/vault/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - {{ docker_persistent_data_path }}/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    ports:
      - "1514:1514/udp"   # Syslog from network devices (Aruba switches)
    extra_hosts:
      - "loki.lab.nkontur.com:{{ lab_nginx_ip }}"
    networks:
      internal:
        ipv4_address: {{ promtail_ip }}
    # Promtail is a lightweight log shipper; ~85MB typical, spikes to ~245MB during
    # log bursts (observed 2026-06-01). 384M leaves ~36% headroom on the spike peak.
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
    # Use json-file logging to avoid circular dependency (same as Loki)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':2378' /proc/net/tcp6 2>/dev/null || grep -q ':2378' /proc/net/tcp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  # =============================================================================
  # Tempo — distributed tracing backend (Grafana Tempo)
  # Receives traces via OTLP from the OTel Collector.
  # Query via Grafana Tempo datasource.
  # =============================================================================
  tempo:
    container_name: tempo
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      loki-backend:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - tempo-storage:/var/tempo
      - {{ docker_persistent_data_path }}/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Tempo 2.10.2 uses a distroless image without wget/curl/busybox.
      # Health is monitored externally via Grafana alerting.
      disable: true

  # =============================================================================
  # OpenTelemetry Collector — central OTLP receiver
  # Services send traces/metrics/logs here via OTLP (gRPC :4317, HTTP :4318).
  # Routes traces to Tempo. Metrics/logs debug-logged for now (Telegraf/Promtail
  # handle those pipelines).
  # =============================================================================
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      internal:
      loki-backend:
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M
    volumes:
      - {{ docker_persistent_data_path }}/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Scratch-based image has no shell or HTTP utilities (curl/wget).
      # Health is monitored externally via Grafana alerting on the
      # health_check extension (port 13133).
      disable: true

  gitlab:
    container_name: gitlab
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # Omnibus GitLab runs ~10 internal services (postgres, redis, nginx, puma, etc.)
    # each as separate users, requiring broad privilege management
    cap_add:
      - CHOWN            # data dir ownership across service users (git, postgres, redis)
      - DAC_OVERRIDE     # cross-user file access for internal services
      - FOWNER           # chmod/chown across service users
      - FSETID           # preserve setgid bits on shared directories
      - KILL             # signal management for internal service supervision (runsvdir)
      - NET_BIND_SERVICE # bind to ports 80 and 22
      - SETGID           # switch between internal service groups
      - SETUID           # switch between internal service users
      - SYS_CHROOT       # PostgreSQL and other services use chroot
      - SYS_RESOURCE     # set ulimits for internal services (runsvdir-start)
    ports:
      - "22/tcp"
      - "443:80"
    networks:
      - internal
    image: 'gitlab/gitlab-ee:19.3.1-ee.0@sha256:b5167605564d64acf896be614791092d1409ac3f78214a9e4394ebb24a0be1b5'
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 65536
    deploy:
      resources:
        limits:
          memory: 14G
        reservations:
          memory: 6G
    volumes:
      - '{{ docker_persistent_data_path }}/gitlab/config:/etc/gitlab'
      - '{{ docker_persistent_data_path }}/gitlab/logs:/var/log/gitlab'
      - '{{ docker_persistent_data_path }}/gitlab/data:/var/opt/gitlab'
      - '{{ docker_persistent_data_path }}/gitlab/license_encryption_key.pub:/opt/gitlab/embedded/service/gitlab-rails/.license_encryption_key.pub:ro'
    environment:
      MALLOC_CONF: 'dirty_decay_ms:1000,muzzy_decay_ms:1000'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/-/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

  # HashiCorp Vault - Secrets Management
  # Initial setup uses file storage; will be configured for GitLab JWT auth in future MR
  vault:
    container_name: vault
    image: hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
    restart: unless-stopped
    networks:
      internal:
