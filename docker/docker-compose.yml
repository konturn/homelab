    build:
      context: "{{ lookup('env', 'CI_PROJECT_DIR') + '/docker/novnc' }}"
    image: gitlab-registry.lab.nkontur.com:443/root/homelab/novnc:latest
    container_name: novnc-dev3
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    networks:
      - internal
      - mgmt
    environment:
      - VNCSERVER=10.4.128.23
      - VNCPORT=5900
    ports:
      - "6083:6080"
    # Memory right-sized 2026-07-01: 30-day peak 38 MB, avg 17 MB. 128M gives 3.4x headroom.
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6080/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  chromium-browser:
    image: gitlab-registry.lab.nkontur.com:443/root/homelab/chromium-browser:latest
    container_name: chromium-browser
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    networks:
      internal:
        ipv4_address: "{{ chromium_browser_ip }}"
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - "{{ docker_persistent_data_path }}/chromium-browser/profile:/data/chrome-profile"
      - "{{ docker_persistent_data_path }}/chromium-browser/uploads:/uploads:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - TZ=America/New_York
      - VNC_PASSWORD={{ vault_chromium_vnc_password | default(lookup('env', 'CHROMIUM_VNC_PASSWORD')) | trim | replace("$", "$$") }}
  openclaw-gateway:
    image: gitlab-registry.lab.nkontur.com:443/root/homelab/openclaw:{{ openclaw_image_tag | default('latest') }}
    container_name: openclaw-gateway
    init: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    restart: unless-stopped
    dns:
      - {{ pihole_ip | default("10.3.32.2") }}
    networks:
      internal:
      iot:
      mgmt:
        ipv4_address: {{ openclaw_gateway_ip }}
      openclaw-nginx-bridge:
    extra_hosts:
      - "nkontur.com:172.30.0.10"
      - "www.nkontur.com:172.30.0.10"
    ports:
      - "18789:18789"
    # Memory (2026-09-01, 30d max): 2313M of 3072M = 75.3%. 5G gives 2.2x headroom.
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - TZ=America/New_York
      # Core openclaw configuration
      - OPENAI_API_KEY={{ vault_openai_api_key | default(lookup('env', 'OPENAI_API_KEY')) | trim | replace("$", "$$") }}
      - OPENCLAW_GATEWAY_TOKEN={{ vault_openclaw_gateway_token | default(lookup('env', 'OPENCLAW_GATEWAY_TOKEN')) | trim | replace("$", "$$") }}
      - TELEGRAM_BOT_TOKEN={{ vault_openclaw_telegram_token | default(lookup('env', 'OPENCLAW_TELEGRAM_TOKEN')) | trim | replace("$", "$$") }}
      - GITLAB_TOKEN={{ vault_openclaw_gitlab_token | default(lookup('env', 'OPENCLAW_GITLAB_TOKEN')) | trim | replace("$", "$$") }}
      # IPMI credentials removed — use JIT T2 (ipmi resource) instead
      # Web search
      - BRAVE_API_KEY={{ brave_api_key }}
      # Agent platforms
      - ACLAWDEMY_API_KEY={{ vault_aclawdemy_api_key | default(lookup('env', 'ACLAWDEMY_API_KEY')) | trim | replace("$", "$$") }}
      # Vault AppRole credentials (for openclaw runtime Vault access & JIT)
      - VAULT_ADDR=https://vault.lab.nkontur.com:8200
      - VAULT_APPROLE_ROLE_ID={{ lookup('env', 'VAULT_APPROLE_ROLE_ID') }}
      - VAULT_APPROLE_SECRET_ID={{ lookup('env', 'VAULT_APPROLE_SECRET_ID') }}
      # OpenTelemetry — uses native diagnostics-otel plugin (configured in openclaw.json)
      # See: https://docs.openclaw.ai/logging#export-to-opentelemetry
      # Claude subscription auth for the claude-cli backend (see openclaw.json.j2)
      - CLAUDE_CODE_OAUTH_TOKEN={{ vault_openclaw_claude_oauth_token | default(lookup('env', 'OPENCLAW_CLAUDE_OAUTH_TOKEN')) | trim | replace("$", "$$") }}
      # OpenClaw >=2026.7 scrubs auth env vars (backend clearEnv) before spawning
      # CLI backends; without this exemption the claude CLI sees no token and
      # every turn fails with "Not logged in · Please run /login"
      - OPENCLAW_LIVE_CLI_BACKEND_PRESERVE_ENV=CLAUDE_CODE_OAUTH_TOKEN
    volumes:
      - {{ docker_persistent_data_path }}/openclaw/data:/home/node/.openclaw
      - {{ docker_persistent_data_path }}/openclaw/mcporter:/home/node/.mcporter
      - {{ docker_persistent_data_path }}/openclaw/workspace:/home/node/.openclaw/workspace
      - {{ docker_persistent_data_path }}/openclaw/claude:/home/node/.claude
      - {{ docker_persistent_data_path }}/openclaw/claude.json:/home/node/.claude.json
      - {{ docker_persistent_data_path }}/chromium-browser/uploads:/uploads
      - {{ docker_persistent_data_path }}/openclaw/entrypoint-wrapper.sh:/usr/local/bin/entrypoint-wrapper.sh:ro
    entrypoint: ["entrypoint-wrapper.sh"]
    command: ["node", "/app/dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]

  # =============================================================================
  # OpenStreetMap Stack — self-hosted mapping services
  # =============================================================================

  # Valhalla — routing engine (turn-by-turn directions, isochrones, matrix)
  # First startup downloads ~11GB full US OSM extract and builds routing tiles (several hours).
  # Subsequent starts are fast — tiles are cached in the data volume.
  valhalla:
    container_name: valhalla
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3@sha256:24ef7955899dececb94e26c6dfb89d64fabfae875f980432694b0261eb6c251b
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    networks:
      - internal
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    # Memory right-sized: 7-day peak 2752MB, avg ~100MB (mostly idle routing engine).
    # Previous 16G limit was 6x peak. 6G gives 2x headroom over peak.
    # Tiles are pre-built from Headway bootstrap data (us.valhalla.tar.zst).
    # use_tiles_ignore_pbf=True prevents re-importing from the PBF (which produces broken tiles).
    # To rebuild tiles from scratch: set force_rebuild=True, remove use_tiles_ignore_pbf,
    # and allow several hours for the full US tile build.
    environment:
      - tile_urls=https://download.geofabrik.de/north-america/us-latest.osm.pbf
      - serve_tiles=True
      - build_elevation=True
      - build_admins=True
      - build_time_zones=True
      - force_rebuild=False
      - use_tiles_ignore_pbf=True
    volumes:
      - {{ docker_persistent_data_path }}/valhalla/custom_files:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # TileServer GL — vector/raster map tile server
  # NOTE: You must download an .mbtiles file into the data volume before this works.
  # Options: https://data.maptiler.com/downloads/planet/ or generate with openmaptiles.
  # Place .mbtiles files in {{ docker_persistent_data_path }}/tileserver/
  tileserver:
    container_name: tileserver
    image: maptiler/tileserver-gl:latest@sha256:3a9ccdb24820b6814c8119bcc8a4376c39867cb0ffe69d62919ef898b90c2427
    # Run as UID 1000 to match tileserver-gl's expected user.
    # The deploy-compose role pre-creates the data dir with 1000:1000 ownership.
    user: "1000:1000"
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    networks:
      - internal
    restart: unless-stopped
    # Memory right-sized: 7-day peak 92MB (17.9%), 30d peak 97 MiB, avg 58MB.
    # 192M gives ~50% headroom above 30-day peak.
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 48M
    volumes:
      - {{ docker_persistent_data_path }}/tileserver:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/health',r=>{r.statusCode===200?process.exit(0):process.exit(1)}).on('error',()=>process.exit(1))\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # =============================================================================
  # Headway Maps — unified map frontend with geocoding, routing, and tiles
  # https://github.com/headwaymaps/headway
  #
  # Architecture:
  #   - Reuses existing tileserver + valhalla containers (already have US data)
  #   - Pelias replaces Nominatim for geocoding
  #   - Travelmux provides multi-modal routing via existing Valhalla
  #   - Headway frontend ties it all together
  #
  # DATA PREREQUISITE: Before first start, you must build Headway data artifacts
  # using Dagger. See docs/HEADWAY_SETUP.md for instructions.
  # Data artifacts go in {{ docker_persistent_data_path }}/headway/
  # =============================================================================

  # Headway frontend — web UI for maps, search, and routing
  headway-frontend-init:
    container_name: headway-frontend-init
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: ghcr.io/headwaymaps/headway-init:0.4.0@sha256:d8ee45cd7d36dd4aa363e5ac6267c304aedb59838788f668d14ba03d57c18f1c
    environment:
      - HEADWAY_AREA={{ headway_area | default('us') }}
      - HEADWAY_ENABLE_TRANSIT_ROUTING=0
      - HEADWAY_SHARED_VOL=/data
    volumes:
      - {{ docker_persistent_data_path }}/headway/data/{{ headway_area | default('us') }}:/bootstrap:ro
      - headway_frontend_data:/data:rw
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  headway-frontend:
    container_name: headway-frontend
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # Stock nginx entrypoint chowns /var/cache/nginx/* and forks workers as the
    # nginx user. Without these caps the container crash-loops on every restart
    # with: chown("/var/cache/nginx/client_temp", 101) failed (Operation not permitted).
    cap_add:
      - CHOWN          # chown cache dirs at startup
      - DAC_OVERRIDE   # cross-user file access during init
      - SETGID         # worker processes drop to nginx group
      - SETUID         # worker processes drop to nginx user
    image: ghcr.io/headwaymaps/headway:0.4.0@sha256:91f30093899cbc2590284e0c63fd99a6b75d776bd2d5293be4382107b50ee023
    restart: unless-stopped
    environment:
      - HEADWAY_AREA={{ headway_area | default('us') }}
      - HEADWAY_RESOLVER=127.0.0.11
      - HEADWAY_PELIAS_URL=http://pelias-api:4000
      - HEADWAY_TILESERVER_URL=http://tileserver:8080
      - HEADWAY_TRAVELMUX_URL=http://travelmux:8000
      - HEADWAY_VALHALLA_URL=http://valhalla:8002
      - HEADWAY_ENABLE_TRANSIT_ROUTING=0
    networks:
      - internal
    volumes:
      - headway_frontend_data:/data:ro
      - {{ docker_persistent_data_path }}/headway/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    depends_on:
      headway-frontend-init:
        condition: service_completed_successfully
      pelias-api:
        condition: service_started
      tileserver:
        condition: service_started
      travelmux:
        condition: service_started
      valhalla:
        condition: service_healthy
    # Memory right-sized 2026-07-02: 30-day peak 20 MB, avg 8 MB. 192M gives 9.5x headroom.
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Travelmux — multi-modal routing proxy (wraps Valhalla)
  headway-travelmux-init:
    container_name: headway-travelmux-init
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: ghcr.io/headwaymaps/travelmux-init:latest@sha256:4f9028d9911c5e867f0eec493bf6dd8cffe2c480cd1beed15baaa5950da971f4
    environment:
      - HEADWAY_AREA={{ headway_area | default('us') }}
      - TRAVELMUX_ELEVATION_ARTIFACT_SOURCE_PATH=/bootstrap/transit/{{ headway_area | default('us') }}.elevation-tifs.tar.zst
    volumes:
      - {{ docker_persistent_data_path }}/headway/data/{{ headway_area | default('us') }}:/bootstrap:ro
      - headway_travelmux_data:/data:rw
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M

  travelmux:
    container_name: travelmux
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: ghcr.io/headwaymaps/travelmux:latest@sha256:a555aff6759c752e762b3c43a23da1a6dbf79cc8d6b837a2cfcbe30b3c414c46
    restart: unless-stopped
    environment:
      - HEADWAY_AREA={{ headway_area | default('us') }}
      - ELEVATION_TIFS_DIR=/data/elevation-tifs
    command: ["http://valhalla:8002"]
    networks:
      internal:
        aliases:
          - transitmux
    volumes:
      - headway_travelmux_data:/data:ro
    depends_on:
      headway-travelmux-init:
        condition: service_completed_successfully
    # Memory right-sized: 7-day peak 11MB, avg 6MB. 1G was 93x peak.
    # 128M gives 12x headroom over peak.
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      # Travelmux image has no shell HTTP utilities (curl/wget).
      # Health is verified externally; the /health/alive endpoint is available.
      disable: true


  # Pelias — geocoding stack (replaces Nominatim)
  pelias-config-init:
    container_name: pelias-config-init
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: ghcr.io/headwaymaps/pelias-init:0.4.0@sha256:67d27152719deaf83b8e1c09679704784a73ab153946d4885246a4d229c57c39
    environment:
      - HEADWAY_AREA={{ headway_area | default('us') }}
      - PELIAS_CONFIG_ARTIFACT_SOURCE_PATH=/bootstrap/{{ headway_area | default('us') }}.pelias.json
    command: ["/bin/bash", "/app/init_config.sh"]
    volumes:
      - {{ docker_persistent_data_path }}/headway/data/{{ headway_area | default('us') }}:/bootstrap:ro
      - headway_pelias_config:/config
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

  pelias-elasticsearch-init:
    container_name: pelias-elasticsearch-init
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: ghcr.io/headwaymaps/pelias-init:0.4.0@sha256:67d27152719deaf83b8e1c09679704784a73ab153946d4885246a4d229c57c39
    environment:
      - HEADWAY_AREA={{ headway_area | default('us') }}
      - ELASTICSEARCH_ARTIFACT_SOURCE_PATH=/bootstrap/{{ headway_area | default('us') }}.elasticsearch.tar.zst
    command: ["/bin/bash", "/app/init_elastic.sh"]
    volumes:
      - {{ docker_persistent_data_path }}/headway/data/{{ headway_area | default('us') }}:/bootstrap:ro
      - headway_pelias_elasticsearch:/usr/share/elasticsearch/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M

  pelias-placeholder-init:
    container_name: pelias-placeholder-init
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: ghcr.io/headwaymaps/pelias-init:0.4.0@sha256:67d27152719deaf83b8e1c09679704784a73ab153946d4885246a4d229c57c39
    environment:
      - HEADWAY_AREA={{ headway_area | default('us') }}
      - PLACEHOLDER_ARTIFACT_SOURCE_PATH=/bootstrap/{{ headway_area | default('us') }}.placeholder.tar.zst
    command: ["/bin/bash", "/app/init_placeholder.sh"]
    volumes:
      - {{ docker_persistent_data_path }}/headway/data/{{ headway_area | default('us') }}:/bootstrap:ro
      - headway_pelias_placeholder:/data/placeholder
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M

  pelias-elasticsearch:
    container_name: pelias-elasticsearch
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK       # mlockall for Elasticsearch memory locking
      - CHOWN          # data dir ownership on startup
      - DAC_OVERRIDE   # cross-user file access
      - SETGID         # drop to elasticsearch group
      - SETUID         # drop to elasticsearch user
    image: pelias/elasticsearch:8.12.2-beta@sha256:f0a92540175bf0183b94528b7e2f6125ed1c79110b73779fd76e48ad2d2ad6f5
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - headway_pelias_elasticsearch:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      pelias-elasticsearch-init:
        condition: service_completed_successfully
      pelias-config-init:
        condition: service_completed_successfully
    # Memory right-sized: 7-day peak 2238MB, avg 1902MB.
    # Previous 18G limit was 8x peak. 6G gives 2.7x headroom over peak.
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 3G
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9200"]
      interval: 5s
      start_period: 60s

  pelias-api:
    container_name: pelias-api
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: pelias/api:master@sha256:0b8d9287fec447b7495e43e177f4c4257e9ea06283358b320b511c693c39a9af
    restart: unless-stopped
    environment:
      - PORT=4000
      - PELIAS_CONFIG=/config/pelias.json
    networks:
      - internal
    volumes:
      - headway_pelias_config:/config:ro
    depends_on:
      pelias-elasticsearch:
        condition: service_healthy
      pelias-config-init:
        condition: service_completed_successfully
    # Memory (2026-09-01, 30d max): 101M. 384M gives 3.8x headroom.
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4000/v1/search?text=test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pelias-placeholder:
    container_name: pelias-placeholder
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: pelias/placeholder:master@sha256:50806f93581ad5ae2cc8ae6dd310d2531878af08819b16e463b8e034ccc1e921
    restart: unless-stopped
    environment:
      - PORT=4100
    networks:
      - internal
    volumes:
      - headway_pelias_config:/config:ro
      - headway_pelias_placeholder:/data/placeholder
    depends_on:
      pelias-config-init:
        condition: service_completed_successfully
      pelias-placeholder-init:
        condition: service_completed_successfully
    # Memory increased from 3G to 4G: 2713 OOM kills/week at 3G (March 2026 audit).
    # Avg 843MB, peak 1041MB — burst allocations exceed 3G. 4G gives 4x avg headroom.
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4100/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pelias-libpostal:
    container_name: pelias-libpostal
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    image: pelias/libpostal-service:latest@sha256:af8a5c9b1e6eb366aa2c8c0a7530ea578029d5132cc8ceb9026a128653a9264a
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      # pelias/libpostal-service ships no wget, so this probe exits 127 and the
      # container has never once reported healthy (failing_streak reached
      # 180025 before recreation on 2026-08-30) even though pelias-api -- which
      # depends on it for parsing -- is healthy and answering queries. Probe the
      # listening socket instead: 4400 == 0x1130 in the hex local_address
      # column of /proc/net/tcp. Same probe as promtail, which reports healthy.
      test: ["CMD-SHELL", "grep -q ':1130' /proc/net/tcp6 2>/dev/null || grep -q ':1130' /proc/net/tcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

