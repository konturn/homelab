      - mosquitto:/mosquitto/data
      - "{{ docker_persistent_data_path }}/certs:/mosquitto/certs:ro"
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 1883 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
