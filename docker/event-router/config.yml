# Event router configuration (docs/design/event-routing.md, docker/event-router/README.md).
# Baked into the image; the executor gets `mode` from this file through
# Ansible (roles/event-router), so a deploy changes both together.

# Kill switch, section 7.3: notify-only | shadow | active. The host override
# (/etc/event-router/override/mode, or the Telegram buttons) wins over this.
# Each playbook also has its own mode; it acts only when both are `active`.
mode: active

limits:
  global_actions_per_hour: 6       # decision 9; above it: notify-only + page ("automation storm")
  default: {max_runs: 1, per: 6h, cooldown: 30m}
  breaker_reset_after: 24h         # section 7.2: no triggers for 24h closes a breaker

correlation:
  burst_events: 5                  # 4.7 step 4: more than this many new incidents
  burst_within: 2m                 # in this span go straight to the agent

maintenance:
  max_duration: 12h                # 13.1

quiet_hours: {start: "23:00", end: "08:00", tz: America/New_York}   # decision 6

# Residue to OpenClaw (phase 3; doc 6.1, 7.4). forward: false keeps phases
# 1-2 behaviour: Grafana delivers every alert to OpenClaw itself and the
# router only records. With forward: true the router queues residue and pages
# for OpenClaw's /hooks/event-router, OpenClaw's Grafana route defers to the
# router for every alert the router acknowledges (/ack), and an alert the
# router never saw still reaches OpenClaw that way (L4).
openclaw:
  forward: true
  url: http://openclaw-gateway:18789/hooks/event-router
  max_age: 6h          # queued residue older than this goes to the digest instead
  jit_after: 2m        # a page OpenClaw has not taken by then goes out through the JIT bot
  ack_window: 6h       # > the event-router route's repeat_interval (4h)

# Deferred retry (doc 16): an action the executor refused for a
# time-bounded reason (recent_deploy: a deploy recreated the target less
# than no_deploy_touching ago) is "not yet", not "never". The incident stays
# open as `deferred` and the playbook is re-evaluated when the guard expires
# (+ grace) if the alert still fires, through every guard and limit again.
deferred:
  max_per_incident: 2    # a second deploy inside the window (often the revert) may defer once more
  grace: 1m

# Re-escalation of long-lived incidents (doc 16): an incident handed to
# OpenClaw or Noah whose alert Grafana keeps re-sending is not deduped into
# silence for 24h. At reforward_after it goes to OpenClaw again, marked still
# failing; at page_after again, and for user_facing services as a page
# (class still_failing, non-urgent: held through quiet hours). Evidence that
# it still fires: a delivery within firing_within (> the 4h repeat_interval).
stale:
  reforward_after: 2h
  page_after: 6h
  firing_within: 270m
  user_facing:           # container names or nodes (globs): what Noah notices himself
    - plex
    - homeassistant
    - zigbee2mqtt
    - snapserver
    - snapclient*
    - mopidy
    - navidrome
    - booksonic
    - airplay_*

# GitLab webhook (POST /gitlab; routing table rows 9 and 10).
gitlab_events:
  projects: [4, 14]
  branch: main

# Handled by recording only: the decision log and the digest, never OpenClaw
# (doc 6.1). Each needs a reason. Page classes cannot be listed here.
digest_only:
  - source: grafana
    rule_uid: container-log-flood
    labels: {container: zigbee2mqtt}
    reason: >-
      zigbee2mqtt's log volume swings with normal Zigbee work (OTA updates,
      interviews, re-pairing); the 10x-baseline rule fires on routine activity
  - source: gitlab
    kind: ci_job_failed
    labels: {deploy_job: "false"}
    reason: >-
      a runner/system failure of a job no playbook may retry (device
      firmware, Pi deploys, reports, project 14); its failed pipeline
      reaches OpenClaw on its own
  - source: gitlab
    kind: pipeline_failed
    labels: {handled_by: automerge-rollback}
    reason: >-
      only <host>:deploy-service jobs failed: the auto-merge sweep already
      rolled back, opened an automerge-rollback issue and a revert MR, and mailed Noah

reconcile_interval: 5m             # level-triggered checks (4.3)
step_interval: 15s

# 4.5 and decision 7: never restarted by a playbook. The first five are also
# hard-coded (router/config.py HARD_DENIED_TARGETS) and in the executor.
restart_denylist:
  - gitlab
  - vault
  - pihole
  - event-router
  - docker-socket-proxy
  # platform (decision 5) and other shared front ends: their own playbooks only
  - nginx
  - lab_nginx
  - iot_nginx
  - homeassistant
  - mosquitto                      # its own playbook (routing table row 3, phase 3)
  - jit-approval-svc
  - openclaw-gateway

# Agent actions (README "Agent actions"): what the OpenClaw agents may ask the
# executor for through POST /agent/<action>. Rendered into executor.json; the
# executor also hard-denies its own lists (event-router-executor
# AGENT_RESTART_DENIED, COLLECT_DENIED, UNIT_DENIED) and the restart_denylist
# above. Tiers are fixed (collect 1, reset_failed 1, restart_container 2);
# the decision per requester and tier is the JIT broker's matrix
# (jit_approval_matrix in ansible/inventory.yml).
agent_actions:
  approval_ttl: 10m        # an unanswered tap expires; an approval is good for this long
  max_pending: 2           # per requester
  collect:                 # read-only: inspect (no env values), logs, unit status, zpool, df
    max_per_hour: 30       # per requester
    # Containers beyond the restart list below (which can also be collected).
    containers:
      - gitlab
      - pihole
      - iot-dns
      - homeassistant
      - mosquitto
      - lr4-broker
      - nginx
      - lab_nginx
      - iot_nginx
      - influxdb
      - loki
      - promtail
      - nextcloud
      - nextcloud_database
      - paperless-ngx
      - paperless-redis
      - frigate
      - amcrest2mqtt
      - petlibro-camera
      - event-router
      - docker-socket-proxy
      - docker-socket-proxy-ro
    # Units beyond the reset_failed list below.
    units:
      - docker.service
      - containerd.service
      - telegraf.service
      - deadman-check.service
      - event-router-control.service
      - gitlab-runner.service
      - nut-monitor.service
      - nut-server.service
      - restic-*.service
      - frigate-backup-*.service
      - zwave-backup.service
      - zpool-scrub.service
      - zfs-zed.service
      - smartmontools.service
      - tailscaled.service
      - ipmi-metrics.service
      - llm-shadow.service
      - vulnwatchd.service
      - vulnwatch-scan.service
      - homelab-canary.service
      - wan-bypass-update.service
      - isc-dhcp-server.service
      - ntpsec.service
  restart_container:
    cooldown: 30m          # per container
    max_per_day: 3         # per container (the playbooks' 2 per 6h applies as well)
    max_per_day_total: 8
    no_deploy_touching: 2h # recent_deploy, as for restart-once
    # Containers only. Never: anything in restart_denylist or the executor's
    # AGENT_RESTART_DENIED (brokers, proxies, DNS, Home Assistant, the
    # agent's own gateway, password vault), data stores, cameras, the
    # Litter-Robot broker, libvirt VMs (not containers at all).
    containers:
      - plex
      - tautulli
      - radarr
      - sonarr
      - lidarr
      - prowlarr
      - jackett
      - ombi
      - nzbget
      - deluge
      - navidrome
      - audioserve
      - mopidy
      - snapserver
      - snapclient_*
      - airplay_*
      - zigbee2mqtt
      - ambientweather
      - hcpy
      - anomaly-detector
      - paperless-ai
      - ollama
      - grafana
      - chromium-browser
      - bluebubbles-relay
      - otel-collector
      - tempo
      - diagram
      - iperf3
    # Restarts a requester may run without a tap although its matrix cell
    # says approve. Off: empty for everyone.
    auto_approve: {}
  reset_failed:            # systemctl reset-failed only: never starts or restarts a unit
    cooldown: 10m
    max_per_day: 3
    max_per_day_total: 12
    units:
      - nut-driver@*.service
      - restic-notify-failure@*.service
      - er-selftest-*.service    # transient units the post-deploy check creates

# Always-page classes (section 6.3, decision 5), by Grafana rule uid. The
# router never runs a playbook for them (S9, S11) and hands each to OpenClaw
# as a page (Telegram; the JIT bot when OpenClaw is down). Grafana mails the
# same list, and only it (policies.yml; tests/test_repo.py keeps the two
# equal). `urgent` classes ignore quiet hours (decision 6). Failed
# remediations page too, as class failed_remediation, from the router alone.
page_classes:
  security:
    urgent: true
    rules:
      - {rule_uid: failed-ssh-logins}
      - {rule_uid: efeju4cob1ipsb}            # Vault unavailable or sealed
  data_at_risk:
    urgent: true
    rules:
      - {rule_uid: zpool-unhealthy}
      - {rule_uid: smart-disk-vanished}
      - {rule_uid: smart-disk-error}
      - {rule_uid: restic-backup-stale}
      - {rule_uid: restic-db-dumps-stale}
      - {rule_uid: restic-db-dumps-weekly-stale}
  ups:
    urgent: true
    rules:
      - {rule_uid: ups-on-battery}
      - {rule_uid: ups-battery-low}
      - {rule_uid: ups-battery-critical-30}
  platform:
    rules:
      - {rule_uid: container-health-failure, labels: {container_name: "gitlab"}}
      - {rule_uid: container-health-failure, labels: {container_name: "vault"}}
      - {rule_uid: container-health-failure, labels: {container_name: "homeassistant"}}
      - {rule_uid: container-health-failure, labels: {container_name: "pihole"}}
      - {rule_uid: container-restart-loop, labels: {container_name: "gitlab"}}
      - {rule_uid: container-restart-loop, labels: {container_name: "vault"}}
      - {rule_uid: container-restart-loop, labels: {container_name: "homeassistant"}}
      - {rule_uid: container-restart-loop, labels: {container_name: "pihole"}}
      - {rule_uid: critical-service-down, labels: {container_name: "gitlab"}}
      - {rule_uid: critical-service-down, labels: {container_name: "vault"}}
      - {rule_uid: critical-service-down, labels: {container_name: "homeassistant"}}
      - {rule_uid: critical-service-down, labels: {container_name: "pihole"}}
      - {rule_uid: pihole-dns-latency-high}          # Pi-hole not answering (5s per failed query)
      - {rule_uid: event-router-down}                # mostly reaches OpenClaw via the fallback route
  host_not_reporting:
    rules:
      - {rule_uid: host-metrics-stale}
  certificate:
    rules:
      - {rule_uid: ssl-cert-expiry-3d}

# Router deploys (resource_group deploy-router in .gitlab-ci.yml): while one
# runs, nothing but ci-orphan-cancel acts (S7).
deploy_jobs: ["router:deploy", "router:deploy-service", "facts:drift", "ups-card:drift",
              "secrets:rotate-proxied"]

# Reconciler (routing table row 11): a job of these names still running past
# its timeout (+ grace), or started before GitLab last came back, is orphaned.
# Timeouts must match .gitlab-ci.yml (tests/test_repo.py checks). Only the
# router's deploy group: device groups (switch/AP firmware) and Pi deploys
# are never cancelled automatically.
ci_orphan:
  project_id: 4
  grace: 5m
  jobs:
    "router:deploy": 45m
    "router:deploy-service": 60m
    "facts:drift": 30m
    "ups-card:drift": 30m
    "secrets:rotate-proxied": 45m
