# Routing table row 4: an unhealthy container is restarted once (Docker
# restarts crashed processes but never unhealthy ones). Not for the restart
# denylist in config.yml (platform services, decision 7), and not when a
# deploy finished in the last 2h (a deploy-correlated failure needs a revert,
# I2). A second failure in 6h trips the breaker and goes to OpenClaw.
id: restart-once
description: Restart an unhealthy non-platform container once
mode: shadow
match:
  source: grafana
  rule_uid: container-health-failure
node: {from_label: container_name}
preconditions:
  - no_recent_deploy: 2h
action: {type: restart_container, target_from_label: container_name}
verify:
  alert_resolved: 10m
limits: {max_runs: 1, per: 6h, cooldown: 30m}
on_success: {notify: digest}
on_failure: {notify: page}
