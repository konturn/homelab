# LAN-only TLS front for a WordPress edit session (edit-session.sh start).
# Not deployed by Ansible; mounted into a throwaway container on the lab LAN.
server {
    listen 443 ssl;
    http2 on;
    server_name blog.nkontur.com;
    include /etc/nginx/ssl_config;
    client_max_body_size 64m;

    allow 10.0.0.0/8;
    deny all;

    location / {
        resolver 127.0.0.11;
        set $backend http://blog:80;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
