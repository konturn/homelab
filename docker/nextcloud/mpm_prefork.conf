# Apache prefork pool for the nextcloud container, mounted over the image's
# /etc/apache2/mods-available/mpm_prefork.conf (stock: MaxRequestWorkers 150).
#
# Why (#145): on 2026-10-08 the iOS client bulk-enumerated the Calibre tree
# (dozens of SEARCH/PROPFIND in one second). Each PHP worker grew to ~290-320M
# anon and the container hit its 3G memcg limit, so the OOM killer took apache
# and Collabora processes. With 150 allowed workers, any burst of ~10 heavy DAV
# requests OOMs the container no matter what the limit is.
#
# Budget (measured 2026-11-07, PSS): built-in Collabora (coolwsd, forkit,
# kit_spare_*) ~0.37G anon, idle apache children ~10M each, page cache ~0.1G.
# 12 workers x ~280M heavy + ~0.5G base is ~3.9G, inside the 4G compose limit.
# Requests beyond 12 wait in the listen backlog instead of forking a worker.
<IfModule mpm_prefork_module>
	StartServers             4
	MinSpareServers          2
	MaxSpareServers          6
	ServerLimit             12
	MaxRequestWorkers       12
	# Recycle children so one huge request's heap is not kept for good.
	MaxConnectionsPerChild 1000
</IfModule>

# Clients connect straight to apache (no proxy in front), so an idle
# keep-alive connection pins a worker. With a 12-worker pool the stock 5s
# would let a few idle clients hold most of it.
KeepAliveTimeout 2
