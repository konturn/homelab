# lr4-broker: the Litter-Robot 4s' MQTT broker (docs/litter-robot.md).
#
# The robot's firmware connects to <provisioned host>:8883 over TLS and can
# only authenticate with a client certificate (no username/password field
# exists). So this broker is separate from `mosquitto`, whose 8883 listener
# is password-only and shared by other clients:
#   - mutual TLS against a private CA (Vault pki/whiskerless); the CA and the
#     server certificate (SAN = lr4_broker_address) are rendered from Vault
#     docker/lr4-broker at deploy
#   - the certificate CN is the MQTT username; robots get their serial as CN,
#     and the ACL limits each one to its own prod/LR4/<serial>/ topics
#   - bridged to `mosquitto` so Home Assistant (whiskerless integration) sees
#     state/activity and can send commands, without a second MQTT entry
#
# No persistence: every message here is live telemetry or a command, and a
# command replayed after a restart is worse than one that is lost.

allow_anonymous false
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

listener 8883
cafile /mosquitto/config/ca.crt
certfile /mosquitto/config/server.crt
keyfile /mosquitto/config/server.key
require_certificate true
use_identity_as_username true
acl_file /mosquitto/config/acl

# Bridge into mosquitto (TLS, its Let's Encrypt certificate; the name maps to
# mosquitto_address through extra_hosts in compose). Only the robots' topics
# cross, each in one direction. Clean session and QoS 0: a command queued
# while the bridge was down must not reach a robot later.
connection mosquitto
address mqtt.lab.nkontur.com:8883
bridge_cafile /etc/ssl/certs/ca-certificates.crt
remote_clientid lr4-bridge
remote_username lr4-bridge
remote_password {{ vault_lr4_bridge_password }}
cleansession true
# Retained 1/0 on mosquitto at $SYS/broker/connection/lr4-bridge/state
# (lr4ctl status).
notifications true
start_type automatic
restart_timeout 5 60
keepalive_interval 60
topic prod/LR4/+/state out 0
topic prod/LR4/+/activity out 0
topic prod/LR4/+/command in 0
