stream {
    include /etc/nginx/stream.d/*.conf;

    # Upstreams go through variables so nginx re-resolves them via Docker DNS
    # (resolver valid=10s). A literal `proxy_pass host:port` is resolved once
    # at startup and the `resolver` line does nothing for it. On 2026-11-08
    # plex was recreated (!994), came back on a different dynamic IP, and its
    # old address went to another container, so Plex direct connect (:32400, also used
    # by Tautulli) failed until nginx was reloaded.

    # Plex direct connect
    server {
        listen 32400;
        resolver 127.0.0.11 valid=10s;
        set $plex_upstream plex:32400;
        proxy_pass $plex_upstream;
    }
}
