http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Edge quarantine: "1" for hosts / host+path prefixes that are flagged by
    # edge-quarantine (docker/nginx/edge-quarantine). The map files are
    # rendered on the host from its state file and survive deploys; no match
    # (or no file) means nothing is quarantined. Vhosts opt in with
    # `include edge_quarantine;`.
    map "$host$uri" $edge_quarantine {
        default 0;
        include /etc/nginx/edge-quarantine/*.map;
    }

    # auth_token applies only to credential endpoints: every other URI maps to
    # "" and nginx skips the limit, so it can sit at server level without
    # throttling normal traffic (vault sync, icons, attachments).
    map $request_uri $auth_endpoint_key {
        default                    "";
        ~^/identity/connect/token  $binary_remote_addr;
    }

    # New zone name: nginx refuses a reload that changes an existing zone's key
    # ("uses the ... key while previously it used ..."), so the old auth_strict
    # zone keyed on $binary_remote_addr cannot be re-keyed in place.
    limit_req_zone $auth_endpoint_key zone=auth_token:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_status 429;

    # blog.nkontur.com ?p=<id> shortlinks -> post paths. export_static.py prints
    # these lines; refresh them when posts are added.
    map $arg_p $blog_shortlink {
        default "";
        2  /index.php/sample-page/;
        22 /index.php/2021/01/04/sad-dns-cse-433-final-project-report/;
        42 /index.php/2021/01/11/2020-movie-recap-top-ten/;
        68 /index.php/2021/01/25/formula-game-using-game-theory-to-analyze-the-probabilistic-features-of-true-quantified-boolean-formulas/;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40G;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /data/log/access.log main;
    sendfile on;
    keepalive_timeout 21600;

    # Default server - HTTP redirect
    server {
        listen 80 default_server;

        location = /health {
            access_log off;
            return 200 'OK';
        }

        location = /stub_status {
            stub_status;
            access_log off;
            allow 10.0.0.0/8;
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Default server - HTTPS catch-all
    server {
        listen 443 ssl default_server;
        include ssl_config;

        location = /health {
            access_log off;
            return 200 'OK';
        }

        location / {
            return 444;
        }
    }

    # nkontur.com / www.nkontur.com - Main site with Plex, Ombi (LAN/tailnet), static content
    server {
        server_name www.nkontur.com nkontur.com;
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        include ssl_config;
        include edge_quarantine;
        limit_req zone=general burst=20 nodelay;

        root /data/webroot/nkontur.com;
        index index.html;

        location /plex/ {
            proxy_pass http://plex:32400/;
            client_max_body_size 10m;
            client_body_buffer_size 128k;
            proxy_bind $server_addr;
            proxy_buffers 32 4k;
            proxy_cache_bypass $cookie_session;
            proxy_connect_timeout 240;
            proxy_hide_header X-Frame-Options;
            proxy_http_version 1.1;
            proxy_no_cache $cookie_session;
            proxy_read_timeout 240;
            proxy_redirect http:// $scheme://;
            proxy_send_timeout 240;
            proxy_set_header Connection upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
            proxy_set_header Upgrade $http_upgrade;
            send_timeout 5m;
        }

        if ($http_referer ~ /plex/) {
            rewrite ^/media/(.*) /plex/media/$1? redirect;
        }

        rewrite ^/web/(.*) /plex/web/$1? redirect;
        rewrite ^/media/(.*) /plex/media/$1? redirect;

        if ($http_referer ~* /plex-requests/) {
            rewrite ^/dist/(.*) $scheme://$host/plex-requests/dist/$1 permanent;
        }

        location /plex-requests/ {
            # Ombi: LAN and tailnet only; the rest of the site stays public
            allow 10.0.0.0/8;
            allow 100.64.0.0/10;
            deny all;
            proxy_pass http://ombi:3579/plex-requests/;
        }

        location /net-map {
            alias /data/webroot/nkontur.com/net-map;
            index index.html;
        }

        location /images/ {
            alias /data/webroot/html/images/;
        }

        location /files/ {
            alias /data/webroot/html/files/;
        }

        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }

    # JIT Webhook - Telegram webhook endpoint with IP allowlist
    server {
        listen 443 ssl;
        http2 on;
        server_name jit-webhook.nkontur.com;
        include ssl_config;

        location /telegram/webhook {
            # Telegram IP ranges
            allow 91.108.56.0/22;
            allow 91.108.4.0/22;
            allow 91.108.8.0/22;
            allow 91.108.16.0/22;
            allow 91.108.12.0/22;
            allow 149.154.160.0/20;
            allow 91.105.192.0/23;
            allow 91.108.20.0/22;
            allow 185.76.151.0/24;
            deny all;

            resolver 127.0.0.11;
            set $backend http://jit-approval-svc:8080;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }

    # Booksonic
    server {
        listen 443 ssl;
        http2 on;
        server_name booksonic.nkontur.com;
        include ssl_config;
        include edge_quarantine;
        # LAN and tailnet only (tailnet clients arrive masqueraded from the
        # router's VLAN 2 address; 100.64.0.0/10 covers a future no-SNAT setup)
        allow 10.0.0.0/8;
        allow 100.64.0.0/10;
        deny all;

        location / {
            resolver 127.0.0.11;
            set $backend http://booksonic:3000;
            proxy_pass $backend;
            proxy_send_timeout 240;
            proxy_read_timeout 240;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }
    }

    # Bitwarden
    server {
        listen 443 ssl;
        http2 on;
        server_name bitwarden.nkontur.com;
        include ssl_config;
        include edge_quarantine;
        limit_req zone=auth_token burst=10 nodelay;
        # LAN and tailnet only (tailnet clients arrive masqueraded from the
        # router's VLAN 2 address; 100.64.0.0/10 covers a future no-SNAT setup)
        allow 10.0.0.0/8;
        allow 100.64.0.0/10;
        deny all;

        location / {
            resolver 127.0.0.11;
            set $backend http://bitwarden:80;
            proxy_pass $backend;
            proxy_send_timeout 240;
            proxy_read_timeout 240;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }

        # Admin panel: LAN and tailnet sources only
        location ^~ /admin {
            allow 10.0.0.0/8;
            allow 100.64.0.0/10;
            deny all;
            resolver 127.0.0.11;
            set $backend http://bitwarden:80;
            proxy_pass $backend;
            proxy_send_timeout 240;
            proxy_read_timeout 240;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }
    }

    # Blog: static export of the retired WordPress site. Files come from
    # docker/nginx/sites/blog.nkontur.com/ (made by docker/wordpress/export_static.py,
    # see docker/wordpress/README.md). No PHP runs behind this vhost.
    server {
        listen 443 ssl;
        http2 on;
        server_name blog.nkontur.com;
        include ssl_config;
        include edge_quarantine;
        limit_req zone=general burst=20 nodelay;

        root /data/webroot/blog.nkontur.com;
        index index.html index.xml;
        # Relative Location on the directory-slash 301s (scheme/host from the client).
        absolute_redirect off;
        error_page 404 /404.html;

        # Old ?p=<id> shortlinks redirect to their posts, as WordPress did.
        if ($blog_shortlink) {
            return 301 $blog_shortlink;
        }

        # Pages are <path>/index.html; a path without the trailing slash gets a 301.
        location / {
            try_files $uri $uri.html $uri/ =404;
            add_header Cache-Control "public, max-age=600" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Theme/core assets and uploads. Names are not content-hashed, so a week.
        location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # RSS feeds are saved as <path>/feed/index.xml.
        location ~ /feed/(?:index\.xml)?$ {
            types { }
            default_type "application/rss+xml; charset=UTF-8";
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Sitemap stylesheets: browsers only apply an XSLT served as XML.
        location ~ \.xsl$ {
            types { }
            default_type "text/xsl; charset=UTF-8";
            add_header Cache-Control "public, max-age=3600" always;
        }

        # wp-login.php, xmlrpc.php and every other script path: nothing to run.
        location ~* \.php$ {
            return 404;
        }
        location ^~ /wp-admin {
            return 404;
        }

        location = /favicon.ico {
            return 302 /wp-includes/images/w-logo-gray-white-bg.png;
        }

        location = /404.html {
            internal;
        }
    }

    # Home Assistant (external)
    server {
        listen 443 ssl;
        http2 on;
        server_name homeassistant.nkontur.com;
        include ssl_config;
        include edge_quarantine;
        # LAN and tailnet only (tailnet clients arrive masqueraded from the
        # router's VLAN 2 address; 100.64.0.0/10 covers a future no-SNAT setup)
        allow 10.0.0.0/8;
        allow 100.64.0.0/10;
        deny all;

        location / {
            resolver 127.0.0.11;
            set $backend http://homeassistant:8123;
            proxy_pass $backend;
            proxy_send_timeout 240;
            proxy_read_timeout 240;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }
    }

    # Nextcloud
    server {
        listen 443 ssl;
        http2 on;
        server_name nextcloud.nkontur.com;
        include ssl_config;
        include edge_quarantine;

        location / {
            resolver 127.0.0.11;
            set $backend http://nextcloud:80;
            proxy_pass $backend;
            proxy_send_timeout 240;
            proxy_read_timeout 240;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }
    }

    # Edge-quarantine drill target: static page, LAN and tailnet only. Used to
    # exercise the quarantine switch end to end (docker/nginx/edge-quarantine).
    server {
        listen 443 ssl;
        http2 on;
        server_name edge-canary.lab.nkontur.com;
        include ssl_config;
        include edge_quarantine;

        allow 10.0.0.0/8;
        allow 100.64.0.0/10;
        deny all;

        location / {
            default_type text/plain;
            return 200 "edge-canary ok\n";
        }
    }
}
