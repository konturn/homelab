http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_status 429;

    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40G;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /data/log/access.log main;
    sendfile on;
    keepalive_timeout 21600;

    # Default server - HTTP redirect
    server {
        listen 80 default_server;

        location = /health {
            access_log off;
            return 200 'OK';
        }

        location = /stub_status {
            stub_status;
            access_log off;
            allow 10.0.0.0/8;
            deny all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Default server - HTTPS catch-all
    server {
        listen 443 ssl default_server;
        include ssl_config;

        location = /health {
            access_log off;
            return 200 'OK';
        }

        location / {
            return 444;
        }
    }

    # Loki - push-only endpoint for satellite promtail.
    # Satellites are on the IoT VLAN and cannot reach loki.lab.nkontur.com on
    # the internal VLAN. Only the push path is exposed here, only to the
    # satellite hosts, and only with the IoT push credential (a separate
    # htpasswd that lab_nginx does not use). Query endpoints are not served.
    server {
        listen 443 ssl;
        http2 on;
        server_name loki.iot.lab.nkontur.com;
        include ssl_config;

        location = /loki/api/v1/push {
            # Satellite hosts (ansible_host in ansible/inventory.yml).
            allow 10.6.128.6;   # zwave
            allow 10.6.128.11;  # satellite-2
            deny all;

            # NOTE: no quotes around limit_except args, same as internal_http.conf.
            limit_except POST {
                deny all;
            }
            auth_basic "Loki Push Auth";
            auth_basic_user_file /etc/nginx/loki-iot.htpasswd;

            resolver 127.0.0.11;
            set $backend http://loki:3100;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 444;
        }
    }

    # Home Assistant
    server {
        listen 443 ssl;
        http2 on;
        server_name homeassistant.iot.lab.nkontur.com;
        include ssl_config;

        location / {
            resolver 127.0.0.11;
            set $backend http://homeassistant:8123;
            proxy_pass $backend;
            proxy_send_timeout 240;
            proxy_read_timeout 240;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }
    }

    # Zigbee2MQTT
    server {
        listen 443 ssl;
        http2 on;
        server_name zigbee2mqtt.iot.lab.nkontur.com;
        include ssl_config;

        location / {
            resolver 127.0.0.11;
            set $backend http://zigbee2mqtt:8080;
            proxy_pass $backend;
            proxy_send_timeout 240;
            proxy_read_timeout 240;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }
    }

    # Mopidy
    server {
        listen 443 ssl;
        http2 on;
        server_name mopidy.iot.lab.nkontur.com;
        include ssl_config;

        location / {
            resolver 127.0.0.11;
            set $backend http://mopidy:6680;
            proxy_pass $backend;
            proxy_send_timeout 240;
            proxy_read_timeout 240;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }
    }

    # Moltbot Gateway
    server {
        listen 443 ssl;
        http2 on;
        server_name openclaw-gateway.iot.lab.nkontur.com;
        include ssl_config;

        location / {
            resolver 127.0.0.11;
            set $backend http://openclaw-gateway:18789;
            proxy_pass $backend;
            proxy_send_timeout 240;
            proxy_read_timeout 240;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
        }
    }
}
