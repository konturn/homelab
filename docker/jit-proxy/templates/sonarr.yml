# Sonarr (design 6.1).
resource: sonarr
min_tier: 1
upstream: https://sonarr.lab.nkontur.com
auth: {type: header, name: X-Api-Key, vault_path: homelab/data/docker/sonarr, field: api_key}

deny:
  - {path: "/api/v3/config/**"}
  - {path: "/api/v3/downloadclient/**"}
  - {path: "/api/v3/indexer"}
  - {path: "/api/v3/indexer/{id:int}"}
  - {path: "/api/v3/indexer/schema/**"}
  - {path: "/api/v3/notification/**"}
  - {path: "/api/v3/importlist/**"}
  - {path: "/api/v3/system/backup/**"}
  - {path: "/api/v3/system/restart"}
  - {path: "/api/v3/system/shutdown"}
  - {path: "/api/v3/update/**"}
  - {path: "/api/v3/log/file/**"}
  - {path: "/api/v3/customformat/**", method: POST}
  - {path: "/api/v3/customformat/**", method: PUT}
  - {path: "/api/v3/customformat/**", method: DELETE}
  - {path: "/api/v3/qualityprofile/**", method: POST}
  - {path: "/api/v3/qualityprofile/**", method: PUT}
  - {path: "/api/v3/qualityprofile/**", method: DELETE}

templates:
  read:
    min_tier: 1
    description: "Read series, episodes, queue, history, calendar; search metadata"
    allow:
      - {method: GET, path: "/api/v3/series", query: {tvdbId: int}, require: [tvdbId]}
      - {method: GET, path: "/api/v3/series/{id:int}"}
      - {method: GET, path: "/api/v3/series/lookup", query: {term: any}, require: [term]}
      - {method: GET, path: "/api/v3/episode", query: {seriesId: int, seasonNumber: int, episodeFileId: int, includeImages: bool}, require: [seriesId]}
      - {method: GET, path: "/api/v3/episode/{id:int}"}
      - {method: GET, path: "/api/v3/episodefile", query: {seriesId: int}, require: [seriesId]}
      - {method: GET, path: "/api/v3/episodefile/{id:int}"}
      - {method: GET, path: "/api/v3/queue", query: {page: int, pageSize: {type: int, min: 1, max: 500}, includeSeries: bool, includeEpisode: bool, seriesIds: int}}
      - {method: GET, path: "/api/v3/history", query: {page: int, pageSize: {type: int, min: 1, max: 500}, seriesIds: int, episodeId: int, eventType: int, includeSeries: bool, includeEpisode: bool, sortKey: [date], sortDirection: [ascending, descending]}}
      - {method: GET, path: "/api/v3/history/series", query: {seriesId: int, seasonNumber: int, eventType: int, includeEpisode: bool}, require: [seriesId]}
      - {method: GET, path: "/api/v3/calendar", query: {start: date, end: date, unmonitored: bool, includeSeries: bool, includeEpisodeFile: bool}}
      - {method: GET, path: "/api/v3/wanted/missing", query: {page: int, pageSize: {type: int, min: 1, max: 500}, includeSeries: bool}}
      - {method: GET, path: "/api/v3/rootfolder"}
      - {method: GET, path: "/api/v3/qualityprofile"}
      - {method: GET, path: "/api/v3/command/{id:int}"}
      - {method: GET, path: "/api/v3/system/status"}
      - {method: GET, path: "/api/v3/health"}
  health:
    min_tier: 1
    description: "Health and indexer checks: test all indexers, indexer status"
    allow:
      - {method: GET, path: "/api/v3/health"}
      - {method: GET, path: "/api/v3/indexerstatus"}
      - {method: POST, path: "/api/v3/indexer/testall", body_max: 1024}
  write:
    min_tier: 1
    description: "Add series, trigger searches and rescans, list and grab releases"
    includes: [read]
    allow:
      - {method: POST, path: "/api/v3/series", body_max: 262144}
      - {method: POST, path: "/api/v3/command", json: {name: [SeriesSearch, SeasonSearch, EpisodeSearch, RefreshSeries, RescanSeries, DownloadedEpisodesScan]}, body_max: 8192}
      - {method: GET, path: "/api/v3/release", query: {episodeId: int, seriesId: int, seasonNumber: int}}
      - {method: POST, path: "/api/v3/release", json: {guid: any, indexerId: int}, body_max: 8192}
  replace-file:
    min_tier: 1
    single_use: true
    description: "Delete one episode file (to re-download a better release)"
    allow:
      - {method: DELETE, path: "/api/v3/episodefile/{id:int}"}
  queue-remove:
    min_tier: 1
    single_use: true
    description: "Remove one queue item, optionally blocklisting the release"
    allow:
      - {method: DELETE, path: "/api/v3/queue/{id:int}", query: {removeFromClient: bool, blocklist: bool}}
  remove-title:
    min_tier: 2
    single_use: true
    description: "Remove a series from the library, keeping its files"
    allow:
      - {method: DELETE, path: "/api/v3/series/{id:int}", query: {deleteFiles: [false], addImportListExclusion: bool}}
