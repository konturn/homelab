server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  # Satellites are on the IoT VLAN, which cannot route to the internal VLAN.
  # loki.iot.lab.nkontur.com resolves to iot_nginx (pihole wildcard) and proxies
  # the push path to loki:3100 over the loki-backend network.
  - url: https://loki.iot.lab.nkontur.com/loki/api/v1/push
    basic_auth:
      username: promtail
      password: "{{ vault_loki_push_password }}"
    tls_config:
      insecure_skip_verify: true

scrape_configs:
  # Systemd journal - scrapes all host logs directly from journal
  - job_name: journal
    journal:
      json: false
      max_age: 48h
      labels:
        job: systemd-journal
        host: "{{ inventory_hostname | regex_replace('\\.lab\\.nkontur\\.com$', '') }}"
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal_syslog_identifier']
        target_label: 'syslog_identifier'
      - source_labels: ['__journal_priority_keyword']
        target_label: 'level'
    pipeline_stages:
      # Redact credentials that upstream services embed in request URLs.
      # Telegraf logs the full URL when an HTTP input errors (Tautulli requires
      # its API key as a query parameter, so it cannot move to a header) and
      # Sonarr does the same. Without this the keys reach Loki in cleartext and
      # sit there for the whole retention window. Only the captured secret is
      # rewritten, the surrounding log line is preserved.
      - replace:
          expression: '(?i)apikey=([^&\s"\]]+)'
          replace: 'REDACTED'
      - replace:
          expression: '(?i)api_key=([^&\s"\]]+)'
          replace: 'REDACTED'

  # Docker container logs (json-file driver)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      - action: replace
        target_label: 'source'
        replacement: 'docker'
      - action: replace
        target_label: 'host'
        replacement: "{{ inventory_hostname | regex_replace('\\.lab\\.nkontur\\.com$', '') }}"
      - action: replace
        target_label: 'job'
        replacement: 'docker'
    pipeline_stages:
      - docker: {}
      # Redact credentials that upstream services embed in request URLs.
      # Telegraf logs the full URL when an HTTP input errors (Tautulli requires
      # its API key as a query parameter, so it cannot move to a header) and
      # Sonarr does the same. Without this the keys reach Loki in cleartext and
      # sit there for the whole retention window. Only the captured secret is
      # rewritten, the surrounding log line is preserved.
      - replace:
          expression: '(?i)apikey=([^&\s"\]]+)'
          replace: 'REDACTED'
      - replace:
          expression: '(?i)api_key=([^&\s"\]]+)'
          replace: 'REDACTED'
