stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

# Disable usage reporting — Tempo runs on an internal-only bridge network
# (loki-backend) with no external DNS, causing repeated lookup failures
# for stats.grafana.org that pollute container logs.
usage_report:
  reporting_enabled: false

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    # Pin the write format. Tempo 3.1.0 makes vParquet5 the default; blocks it
    # writes cannot be read by 3.0.x, so taking the default would make the
    # image pin a one-way door -- a rollback would silently drop every trace
    # written since the upgrade. Reading vParquet5 is unaffected either way.
    # Drop this `block:` stanza as a separate, deliberate change to adopt vParquet5.
    block:
      version: vParquet4
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write: []

# Tempo 3.0 removed the top-level `compactor` section (grafana/tempo#6273).
# Block retention is now a per-tenant override under `overrides.defaults.compaction`.
overrides:
  defaults:
    compaction:
      block_retention: 336h   # 14 days
    metrics_generator:
      processors: [service-graphs, span-metrics]
