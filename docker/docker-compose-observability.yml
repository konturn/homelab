services:
  promtail:
    image: grafana/promtail:3.5.8@sha256:2a7c5469d687377de5cb7c8356cf96090c0069814d90ef35f9874db445999609
    container_name: promtail
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /etc/machine-id:/etc/machine-id:ro
      - promtail-positions:/tmp/positions
      - {{ docker_persistent_data_path }}/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.15'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      # grafana/promtail is debian-slim and ships no wget/curl, so an HTTP probe
      # always exits 127. Check the listening socket instead: 9080 == 0x2378 in
      # the hex local_address column of /proc/net/tcp. Same probe as the router
      # promtail in docker-compose.yml, which reports healthy.
      test: ["CMD-SHELL", "grep -q ':2378' /proc/net/tcp6 2>/dev/null || grep -q ':2378' /proc/net/tcp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  telegraf:
    image: telegraf:1.39.3@sha256:ac66e6482c0644765c12904ce2f42ce3f3702f72e905b1894120b51b12ae30c9
    container_name: telegraf
    restart: unless-stopped
    # Run telegraf directly as root — the default entrypoint uses setpriv to
    # drop privileges, which fails with no-new-privileges + cap_drop ALL.
    # Security is enforced by no-new-privileges + cap_drop instead.
    entrypoint: ["/usr/bin/telegraf"]
    command: ["--config", "/etc/telegraf/telegraf.conf"]
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    volumes:
      - {{ docker_persistent_data_path }}/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_MOUNT_PREFIX=/host
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.15'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "pgrep telegraf > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  promtail-positions:
    name: promtail-positions
