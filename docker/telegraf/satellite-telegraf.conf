[global_tags]
  host = "{{ inventory_hostname | regex_replace('\\.lab\\.nkontur\\.com$', '') }}"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  flush_jitter = "2s"
  hostname = ""

[[inputs.cpu]]
    percpu = true
    totalcpu = true
    collect_cpu_time = false
    report_active = true
[[inputs.disk]]
    ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "squashfs", "nsfs"]
[[inputs.diskio]]
  # Exclude SD card block devices — not accessible from inside the container
  devices = ["sd*", "nvme*", "vd*"]
[[inputs.mem]]
[[inputs.net]]
[[inputs.system]]
[[inputs.swap]]
[[inputs.netstat]]
[[inputs.processes]]
[[inputs.kernel]]

# Docker container stats
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  docker_label_include = []
  docker_label_exclude = []
  perdevice_include = ["cpu", "blkio", "network"]

# Temperature sensors (Pi has thermal_zone)
[[inputs.temp]]

{% if inventory_hostname == 'satellite-2.lab.nkontur.com' %}
# Paperless consume NFS mount used by the scanner (configure-scanner role).
# mounted=1 when /mnt is an NFS mount in the host's mount table. /host/proc is
# the host procfs, so PID 1's mounts are the host's. Alert: scanner-nfs-mount.
[[inputs.exec]]
  commands = ["awk 'BEGIN{m=0} $2==\"/mnt\" && $3 ~ /^nfs/ {m=1} END{print \"scanner_nfs,mountpoint=/mnt mounted=\" m \"i\"}' /host/proc/1/mounts"]
  timeout = "5s"
  data_format = "influx"
  interval = "60s"

{% endif %}
{% if inventory_hostname == 'zwave.lab.nkontur.com' %}
# miniDSP 2x4HD status from minidspd (base/minidsp/config.toml, HTTP on :5380;
# telegraf is on the host network). Read-only GET per unit, addressed by serial
# (docs/minidsp.md), so the series follow the unit, not the USB enumeration
# order. A unit missing from minidspd answers 500 "out of range" and writes no
# point: the anomaly detector's minidsp_units signal goes stale.
# Levels are dBFS meters (about -127 = silence).
{% for unit in minidsp_units %}
[[inputs.http]]
  urls = ["http://127.0.0.1:5380/devices/{{ unit.serial }}"]
  method = "GET"
  interval = "60s"
  timeout = "10s"
  data_format = "json_v2"
  name_override = "minidsp"
  tagexclude = ["url"]
  [inputs.http.tags]
    serial = "{{ unit.serial }}"
    usb_path = "{{ unit.usb_path }}"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "master.preset"
      rename = "preset"
      type = "int"
    [[inputs.http.json_v2.field]]
      path = "master.source"
      rename = "source"
      type = "string"
    [[inputs.http.json_v2.field]]
      path = "master.volume"
      rename = "volume_db"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "master.mute"
      rename = "mute"
      type = "bool"
{% for i in range(2) %}
    [[inputs.http.json_v2.field]]
      path = "input_levels.{{ i }}"
      rename = "input_{{ i + 1 }}_level_db"
      type = "float"
{% endfor %}
{% for i in range(4) %}
    [[inputs.http.json_v2.field]]
      path = "output_levels.{{ i }}"
      rename = "output_{{ i + 1 }}_level_db"
      type = "float"
{% endfor %}

{% endfor %}
{% endif %}
[[outputs.influxdb_v2]]
  urls = ["http://{{ influxdb_iot_ip }}:8086"]
  token = "{{ vault_influxdb_telegraf_token }}"
  organization = "homelab"
  bucket = "metrics"
