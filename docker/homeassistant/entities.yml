# Home Assistant entity registry: the desired state (docs/HOMEASSISTANT.md,
# "Entity registry"). Applied by ci/ha-entities/reconcile.py: on main when
# this file or the amps in inventory/hardware.yml change, and checked daily.
#
# Only entities listed here (or as amp zones in inventory/hardware.yml) are
# touched. Per entity, one line, all fields optional:
#   name      friendly name. On an entity named after its device (most
#             integrations, e.g. monoprice) it is set on the device.
#   area      area id (Settings > Areas). Set where the name is: device or entity.
#   disabled  true / false
#   rename_from  an entity_id to rename to this one, if this one is missing
#
# Amp zone names and input names come from inventory/hardware.yml (amps.*);
# an entry here overrides the zone name there. `amp_inputs` adds input names
# the inventory does not list.
#
# A UI edit to a listed entity is not reverted: the daily check opens an MR
# (label ha-entities-adopt) that writes the Home Assistant value back here.

entities:
  media_player.zone_11: {area: living_room}
  media_player.zone_12: {area: dining_room}
  media_player.zone_15: {area: kitchen}
  media_player.zone_16: {area: living_room}
  media_player.amp_a_zone_15: {disabled: true}
  media_player.amp_a_zone_16: {disabled: true}
  media_player.guest_bedroom_speakers: {rename_from: media_player.amp_c_zone_13}
  media_player.main_bedroom_speakers: {area: bedroom, rename_from: media_player.amp_c_zone_14}
  media_player.zone_21_3: {name: Amp C Zone 21 (no expansion unit), disabled: true}
  media_player.zone_22_3: {name: Amp C Zone 22 (no expansion unit), disabled: true}
  media_player.zone_23_3: {name: Amp C Zone 23 (no expansion unit), disabled: true}
  media_player.zone_24_3: {name: Amp C Zone 24 (no expansion unit), disabled: true}
  media_player.zone_25_3: {name: Amp C Zone 25 (no expansion unit), disabled: true}
  media_player.zone_26_3: {name: Amp C Zone 26 (no expansion unit), disabled: true}
  media_player.zone_31_3: {name: Amp C Zone 31 (no expansion unit), disabled: true}
  media_player.zone_32_3: {name: Amp C Zone 32 (no expansion unit), disabled: true}
  media_player.zone_33_3: {name: Amp C Zone 33 (no expansion unit), disabled: true}
  media_player.zone_34_3: {name: Amp C Zone 34 (no expansion unit), disabled: true}
  media_player.zone_35_3: {name: Amp C Zone 35 (no expansion unit), disabled: true}
  media_player.zone_36_3: {name: Amp C Zone 36 (no expansion unit), disabled: true}

amp_inputs:
  C: {2: Input 2, 3: Input 3, 4: Input 4, 5: Input 5, 6: Input 6}
