# iot-dns: the resolver for devices on the IoT VLAN (VLAN 6), docs/NETWORK.md
# "IoT resolver". Rendered by Ansible (docker_config) to
# {{ docker_persistent_data_path }}/iot-dns/dnsmasq.conf.
#
# Everything is forwarded to Pi-hole, so its blocklists apply. Internal zones
# are answered NXDOMAIN here and never forwarded, so IoT devices cannot learn
# internal names or addresses. Containers on the iot docker network are not
# affected: they use Docker's embedded DNS, which never asks this server.

port=53
# No /etc/hosts, no resolv.conf (the entrypoint also passes --no-resolv).
no-hosts
no-resolv
# No cache: every query reaches Pi-hole, so its query log stays complete.
cache-size=0

# --- upstream --------------------------------------------------------------
server={{ pihole_ip }}
# EDNS Client Subnet with the full client address, so Pi-hole (FTL
# dns.EDNS0ECS) logs and rate-limits the real device instead of this server.
# Queries redirected by the router's NAT (docs/FIREWALL.md) arrive from the
# router's shim address instead and are logged as that.
add-subnet=32

# --- internal zones: NXDOMAIN, never forwarded --------------------------------
# Unqualified names (wpad, router, ...): never forwarded.
domain-needed
local=//
# Every nkontur.com name: Pi-hole answers these with internal addresses
# (dns.hosts, the address=/.../ wildcards in docker/pihole/custom.conf), and
# that includes lab.nkontur.com, iot.lab.nkontur.com and zwave.lab.nkontur.com.
local=/nkontur.com/
# Pi-hole's local domain (dns.domain) and its own name (pi.hole)
local=/lan/
local=/hole/
# Special-use local zones
local=/local/
local=/home.arpa/
local=/internal/
# Reverse lookups of private addresses: bogus-priv answers RFC 1918, CGNAT
# (Tailscale), link-local, loopback and IPv6 ULA/link-local PTR queries
# locally with NXDOMAIN. The VLAN and docker ranges are listed explicitly too.
bogus-priv
local=/10.in-addr.arpa/
local=/16.172.in-addr.arpa/
local=/17.172.in-addr.arpa/
local=/18.172.in-addr.arpa/
local=/19.172.in-addr.arpa/
local=/20.172.in-addr.arpa/
local=/21.172.in-addr.arpa/
local=/22.172.in-addr.arpa/
local=/23.172.in-addr.arpa/
local=/24.172.in-addr.arpa/
local=/25.172.in-addr.arpa/
local=/26.172.in-addr.arpa/
local=/27.172.in-addr.arpa/
local=/28.172.in-addr.arpa/
local=/29.172.in-addr.arpa/
local=/30.172.in-addr.arpa/
local=/31.172.in-addr.arpa/
local=/168.192.in-addr.arpa/

# --- exceptions ----------------------------------------------------------------
# Internal names an IoT device needs. A more specific server= line wins over
# the local= above, e.g.
#   server=/homeassistant.iot.lab.nkontur.com/{{ pihole_ip }}
# Empty on purpose: in the 2026-11-08 review no IoT device resolved an internal
# name it needs (docs/NETWORK.md, "IoT resolver"). The zwave and satellite-2
# Pis, which do, keep Pi-hole (dhcpd.conf host entries).

# --- health ------------------------------------------------------------------
# Answered locally for the container healthcheck (independent of Pi-hole).
address=/iot-dns-health.invalid/127.0.0.1
