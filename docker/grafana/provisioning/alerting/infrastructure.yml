apiVersion: 1

groups:
  # =========================================================================
  # Container Alerts
  # =========================================================================
  - orgId: 1
    name: container-alerts
    folder: General Alerting
    interval: 1m
    rules:
      - uid: container-health-failure
        title: Container Health Check Failed
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "docker_container_health")
                  |> filter(fn: (r) => r._field == "failing_streak")
                  |> filter(fn: (r) => r._value > 0)
                  |> group(columns: ["container_name"])
                  |> last()
                  |> keep(columns: ["_time", "_value", "container_name"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Container {{ $labels.container_name }} health check failed"
        labels:
          severity: critical

      # A crash-looping container is DOWN most of the time, so telegraf's docker
      # input barely gets to sample it: over one hour a healthy container yields
      # ~360 restart_count points, while snapclient_kitchen yields 1 and
      # amcrest2mqtt yields ~1. difference() needs two points in the window to
      # emit anything, so the original 15m window produced a null for exactly the
      # containers that were on fire, reduce(dropNN) discarded it, and the rule
      # sat Normal through 8,400 restarts/day (issues #120, #123, #132).
      #
      # The window is therefore 6h, not 15m: long enough that even a container
      # sampled once an hour accumulates the two points difference() needs.
      # nonNegative:true still drops the reset-to-zero when a container is
      # recreated, so a redeploy does not read as a restart storm.
      #
      # The 6h accumulation alone kept the alert firing for up to 6h after a
      # loop was over (2026-10-20: zigbee2mqtt restarted 8 times during a
      # coordinator firmware update at 23:15Z, was stable from 23:20Z, and would
      # have fired until ~05:20Z). So the restart sum is joined with the
      # container's most recent uptime_ns and only kept while that is under 1h:
      # a container that has stayed up for an hour is no longer looping and
      # resolves. A real loop never reaches 1h of uptime -- every sample a
      # crash-looping container gets is taken seconds after a (re)start -- so
      # detection is unchanged. A removed container (e.g. scaled to 0) keeps its
      # last short-uptime sample and still ages out with the 6h window.
      - uid: container-restart-loop
        title: Container Restart Loop
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                restarts = from(bucket: "metrics")
                  |> range(start: -6h)
                  |> filter(fn: (r) => r._measurement == "docker_container_status")
                  |> filter(fn: (r) => r._field == "restart_count")
                  |> difference(nonNegative: true)
                  |> group(columns: ["container_name"])
                  |> sum()
                uptime = from(bucket: "metrics")
                  |> range(start: -6h)
                  |> filter(fn: (r) => r._measurement == "docker_container_status")
                  |> filter(fn: (r) => r._field == "uptime_ns")
                  |> group(columns: ["container_name"])
                  |> sort(columns: ["_time"])
                  |> last()
                join(tables: {r: restarts, u: uptime}, on: ["container_name"])
                  |> filter(fn: (r) => r._value_u < 3600000000000)
                  |> map(fn: (r) => ({_time: now(), _value: r._value_r, container_name: r.container_name}))
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [5]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Container {{ $labels.container_name }} restarting repeatedly (>5 restarts in 6h, not yet up for 1h)"
        labels:
          severity: critical

      # docker_container_status.oomkilled is Docker's State.OOMKilled flag. It is
      # STATE, not an event: Docker sets it when the cgroup OOM fires and clears
      # it only when the container is *recreated*. Alerting on its value
      # therefore reports "this container has been OOM-killed at some point in
      # its current life", which is not the same question as "a container was
      # just OOM-killed".
      #
      # That distinction is the live defect this rule replaces, and it has two
      # halves. Both were measured against Grafana's own state history
      # (/api/v1/rules/history?ruleUID=container-oom-kill) on 2026-10-09, which
      # is the only instrument that answers "did this rule fire?" -- re-running
      # the query by hand answers a different question.
      #
      # 1. The previous revision of this MR claimed the last()-before-filter
      #    ordering meant the rule never fired, citing four missed chromium
      #    episodes. THAT WAS WRONG. The history shows container-oom-kill went
      #    Normal -> Pending -> Alerting for container_name=chromium-browser on
      #    09-24 06:20, 09-26 06:15, 09-28 06:20, 09-29 06:13 and 09-30 06:14,
      #    resolving at 08:01 each time. The transitions are at 06:07-06:15 and
      #    the flag clears at 08:00:02, so last() saw true for ~105 minutes per
      #    episode. The "0 rows" measurement behind that claim was taken over
      #    07:56-08:01Z -- the one 5-minute window straddling the clear, i.e.
      #    exactly when the rule was correctly resolving. The MR was opened at
      #    08:11, ten minutes after that morning's alert went back to Normal.
      #    Detection was never the problem here; acting on it was (!719 is the
      #    chromium fix and is still unmerged).
      #
      # 2. The real defect is that a value-based rule cannot resolve. A
      #    container whose MAIN process survives the cgroup OOM never gets
      #    recreated, so the flag stays true for the container's lifetime.
      #    nextcloud OOMed once at 2026-10-08T05:16:11Z (six PHP workers killed,
      #    #145); at the time of writing it has restart_count=0 and 35 days of
      #    uptime, oomkilled has read true for 27 hours straight (2,160 samples
      #    per 6h, unbroken), and this alert has been Alerting since 05:22 on
      #    10-08 with no path back to Normal short of recreating the container.
      #    A permanently-firing critical is the #143 latch pathology, and
      #    filtering before max() over a 15m window does not fix it -- the
      #    source data is true in every window from now on.
      #
      # So: alert on the TRANSITION. difference() over the window yields +1 only
      # where the flag went false -> true inside it, which is the OOM event
      # itself. Verified both directions on 2026-10-09: a window containing
      # 05:16:11 returns nextcloud=1, and a -15m window 27h later returns zero
      # rows, so the alert clears on its own. It still catches the restarting
      # case -- the same query over 09-24 and 09-26 returns chromium-browser=1.
      # Recreation produces a -1, which nonNegative drops, so a container coming
      # back does not alert.
      #
      # for: 0s rather than 5m. An edge cannot flap, so there is nothing to
      # dampen, and dampening would eat half of the window the alert is visible
      # in. The rule fires at the first evaluation after the OOM and self-clears
      # once the transition ages out of the 15m range -- the same event-in-a-
      # window shape restic-backup-incomplete below already uses.
      - uid: container-oom-kill
        title: Container OOM Kill
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "docker_container_status")
                  |> filter(fn: (r) => r._field == "oomkilled")
                  |> map(fn: (r) => ({r with _value: if r._value then 1 else 0}))
                  |> group(columns: ["container_name"])
                  |> sort(columns: ["_time"])
                  |> difference(nonNegative: true)
                  |> group(columns: ["container_name"])
                  |> max()
                  |> filter(fn: (r) => r._value > 0)
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "container_name"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        annotations:
          summary: "Container {{ $labels.container_name }} killed by OOM"
          description: "The cgroup OOM killer fired inside this container within the last 15 minutes. Note the container may still be running: Docker sets State.OOMKilled when any process in the cgroup is killed, so check whether the main process survived (docker inspect -f '{{ .RestartCount }} {{ .State.StartedAt }}' {{ $labels.container_name }}) before assuming a restart. Kernel detail, including which process and its anon-rss: journalctl -k | grep -A3 'Memory cgroup out of memory'."
        labels:
          severity: critical

      # The rule above reads a per-container metric, which means it cannot see
      # the one OOM kill that matters most: InfluxDB's own. telegraf writes
      # docker_container_status *into* InfluxDB, so when InfluxDB is the process
      # the kernel kills, the sample recording that fact has nowhere to go. Any
      # container whose death takes the metrics pipeline down with it is
      # structurally invisible to container-oom-kill.
      #
      # Measured 2026-09-30, and this is the whole argument for keeping both
      # rules: over 30 days InfluxDB has *zero* oomkilled=true samples, while
      # its own uptime_ns shows it restarting with <30 s of uptime on 09-02,
      # 09-05 and 09-13. Same window, chromium-browser has 3,268 true samples
      # and nextcloud 13,635. The metric is not broken -- it simply cannot
      # report the collector's own death.
      #
      # The kernel's memcg line survives that, because it goes to the journal
      # and promtail ships it to Loki, a different store on a different path.
      # Verified present: 7 "Memory cgroup out of memory" lines in the last 7
      # days, each naming the killed process and its anon-rss.
      #
      # This rule is the journal half of !712, kept alongside the metric half
      # rather than replacing it. !712 proposed swapping container-oom-kill over
      # to this query outright, on the evidence of the InfluxDB kill above. That
      # evidence is real but does not generalise: swapping would trade away the
      # container_name label (the journal line carries a *process* name, so
      # "chromium" rather than "chromium-browser") and would inherit Loki's
      # delivery gaps -- per !698 the satellite hosts currently ship zero logs,
      # while they do still report telegraf metrics. Two cheap rules, two
      # independent failure paths.
      - uid: kernel-oom-kill
        title: Kernel OOM Kill (catches the collector's own death)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="systemd-journal"} |= "Memory cgroup out of memory" [15m]))'
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: replaceNN, replaceWithValue: 0}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: KeepLast
        # for: 0s, unlike container-oom-kill's 5m. A journal line is a single
        # instant, not a state that persists to be re-sampled; requiring it to
        # hold for five minutes is the mistake that made the original metric
        # rule unfireable.
        for: 0s
        annotations:
          summary: "A container was killed by the kernel OOM killer"
          description: "If Container OOM Kill did not also fire, the victim was probably the metrics collector itself. Which process and how much it held: journalctl -k --since '15 minutes ago' | grep 'Memory cgroup out of memory'. Then raise that container's deploy.resources.limits.memory in docker/docker-compose.yml."
        labels:
          severity: critical

      # Container OOM Kill above only fires *after* the kernel has already killed
      # the container. For anything that other services depend on, that is too
      # late: influxdb dying takes every alert in this file down with it, because
      # they all query it.
      #
      # This rule is the early warning. It measures *anon* memory
      # (active_anon + inactive_anon), not docker's `usage`, because only anon
      # pages are unreclaimable. `usage` includes page cache, which the kernel
      # drops on pressure -- deluge sits at ~99% of its 12G `usage` limit
      # permanently and is nowhere near an OOM, so a usage_percent rule would be
      # pure noise. active+inactive anon is what the OOM killer actually weighs.
      #
      # `max` over a 10m window rather than `last`: the spikes this is meant to
      # catch are short. Every influxdb spike over the last 30d lasted between
      # 20 seconds and 4 minutes, so a `last`-based rule sampling every minute
      # would miss most of them entirely. Taking the window max also means a
      # 20-second spike stays visible for a full 10m, which is what lets
      # `for: 5m` latch on it instead of flapping.
      #
      # limit == 0 means telegraf could not read the cgroup (satellite/zwave
      # hosts report this for some containers); those are dropped rather than
      # divided by zero. GitLab runner containers are excluded -- they are
      # ephemeral and inherit the host limit, so they always read ~0%.
      - uid: container-memory-near-limit
        title: Container Memory Near Limit (85%+)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                base = from(bucket: "metrics")
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "docker_container_mem")
                  |> filter(fn: (r) => not r.container_name =~ /^runner-/)

                // Sum the two fields per sample, then take the max. Taking each
                // field's max first double-counts: the kernel moves pages
                // between the active and inactive lists, so both maxima can
                // include the same pages.
                anon = base
                  |> filter(fn: (r) => r._field == "active_anon" or r._field == "inactive_anon")
                  |> group(columns: ["container_name", "_time"])
                  |> sum()
                  |> group(columns: ["container_name"])
                  |> max()

                lim = base
                  |> filter(fn: (r) => r._field == "limit")
                  |> group(columns: ["container_name"])
                  |> max()
                  |> group(columns: ["container_name"])
                  |> sum()

                join(tables: {a: anon, l: lim}, on: ["container_name"])
                  |> filter(fn: (r) => r._value_l > 0)
                  |> map(fn: (r) => ({
                      _time: now(),
                      container_name: r.container_name,
                      _value: float(v: r._value_a) * 100.0 / float(v: r._value_l)}))
                  |> keep(columns: ["_time", "_value", "container_name"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [85]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Container {{ $labels.container_name }} anon memory above 85% of its limit"
          description: "Unreclaimable (anon) memory is within 15% of the container's hard limit; the next allocation spike may trigger an OOM kill. Check the configured limit in docker/docker-compose.yml against actual use: sudo docker stats --no-stream {{ $labels.container_name }}. Either raise deploy.resources.limits.memory or find what is driving the allocation."
        labels:
          severity: warning

      - uid: critical-service-down
        title: Critical Service Down
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "docker_container_status")
                  |> filter(fn: (r) => r._field == "exitcode")
                  |> filter(fn: (r) => r.container_name =~ /grafana|homeassistant|nginx|gitlab|influxdb|plex|bitwarden|vault|loki|promtail|tempo|otel-collector/)
                  |> last()
                  |> filter(fn: (r) => r._value != 0)
                  |> keep(columns: ["_time", "_value", "container_name"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: last, refId: B, settings: {mode: dropNN}}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Critical service {{ $labels.container_name }} has non-zero exit code"
        labels:
          severity: critical

  # =========================================================================
  # System Alerts
  # =========================================================================
  - orgId: 1
    name: system-alerts
    folder: General Alerting
    interval: 1m
    rules:
      # A host that stops reporting is invisible to every other rule in this
      # file. high-memory-usage, high-cpu-temps, disk-space-*, smart-* and
      # critical-service-down all read the *last* sample for a host or
      # container; when the host dies there is no last sample, the series
      # simply stops existing, and each of those rules resolves to Normal.
      # The only trace left was a warning-severity "IoT Device Unreachable"
      # ping alert, which cannot tell a flat camera battery apart from an
      # Ansible-managed Docker host going away.
      #
      # This rule measures staleness directly: minutes since each host last
      # wrote mem.used_percent. Telegraf writes every 10s, so 20 minutes is
      # 120 consecutive missed samples — generous enough not to flap on a
      # reboot or a brief network blip.
      #
      # The 7d lookback is deliberate. A 5m or 24h window would only contain
      # hosts that are *currently* healthy, so a host already dead when the
      # rule is installed would never appear in the query at all and would
      # never fire. 7d means a host stays flagged for a week after it dies,
      # which is the behaviour you want for a machine you have not fixed yet,
      # and means a genuinely decommissioned host ages out on its own.
      - uid: host-metrics-stale
        title: Host Metrics Stale (host not reporting)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -7d)
                  |> filter(fn: (r) => r._measurement == "mem")
                  |> filter(fn: (r) => r._field == "used_percent")
                  |> group(columns: ["host"])
                  |> last()
                  |> map(fn: (r) => ({
                      host: r.host,
                      _time: now(),
                      _value: float(v: int(v: now()) - int(v: r._time)) / 60000000000.0,
                    }))
                  |> keep(columns: ["_time", "_value", "host"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [20]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Host {{ $labels.host }} has not reported metrics in {{ $values.B }} minutes"
          description: "Telegraf writes mem.used_percent every 10s. Check the host is powered on and reachable, then: systemctl status telegraf"
        labels:
          severity: critical

      - uid: high-memory-usage
        title: High Memory Usage (90%+)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "mem")
                  |> filter(fn: (r) => r._field == "used_percent")
                  |> group(columns: ["host"])
                  |> mean()
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "host"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [90]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "System memory usage above 90%"
        labels:
          severity: warning

      - uid: high-cpu-temps
        title: CPU Temperature High (80°C+)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "ipmi_sensor")
                  |> filter(fn: (r) => r._field == "value")
                  |> filter(fn: (r) => r.name == "cpu1_temp" or r.name == "cpu2_temp")
                  |> group(columns: ["host", "name"])
                  |> mean()
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "host", "name"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [80]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "CPU temperature above 80°C"
        labels:
          severity: warning

      - uid: disk-space-warning
        title: Disk Space Warning (80-90%)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "disk")
                  |> filter(fn: (r) => r._field == "used_percent")
                  |> filter(fn: (r) => r.device !~ /^loop/)
                  |> filter(fn: (r) => r.path !~ /^\/snap/)
                  // ZFS datasets are not independent filesystems -- every
                  // dataset in a pool reports the SAME free space (the pool's),
                  // while used_percent is computed against its own
                  // used+available. So the percentage measures the dataset's
                  // share of the pool, not how close anything is to being
                  // full. Keeping only the pool root (device has no "/") gives
                  // one honest number per pool and covers every dataset in it.
                  |> filter(fn: (r) => not (r.fstype == "zfs" and r.device =~ /\//))
                  |> group(columns: ["device", "path", "host"])
                  |> mean()
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "device", "path", "host"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            # within_range, not gt: above 90% the disk-space-critical rule
            # below owns the alert. A plain gt 80 leaves both rules firing on
            # the same filesystem forever, which is two mails for one fact.
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: within_range, params: [80, 90]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Disk usage between 80% and 90% on {{ $labels.device }} ({{ $labels.path }})"
        labels:
          severity: warning

      - uid: disk-space-critical
        title: Disk Space Critical (90%+)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "disk")
                  |> filter(fn: (r) => r._field == "used_percent")
                  |> filter(fn: (r) => r.device !~ /^loop/)
                  |> filter(fn: (r) => r.path !~ /^\/snap/)
                  // ZFS datasets are not independent filesystems -- every
                  // dataset in a pool reports the SAME free space (the pool's),
                  // while used_percent is computed against its own
                  // used+available. So the percentage measures the dataset's
                  // share of the pool, not how close anything is to being
                  // full. Keeping only the pool root (device has no "/") gives
                  // one honest number per pool and covers every dataset in it.
                  |> filter(fn: (r) => not (r.fstype == "zfs" and r.device =~ /\//))
                  |> group(columns: ["device", "path", "host"])
                  |> mean()
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "device", "path", "host"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [90]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "CRITICAL: Disk usage above 90% on {{ $labels.device }} ({{ $labels.path }})"
        labels:
          severity: critical

      # NOTE: this rule reads smart_device.health_ok. That field is only
      # written when smartctl actually succeeds. When collection is broken the
      # field is absent entirely, the query returns no series, and noDataState
      # OK means the rule reports healthy for disks it has never read. The
      # smart-collection-failed rule below covers that case. See issue #129.
      - uid: smart-disk-error
        title: SMART Disk Error
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -1h)
                  |> filter(fn: (r) => r._measurement == "smart_device")
                  |> filter(fn: (r) => r._field == "health_ok")
                  |> last()
                  |> filter(fn: (r) => r._value == false)
                  |> map(fn: (r) => ({r with _value: 1}))
                  |> keep(columns: ["_time", "_value", "host", "device"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [-1]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "SMART reports disk health issue on {{ $labels.device }} ({{ $labels.model }})"
        labels:
          severity: critical

      # Collection health, not disk health. telegraf's smart input reports a
      # per-device smartctl exit_status; anything non-zero means SMART was
      # never read for that drive, so smart-disk-error above cannot fire for
      # it. Issue #129 (device open failed, exit_status 2 on the whole array)
      # was closed 2026-09-07; all 26 devices on router now report
      # exit_status 0. This rule stays as the tripwire for a regression.
      # health_ok is smartctl's overall-health self-assessment, which most
      # drives keep reporting PASSED until they are essentially dead. The
      # sector counters move first: pending sectors are blocks the drive
      # failed to read and has not been able to remap, and reallocated /
      # uncorrectable counts are damage it already gave up on. Watching only
      # health_ok above means a drive can rot for weeks in silence -- router
      # sdk has been sitting at 16 pending sectors since 2026-09-03 with
      # health_ok still true, which is what prompted this rule.
      #
      # Alerts on an INCREASE over 24h, not on any non-zero value. The >0
      # version fired permanently on the two known-bad disks, which hid the
      # signal that matters for them: getting worse. Baseline, unchanged since
      # metrics began on 2026-09-02:
      #   sdk  WD240KFGX s/n 65HYX6RK   pending 16 (FAULTED in mpool, being
      #        replaced by sda; RMA once the resilver completes)
      #   sdb  CT480BX500 s/n 1938E19CE56F (boot/root SSD)  reallocated 1,
      #        pending 1
      # Every other disk reads 0, so any new damage on any disk is an increase.
      # Per series = host+serial_no+device+model+field, so a /dev/sdX rename
      # after a reboot starts a new series rather than reading as an increase.
      # last - first rather than summed differences, so a one-sample glitch
      # (a read of 0 and back) does not fire. Not covered: a disk that is
      # already damaged when first installed; smart-disk-error still applies.
      # The alert self-clears 24h after the last increase. Warning, not
      # critical: this means "plan a replacement", while smart-disk-error
      # means "the drive is going now".
      - uid: smart-prefail-sectors
        title: SMART Pre-Failure Sectors
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -24h)
                  |> filter(fn: (r) => r._measurement == "smart_device")
                  |> filter(fn: (r) => r._field == "pending_sector_count" or r._field == "uncorrectable_sector_count" or r._field == "reallocated_sectors_count")
                  |> group(columns: ["host", "serial_no", "device", "model", "_field"])
                  |> sort(columns: ["_time"])
                  |> reduce(
                      identity: {n: 0, first: 0, last: 0},
                      fn: (r, accumulator) => ({
                        n: accumulator.n + 1,
                        first: if accumulator.n == 0 then int(v: r._value) else accumulator.first,
                        last: int(v: r._value),
                      }),
                    )
                  |> map(fn: (r) => ({r with _value: if r.last > r.first then r.last - r.first else 0}))
                  |> group(columns: ["host", "device", "model"])
                  |> sum()
                  |> filter(fn: (r) => r._value > 0)
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "host", "device", "model"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Disk {{ $labels.device }} on {{ $labels.host }} ({{ $labels.model }}) gained {{ $values.B }} pending/reallocated/uncorrectable sectors in 24h — plan a replacement"
        labels:
          severity: warning

      - uid: smart-collection-failed
        title: SMART Collection Failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -1h)
                  |> filter(fn: (r) => r._measurement == "smart_device")
                  |> filter(fn: (r) => r._field == "exit_status")
                  |> last()
                  |> filter(fn: (r) => r._value != 0)
                  |> group(columns: ["host"])
                  |> count()
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "host"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: "smartctl is failing on one or more disks on {{ $labels.host }} — SMART failure prediction is blind for those drives (see issue #129)"
        labels:
          severity: warning

      # -----------------------------------------------------------------
      # Counts systemd unit FAILURE EVENTS from the journal instead of
      # sampling unit state, because state is the wrong instrument class for
      # this and we had the data to prove it. Measured 2026-10-05 over the
      # full 29-day Loki retention window, four units failed on router:
      #
      #   snap.certbot.renew.service   2/day, every single day
      #   logrotate.service            1/day, every single day
      #   mullvad-failover.service     1 event in 7d
      #   rpc-svcgssd.service          1 event in 7d
      #
      # inputs.systemd_units reported none of them, for two different reasons:
      #
      #  1. Coverage. telegraf.conf:378 is an allow-list
      #     ("docker* ssh* telegraf* nginx* restic* mullvad-failover*"), so
      #     certbot, logrotate and rpc-svcgssd are not collected at all. 11
      #     units, one host.
      #  2. Instrument class, and this is the half a wider pattern would not
      #     fix. mullvad-failover.service IS in that pattern and still never
      #     alerted. active_code + last() only reports a failure that is still
      #     the unit's most recent outcome at sample time; a unit that fails
      #     and is later re-run successfully reads inactive (2), not failed
      #     (3). With for: 15m on the active_code rules, an intermittent
      #     failure of a frequently-run unit cannot alert, ever.
      #
      # Which is why the only systemd instance that has ever fired is
      # restic-notify-failure@restic-check.service.service -- it is LATCHED,
      # the one case a state sampler can see. That single red instance has
      # been reading as "systemd coverage works". It does not.
      #
      # This rule starts out firing on certbot and logrotate. That is the
      # finding, not a defect: both have failed daily for at least 29 days
      # with no notification. The always-red objection that shaped the restic
      # rules (see "Restic Unit Failed" below) does not apply here, because
      # failed_unit is a label -- a new unit failing is a NEW alert instance,
      # distinguishable from the known-chronic ones rather than absorbed by
      # them.
      #
      # Neither chronic failure logs a reason; systemd's wrapper lines are all
      # the journal has ("Main process exited, code=exited, status=1/FAILURE").
      # certbot -q is quiet by design and logrotate emits nothing. Diagnosis
      # needs journalctl -u on the router. Note certbot here is a dead second
      # renewal path -- real renewal is networking/ssl/renew.sh via root cron,
      # and all 44 monitored certs are valid with 69+ days to expiry.
      #
      # Only router ships job="systemd-journal" today, so despite the host
      # label this is single-host coverage until promtail's journal scrape is
      # extended to the satellites.
      - uid: systemd-unit-failed-event
        title: Systemd Unit Failure
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: loki
            model:
              # The unit name is in the message body, not in a label: these
              # lines come from PID 1, so the stream carries init.scope rather
              # than the unit that failed. Hence the regexp extraction.
              expr: 'sum by (failed_unit, host) (count_over_time({job="systemd-journal"} |= "Failed with result" | regexp "(?P<failed_unit>[^ ]+): Failed with result" [15m]))'
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: replaceNN, replaceWithValue: 0}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: KeepLast
        # Event-counting, not state-sampling: a for: window would re-introduce
        # exactly the blindness to transient failures this rule exists to fix.
        for: 0s
        annotations:
          summary: "systemd unit {{ $labels.failed_unit }} failed on {{ $labels.host }}"
          description: "The unit exited non-zero at least once in the last 15 minutes. Check: journalctl -u {{ $labels.failed_unit }} -n 50 --no-pager"
        labels:
          severity: warning

  # =========================================================================
  # Network Alerts
  # =========================================================================
  - orgId: 1
    name: network-alerts
    folder: General Alerting
    interval: 1m
    rules:
      - uid: internet-connectivity-loss
        title: Internet Connectivity Loss
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "ping")
                  |> filter(fn: (r) => r._field == "result_code")
                  |> filter(fn: (r) => not exists r.probe or r.probe == "internet")
                  |> filter(fn: (r) => r._value != 0)
                  |> group(columns: ["url"])
                  |> count()
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "url"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: sum, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Internet connectivity loss — ping failures detected"
        labels:
          severity: critical

      # Device probes are tagged probe="device" by telegraf and excluded from
      # the rule above, which is scoped to the three internet/gateway targets.
      # Threshold is 4 of the last 15 one-minute samples so a single dropped
      # reply does not page; "for: 15m" then requires it to stay bad.
      #
      # known_offline: devices that are physically offline pending a hardware
      # fix, excluded only until known_offline_until. The exclusion expires by
      # itself, so a device still down after that date alerts again instead of
      # being hidden forever. Re-enable early by deleting its entry once the
      # device is back; extend the date only with a reason.
      #   10.6.128.9   doorbell (amcrest2mqtt waits for it)  offline, added 2026-10-21
      #   10.6.128.14  back camera                          offline, added 2026-10-21
      - uid: iot-device-unreachable
        title: IoT Device Unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                known_offline = ["10.6.128.9", "10.6.128.14"]
                known_offline_until = 2026-11-04T00:00:00Z
                from(bucket: "metrics")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "ping")
                  |> filter(fn: (r) => r._field == "result_code")
                  |> filter(fn: (r) => r.probe == "device")
                  |> filter(fn: (r) => not (contains(value: r.url, set: known_offline) and now() < known_offline_until))
                  |> filter(fn: (r) => r._value != 0)
                  |> group(columns: ["url"])
                  |> count()
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "url"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [3]}}]}
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "IoT device {{ $labels.url }} unreachable — dependent container will crash-loop or stop reporting"
        labels:
          severity: warning

      - uid: dns-resolution-failure
        title: DNS Resolution Failure
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "dns_query")
                  |> filter(fn: (r) => r._field == "result_code")
                  |> filter(fn: (r) => r._value != 0)
                  |> group(columns: ["server", "domain"])
                  |> count()
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "server", "domain"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [2]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "DNS resolution failing"
        labels:
          severity: critical

      # Reachability through the reverse proxy, from [[inputs.http_response]].
      # Keyed on result_code rather than http_response_code: result_code is 0
      # whenever any HTTP response came back, so a 401 from an authenticated
      # endpoint is treated as up (nginx and TLS both worked). Non-zero is
      # connection_failed / timeout / dns_error — the container can be perfectly
      # healthy and still be unreachable, which no other rule here detects.
      - uid: http-endpoint-unreachable
        title: HTTP Endpoint Unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -10m)
                  |> filter(fn: (r) => r._measurement == "http_response")
                  |> filter(fn: (r) => r._field == "result_code")
                  |> filter(fn: (r) => r._value != 0)
                  |> group(columns: ["server"])
                  |> count()
                  |> map(fn: (r) => ({r with _time: now()}))
                  |> keep(columns: ["_time", "_value", "server"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [3]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $labels.server }} is not answering over HTTP — container may be healthy but unreachable"
          description: "More than 3 failed probes in 10m (connection refused, timeout, or DNS failure). Check the nginx vhost, proxy_pass target, and TLS chain for this host."
        labels:
          severity: critical


  # =========================================================================
  # Certificate Alerts
  # =========================================================================
  - orgId: 1
    name: certificate-alerts
    folder: General Alerting
    interval: 10m
    rules:
      - uid: ssl-cert-expiry
        title: SSL Certificate Expiry (<14 days)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 21600, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -6h)
                  |> filter(fn: (r) => r._measurement == "x509_cert")
                  |> filter(fn: (r) => r._field == "expiry")
                  |> filter(fn: (r) => r.type == "leaf")
                  |> group(columns: ["source"])
                  |> last()
                  |> keep(columns: ["_time", "_value", "source"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: min, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            # 14 days = 1209600 seconds (comparing raw seconds instead of hours)
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: lt, params: [1209600]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "SSL certificate expiring within 14 days"
        labels:
          severity: warning

  # =========================================================================
  # UPS / Hardware Alerts
  # =========================================================================
  - orgId: 1
    name: hardware-alerts
    folder: General Alerting
    interval: 1m
    rules:
      # The UPS is monitored over SNMP by telegraf ([[inputs.snmp]], UPS-MIB via
      # CyberPower) and lands in the "snmp" measurement. These rules were left
      # commented out with "snmp measurement not available"; that reason is no
      # longer true — the input has been collecting percent_charge, load,
      # batterySeconds and minutes on a 30s interval. Nothing else writes to the
      # "snmp" measurement (the Aruba switch inputs use name= overrides), so no
      # source filter is needed.

      # upsSecondsOnBattery is 0 on utility power and counts up the moment the
      # UPS switches to battery. This is the alert that catches a power cut:
      # charge stays near 100% and load is unchanged for the first several
      # minutes, so the charge/load rules below would stay silent through an
      # outage that is quietly burning the runtime budget.
      - uid: ups-on-battery
        title: UPS On Battery (utility power lost)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "snmp")
                  |> filter(fn: (r) => r._field == "batterySeconds")
                  |> last()
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: KeepLast
        for: 1m
        annotations:
          summary: "UPS is running on battery — utility power lost"
          description: "Check `minutes` (upsEstimatedMinutesRemaining) for the remaining runtime budget before a hard shutdown."
        labels:
          severity: critical

      # Battery ladder is 80% warn -> 50% critical -> 30% critical. On a real
      # outage all three fire in sequence; that escalation is intentional.
      # Same error/no-data handling as the other short-pending UPS rules: a
      # failed or empty query is not a low battery (see datasource-health).
      - uid: ups-battery-warning-80
        title: UPS Battery Below 80%
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "snmp")
                  |> filter(fn: (r) => r._field == "percent_charge")
                  |> last()
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: min, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: lt, params: [80]}}]}
        noDataState: OK
        execErrState: KeepLast
        for: 2m
        annotations:
          summary: "UPS battery charge dropped below 80% — may be on battery power"
        labels:
          severity: warning

      - uid: ups-battery-low
        title: UPS Battery Low
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "snmp")
                  |> filter(fn: (r) => r._field == "percent_charge")
                  |> last()
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: min, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: lt, params: [50]}}]}
        noDataState: OK
        execErrState: KeepLast
        for: 2m
        annotations:
          summary: "UPS battery charge below 50%"
        labels:
          severity: critical

      - uid: ups-battery-critical-30
        title: UPS Battery Critical (<30%)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "snmp")
                  |> filter(fn: (r) => r._field == "percent_charge")
                  |> last()
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: min, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: lt, params: [30]}}]}
        noDataState: OK
        execErrState: KeepLast
        for: 1m
        annotations:
          summary: "UPS battery critically low — below 30%. Imminent power loss risk."
        labels:
          severity: critical

      - uid: ups-high-load
        title: UPS High Load
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "snmp")
                  |> filter(fn: (r) => r._field == "load")
                  |> last()
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [80]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "UPS load above 80%"
        labels:
          severity: warning

  # =========================================================================
  # Backup Alerts
  # =========================================================================
  - orgId: 1
    name: backup-alerts
    folder: General Alerting
    interval: 30m
    rules:
      - uid: restic-backup-stale
        title: Restic Backup Stale (48h)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 172800, to: 0}
            datasourceUid: loki
            model:
              expr: 'count_over_time({unit="restic-backup.service"} |= "snapshot" |= "saved" [48h])'
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: replaceNN, replaceWithValue: 0}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: lt, params: [1]}}]}
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "No successful restic backup in 48 hours"
          description: "Check: journalctl -u restic-backup.service --since '48 hours ago'"
        labels:
          severity: critical

      - uid: restic-backup-error
        title: Restic Backup Error
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: loki
            model:
              expr: 'count_over_time({unit="restic-backup.service"} |~ "(?i)(fatal|unable to create lock)" [1h])'
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: replaceNN, replaceWithValue: 0}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        annotations:
          summary: "Restic backup failed with errors"
          description: "Check: journalctl -u restic-backup.service --since '1 hour ago'"
        labels:
          severity: critical

      # restic exits 3 ("at least one source file could not be read") when the
      # snapshot was still written but something vanished mid-run. The unit now
      # sets SuccessExitStatus=3 so that a single vanished temp file no longer
      # aborts the remaining folders, the database dumps and forget/prune -- see
      # ansible/roles/restic/templates/restic-backup.service.j2. That means the
      # unit no longer goes to failed state for this case, so restic-unit-failed
      # will not catch it and restic-backup-error's regex does not match the
      # wording. This rule is what keeps a partial backup visible.
      - uid: restic-backup-incomplete
        title: Restic Backup Incomplete (unreadable source files)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: loki
            model:
              expr: 'count_over_time({unit="restic-backup.service"} |= "could not be read" [24h])'
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: replaceNN, replaceWithValue: 0}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        annotations:
          summary: "Restic wrote an incomplete snapshot - some source files could not be read"
          description: "The snapshot exists but is missing files. Find which: journalctl -u restic-backup.service --since '24 hours ago' | grep -E '^error:'. If a path recurs, add it to restic_global_excludes in ansible/roles/restic/defaults/main.yml."
        labels:
          severity: warning

      # Both alerts above read restic's *log text*, which cannot see a run that
      # dies without printing an error. On 2026-08-31 restic-backup.service was
      # killed part-way through /mpool/plex/config: four folders had already
      # produced snapshots, so restic-backup-stale stayed green, and nothing
      # matched "fatal|unable to create lock", so restic-backup-error stayed
      # green too. The unit sat in failed state with no alert. The systemd_units
      # metric was added for exactly this case but nothing consumed it yet.
      #
      # Scope (2026-09-07): the unit list is restic-backup.service and
      # restic-check.service, not /^restic-/. The broader regex also matched the
      # restic-notify-failure@<unit>.service instances, and those are OnFailure=
      # handlers: Type=oneshot units that run once, exit, and then keep whatever
      # state that run ended in until something invokes them again. Nothing ever
      # does. restic-notify-failure@restic-check.service.service failed once
      # (msmtp exits 69/UNAVAILABLE, per the description below) and has reported
      # active_code=3 on every one of the 60,462 samples in the last 7 days, so
      # this rule had been firing continuously since 2026-08-31T13:56Z.
      #
      # That is the failure mode this rule exists to prevent. A critical alert
      # that is always red carries no signal: restic-backup.service really did
      # fail from 2026-09-02T07:24Z to 2026-09-03T07:00Z (the vanished-temp-file
      # bug fixed in 98df99d) and the alert could not change state to say so,
      # because a dead notifier was already holding it firing.
      #
      # The notifier is still worth watching, just not as a backup-failure
      # signal at critical severity -- restic-notifier-failed below covers it.
      - uid: restic-unit-failed
        title: Restic Unit Failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "systemd_units")
                  |> filter(fn: (r) => r._field == "active_code")
                  |> filter(fn: (r) => r.name =~ /^restic-(backup|check)\.service$/)
                  |> group(columns: ["name"])
                  |> last()
                  |> keep(columns: ["_time", "_value", "name"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: last, refId: B, settings: {mode: dropNN}}
          # telegraf active_code, verified against live data 2026-08-31:
          #   0=active  2=inactive  3=failed  4=activating
          # (An earlier revision of this rule assumed 3=inactive / 4=failed and
          # used "gt 3". That never fires on a failed unit and does fire on any
          # unit that is merely activating. Confirmed wrong while
          # restic-check.service sat at active_code=3 / active="failed" with the
          # alert silent.) Match failed exactly rather than using a threshold.
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: within_range, params: [2.5, 3.5]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Restic unit {{ $labels.name }} is in failed state"
          description: "A restic unit failed. The OnFailure email path is unreliable (msmtp has exited 69/UNAVAILABLE), so this alert is the primary signal. Check: systemctl status {{ $labels.name }} && journalctl -u {{ $labels.name }} --since '24 hours ago'"
        labels:
          severity: critical

      # The OnFailure= notifier for the restic units. Split out of
      # restic-unit-failed so a broken notifier can no longer masquerade as a
      # broken backup (see the scope note above).
      #
      # This one is expected to stay firing until someone acts: the units are
      # Type=oneshot, so a failed run latches active_code=3 until the unit is
      # invoked again or reset. Clearing it needs both halves -- fix the send
      # path, then `systemctl reset-failed` -- otherwise the state persists even
      # once msmtp works. That is a standing defect, not a flapping signal, so
      # it sits at warning and stays out of the backup-failure path.
      - uid: restic-notifier-failed
        title: Restic Failure Notifier Broken
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "systemd_units")
                  |> filter(fn: (r) => r._field == "active_code")
                  |> filter(fn: (r) => r.name =~ /^restic-notify-failure@/)
                  |> group(columns: ["name"])
                  |> last()
                  |> keep(columns: ["_time", "_value", "name"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: last, refId: B, settings: {mode: dropNN}}
          # Same telegraf active_code mapping as restic-unit-failed: 3 == failed.
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: within_range, params: [2.5, 3.5]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Restic failure notifier {{ $labels.name }} is in failed state"
          description: "The OnFailure= handler for a restic unit cannot deliver. Backups themselves are unaffected, and the Restic Unit Failed / Backup Stale / Backup Error alerts still cover them. Check: systemctl status {{ $labels.name }} && journalctl -u {{ $labels.name }} -n 50. After fixing the send path, clear the latched state with: systemctl reset-failed {{ $labels.name }}"
        labels:
          severity: warning

      # A timer that stops being scheduled produces no failure event at all —
      # backups just quietly stop. Timers should always be active (0).
      - uid: restic-timer-inactive
        title: Restic Timer Not Scheduled
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "systemd_units")
                  |> filter(fn: (r) => r._field == "active_code")
                  |> filter(fn: (r) => r.name =~ /^restic-.*\.timer$/)
                  |> group(columns: ["name"])
                  |> last()
                  |> keep(columns: ["_time", "_value", "name"])
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: last, refId: B, settings: {mode: dropNN}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Restic timer {{ $labels.name }} is not active"
          description: "A restic timer is not scheduled (disabled, masked, or lost in a rebuild); backups will silently stop. Check: systemctl status {{ $labels.name }}"
        labels:
          severity: critical

  # =========================================================================
  # Security Alerts
  # =========================================================================
  - orgId: 1
    name: security-alerts
    folder: General Alerting
    interval: 5m
    rules:
      - uid: failed-ssh-logins
        title: Failed SSH Logins
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: loki
            model:
              # PasswordAuthentication is "no" everywhere (ansible/roles/claude-user),
              # so sshd never logs "Failed password" and matching only that string
              # made this rule dead. Match the signatures key-only sshd actually
              # emits for a rejected attempt, and keep "Failed password" for any
              # host that ever re-enables password auth.
              expr: 'count_over_time({unit="ssh.service"} |~ `Failed password|Invalid user|Connection (closed|reset) by authenticating user|maximum authentication attempts` [15m])'
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: max, refId: B, settings: {mode: replaceNN, replaceWithValue: 0}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            # Threshold is 100, not 5. Constant internet scanning is the baseline on a
            # host with sshd exposed: measured over 7d of real logs, a 15m bucket runs
            # p50=8, p90=19, p99=42, max=48. Alerting at 5 would fire nearly always and
            # train everyone to ignore it. 100 is ~2x the observed 7d peak, so it stays
            # quiet under background noise and fires on a genuine burst.
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [100]}}]}
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        annotations:
          summary: "SSH login attempt burst (>100 rejected attempts in 15min)"
        labels:
          severity: warning

      # Imported from the rule created through the API (same uid, so Grafana
      # keeps its state history). telegraf writes vault_health.sealed; a sealed
      # Vault is 1, and no data (Vault unreachable or the input failing) also
      # fires. Short pending period, so query errors hold the last state; see
      # datasource-health below for the "InfluxDB is down" signal.
      - uid: efeju4cob1ipsb
        title: Vault Unavailable or Sealed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "vault_health" and r._field == "sealed")
                  |> last()
                  |> map(fn: (r) => ({r with _value: if r._value == false then 0.0 else 1.0}))
              intervalMs: 30000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: last, refId: B}
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: Alerting
        execErrState: KeepLast
        for: 2m
        annotations:
          summary: "Vault is either unreachable, sealed, or uninitialized. All secret-dependent operations will fail."
          description: "Vault health check failed. Check if the Vault container is running and unsealed at 10.3.32.6:8200."
        labels:
          service: vault
          severity: critical

  - orgId: 1
    name: log-volume-alerts
    folder: General Alerting
    interval: 15m
    rules:
      # A single container can go from a handful of lines an hour to five figures
      # without anything crashing, restarting or OOMing -- so none of the existing
      # container rules see it. Every log flood in this lab so far was found by a
      # human or agent eyeballing Loki volume long after the fact:
      #
      #   !716  SMBus probe flood        42.7% of all Loki ingest
      #   !715  GitLab DEBUG lines       150k/day, 26.5% of GitLab volume
      #   !722  Loki compaction chatter  7.9% of all Loki ingest
      #   !721  Tempo scheduler noise
      #
      # This rule is the detector those four were missing.
      #
      # Why the expression looks the way it does -- each clause is load-bearing and
      # was tuned against 48h of real log data, not guessed:
      #
      #   > 3000 (absolute floor)
      #     Without it, a container idling at 2 lines/h that briefly reaches 40
      #     trips a 20x ratio and pages for nothing. 3000/h is above every benign
      #     burst measured in 48h -- nzbget's post-download cleanup chatter peaks
      #     at 1339/h -- and well under the flood this was written for (15000/h).
      #
      #   ratio > 10 vs the SAME container 24h earlier
      #     A single absolute threshold cannot work here. GitLab steadily writes
      #     ~21000 lines/h while healthy, so any absolute limit that catches
      #     radarr's 15000/h flood would page on GitLab continuously. Comparing a
      #     container to its own recent past is what separates "loud" from
      #     "newly loud". Offset 24h rather than a longer window so a flood that
      #     has been running for days still reads as elevated for at least a day.
      #
      #   + 60 on the denominator
      #     Guards against divide-by-near-zero. A container that logs 1 line/h
      #     baseline would otherwise show a 15000x ratio from any activity at all.
      #
      # Verified against live Loki over the 48h to 2026-09-26T09:00Z: fires on
      # radarr for exactly the 5 hours of the real flood (05:00-09:00Z) and on
      # nothing else in that window. for: 1h additionally drops single-hour bursts.
      #
      # queryType: instant. The expression is a filter (`> 3000 and ... > 10`),
      # so a range query only has points where the condition held, and the
      # `last` reducer then returns the most recent point where it held -- not
      # whether it holds now. With a 25h range, a flood that had already stopped
      # kept the alert firing for up to a day (2026-10-19: nextcloud's flood
      # ended 03:15Z and was still firing at 14:30Z). An instant query evaluates
      # the expression at now only. The `offset 24h` baseline does not need a
      # 25h query range; LogQL reads it independently of the range.
      - uid: container-log-flood
        title: Container Log Flood (rate 10x its own 24h baseline)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: loki
            model:
              queryType: instant
              expr: '(sum by (container) (count_over_time({job="docker"}[1h])) > 3000) and (sum by (container) (count_over_time({job="docker"}[1h])) / (sum by (container) (count_over_time({job="docker"}[1h] offset 24h)) + 60) > 10)'
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: last, refId: B, settings: {mode: replaceNN, replaceWithValue: 0}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: gt, params: [0]}}]}
        noDataState: OK
        execErrState: Error
        for: 1h
        annotations:
          summary: "{{ $labels.container }} log rate is 10x its own 24h baseline (>3000 lines/hour)"
          description: >-
            A container is flooding Loki. This is usually a stuck retry loop, not a
            crash -- the container stays healthy and keeps failing the same operation.
            Find the repeated line first, and read it before trusting what it says:
            the 2026-09-26 radarr flood printed "make sure ffprobe is available" while
            ffprobe was present and working fine.
            Check: logcli query '{container="<name>"}' --limit=50 --since=15m
        labels:
          severity: warning

  # =========================================================================
  # Datasource health (meta-alerts)
  # =========================================================================
  # The short-pending rules above (for: 0s-2m) use execErrState: KeepLast, so
  # a single failed evaluation (SQLite lock, lab_nginx restart, Loki restart)
  # no longer pages as a DatasourceError. These two rules keep the "a
  # datasource has actually been down for a while" signal: each runs a cheap
  # query that never meets its threshold, so the only way it fires is the
  # query itself failing (execErrState: Alerting) for 15 consecutive minutes.
  # Rules with for: >= 5m keep execErrState: Error and still report their own
  # persistent errors.
  - orgId: 1
    name: datasource-health
    folder: General Alerting
    interval: 1m
    rules:
      - uid: datasource-loki-unreachable
        title: Loki Datasource Unreachable (15m)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              queryType: instant
              expr: 'sum(count_over_time({job="systemd-journal"}[5m]))'
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: last, refId: B, settings: {mode: replaceNN, replaceWithValue: 0}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: lt, params: [0]}}]}
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: "Grafana has failed to query Loki for 15+ minutes"
          description: "Every Loki-backed alert rule (OOM kills, systemd failures, restic, SSH) is blind while this fires; they hold their last state. Check: docker ps --filter name=loki; docker logs --tail 50 loki; and from grafana: docker exec grafana curl -s http://loki:3100/ready"
        labels:
          severity: critical

      - uid: datasource-influxdb-unreachable
        title: InfluxDB Datasource Unreachable (15m)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: influxdb
            model:
              query: |
                from(bucket: "metrics")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "mem" and r._field == "used_percent")
                  |> group()
                  |> count()
                  |> map(fn: (r) => ({_time: now(), _value: float(v: r._value)}))
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: reduce, expression: A, reducer: last, refId: B, settings: {mode: replaceNN, replaceWithValue: 0}}
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model: {type: threshold, expression: B, refId: C, conditions: [{evaluator: {type: lt, params: [0]}}]}
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: "Grafana has failed to query InfluxDB for 15+ minutes"
          description: "The InfluxDB-backed short-pending rules (container OOM kill, UPS on battery / battery low) hold their last state while this fires. Check: docker ps --filter name=influxdb; docker logs --tail 50 influxdb; then the datasource health check in Grafana (Connections > Data sources > InfluxDB > Test)."
        labels:
          severity: critical
