apiVersion: 1

# Quiet hours (decision 6): non-urgent page classes are not mailed 23:00-08:00.
# Alertmanager sends a muted alert at the first notification after the
# interval ends if it still fires (08:00 plus up to group_interval).
muteTimes:
  - orgId: 1
    name: quiet-hours
    time_intervals:
      - times:
          - start_time: "23:00"
            end_time: "24:00"
          - start_time: "00:00"
            end_time: "08:00"
        location: America/New_York

policies:
  - orgId: 1
    receiver: openclaw-webhook
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
    routes:
      # Event router (docs/design/event-routing.md, phase 3, section 15): the
      # catch-all. Every alert, one per notification (it dedupes by
      # fingerprint); resolves within ~1m are its verification signal. It
      # runs playbooks and hands OpenClaw what it could not handle through
      # OpenClaw's /hooks/event-router. First, with continue: true, so the
      # routes below still see every alert.
      - receiver: event-router
        matchers:
          - severity =~ ".*"
        group_by: ['...']
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 4h
        continue: true
      # Fallback to OpenClaw (property L4). Every alert also goes to the
      # agent's /hooks/grafana, whose transform (grafana.js) asks the router
      # (GET /ack) and drops each alert the router acknowledged. So while the
      # router works this route wakes nobody; when the router is down or never
      # got an alert, the agent gets it here. It MUST stay a catch-all child
      # route: the root `receiver:` is only Alertmanager's fallback for
      # alerts no child matches (the agent path silently never delivered from
      # 2026-02 to 2026-09 because of that, cf3194a). severity =~ ".*" also
      # matches a rule without the label. group_wait 30s > the router's 10s,
      # so the router's copy is in its inbox before this route asks.
      - receiver: openclaw-webhook
        matchers:
          - severity =~ ".*"
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 24h
        continue: true
      # Email: page classes only (decisions 4 and 5), by rule uid. Must match
      # page_classes in docker/event-router/config.yml (tests/test_repo.py).
      # Urgent classes, never muted (decision 6): security, data at risk, UPS.
      - receiver: homelab-email-alerts
        matchers:
          - __alert_rule_uid__ =~ "failed-ssh-logins|efeju4cob1ipsb|zpool-unhealthy|smart-disk-vanished|smart-disk-error|restic-backup-stale|restic-db-dumps-stale|restic-db-dumps-weekly-stale|ups-on-battery|ups-battery-low|ups-battery-critical-30"
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 24h
        continue: true
      # Non-urgent page classes, held through quiet hours (23:00-08:00): an
      # alert still firing at 08:00 is mailed then. Host not reporting,
      # certificate <= 3 days, platform down (the event router itself;
      # Pi-hole not answering).
      - receiver: homelab-email-alerts
        matchers:
          - __alert_rule_uid__ =~ "host-metrics-stale|ssl-cert-expiry-3d|event-router-down|pihole-dns-latency-high"
        mute_time_intervals: [quiet-hours]
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 24h
        continue: true
      # Platform down: GitLab, Vault, Home Assistant, Pi-hole containers.
      - receiver: homelab-email-alerts
        matchers:
          - __alert_rule_uid__ =~ "container-health-failure|container-restart-loop|critical-service-down"
          - container_name =~ "gitlab|vault|homeassistant|pihole"
        mute_time_intervals: [quiet-hours]
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 24h
        continue: true
