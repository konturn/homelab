apiVersion: 1

policies:
  - orgId: 1
    receiver: openclaw-webhook
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
    routes:
      # zigbee2mqtt log floods: agent only, no email. Its log volume swings with
      # normal Zigbee activity (OTA firmware updates, interviews, re-pairing),
      # so the 10x-baseline rule fires on routine work. This route delivers it
      # to the agent; continue: false keeps it out of the email routes. It sits
      # ahead of the agent catch-all so openclaw-webhook gets it exactly once.
      - receiver: openclaw-webhook
        matchers:
          - alertname = "Container Log Flood (rate 10x its own 24h baseline)"
          - container = "zigbee2mqtt"
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 24h
        continue: false
      # Agent notification. MUST be the first catch-all and MUST stay a child route.
      #
      # The root `receiver:` above is Alertmanager's *fallback* -- it notifies only
      # alerts that match no child route. `continue: true` continues to sibling
      # routes, never to the parent. Every one of the 27 rules carries
      # severity=critical|warning, so all 27 matched the email route below and the
      # root receiver was never used: openclaw-webhook's lastNotifyAttempt was
      # 0001-01-01T00:00:00Z (never) while the email receiver was attempting
      # normally. The agent path had never delivered a real alert since it was
      # wired in 2026-02 (cf3194a).
      #
      # severity =~ ".*" matches every alert, including any rule that forgets the
      # label (an absent label matches the empty string), so this route cannot be
      # bypassed the way the root receiver was.
      - receiver: openclaw-webhook
        matchers:
          - severity =~ ".*"
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 24h
        continue: true
      - receiver: homelab-email-alerts
        matchers:
          - severity =~ "critical|warning"
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 24h
        continue: true
      - receiver: homelab-email-alerts
        matchers:
          - alertname =~ ".*HighMemory.*"
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 24h
        continue: true
      - receiver: homelab-email-alerts
        matchers:
          - alertname =~ ".*DiskSpace.*"
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 24h
        continue: true
