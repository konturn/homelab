{# shairport-sync config for one AirPlay receiver (docs/AUDIO.md). Rendered once
   per entry of airplay_receivers (ansible/inventory.yml); item.receiver is that
   entry, item.slug its zone name. Holds the MQTT password: mode 0600. #}
{% set r = item.receiver %}
// {{ r.name }} AirPlay receiver -> snapserver {{ r.stream }} (tcp {{ r.port }}).
// Rendered by Ansible from docker/airplay/shairport-sync.conf.
general =
{
	name = "{{ r.name }}";
	output_backend = "pipe";
	// AirPlay 2 device ID: the container's fixed MAC. A stable ID keeps the
	// receiver the same accessory in the Home app across recreates.
	airplay_device_id = 0x{{ r.mac | replace(':', '') | upper }}L;
};

sessioncontrol =
{
	// Connect to snapserver only while audio plays (docker/airplay/feed.sh):
	// a tcp:// source serves one sender at a time, and an idle connection
	// would hold the port (Home Assistant's doorbell sound uses port 80).
	run_this_before_play_begins = "/airplay/feed.sh start";
	run_this_after_play_ends = "/airplay/feed.sh stop";
	wait_for_completion = "yes";
};

pipe =
{
	name = "/tmp/shairport-sync-audio";
	// snapserver's tcp:// sources use its default sample format, 48000:16:2.
	output_rate = 48000;
	output_format = "S16_LE";
};

metadata =
{
	enabled = "yes";
	include_cover_art = "no";
};

// What is playing, for Home Assistant (MQTT discovery under homeassistant/).
mqtt =
{
	enabled = "yes";
	hostname = "mqtt.lab.nkontur.com";
	port = 8883;
	cafile = "/etc/ssl/certs/ca-certificates.crt";
	username = "airplay";
	password = "{{ vault_airplay_mqtt_password | trim }}";
	topic = "shairport/{{ item.slug }}";
	publish_parsed = "yes";
	publish_cover = "no";
	enable_autodiscovery = "yes";
	autodiscovery_prefix = "homeassistant";
};
