extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

receivers:
  # ============================================================================
  # OTLP — Traces, metrics, logs from instrumented applications
  # ============================================================================
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

  # Add resource attributes for easier filtering in Grafana
  resource:
    attributes:
      - key: deployment.environment
        value: homelab
        action: upsert

  # Span counts (below) keep only service.name: the counted spans' other
  # resource attributes (process.pid, host.name, ...) would become InfluxDB
  # tags, one series per Puma worker.
  transform/spancount:
    metric_statements:
      - keep_keys(resource.attributes, ["service.name"])

connectors:
  # Spans received per service.name -> InfluxDB measurement
  # otelcol_spans_by_service (field gauge = spans in that batch, tag
  # service.name). The Trace Emitter Silent alert (trace-emitter-silent)
  # reads it to catch one expected emitter going quiet (#106).
  count:
    spans:
      otelcol_spans_by_service:
        description: Spans received by otel-collector, by resource service.name
        attributes:
          - key: service.name
            default_value: unknown

exporters:
  # OTLP over gRPC (the old "otlp" exporter name is a deprecated alias).
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  influxdb:
    endpoint: "http://{{ influxdb_ip }}:8086"
    org: "homelab"
    bucket: "metrics"
    token: "{{ vault_influxdb_telegraf_token }}"

  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp_grpc/tempo, count]

    metrics/spancount:
      receivers: [count]
      processors: [transform/spancount]
      exporters: [influxdb]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [influxdb]

    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    # Internal metrics on :8888 (Prometheus pull). The old `address` key was
    # removed from the collector; `readers` is the replacement.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
