# OpenClaw's cron jobs, declared. OpenClaw keeps them in its own store
# (~/.openclaw/state/openclaw.sqlite in the openclaw-gateway container); this
# file does not create or change them. facts:drift (ci/facts/drift.py, check
# "openclaw crons") compares it with `openclaw cron list --all --json` and
# reports a missing, undeclared or changed cron to the facts-drift living
# issue, which drops the item once the two agree again (inventory/README.md).
#
# Fields as collect.normalize_cron() reduces a job: schedule ("cron <expr>
# <tz> [stagger <n>ms]", "every <n>ms" or "at <ISO time>"), agent (agentId,
# "" for none), session (sessionTarget), wake (wakeMode), delivery ("<mode>
# [<channel>] [<to>]"), payload settings without the prompt text, and whether
# a trigger script is attached. The prompts live in OpenClaw (and its
# workspace repo's config/cron-jobs.json snapshot), not here.
#
# A cron changed on purpose in OpenClaw: update its entry here in an MR.
crons:
  - name: "job-apply"
    enabled: true
    schedule: "cron */30 * * * * America/New_York"
    agent: "main"
    session: "isolated"
    wake: "next-heartbeat"
    delivery: "none telegram 8531859108"
    payload: {kind: "agentTurn", model: "claude-cli/claude-opus-5", timeout: 900}
    trigger: false
  - name: "nightly-meditation"
    enabled: true
    schedule: "cron 0 23 * * * America/New_York"
    agent: "main"
    session: "isolated"
    wake: "now"
    delivery: "none"
    payload: {kind: "agentTurn", timeout: 900}
    trigger: false
  - name: "imessage-check"
    enabled: true
    schedule: "every 1800000ms"
    agent: ""
    session: "isolated"
    wake: "now"
    delivery: "none last"
    payload: {kind: "agentTurn", timeout: 180, thinking: "off", light_context: true}
    trigger: true
  - name: "main-pipeline-fix"
    enabled: true
    schedule: "cron 0 */6 * * * America/New_York stagger 300000ms"
    agent: "main"
    session: "isolated"
    wake: "next-heartbeat"
    delivery: "announce telegram 8531859108"
    payload: {kind: "agentTurn"}
    trigger: false
