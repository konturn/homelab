     luks: {mapper: dev20, uuid: 8f89d266-da67-4fca-b3da-f3476616d505}, zpool: {pool: mpool, vdev: raidz2-1}}
  - {slot: hba/phy35, model: WD201KFGX, serial_suffix: WXJR, role: data,
