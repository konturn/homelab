# Pools: the drift check expects every vdev and the pool ONLINE.
zpools:
  mpool:
    vdevs: [raidz2-0, raidz2-1, raidz2-2]

# ---------------------------------------------------------------------------
# USB audio: one C-Media USB sound card per Snapcast zone. The cards have no
# serial number, so the physical port is the only thing udev can name them
# by; a card moved to another port comes up as `Device`, `Device_1`, ... and
# its zone's snapclient cannot open plughw:CARD=<id> (issue #132).
#
# Port syntax is the kernel's: <bus>-<port>[.<port>...], as in
# /sys/bus/usb/devices and `lsusb -t`. `interface` is the audio interface
# number (the rules match <port>:1.<interface>).
# ---------------------------------------------------------------------------
usb_controllers:
  pcie:
    desc: Fresco Logic FL1100 USB 3.0 PCIe card
    pci_path: pci0000:80/0000:80:02.0/0000:82:00.0
    bus: 3
  mobo_ehci1:
    desc: motherboard USB 2.0, Intel C600 EHCI 1
    pci_path: pci0000:00/0000:00:1d.0
    bus: 2

# Order is the rule order in 85-my-usb-audio.rules.
audio_zones:
  - {id: Main_Bedroom, snapclient: main_bedroom, controller: mobo_ehci1, port: 2-1.3}
  - {id: Office, snapclient: office, controller: pcie, port: 3-2.3.2}
  - {id: Kitchen, snapclient: kitchen, controller: pcie, port: 3-2.3}
  - {id: Main_Bathroom, snapclient: main_bathroom, controller: pcie, port: 3-2.2}
  - {id: Guest_Bathroom, snapclient: guest_bathroom, controller: pcie, port: 3-4}
  - {id: Guest_Bedroom, snapclient: guest_bedroom, controller: pcie, port: 3-3}
  - {id: Global, snapclient: global, controller: mobo_ehci1, port: 2-1.3.4}

# Observed, not desired (checked 2026-11-07): only Global is where the rules
# expect it. Two more cards sit on the motherboard hub at 2-1.3.2 and
# 2-1.3.3 and come up unnamed (`Device`, `Device_1`); nothing is plugged into
# the PCIe card (hub 3-2 is there, empty). 2-1.3 is itself a hub, so the
# Main_Bedroom rule cannot match as written. Which zones the two cards belong
# to is not known; until that is traced, the drift check reports them, and
# the six zones stay in snapclient_disabled_zones (ansible/inventory.yml).

# ---------------------------------------------------------------------------
# Whole-house audio, end to end (issue #154 plans the replacement):
#
#   speaker zone (amps[].zones) -> amp input (amps[].inputs) -> stream
#   (audio_zones[].id, one Snapcast zone / Spotify Connect target) -> output
#   (today: the zone's USB card, audio_zones[].controller/port)
#
# When #154's multichannel interface arrives, a stream's output becomes an
# output pair (`output: {interface: <card>, pair: <n>}` in place of
# controller/port); amps, inputs and speaker zones keep this shape.
#
# Monoprice 10761 6-zone amps, each a standalone unit on its own Prolific
# USB-serial adapter. Home Assistant's monoprice integration talks to them;
# `ha_port` is the path inside the homeassistant container (its config entry
# is named after it), `serial_by_id` the host device mapped there. facts:test
# checks docker/docker-compose.yml maps exactly these. A zone can only play
# its own amp's inputs; keep a room's speakers on one amp.
# inputs: number -> {label: name in HA, stream: the audio_zones id meant to
# feed it, judged from the label; RCA wiring not traced}.
# zones: amp zone number -> {name: HA friendly name, entity}.
# ---------------------------------------------------------------------------
amps:
  A:
    model: Monoprice 10761
    serial_by_id: usb-Prolific_Technology_Inc._USB-Serial_Controller_ETDRb11A920-if00-port0
    ha_port: /dev/ttyUSB0
    inputs:
      1: {label: Global, stream: Global}
      2: {label: Guest Bathroom, stream: Guest_Bathroom}
      3: {label: Guest Bedroom, stream: Guest_Bedroom}
      4: {label: Office, stream: Office}
      5: {label: c}
      6: {label: d}
    zones:
      11: {name: Living Room Speakers 2, entity: media_player.zone_11}
      12: {name: Dining Room Speakers, entity: media_player.zone_12}
      13: {name: Guest Bathroom Speakers, entity: media_player.zone_13}
      14: {name: Deck Speakers, entity: media_player.zone_5}
      15: {name: Kitchen Speakers, entity: media_player.zone_15}
      16: {name: Living Room Speakers 1, entity: media_player.zone_16}
  B:
    model: Monoprice 10761
    serial_by_id: usb-Prolific_Technology_Inc._USB-Serial_Controller-if00-port0
    ha_port: /dev/ttyUSB1
    inputs:
      1: {label: Global, stream: Global}
      2: {label: test2}
      3: {label: test3}
      4: {label: test4}
      5: {label: test5}
      6: {label: test6}
    zones:
      11: {name: Main Bathroom Speakers, entity: media_player.zone_11_2}
      12: {name: Gym Speakers, entity: media_player.zone_12_2}
      13: {name: Front Basement Hallway Speakers, entity: media_player.zone_13_2}
      14: {name: Ping Pong Speakers, entity: media_player.zone_14}
      15: {name: Back Basement Hallways Speakers, entity: media_player.zone_15_2}
      16: {name: Office Speakers, entity: media_player.zone_16_2}
    note: >-
      Office Speakers (zone 16) sit on B, but the Office stream is labelled on
      A's input 4, so the Office speakers can only play Global today (#154).
  C:
    model: Monoprice 10761
    connected: false
    note: >-
      Not connected yet. Planned (#154): Office, Main Bedroom, Guest Bedroom,
      maybe Movie Room, on a third USB-serial adapter.

# ---------------------------------------------------------------------------
# Network-attached devices with no health signal of their own. Addresses and
# MACs live in ansible/inventory.yml (named here by variable); probes in
# inventory/dependencies.yml. `link` is the path from the core switch, as far
# as it has been traced (S2500 FDB over SNMP, read-only).
# ---------------------------------------------------------------------------
network_devices:
  back_camera:
    desc: Amcrest back camera (Home Assistant camera.10_6_128_14)
    address_var: back_camera_address
    mac_var: back_camera_mac
    vlan: 6
    power: PoE
    link: S2500 gigabitethernet0/0/47 -> upstairs PoE switch (IoT; NETGEAR, not managed in networking/), port on that switch not traced
    note: Offline 2026-10-21 to 2026-11-08; back after its PoE cable was reseated at the switch.
  doorbell:
    desc: Amcrest doorbell (amcrest2mqtt)
    address_var: doorbell_address
    mac_var: doorbell_mac
    vlan: 6
    link: not traced (its MAC is not in the S2500 forwarding table while it is offline)
    known_issue: "Unreachable since 2026-07-13 (issue #123); hardware fix pending."
