# Physical facts about the router (router.lab.nkontur.com): which disk sits in
# which slot, which USB sound card is plugged into which port. See
# inventory/README.md.
#
# This file is the source of truth. Generated from it (ci/facts/render.py,
# CI fails when a generated file is stale):
#   base/udev/85-my-usb-audio.rules   audio_zones
#   base/disk/crypttab                disks[].luks
# Checked against the live router by the scheduled facts:drift job
# (ci/facts/drift.py): disks in their slots with the declared model, serial
# suffix, LUKS mapper and pool membership; sound cards on their ports.
#
# The repo is mirrored publicly: disks carry only the last 4 characters of
# their serial number (enough to tell two disks of the same model apart, and
# to match `lsblk -o SERIAL`).

# ---------------------------------------------------------------------------
# Disk controllers. `by_path` is the /dev/disk/by-path name of a slot without
# its slot suffix: the slot `hba/phy12` is
# /dev/disk/by-path/pci-0000:06:00.0-sas-exp0x5003048001134f3f-phy12-lun-0.
# ---------------------------------------------------------------------------
disk_controllers:
  hba:
    desc: LSI SAS9211-8i (SAS2008), internal ports to the chassis backplane expander (24 bays)
    by_path: "pci-0000:06:00.0-sas-exp0x5003048001134f3f-{slot}-lun-0"
  ahci:
    desc: Motherboard SATA (Intel C600 AHCI, X9DR3-F), shares cabling/power with the 870 EVO
    by_path: "pci-0000:00:1f.2-{slot}"

# ---------------------------------------------------------------------------
# Disks. role: data (mpool member), boot (root fs), persistent_data (Docker
# data-root and every container's config), retired (in a slot, out of the
# pool), empty (slot with nothing detected).
# luks.mapper/uuid render base/disk/crypttab; key file and options default
# to /etc/password_file.txt and `luks`.
# known_issue: shown next to any drift the disk causes. It does not silence
# the drift check.
# ---------------------------------------------------------------------------
disks:
  # Motherboard SATA
  - slot: ahci/ata-1
    model: WD260KFGX
    serial_suffix: NA4M
    role: data
    luks: {mapper: dev17, uuid: f0924ba1-d8bb-440d-b5cf-904b5ae54ce7}
    zpool: {pool: mpool, vdev: raidz2-0}
    note: >-
      Replacement for dev22 (zpool replace, 2026-10-18). Dropped off the bus
      on 2026-11-05 with the 870 EVO (same controller), resilvered back in
      2026-11-06.
  - slot: ahci/ata-2
    model: CT480BX500SSD1
    serial_suffix: E56F
    role: boot
    holds: [/, /boot, swap]
    luks:
      mapper: sda5_crypt
      uuid: 3b0b75c5-603e-47a6-bb4c-2fa1453da1b2
      partition: 5
      keyfile: none
      options: luks,discard
    note: Unlocked by passphrase at boot (key file none), docs/POWER.md.
  - slot: ahci/ata-4
    model: Samsung SSD 870 EVO 1TB
    serial_suffix: 068K
    role: persistent_data
    holds: [/persistent_data]
    luks: {mapper: persistent_data, uuid: 4cf4756a-0b62-4fd4-b435-81e0f1e3809f}
    note: >-
      Single disk, no redundancy: Docker data-root and every app config. If it
      drops, every container (Grafana alerting included) goes with it; the
      dead-man check (docs/DEADMAN.md) is what notices. Vanished from the bus
      2026-11-05 03:01, back after a reseat, live mapper reopened as
      persistent_data_r until the next reboot.

  # LSI HBA -> backplane expander. Slots are expander phys (phy12-phy35).
  - {slot: hba/phy12, model: WD240KFGX, serial_suffix: V9XN, role: data,
     luks: {mapper: dev1, uuid: b5912d16-d82e-4c5e-a8c1-597a6b8ff02d}, zpool: {pool: mpool, vdev: raidz2-0}}
  - slot: hba/phy13
    model: WD201KFGX
    serial_suffix: SGBR
    role: data
    luks: {mapper: dev12, uuid: c03b38b6-959e-49c8-a712-0cd0ccdfff8f}
    zpool: {pool: mpool, vdev: raidz2-1}
    known_issue: >-
      FAULTED in mpool (55 read errors, SMART clean): suspect cable or slot,
      not the disk. Replacement pending; no free bay.
  - {slot: hba/phy14, model: WD240KFGX, serial_suffix: PVPB, role: data,
     luks: {mapper: dev3, uuid: 9f2b9dd5-bae9-46fa-8bc9-f5a7a68dce8c}, zpool: {pool: mpool, vdev: raidz2-0}}
  - {slot: hba/phy15, model: WD240KFGX, serial_suffix: BTBB, role: data,
     luks: {mapper: dev4, uuid: 2cf4cf51-5504-4467-abe2-6602fcb1fdf5}, zpool: {pool: mpool, vdev: raidz2-0}}
  - {slot: hba/phy16, model: WD240KFGX, serial_suffix: ZSXM, role: data,
     luks: {mapper: dev5, uuid: d211aeca-2e71-4051-b292-8b8106e8d8f9}, zpool: {pool: mpool, vdev: raidz2-0}}
  - {slot: hba/phy17, model: WD100EMAZ, serial_suffix: LTWM, role: data,
     luks: {mapper: dev6, uuid: ffdb5527-8df5-44ca-b80d-8ecb255b7321}, zpool: {pool: mpool, vdev: raidz2-2}}
  - {slot: hba/phy18, model: WD120EMFZ, serial_suffix: ALLU, role: data,
     luks: {mapper: dev13, uuid: f357299b-67ae-4ef0-a9a9-f2751c9f6689}, zpool: {pool: mpool, vdev: raidz2-2}}
  - slot: hba/phy19
    model: WD240KFGX
    serial_suffix: X6RK
    role: retired
    luks: {mapper: dev22, crypttab: false}
    note: >-
      Ex-dev22, replaced in mpool by dev17 (2026-10-18); pending sectors, RMA
