  - {slot: hba/phy20, model: WD201KFGX, serial_suffix: S6SN, role: data,
     luks: {mapper: dev11, uuid: 87da6c73-80de-4834-b316-0e94bb8203c4}, zpool: {pool: mpool, vdev: raidz2-1}}
  - {slot: hba/phy21, model: WD120EMFZ, serial_suffix: 1J2L, role: data,
     luks: {mapper: dev9, uuid: c571cb2a-447c-44c3-b4d9-8b2d0f2ef765}, zpool: {pool: mpool, vdev: raidz2-2}}
  - slot: hba/phy22
    role: empty
    note: No disk detected on this expander phy (2026-11-07). Which front bay it is has not been traced.
  - {slot: hba/phy23, model: WD260KFGX, serial_suffix: 26HD, role: data,
     luks: {mapper: dev8, uuid: 79437d5c-389d-45c0-91d3-40aa6297bf23}, zpool: {pool: mpool, vdev: raidz2-0}}
  - {slot: hba/phy24, model: WD201KFGX, serial_suffix: PV6R, role: data,
