# Auto-merge policy configuration. See docs/AUTOMERGE.md.
#
# Every image update in a deployed compose file is merged without review
# when it passes every check in ci/automerge/policy.py, EXCEPT:
#   - major versions (and tag changes whose version scheme is ambiguous),
#   - services and images on the `denylist` below,
#   - services that run only under a compose profile (e.g. `wordpress`),
#   - update kinds a service's entry under `services` restricts.
# Version updates of services whose data migrates one way (Home Assistant,
# InfluxDB) are backed up before they deploy (`pre_upgrade_backup` below).
# Those wait for a human; the sweep labels them `automerge-manual`.
# This file is CODEOWNERS-protected.

# MR authors whose image-update MRs may be auto-merged. The merging identity
# (AUTOMERGE_TOKEN's user) is never one of them: author != merger is enforced.
authors:
  - moltbot
  # Renovate (RENOVATE_TOKEN project bot, see docs/RENOVATE.md)
  - project_4_bot_af78a2ea227eba9e10006515fbde375e

target_branch: main

# Compose files an eligible MR may touch, limited to in-place edits of service
# `image:` lines (same image, tag/digest only). Each must be rendered by at
# least one host (docker_compose_file_names in ansible/inventory.yml), and
# every such host must be listed under deploy_hosts.
# Not listed, and ignored by Renovate: docker-compose-zigbee.yml and
# docker-compose-satellite.yml. No host renders them (zigbee2mqtt runs from
# docker-compose.yml on the router).
compose_files:
  - docker/docker-compose.yml
  - docker/docker-compose-observability.yml   # zwave, satellite-2
  - docker/docker-compose-zwave.yml           # zwave

# Inventory host -> prefix of its per-service deploy job
# (`<prefix>:deploy-service` in .gitlab-ci.yml, ansible/service-update.yml).
deploy_hosts:
  router.lab.nkontur.com: router
  zwave.lab.nkontur.com: zwave
  satellite-2.lab.nkontur.com: satellite-2

# Maximum general-class auto-merges in any rolling 24h window (fast track has
# its own budget below). The sweep merges at most one MR per run and none
# while a per-service deploy is still running.
max_per_24h: 24

# CI image class (docs/AUTOMERGE.md, "CI images"): Renovate MRs whose only
# change is job image lines in these CI files, edited in place (same image,
# new reference pinned by digest, not a major). Nothing is deployed: the merge
# commit carries `Automerge-Policy: ci-image` (full host deploys become
# manual), and the sweep watches the main pipeline of the merge. If a job that
# runs the changed image fails there, it opens a revert MR and a rollback
# issue (job=ci), which holds further updates of that image. Merges count
# against max_per_24h. The images under `denylist.images` below stay manual
# here too; `ci_images.denylist` adds CI-only exceptions.
ci_images:
  enabled: true
  authors:
    # Renovate only.
    - project_4_bot_af78a2ea227eba9e10006515fbde375e
  files:
    - .gitlab-ci.yml
  denylist:
    willhallonline/ansible: >-
      The .ansible image runs the sweep, plan-deploy and every deploy. A
      broken one takes down the jobs that would detect and revert it.

# Bot-config class (docs/AUTOMERGE.md, "Bot-config class"): moltbot's own
# low-risk configuration MRs. moltbot reads outside input and can be
# prompt-injected, so nothing here trusts it: ci/automerge/botconfig.py
# checks that every changed file is on the allowlist below AND that every
# change in it has the allowed shape (resource/log-level values in compose
# files; for/summary/description/severity/threshold values of existing
# Grafana alert rules; dashboard JSON without new datasources; Markdown docs).
# A hard never-list in botconfig.py (networking, ansible, CI, OpenClaw, Vault,
# secrets, scripts, ...) wins over every allowlist, as does `never` below.
# New, deleted, renamed or mode-changed files never qualify. Merges count
# against max_per_24h and against the class cap below.
bot_config:
  enabled: true
  authors:
    - moltbot
  max_per_24h: 6
  # A resource limit/reservation may move to between 0.5x and 2x its old value.
  resource_ratio: [0.5, 2.0]
  paths:
    compose:
      - docker/docker-compose.yml
      - docker/docker-compose-observability.yml
      - docker/docker-compose-zwave.yml
    alerts:
      - docker/grafana/provisioning/alerting/infrastructure.yml
      - docker/grafana/provisioning/alerting/anomaly.yml
    dashboard:
      - docker/grafana/provisioning/dashboards/json/*.json
    docs:
      - docs/*.md
      - docs/**/*.md
      - README.md
      - docs/**/README*.md
  # Docs that describe security policy, deploy procedures or this policy
  # itself, or that agents follow as runbooks: reviewed.
  docs_exclude:
    - docs/AUTOMERGE.md
    - docs/DISASTER_RECOVERY.md
    - docs/RENOVATE.md
    - docs/DEPLOY.md
    - docs/FIREWALL.md
    - docs/SECRET_ROTATION.md
    - docs/GITLAB_SETTINGS.md
    - docs/docker-proxy-architecture.md
    - docs/jit-*
    - docs/*security*
    - docs/*SECURITY*
  # On top of the global denylist services and any service named
  # openclaw*/moltbot* (always denied).
  denied_services:
    - nginx
    - lab_nginx
    - iot_nginx
    - jit-approval-svc
    - anomaly-detector
    - chromium-browser
  never:
    - docker/grafana/provisioning/dashboards/homelab.yml
    # Playbooks and the router's config: Noah reviews (event-routing.md 8.3).
    - docker/event-router/**
  # The one exception to `docker/event-router/**` above (decision 10 of
  # docs/design/event-routing.md): an MR that only ADDS new playbook files
  # docker/event-router/playbooks/<id>.yml, each with `id: <id>`, an explicit
  # `mode: shadow` and an allowlisted action type (botconfig.py). A shadow
  # playbook only logs what it would do. Changing an existing playbook,
  # promotion to `active` included, stays a reviewed MR. Merges count against
  # this cap, the bot-config cap and max_per_24h.
  shadow_playbooks:
    enabled: true
    max_per_24h: 3

# Never auto-merged, whatever the update kind. Each entry needs a reason; the
# sweep prints it on the MR and labels the MR `automerge-manual`. Renovate
# labels updates of the denylisted images `automerge-manual` too (renovate.json,
# kept in sync by ci/automerge/test_fast_track.py).
denylist:
  services:
    gitlab: >-
      GitLab runs the pipelines, the sweep and the per-service deploy. A bad
      upgrade takes down the pipeline that would roll it back, and its
      database migrations are one-way. Upgrade by hand (docs/AUTOMERGE.md,
      "GitLab updates").
    vault: >-
      Every deploy job reads its secrets from Vault before it changes
      anything. A Vault that breaks after the health gate blocks every later
      deploy, the revert included.
    docker-socket-proxy: >-
      CI image builds reach the Docker daemon through it.
  images:
    gitlab/gitlab-ee: GitLab itself (see the gitlab service).
    gitlab/gitlab-ce: GitLab itself (see the gitlab service).
    gitlab/gitlab-runner: runs every CI job, including the deploy and its rollback.
    hashicorp/vault: Vault (see the vault service).
    tecnativa/docker-socket-proxy: CI image builds (see the docker-socket-proxy service).

# Stateful services and database images. A major-version upgrade of one of
# these is a heavy change: it would need last night's backup to have succeeded
# and a fresh ZFS snapshot of its dataset, which the bot cannot verify, so heavy
# changes stay manual-only (every major-version change is refused anyway).
stateful:
  services:
    - nextcloud
    - nextcloud_db
    - wordpress_db
    - bitwarden
    - blog
    - gitlab
    - vault
    - influxdb
    - paperless-ngx
    - homeassistant
    - frigate
  images:
    - mariadb
    - mysql
    - postgres
    - mongo
    - redis
    - influxdb

# MR label that blocks auto-merge for that MR.
freeze_label: freeze

# Default seconds to wait for a service to become healthy after deploy.
default_health_timeout: 600

# Pre-upgrade backups (docs/AUTOMERGE.md, "Pre-upgrade backups"). A version
# (minor) update of a service with `pre_upgrade_backup` is backed up by
# ci/automerge/pre-upgrade-backup.sh before the new image starts, into
# <dir>/<service>/<UTC time>-<old tag>-to-<new tag>, and restored if the
# rollback fires. The newest `keep` backups per service are kept. `dir` must
# be on the ZFS pool (the script refuses anything else): copies onto or off
# /persistent_data are limited to `rate_mb` MB/s, because a full-speed 14 GB
# copy there on 2026-10-20 starved Vault. `timeout` (seconds) bounds each
# backup and each restore.
pre_upgrade_backups:
  dir: /mpool/backups/automerge-pre-upgrade
  keep: 2
  rate_mb: 40
  timeout: 1800

# Per-service options (compose service name). A service needs no entry to be
# auto-merged; list it only to set one of:
#   probe:   URL that must return 2xx/3xx after deploy. Requests are sent to
#            the internal reverse proxy (lab_nginx_ip) with SNI/Host set from
#            the URL, so they do not depend on DNS.
#   probe_via: `external` sends the probe to the external reverse proxy
#            (nginx_ip) instead, for hostnames only it serves.
#   timeout: override of default_health_timeout.
#   updates: subset of [digest, patch, minor] (default: all three). Use it for
#            services whose version change runs a one-way migration that
#            restoring the previous image cannot undo.
#   zero_minor_is_minor: true counts a 0.x minor (0.163 -> 0.165) as a minor
#            update instead of a major one, for projects that ship routine
#            releases as 0.x minors. Majors stay manual.
#   pre_upgrade_backup: homeassistant | influxdb. Before a version (minor)
#            update deploys, back up the data its new version migrates one
#            way, and restore it on rollback (see pre_upgrade_backups above).
# Without a probe the gate is the container's own healthcheck. Every
# long-running service in the deployed compose files has one; services
# without one are on the denylist (checked by test_fast_track.py).
services:
  # media
  plex:
    probe: https://nkontur.com/plex/identity
    probe_via: external
  tautulli:
    probe: https://tautulli.lab.nkontur.com/status
  radarr:
    probe: https://radarr.lab.nkontur.com/ping
  sonarr:
    probe: https://sonarr.lab.nkontur.com/ping
  prowlarr:
    probe: https://prowlarr.lab.nkontur.com/ping
  jackett:
    probe: https://jackett.lab.nkontur.com/UI/Login
  ombi:
    probe: https://nkontur.com/plex-requests/
    probe_via: external
  deluge:
    probe: https://deluge.lab.nkontur.com/
  # home automation. Home Assistant's monthly (minor) releases can migrate
  # .storage and the recorder database (SQLite) one way, so a minor update is
  # backed up first: /config without the database, and the database itself
  # only when the new image's recorder schema differs from the database's.
  homeassistant:
    probe: https://homeassistant.lab.nkontur.com/manifest.json
    pre_upgrade_backup: homeassistant
  # observability
  grafana:
    probe: https://grafana.lab.nkontur.com/api/health
  tempo:
    probe: https://tempo.lab.nkontur.com/ready
  # The collector has been 0.x for years and ships a 0.x minor every two
  # weeks. It rejects unknown config keys at start, so a renamed key fails
  # the health gate and the sweep rolls it back.
  otel-collector:
    zero_minor_is_minor: true
  # InfluxDB 2.x minor releases migrate its metadata (influxd.bolt,
  # influxd.sqlite) one way, and `influxd downgrade` cannot go back to a 2.8 or
  # later release (2.9.1 knows only 2.0-2.4 as targets, which would also drop
  # hashed tokens). So a minor update copies both files with influxd stopped,
  # and the rollback puts them back. The TSM data is not migrated by a minor.
  influxdb:
    pre_upgrade_backup: influxdb
  # reverse proxies
  nginx:
    probe: https://nkontur.com/
    probe_via: external
  lab_nginx:
    probe: https://grafana.lab.nkontur.com/api/health
  # Digest-only services. A new version of these runs a one-way migration on
  # start (nextcloud: `occ upgrade`; vaultwarden: its database schema), so
  # rolling back the image would not restore the previous state. A digest
  # refresh of the same tag keeps the version and rolls back cleanly; version
  # updates go through a reviewed merge and the full deploy (which also runs
  # `occ upgrade`). The deploy refuses a nextcloud digest whose packaged
  # version differs from the installed one (ansible/service-update.yml).
  nextcloud:
    updates: [digest]
    probe: https://nextcloud.nkontur.com/status.php
    probe_via: external
    timeout: 900
  bitwarden:
    updates: [digest]
    probe: https://bitwarden.nkontur.com/alive
    probe_via: external
  # blog and wordpress_db run only under the "wordpress" compose profile.
  # Services with `profiles:` are never auto-merged (policy.py reads the
  # compose file), and Renovate ignores their images (renovate.json).

# Fast track: images of services published through the external reverse proxy
# (docker/nginx/router.lab.nkontur.com/external_*.conf) or a WAN port forward
# (networking/iptables/rules.v4). Their digest refreshes and patch releases
# are proposed by Renovate at any hour and merge as soon as the MR pipeline
# passes, all other checks above included, even while the sweep schedule runs
# with AUTOMERGE_DRY_RUN=1 (only AUTOMERGE_DRY_RUN=all stops them). Their
# other non-major updates go through the general class, where the service's
# `updates` allows them. See docs/AUTOMERGE.md ("Fast track").
#
# An MR qualifies only if it changes exactly one of these images in
# docker/docker-compose.yml and was opened by an author listed here. Keep the
# image list identical to the "Fast track" packageRules in renovate.json
# (checked by ci/automerge/test_fast_track.py).
fast_track:
  enabled: true
  authors:
    # Renovate only: it derives the new digest from the registry itself.
    - project_4_bot_af78a2ea227eba9e10006515fbde375e
  max_per_24h: 4
  images:
    plexinc/pms-docker: {}                      # plex
    linuxserver/ombi: {}                        # ombi
    homeassistant/home-assistant: {}            # homeassistant
    lscr.io/linuxserver/deluge: {}              # deluge (peer port)
    izderadicka/audioserve: {}                  # booksonic (floating tag: digest only in practice)
    nextcloud: {updates: [digest]}              # nextcloud
    vaultwarden/server: {updates: [digest]}     # bitwarden
  # Not listed: nginx. nginx, lab_nginx, iot_nginx and bluebubbles-relay run
  # the local build from docker/images/nginx, whose base image updates are
  # Dockerfile changes and always reviewed.
  # Not listed: database images. A database image is the hardest one to roll
  # back; their non-major updates go through the general class.
