# Auto-merge policy configuration. See docs/AUTOMERGE.md.
#
# Only MRs that pass every check in ci/automerge/policy.py are merged without
# review. Anything not listed under `services` always needs a human.
# This file is CODEOWNERS-protected.

# MR authors whose image-update MRs may be auto-merged. The merging identity
# (AUTOMERGE_TOKEN's user) is never one of them: author != merger is enforced.
authors:
  - moltbot
  # Renovate (RENOVATE_TOKEN project bot, see docs/RENOVATE.md)
  - project_4_bot_af78a2ea227eba9e10006515fbde375e

target_branch: main

# Files an eligible MR may touch. docker/docker-compose.yml is further limited
# to in-place edits of service `image:` lines (same image, tag/digest only).
allowed_files:
  - docker/docker-compose.yml

# Maximum auto-merges in any rolling 24h window.
max_per_24h: 3

# Rule 8 (ZFS) is decided by the redundancy each vdev has left, not by the
# DEGRADED label (ci/automerge/policy.py, "Host storage"):
#   - every auto-merge stops while a pool is SUSPENDED, UNAVAIL or FAULTED, I/O
#     is suspended, data errors are reported, or a vdev has no redundancy left
#     (raidz2: two members unavailable in the same vdev);
#   - while a resilver or scrub runs, heavy changes (below) stop and normal
#     image updates go ahead;
#   - a DEGRADED pool that still has redundancy, with no resilver running, does
#     not block.
# Nothing to configure here.

# Stateful services and database images. A major-version upgrade of one of
# these is a heavy change: it would need last night's backup to have succeeded
# and a fresh ZFS snapshot of its dataset, which the bot cannot verify, so heavy
# changes stay manual-only (rule 3 also refuses every major-version change).
stateful:
  services:
    - nextcloud
    - nextcloud_db
    - wordpress_db
    - bitwarden
    - blog
    - gitlab
    - vault
    - influxdb
    - paperless-ngx
    - homeassistant
  images:
    - mariadb
    - mysql
    - postgres
    - mongo
    - redis
    - influxdb

# MR label that blocks auto-merge for that MR.
freeze_label: freeze

# Default seconds to wait for a service to become healthy after deploy.
default_health_timeout: 600

# Compose service name -> options.
#   probe:   optional URL that must return 2xx/3xx after deploy. Requests are
#            sent to the internal reverse proxy (lab_nginx_ip) with SNI/Host set
#            from the URL, so they do not depend on DNS.
#   probe_via: `external` sends the probe to the external reverse proxy
#            (nginx_ip) instead, for hostnames only it serves.
#   timeout: optional override of default_health_timeout.
#   updates: optional subset of [digest, patch, minor] (default: all three).
# The container's own healthcheck (if it has one) must also report healthy.
services:
  # media
  plex:
    probe: https://nkontur.com/plex/identity
    probe_via: external
  tautulli:
    probe: https://tautulli.lab.nkontur.com/status
  radarr:
    probe: https://radarr.lab.nkontur.com/ping
  sonarr:
    probe: https://sonarr.lab.nkontur.com/ping
  lidarr: {}
  prowlarr:
    probe: https://prowlarr.lab.nkontur.com/ping
  jackett:
    probe: https://jackett.lab.nkontur.com/UI/Login
  ombi:
    probe: https://nkontur.com/plex-requests/
    probe_via: external
  nzbget: {}
  deluge:
    probe: https://deluge.lab.nkontur.com/
  navidrome: {}
  booksonic: {}          # audioserve
  # home automation
  homeassistant:
    probe: https://homeassistant.lab.nkontur.com/manifest.json
  # observability
  grafana:
    probe: https://grafana.lab.nkontur.com/api/health
  loki: {}
  promtail: {}
  tempo:
    probe: https://tempo.lab.nkontur.com/ready
  otel-collector: {}
  # reverse proxies
  nginx:
    probe: https://nkontur.com/
    probe_via: external
  lab_nginx:
    probe: https://grafana.lab.nkontur.com/api/health
  iot_nginx: {}
  bluebubbles-relay: {}  # same image as nginx; must be listed so nginx MRs can qualify
  # Digest-only services. A new version of these runs a one-way migration on
  # start (nextcloud: `occ upgrade`; vaultwarden and wordpress: their database
  # schema), so rolling back the image would not restore the previous state.
  # A digest refresh of the same tag keeps the version and rolls back cleanly;
  # version updates go through a reviewed merge and the full deploy (which also
  # runs `occ upgrade`). The deploy refuses a nextcloud digest whose packaged
  # version differs from the installed one (ansible/router-service-update.yml).
  nextcloud:
    updates: [digest]
    probe: https://nextcloud.nkontur.com/status.php
    probe_via: external
    timeout: 900
  bitwarden:
    updates: [digest]
    probe: https://bitwarden.nkontur.com/alive
    probe_via: external
  blog:
    updates: [digest]
    probe: https://blog.nkontur.com/
    probe_via: external
  # Not listed: databases (nextcloud_db, wordpress_db, influxdb, paperless-redis).

# Fast track: images of services published through the external reverse proxy
# (docker/nginx/router.lab.nkontur.com/external_*.conf) or a WAN port forward
# (networking/iptables/rules.v4). Their digest refreshes and patch releases
# merge as soon as the MR pipeline passes, all other checks above included,
# even while the sweep schedule runs with AUTOMERGE_DRY_RUN=1 (only
# AUTOMERGE_DRY_RUN=all stops them). Their minor and major updates always need
# a human, in every mode. See docs/AUTOMERGE.md ("Fast track").
#
# An MR qualifies only if it changes exactly one of these images (on one or
# more allowlisted services) and was opened by an author listed here. Keep the
# image list identical to the "Fast track" packageRule in renovate.json
# (checked by ci/automerge/test_fast_track.py).
fast_track:
  enabled: true
  authors:
    # Renovate only: it derives the new digest from the registry itself.
    - project_4_bot_af78a2ea227eba9e10006515fbde375e
  max_per_24h: 4
  images:
    nginx: {}                                   # nginx (external), lab_nginx, iot_nginx, bluebubbles-relay
    plexinc/pms-docker: {}                      # plex
    linuxserver/ombi: {}                        # ombi
    homeassistant/home-assistant: {}            # homeassistant
    lscr.io/linuxserver/deluge: {}              # deluge (peer port)
    izderadicka/audioserve: {}                  # booksonic (floating tag: digest only in practice)
    nextcloud: {updates: [digest]}              # nextcloud
    vaultwarden/server: {updates: [digest]}     # bitwarden
    wordpress: {updates: [digest]}              # blog
  # Not listed: database images. nextcloud_db and wordpress_db are reachable
  # only from their application's internal network, restarting one interrupts
  # its application, and a database image is the hardest one to roll back.
  # Their updates (digest refreshes included) keep the reviewed path.
