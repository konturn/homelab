# Aruba Instant cluster configuration (desired state).
# Generated by iapctl.py export; values of the form {{vault:<path>#<field>}}
# are kept in Vault and are not compared or applied unless required.

virtual-controller-country US
virtual-controller-key {{vault:homelab/network/aruba-iap#virtual_controller_key}}
virtual-controller-ip 10.4.128.10
name Movie_IAP
terminal-access
clock timezone none 00 00
rf-band all
allow-new-aps
allowed-ap 90:4c:81:cf:49:58
allowed-ap 24:62:ce:cb:82:94

arm
 wide-bands 5ghz
 80mhz-support
 min-tx-power 9
 max-tx-power 127
 band-steering-mode prefer-higher-band
 air-time-fairness-mode default-access
 channel-quality-aware-arm-disable
 client-aware
 scanning
 client-match

rf dot11g-radio-profile
 spectrum-monitor
 max-distance 0
 max-tx-power 9
 min-tx-power 6
 disable-arm-wids-functions off
 free-channel-index 40

rf dot11a-radio-profile
 max-distance 0
 max-tx-power 127
 min-tx-power 12
 disable-arm-wids-functions off

syslog-level warn ap-debug
syslog-level warn network
syslog-level warn security
syslog-level warn system
syslog-level warn user
syslog-level warn user-debug
syslog-level warn wireless
extended-ssid
allow-rest-api
hash-mgmt-password
hash-mgmt-user admin password hash {{vault:homelab/network/aruba-iap#mgmt_user_hash}}

wlan access-rule default_wired_port_profile
 index 0
 rule any any match any any any permit

wlan access-rule wired-SetMeUp
 index 1
 rule masterip 0.0.0.0 match tcp 80 80 permit
 rule masterip 0.0.0.0 match tcp 4343 4343 permit
 rule any any match udp 67 68 permit
 rule any any match udp 53 53 permit

wlan access-rule aethernet-main
 index 2
 rule any any match any any any permit

wlan access-rule aethernet-guest
 index 3
 rule any any match any any any permit

wlan access-rule aethernet-iot
 index 4
 rule any any match any any any permit

wlan access-rule aethernet-airgap
 index 5
 rule any any match any any any permit

wlan access-rule aethernet-internal
 index 6
 rule any any match any any any permit

wlan ssid-profile aethernet-main
 enable
 index 0
 type employee
 essid aethernet-main
 wpa-passphrase {{vault:homelab/network/aruba-iap-ssids#aethernet-main}}
 opmode wpa2-psk-aes
 max-authentication-failures 0
 vlan 4
 rf-band all
 captive-portal disable
 dtim-period 1
 broadcast-filter none
 dmo-channel-utilization-threshold 90
 local-probe-req-thresh 0
 max-clients-threshold 64
 dot11k
 dot11v

wlan ssid-profile aethernet-guest
 enable
 index 1
 type employee
 essid aethernet-guest
 wpa-passphrase {{vault:homelab/network/aruba-iap-ssids#aethernet-guest}}
 opmode wpa2-psk-aes
 max-authentication-failures 0
 vlan 5
 rf-band all
 captive-portal disable
 dtim-period 1
 broadcast-filter none
 dmo-channel-utilization-threshold 90
 local-probe-req-thresh 0
 max-clients-threshold 64
 dot11k
 dot11v

wlan ssid-profile aethernet-iot
 enable
 index 2
 type employee
 essid aethernet-iot
 wpa-passphrase {{vault:homelab/network/aruba-iap-ssids#aethernet-iot}}
 opmode wpa3-sae-aes
 max-authentication-failures 0
 vlan 6
 rf-band all
 captive-portal disable
 dtim-period 1
 broadcast-filter none
 dmo-channel-utilization-threshold 90
 local-probe-req-thresh 0
 max-clients-threshold 64

wlan ssid-profile aethernet-airgap
 enable
 index 3
 type employee
 essid aethernet-airgap
 wpa-passphrase {{vault:homelab/network/aruba-iap-ssids#aethernet-airgap}}
 opmode wpa2-psk-aes
 max-authentication-failures 0
 vlan 7
 rf-band all
 captive-portal disable
 dtim-period 1
 broadcast-filter arp
 dmo-channel-utilization-threshold 90
 local-probe-req-thresh 0
 max-clients-threshold 64

wlan ssid-profile aethernet-internal
 enable
 index 4
 type employee
 essid aethernet-internal
 wpa-passphrase {{vault:homelab/network/aruba-iap-ssids#aethernet-internal}}
 opmode wpa2-psk-aes
 max-authentication-failures 0
 vlan 3
 rf-band all
 captive-portal disable
 dtim-period 1
 broadcast-filter arp
 dmo-channel-utilization-threshold 90
 local-probe-req-thresh 0
 max-clients-threshold 64

auth-survivability cache-time-out 24

wlan external-captive-portal
 server localhost
 port 80
 url "/"
 auth-text "Authenticated"
 auto-whitelist-disable
 https

blacklist-time 3600
auth-failure-blacklist-time 3600

ids
 wireless-containment none

wired-port-profile wired-SetMeUp
 switchport-mode access
 allowed-vlan all
 native-vlan guest
 no shutdown
 access-rule-name wired-SetMeUp
 speed auto
 duplex auto
 no poe
 type guest
 captive-portal disable
 no dot1x

wired-port-profile default_wired_port_profile
 switchport-mode trunk
 allowed-vlan all
 native-vlan 4
 shutdown
 access-rule-name default_wired_port_profile
 speed auto
 duplex full
 no poe
 type employee
 auth-server InternalServer
 captive-portal disable
 no dot1x

enet0-port-profile default_wired_port_profile

uplink
 preemption
 enforce none
 failover-internet-pkt-lost-cnt 10
 failover-internet-pkt-send-freq 30
 failover-vpn-timeout 180

airgroup
 disable

airgroupservice airplay
 enable
 description AirPlay

airgroupservice airprint
 enable
 description AirPrint

airgroupservice Spotify
 enable
 id _spotify-connect._tcp

airgroupservice allowall
 enable

airgroupservice itunes
 enable

airgroupservice remotemgmt
 enable

airgroupservice sharing
 enable

airgroupservice googlecast
 enable

airgroupservice AmazonTV
 enable

airgroupservice DIAL
 enable

airgroupservice "DLNA Media"
 enable

airgroupservice "DLNA Print"
 enable

cluster-security
 allow-low-assurance-devices
