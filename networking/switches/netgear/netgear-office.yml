# Desired state for netgear-office (MS510TXPP).
# Applied by CI from main with networking/switches/netgear/ngswitch.py; see README.md.
name: netgear-office
model: MS510TXPP
vault_path: homelab/network/netgear-office
# Firmware the switch should run (Maintenance > File Management > Dual Image).
# Upgrades reboot the switch: run the manual netgear:firmware job (see README.md).
# Hashes from the vendor download (NETGEAR publishes none to compare against).
firmware:
  version: "6.7.0.52"
  url: https://www.downloads.netgear.com/files/GDC/MS510TX/MS510TX_TXPP_V6.7.0.52.zip
  sha256: e3aa7b4b878dce87bc7ffc8062b5f3f100cf9431d4ba2987a4f485723e2e4592
  image: MS510TX_TXPP_V6.7.0.52.bin
  image_sha256: c0d218ec52a452e149c351b3c81ae2a50011b831ee89158f44ebe76346d06ae4
management:
  vlan: 4
  uplink: te10
  # Ports carrying the management VLAN; the tool never changes their
  # management VLAN membership or PVID.
  protected_ports: [gi3, tw6, hx7, te10]
# PoE values the switch omits from its exported configuration.
poe_defaults_offline: {enabled: true, priority: low, limit_mw: 30000}
vlans:
  1: ""
  4: "Management"
  5: "Guest"
  6: "IoT"
  7: "Reserved"
ports:
  gi1: {pvid: 6, untagged: [6], tagged: [], poe: {enabled: true, priority: low, limit_mw: 30000}}
  gi2: {pvid: 6, untagged: [6], tagged: [], poe: {enabled: true, priority: low, limit_mw: 30000}}
  gi3: {pvid: 4, untagged: [4], tagged: [], poe: {enabled: true, priority: low, limit_mw: 30000}}
  gi4: {pvid: 6, untagged: [6], tagged: [], poe: {enabled: true, priority: low, limit_mw: 30000}}
  tw5: {pvid: 7, untagged: [7], tagged: [], poe: {enabled: true, priority: low, limit_mw: 30000}}
  tw6: {pvid: 4, untagged: [4], tagged: [], poe: {enabled: true, priority: low, limit_mw: 30000}}
  hx7: {pvid: 1, untagged: [], tagged: [4, 5, 6, 7], poe: {enabled: true, priority: low, limit_mw: 30000}}
  hx8: {pvid: 6, untagged: [6], tagged: [], poe: {enabled: true, priority: low, limit_mw: 30000}}
  te9: {pvid: 6, untagged: [6], tagged: []}
  te10: {pvid: 1, untagged: [], tagged: [4, 5, 6, 7]}
