# Managed by ansible (configure-zwave role): ALSA mixer state for the stable
# miniDSP card ids set by 85-minidsp-alsa-ids.rules. The values are a verbatim
# copy of what this Pi already restored into the m2x4HD / m2x4HD_1 cards at
# every boot (both identical: switches on, volumes 127 = 0 dB), so renaming
# the cards does not change what alsa-restore writes to the units.
{% for unit in minidsp_units %}
state.minidsp_{{ unit.serial }} {
	control.1 {
		iface PCM
		name 'Playback Channel Map'
		value.0 0
		value.1 0
		comment {
			access read
			type INTEGER
			count 2
			range '0 - 36'
		}
	}
	control.2 {
		iface PCM
		name 'Capture Channel Map'
		value.0 0
		value.1 0
		value.2 0
		value.3 0
		comment {
			access read
			type INTEGER
			count 4
			range '0 - 36'
		}
	}
	control.3 {
		iface MIXER
		name 'miniDSP 2x4HD Playback Switch'
		value.0 true
		value.1 true
		comment {
			access 'read write'
			type BOOLEAN
			count 2
		}
	}
	control.4 {
		iface MIXER
		name 'miniDSP 2x4HD Playback Switch'
		index 1
		value true
		comment {
			access 'read write'
			type BOOLEAN
			count 1
		}
	}
	control.5 {
		iface MIXER
		name 'miniDSP 2x4HD Playback Volume'
		value.0 127
		value.1 127
		comment {
			access 'read write'
			type INTEGER
			count 2
			range '0 - 127'
			dbmin -12700
			dbmax 0
			dbvalue.0 0
			dbvalue.1 0
		}
	}
	control.6 {
		iface MIXER
		name 'miniDSP 2x4HD Playback Volume'
		index 1
		value 127
		comment {
			access 'read write'
			type INTEGER
			count 1
			range '0 - 127'
			dbmin -12700
			dbmax 0
			dbvalue.0 0
		}
	}
	control.7 {
		iface CARD
		name 'miniDSP Internal Clock Validity'
		value true
		comment {
			access read
			type BOOLEAN
			count 1
		}
	}
	control.8 {
		iface MIXER
		name 'Mic Capture Switch'
		value.0 true
		value.1 true
		value.2 true
		value.3 true
		comment {
			access 'read write'
			type BOOLEAN
			count 4
		}
	}
	control.9 {
		iface MIXER
		name 'Mic Capture Switch'
		index 1
		value true
		comment {
			access 'read write'
			type BOOLEAN
			count 1
		}
	}
	control.10 {
		iface MIXER
		name 'Mic Capture Volume'
		value.0 127
		value.1 127
		value.2 127
		value.3 127
		comment {
			access 'read write'
			type INTEGER
			count 4
			range '0 - 127'
			dbmin -12700
			dbmax 0
			dbvalue.0 0
			dbvalue.1 0
			dbvalue.2 0
			dbvalue.3 0
		}
	}
	control.11 {
		iface MIXER
		name 'Mic Capture Volume'
		index 1
		value 127
		comment {
			access 'read write'
			type INTEGER
			count 1
			range '0 - 127'
			dbmin -12700
			dbmax 0
			dbvalue.0 0
		}
	}
}
{% endfor %}
