# NUT UPS monitor configuration (primary)
#
# Shutdown policy (docs/POWER.md):
#   - early, graceful: upssched (upssched.conf) asks for a forced shutdown
#     (upsmon -c fsd) after {{ ups_onbatt_shutdown_minutes }} min on battery, or when the reported
#     runtime stays below {{ ups_runtime_shutdown_seconds }} s (ups-power watch), whichever comes first;
#   - backstop: upsmon's own critical state (on battery + LOWBATT, which the
#     UPS raises at battery.runtime.low, 120 s).
# Either way upsmon writes POWERDOWNFLAG and runs SHUTDOWNCMD. Only that path
# writes the flag, so a normal reboot never turns the UPS outlets off.

# Monitor: UPS name @ localhost, power value 1, user, password, type
MONITOR {{ ups_nut_name }}@localhost 1 upsmon {{ vault_nut_monitor_password }} primary

# Minimum battery charge (%) before shutdown
MINSUPPLIES 1

# Orderly shutdown: stops VMs and containers with timeouts, syncs, then
# /sbin/shutdown -h +0. Without --execute the script only prints its plan.
SHUTDOWNCMD "/usr/local/sbin/ups-orderly-shutdown --execute"

# Written by upsmon just before SHUTDOWNCMD on a power-fail shutdown and
# removed by upsmon when it starts. At the end of that shutdown,
# /lib/systemd/system-shutdown/nutshutdown sees it (upsmon -K) and runs
# upsdrvctl shutdown: snmp-ups sends shutdown.return, so the UPS turns its
# outlets off and back on when mains returns.
POWERDOWNFLAG /etc/killpower

# Notification flags: WALL = broadcast, EXEC = run NOTIFYCMD
NOTIFYFLAG ONLINE    SYSLOG+WALL+EXEC
NOTIFYFLAG ONBATT    SYSLOG+WALL+EXEC
NOTIFYFLAG LOWBATT   SYSLOG+WALL+EXEC
NOTIFYFLAG FSD       SYSLOG+WALL+EXEC
NOTIFYFLAG SHUTDOWN  SYSLOG+WALL+EXEC
NOTIFYFLAG REPLBATT  SYSLOG+WALL+EXEC
NOTIFYFLAG COMMBAD   SYSLOG+EXEC
NOTIFYFLAG COMMOK    SYSLOG+EXEC
NOTIFYFLAG NOCOMM    SYSLOG+EXEC

# Custom notification messages
NOTIFYMSG ONLINE    "UPS %s is on line power"
NOTIFYMSG ONBATT    "UPS %s is on battery!"
NOTIFYMSG LOWBATT   "UPS %s battery is LOW - shutdown imminent!"
NOTIFYMSG FSD       "UPS %s: forced shutdown in progress"
NOTIFYMSG SHUTDOWN  "System shutting down due to UPS"
NOTIFYMSG REPLBATT  "UPS %s battery needs replacement"

# Run this command on any notification (logs, webhook, then upssched)
NOTIFYCMD /etc/nut/notify.sh

# Seconds between UPS polls
POLLFREQ 5

# Seconds between UPS polls when on battery
POLLFREQALERT 5

# Seconds without contact before declaring UPS dead
DEADTIME 15

# Seconds to wait for secondaries to disconnect during a forced shutdown
HOSTSYNC 15

# Seconds between the SHUTDOWN notification and SHUTDOWNCMD
FINALDELAY 5
