# NUT UPS daemon configuration
# Listens for upsmon and monitoring connections.
#
# 127.0.0.1: the local upsmon (primary) and local tools.
# {{ ups_nut_mgmt_listen }}: the router's management-VLAN address, for NUT
# secondaries on other hosts (docs/POWER.md, "Adding a NUT secondary").
# The firewall allows tcp/3493 to it from 10.4.0.0/16 on the mgmt VLAN only.
# If that address is missing when upsd starts, upsd logs "not listening on"
# for it and keeps serving 127.0.0.1.

LISTEN 127.0.0.1 3493
LISTEN {{ ups_nut_mgmt_listen }} 3493
MAXAGE 25
