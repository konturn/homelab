# upssched: early-shutdown timers (docs/POWER.md, "Shutdown sequence")
# Called by /etc/nut/notify.sh for every upsmon notification; acts only on
# the events below. CMDSCRIPT runs as the nut user with the timer name as $1.
#
#   ONBATT  -> start onbatt-confirm ({{ ups_onbatt_confirm_seconds }} s) and onbatt-shutdown ({{ ups_onbatt_shutdown_minutes }} min)
#   ONLINE  -> cancel both
#
# onbatt-confirm: still on battery after {{ ups_onbatt_confirm_seconds }} s (not an SNMP blip), so start
#   the runtime watcher (ups-power watch). It asks for a forced shutdown
#   when battery.runtime stays below {{ ups_runtime_shutdown_seconds }} s, and exits on line power.
# onbatt-shutdown: on battery for {{ ups_onbatt_shutdown_minutes }} min, so ask for a forced shutdown.
#
# Nothing here runs while the UPS is on line power: the timers start only on
# ONBATT, ONLINE cancels them, and every action re-reads ups.status twice and
# does nothing unless both reads say OB and neither says OL.

CMDSCRIPT /usr/local/sbin/ups-power
PIPEFN /run/nut/upssched/upssched.pipe
LOCKFN /run/nut/upssched/upssched.lock

AT ONBATT * START-TIMER onbatt-confirm {{ ups_onbatt_confirm_seconds }}
AT ONBATT * START-TIMER onbatt-shutdown {{ (ups_onbatt_shutdown_minutes | int) * 60 }}
AT ONLINE * CANCEL-TIMER onbatt-confirm
AT ONLINE * CANCEL-TIMER onbatt-shutdown
AT ONLINE * EXECUTE online
