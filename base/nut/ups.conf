# NUT UPS driver configuration
# APC Smart-UPS 1500 via its AP9631 network management card (SNMPv3)
#
# Reference: https://networkupstools.org/docs/man/snmp-ups.html
# Outage handling, shutdown and restart behaviour: docs/POWER.md

maxretry = 3
maxstartdelay = 0

[{{ ups_nut_name }}]
    driver = snmp-ups
    # By IP, not ups.lab.nkontur.com: that name is served only by Pi-hole,
    # which is a container. The killpower step (upsdrvctl shutdown, run by
    # /lib/systemd/system-shutdown/nutshutdown at the very end of a power-fail
    # shutdown) runs after every container has stopped, so the name would
    # not resolve there.
    port = {{ ups_address }}
    desc = "APC Smart-UPS 1500 (AP9631)"

    # SNMPv3 authentication: same user as Telegraf, SHA-1 auth (the best the
    # NMC2 card offers) and AES priv with separate passphrases, from Vault
    # homelab/infrastructure/snmp (docs/POWER.md, "SNMP credentials")
    snmp_version = v3
    secLevel = authPriv
    secName = {{ vault_snmp_v3_user }}
    authProtocol = SHA
    authPassword = {{ vault_snmp_auth_password }}
    privProtocol = AES
    privPassword = {{ vault_snmp_priv_password }}

    # APC MIB (AP9631 management card detected via SNMP)
    mibs = apcc

    # Poll interval for full updates (seconds)
    pollfreq = 30
