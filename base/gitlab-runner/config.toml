# Three runners (see workflow:rules in .gitlab-ci.yml):
#   router-protected   tag "protected", access_level=ref_protected: jobs
#                      from protected refs (main) only. Deploys and image
#                      pushes; host network and the docker-socket-proxy
#                      client certs.
#   router-firmware    tag "firmware-hostnet", access_level=ref_protected:
#                      only the firmware rollout jobs (netgear:firmware,
#                      aruba-iap:firmware, aruba-s2500:firmware). Host
#                      network: the job serves the image from a TFTP server
#                      bound to the router's own addresses. One job at a time.
#   main.nkontur.com   tag "unprotected": MR and branch pipelines. Docker
#                      network "gitlab-ci" (bridge br-ci, egress allowlist
#                      in networking/iptables/rules.v4), no Docker access,
#                      separate cache directory.
# All have run_untagged=false (set when registering / via the runners API).
#
# The protected and firmware runners' tokens are read by Ansible from
# /etc/gitlab-runner/{protected,firmware}-runner.token on the host
# (configure-base).
concurrent = 7
check_interval = 0

[session_server]
  session_timeout = 1800

[[runners]]
  name = "router-protected"
  url = "https://gitlab.lab.nkontur.com/"
  tls-ca-file = "/persistent_data/application/certs/nkontur.com/live/iot.lab.nkontur.com-0003/chain.pem"
  token = "{{ gitlab_runner_protected_token }}"
  executor = "docker"
  limit = 4
  [runners.docker]
    image = "ubuntu:20.04"
    network_mode = "host"
    privileged = false
    # Resource caps: CI build containers are the only containers on the router
    # without limits (every service in docker-compose.yml has one). The router
    # peaks at ~90% memory used, so an unbounded job can OOM production
    # services sharing the host.
    #
    # Observed peak across 207 build containers in the last 30 days is 117 MB
    # (the *:build jobs push the real work to the remote daemon via
    # DOCKER_HOST, so the build container itself stays small). 4g is ~34x that
    # and still caps the worst case at concurrent(7) x 4g = 28g of 126g.
    #
    # Deliberately generous rather than tight: this limit applies to the jobs
    # that deploy this file, so a limit low enough to OOM a job would also OOM
    # the pipeline that reverts it. The goal is a blast-radius ceiling, not a
    # snug fit.
    #
    # memory_swap = memory disables swap escape past the limit.
    memory = "4g"
    memory_swap = "4g"
    volumes = ["/cache/gitlab-runner:/cache", "/persistent_data/application/docker-proxy-tls/ca.pem:/certs/ca.pem:ro", "/persistent_data/application/docker-proxy-tls/cert.pem:/certs/cert.pem:ro", "/persistent_data/application/docker-proxy-tls/key.pem:/certs/key.pem:ro"]
    environment = ["DOCKER_HOST=tcp://lab.nkontur.com:2376", "DOCKER_TLS_VERIFY=1", "DOCKER_CERT_PATH=/certs"]

[[runners]]
  name = "router-firmware"
  url = "https://gitlab.lab.nkontur.com/"
  tls-ca-file = "/persistent_data/application/certs/nkontur.com/live/iot.lab.nkontur.com-0003/chain.pem"
  token = "{{ gitlab_runner_firmware_token }}"
  executor = "docker"
  limit = 1
  [runners.docker]
    image = "ubuntu:20.04"
    # Host network on purpose, for this runner only: the firmware jobs bind
    # a TFTP server to 10.4.0.1 / 10.100.0.2 and the switches and APs fetch
    # the image from it. Every other protected job runs on router-protected.
    network_mode = "host"
    privileged = false
    # Resource caps: see router-protected above.
    memory = "4g"
    memory_swap = "4g"
    # Shares router-protected's cache: the jobs read the staged firmware
    # images and the pip cache from it.
    volumes = ["/cache/gitlab-runner:/cache"]

[[runners]]
  name = "main.nkontur.com"
  url = "https://gitlab.lab.nkontur.com/"
  tls-ca-file = "/persistent_data/application/certs/nkontur.com/live/iot.lab.nkontur.com-0003/chain.pem"
  token = "{{ lookup('env', 'GITLAB_RUNNER_TOKEN') }}"
  executor = "docker"
  limit = 2
  [runners.docker]
    image = "ubuntu:20.04"
    # Job, helper and service containers all join this network
    network_mode = "gitlab-ci"
    privileged = false
    # Resource caps: see router-protected above.
    memory = "4g"
    memory_swap = "4g"
    # Own cache directory: nothing written by these jobs is read by the
    # protected runner's jobs.
    volumes = ["/cache/gitlab-runner-unprotected:/cache"]
