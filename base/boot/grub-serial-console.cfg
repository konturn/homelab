# Installed as /etc/default/grub.d/50-serial-console.cfg by configure-base.
#
# The BMC exposes the second serial port (ttyS1, 115200 8N1) over IPMI
# Serial-over-LAN, so the GRUB menu, kernel messages and the LUKS passphrase
# prompt for the root disk are reachable without a monitor:
#
#   ipmitool -I lanplus -H <bmc> -U <user> sol activate     (exit: ~.)
#
# tty0 stays a console too, so a local monitor and keyboard keep working.
# The last console= is /dev/console; plymouth prompts on every active console.
# Kernel options are appended here so /etc/default/grub stays stock.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT console=tty0 console=ttyS1,115200n8"
GRUB_TERMINAL="console serial"
GRUB_SERIAL_COMMAND="serial --unit=1 --speed=115200 --word=8 --parity=no --stop=1"
# Show the menu briefly so an older kernel can be picked over SOL.
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=5
