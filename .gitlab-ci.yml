# =============================================================================
# Deploy Stage - Parallel deployment (main only)
# =============================================================================
router:deploy:
  extends: .ansible
  stage: deploy
  # Normally ~5 minutes; a full deploy that pulls large images or recreates
  # GitLab takes longer.
  timeout: 45m
  resource_group: deploy-router
  # environment: enables "prevent outdated deployment jobs"; with the
  # resource group in newest_ready_first mode, older queued deploys are skipped.
  # Both settings live in GitLab, enforced by gitlab:settings.
  environment:
    name: router
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  needs:
    - job: router:validate
      optional: true
    - job: vault:configure
      optional: true
    # Image builds for docker/docker-compose.yml. They tag :latest on the
    # host daemon, so compose up must start after they finish or it keeps the
    # old image. Optional: a build job exists only when its image changed (or
    # in a non-push pipeline, where changes: is always true). Build jobs must
    # not have a manual rule: a job that needs an unplayed manual job is
    # skipped. ci/deploy-scope/test_deploy_needs.py checks both.
    - job: amcrest2mqtt:build
      optional: true
    - job: anomaly-detector:build
      optional: true
    - job: event-router:build
      optional: true
    - job: chromium-browser:build
      optional: true
    - job: jit-approval-svc:build
      optional: true
    - job: nginx:build
      optional: true
    - job: novnc:build
      optional: true
    - job: openclaw:build
      optional: true
    - job: petlibro-camera:build
      optional: true
    - job: snapcast:build
      optional: true
    - job: snapclient:build
      optional: true
  script:
    # Runs only the roles whose inputs changed since the last successful
    # deploy to the host (full deploy when in doubt); see docs/DEPLOY.md.
    - python3 ci/deploy-scope/deploy_scope.py run --playbook router
  rules:
    - !reference [.full_deploy_schedule, rules]
    - !reference [.automerge_task_skip, rules]
    - !reference [.automerged_commit_manual, rules]
    - if: $CI_COMMIT_BRANCH == "main"

zwave:deploy:
  extends: .ansible
  stage: deploy
  resource_group: deploy-zwave
  # environment: enables "prevent outdated deployment jobs"; with the
  # resource group in newest_ready_first mode, older queued deploys are skipped.
  # Both settings live in GitLab, enforced by gitlab:settings.
  environment:
    name: zwave
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  needs:
    - job: zwave:validate
      optional: true
    # The zwave-security-keys role writes to Vault under a path the ci-deploy
    # policy (terraform/vault) grants; apply a policy change first.
    - job: vault:configure
      optional: true
  # The Z-Wave Pi sits on the IoT VLAN and can be offline (hardware). When
  # port 22 does not answer, deploy_scope.py deploys nothing, keeps the marker
  # and exits 75: a warning, not a failed pipeline. The next deploy after the
  # host returns applies everything it missed. Real deploy failures still fail.
  allow_failure:
    exit_codes: [75]
  script:
    # Runs only the roles whose inputs changed since the last successful
    # deploy to the host (full deploy when in doubt); see docs/DEPLOY.md.
    - python3 ci/deploy-scope/deploy_scope.py run --playbook zwave
  rules:
    - !reference [.full_deploy_schedule, rules]
    - !reference [.automerge_task_skip, rules]
    - !reference [.automerged_commit_manual, rules]
    - if: $CI_COMMIT_BRANCH == "main"

