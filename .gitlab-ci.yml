  stage: deploy
  resource_group: deploy-router
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  needs:
    - job: router:validate
      optional: true
    - job: vault:configure
      optional: true
  script:
    - ansible-playbook -i ansible/inventory.yml -u root --private-key=tmp ansible/router.yml
  rules:
