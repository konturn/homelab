# =============================================================================
# UPS: NUT shutdown logic (base/nut) and the AP9631 card (networking/ups)
# See docs/POWER.md. Nothing here sends a command to the UPS.
# =============================================================================

ups:test:
  extends: .interruptible
  stage: validate
  # python + root apk (the ansible image runs as a non-root user)
  image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
  needs: []
  script:
    # the orderly-shutdown script tests run it under bash (not in the image)
    - apk add --no-cache bash >/dev/null
    - python3 -m unittest discover -s base/nut -p 'test_*.py' -v
    - python3 -m unittest discover -s networking/ups -p 'test_*.py' -v
    - python3 networking/ups/apcctl.py check
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - base/nut/**/*
        - networking/ups/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - base/nut/**/*
        - networking/ups/**/*

# Scheduled daily with SCHEDULED_TASK=ups-card-drift (protected runner, host
# network): downloads the card's config.ini (read-only SCP), sanitizes it and
# compares it with networking/ups/apc-config.ini. Fails and mails root on
# drift. Exits 0 with a notice while the card credentials
# (homelab/infrastructure/ups-card) or the baseline are not there yet.
ups-card:drift:
  extends: .ansible
  stage: deploy
  needs: []
  # deploy-router, not a group of its own: the SCP download stalls the card's
  # SNMP agent for up to ~35 s, which must not overlap the NUT check in
  # router:deploy (#93)
  resource_group: deploy-router
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  variables:
    VAULT_ADDR: "https://10.3.32.6:8200"
    VAULT_SKIP_VERIFY: "true"
    VAULT_JWT_ROLE: "ci-deploy"
  script:
    - rc=0; python3 networking/ups/apcctl.py drift --report ups-card-drift.txt || rc=$?
    - |
      if [ "$rc" -ne 0 ]; then
        [ -s ups-card-drift.txt ] || echo "apcctl drift exited with $rc before writing a report." > ups-card-drift.txt
        printf '\nExit code: %s\nJob: %s\n' "$rc" "$CI_JOB_URL" >> ups-card-drift.txt
        ssh -i tmp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$CI_PROJECT_DIR/ansible/known_hosts" -o LogLevel=ERROR \
          root@10.4.0.1 "mail -s 'Homelab: UPS card config drift' root" < ups-card-drift.txt \
          || echo "WARN: sending mail failed"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - ups-card-drift.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $SCHEDULED_TASK == "ups-card-drift" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# =============================================================================
# Router BMC (ansible/roles/ipmi, see docs/IPMI.md)
# =============================================================================
# The BMC is read in-band on the router by ipmictl (installed by the ipmi
# role). No job here changes a BMC setting: ipmi:drift runs `ipmictl check`
# only, and `ipmictl apply` refuses to write under CI.

ipmi:test:
  extends: .interruptible
  stage: validate
  image: willhallonline/ansible:latest
  needs: []
  script:
    - python3 -m unittest discover -s ansible/roles/ipmi/files -p 'test_*.py' -v
    - python3 -m unittest discover -s ci/ipmi -p 'test_*.py' -v
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/roles/ipmi/**/*
        - ci/ipmi/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - ansible/roles/ipmi/**/*
        - ci/ipmi/**/*

# Scheduled daily with SCHEDULED_TASK=ipmi-drift (protected runner): runs
# `ipmictl check` on the router over SSH and opens, updates or closes the
# `ipmi-drift` issue. Fails on drift or when the check cannot run.
ipmi:drift:
  extends: .ansible
  stage: deploy
  needs: []
  resource_group: router-bmc
  script:
    - rc=0
    - |
      ssh -i tmp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
        -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$CI_PROJECT_DIR/ansible/known_hosts" -o LogLevel=ERROR \
        root@10.4.0.1 "/usr/local/sbin/ipmictl check --markdown" > ipmi-drift.md || rc=$?
    - cat ipmi-drift.md
    - python3 ci/ipmi/drift_issue.py --rc "$rc" --report ipmi-drift.md
    - |
      if [ "$rc" -ne 0 ]; then
        echo "ipmictl check exited with $rc (2 = drift; see docs/IPMI.md)"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - ipmi-drift.md
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $SCHEDULED_TASK == "ipmi-drift" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# =============================================================================
# Facts: inventory/hardware.yml + inventory/dependencies.yml (inventory/README.md)
# =============================================================================
# facts:test checks the fact files, that the files generated from them
# (base/udev/85-my-usb-audio.rules, base/disk/crypttab, OpenClaw's
# docker/openclaw/workspace/infra/TOOLS.md) are current, and the tools' unit
# tests. facts:drift compares the live router with the data.

facts:test:
  extends:
    - .ansible
    - .interruptible
  stage: validate
  needs: []
  before_script: []
  script:
    - python3 ci/facts/render.py --check
    - python3 -m unittest discover -s ci/facts -p 'test_*.py' -v
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push")
      changes:
        - inventory/**/*
        - ci/facts/**/*
        - base/udev/**/*
        - base/disk/crypttab
        - ansible/inventory.yml
        - docker/docker-compose*.yml
        # TOOLS.md (OpenClaw context) is rendered from these too
        - docker/openclaw/workspace/infra/**
        - ci/automerge-policy.yml
        - ci/automerge/botconfig.py
        - ci/automerge/automerge.py
        - docs/*.md
        - .gitlab-ci.yml

# Daily on the router BMC drift schedule (SCHEDULED_TASK=ipmi-drift), so it
# needs no pipeline schedule of its own; run it by hand with Run pipeline and
# SCHEDULED_TASK=facts-drift. ci/facts/collect.py runs on the router over SSH
# (sent on stdin, read-only). What happens to a difference (resolve.py,
# inventory/README.md "What happens to drift"): a stopped container or
# inactive unit the repo declares is started and checked again; a physical
# change that explains itself becomes a `facts-record` MR for review; the rest
# goes to ONE living issue (labels facts-drift, needs-hands), rewritten in
# place and closed when nothing is left. Drift does not fail the job (no
# page per run); a check or GitLab write that could not run does.
# deploy-router: never starts a container while a deploy is changing them.
facts:drift:
  extends: .ansible
  stage: deploy
  needs: []
  resource_group: deploy-router
  script:
    - python3 ci/facts/drift.py --resolve --report facts-drift.md
  artifacts:
    when: always
    paths:
      - facts-drift.md
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($SCHEDULED_TASK == "ipmi-drift" || $SCHEDULED_TASK == "facts-drift") && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# =============================================================================
