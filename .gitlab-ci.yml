# =============================================================================
# Vault Configuration - Terraform (main only, deploy stage)
# =============================================================================
vault:configure:
  stage: deploy
  image: alpine:3.19
  environment: admin
  needs: []
  variables:
    TF_VERSION: "1.7.5"
    VAULT_ADDR: "https://vault.lab.nkontur.com:8200"
  before_script:
    - apk add --no-cache wget unzip
    - wget -q "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
    - unzip -o "terraform_${TF_VERSION}_linux_amd64.zip" -d /usr/local/bin/
    - chmod +x /usr/local/bin/terraform
  script:
    - cd terraform/vault
    - |
      terraform init \
        -backend-config="address=https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/vault" \
        -backend-config="lock_address=https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/vault/lock" \
        -backend-config="unlock_address=https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/vault/lock" \
        -backend-config="lock_method=POST" \
        -backend-config="unlock_method=DELETE" \
        -backend-config="username=gitlab-ci-token" \
        -backend-config="password=${CI_JOB_TOKEN}" \
        -backend-config="retry_wait_min=5"
    - terraform validate
    - terraform plan -var="vault_addr=${VAULT_ADDR}" -var="vault_token=${VAULT_TOKEN}" -out=tfplan
    - terraform apply tfplan
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - terraform/vault/**/*

vault:rotate-approles:
  stage: deploy
  image: alpine:3.19
  environment: admin
  needs:
    - job: router:deploy
      optional: true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  variables:
    VAULT_ADDR: "https://vault.lab.nkontur.com:8200"
    VAULT_SKIP_VERIFY: "true"
  when: manual
  allow_failure: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail

      # --- Helper functions ---
      vault_api() {
        local method="$1" path="$2" data="${3:-}"
        if [ -n "$data" ]; then
          curl -sk --max-time 10 -X "$method" \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$data" \
            "${VAULT_ADDR}/v1/${path}"
        else
          curl -sk --max-time 10 -X "$method" \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            "${VAULT_ADDR}/v1/${path}"
        fi
      }

      rotate_approle() {
        local role_name="$1"
        echo ""
        echo "=== Rotating AppRole: ${role_name} ==="

        # Get role_id
        local ROLE_ID_RESP
        ROLE_ID_RESP=$(vault_api GET "auth/approle/role/${role_name}/role-id")
        local ROLE_ID
        ROLE_ID=$(echo "$ROLE_ID_RESP" | jq -r '.data.role_id // empty')
        if [ -z "$ROLE_ID" ]; then
          echo "ERROR: Failed to read role_id for ${role_name}"
          echo "$ROLE_ID_RESP" | jq -r '.errors[]' 2>/dev/null
          return 1
        fi
        echo "  role_id: ${ROLE_ID:0:8}..."

        # Generate new secret_id
        local SECRET_RESP
        SECRET_RESP=$(vault_api POST "auth/approle/role/${role_name}/secret-id")
        local NEW_SECRET_ID
        NEW_SECRET_ID=$(echo "$SECRET_RESP" | jq -r '.data.secret_id // empty')
        if [ -z "$NEW_SECRET_ID" ]; then
          echo "ERROR: Failed to generate secret_id for ${role_name}"
          echo "$SECRET_RESP" | jq -r '.errors[]' 2>/dev/null
          return 1
        fi
        echo "  New secret_id generated"

        # Verify login with new credentials
        local LOGIN_TEST
        LOGIN_TEST=$(curl -sk --max-time 10 -X POST \
          -d "{\"role_id\":\"$ROLE_ID\",\"secret_id\":\"$NEW_SECRET_ID\"}" \
          "${VAULT_ADDR}/v1/auth/approle/login")
        if ! echo "$LOGIN_TEST" | jq -e '.auth.client_token' > /dev/null 2>&1; then
          echo "ERROR: Login verification FAILED for ${role_name} — aborting"
          return 1
        fi
        echo "  Login verification passed"

        # Return values via globals (sh-compatible)
        _ROTATED_ROLE_ID="$ROLE_ID"
        _ROTATED_SECRET_ID="$NEW_SECRET_ID"
        return 0
      }

      # --- Main ---

      echo "=== Authenticating to Vault via JWT ==="
      JWT_RESPONSE=$(curl -sk --max-time 10 \
        --request POST \
        --data "{\"role\": \"vault-admin\", \"jwt\": \"${VAULT_ID_TOKEN}\"}" \
        "${VAULT_ADDR}/v1/auth/jwt/login" 2>/dev/null) || true

      VAULT_TOKEN=$(echo "$JWT_RESPONSE" | jq -r '.auth.client_token // empty' 2>/dev/null)
      if [ -z "$VAULT_TOKEN" ]; then
        echo "JWT authentication failed"
        echo "$JWT_RESPONSE" | jq -r '.errors[]' 2>/dev/null
        exit 1
      fi
      echo "JWT authentication succeeded"

      FAILURES=0

      # -----------------------------------------------------------------
      # 1. Rotate openclaw AppRole (stored in CI variable)
      # -----------------------------------------------------------------
      if rotate_approle "openclaw"; then
        echo "=== Updating openclaw CI variable ==="
        # APPROLE_ROTATION_PAT is a protected CI variable containing a PAT with api scope
        if [ -z "${APPROLE_ROTATION_PAT:-}" ]; then
          echo "  ERROR: APPROLE_ROTATION_PAT CI variable not set"
          FAILURES=$((FAILURES + 1))
        else
          # Try PUT (update existing variable)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            "https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/variables/VAULT_APPROLE_SECRET_ID" \
            -H "PRIVATE-TOKEN: ${APPROLE_ROTATION_PAT}" \
            -H "Content-Type: application/json" \
            -d "{\"value\":\"${_ROTATED_SECRET_ID}\",\"protected\":true,\"masked\":true}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "  VAULT_APPROLE_SECRET_ID updated ✓"
          else
            echo "  PUT failed (HTTP $HTTP_CODE), trying POST to create..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/variables" \
              -H "PRIVATE-TOKEN: ${APPROLE_ROTATION_PAT}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"VAULT_APPROLE_SECRET_ID\",\"value\":\"${_ROTATED_SECRET_ID}\",\"protected\":true,\"masked\":true}")
            if [ "$HTTP_CODE" = "201" ]; then
              echo "  VAULT_APPROLE_SECRET_ID created ✓"
            else
              echo "  ERROR: Failed to create VAULT_APPROLE_SECRET_ID CI variable (HTTP $HTTP_CODE)"
              FAILURES=$((FAILURES + 1))
            fi
          fi

          # Persist role_id (changes when AppRole is renamed)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            "https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/variables/VAULT_APPROLE_ROLE_ID" \
            -H "PRIVATE-TOKEN: ${APPROLE_ROTATION_PAT}" \
            -H "Content-Type: application/json" \
            -d "{\"value\":\"${_ROTATED_ROLE_ID}\",\"protected\":true,\"masked\":true}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "  VAULT_APPROLE_ROLE_ID updated ✓"
          else
            echo "  PUT failed (HTTP $HTTP_CODE), trying POST to create..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/variables" \
              -H "PRIVATE-TOKEN: ${APPROLE_ROTATION_PAT}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"VAULT_APPROLE_ROLE_ID\",\"value\":\"${_ROTATED_ROLE_ID}\",\"protected\":true,\"masked\":true}")
            if [ "$HTTP_CODE" = "201" ]; then
              echo "  VAULT_APPROLE_ROLE_ID created ✓"
            else
              echo "  ERROR: Failed to create VAULT_APPROLE_ROLE_ID CI variable (HTTP $HTTP_CODE)"
              FAILURES=$((FAILURES + 1))
            fi
          fi
        fi
      else
        FAILURES=$((FAILURES + 1))
      fi

      # -----------------------------------------------------------------
      # 2. Rotate jit-approval-svc AppRole (stored in Vault KV)
      # -----------------------------------------------------------------
      if rotate_approle "jit-approval-svc"; then
        echo "=== Updating jit-approval-svc secrets in Vault ==="
        # Read existing secret to preserve non-approle fields (telegram tokens)
        EXISTING=$(vault_api GET "homelab/data/docker/jit-approval-svc")
        EXISTING_DATA=$(echo "$EXISTING" | jq -r '.data.data // empty' 2>/dev/null)

        if [ -n "$EXISTING_DATA" ] && [ "$EXISTING_DATA" != "null" ]; then
          # Merge: update approle fields, keep everything else
          UPDATED=$(echo "$EXISTING_DATA" | jq \
            --arg rid "$_ROTATED_ROLE_ID" \
            --arg sid "$_ROTATED_SECRET_ID" \
            '. + {approle_role_id: $rid, approle_secret_id: $sid}')
        else
          # First time: create with just approle fields
          echo "  WARN: No existing secret found — creating new entry"
          UPDATED=$(jq -n \
            --arg rid "$_ROTATED_ROLE_ID" \
            --arg sid "$_ROTATED_SECRET_ID" \
            '{approle_role_id: $rid, approle_secret_id: $sid}')
        fi

        WRITE_RESP=$(vault_api POST "homelab/data/docker/jit-approval-svc" \
          "{\"data\": $UPDATED}")

        if echo "$WRITE_RESP" | jq -e '.data.version' > /dev/null 2>&1; then
          VERSION=$(echo "$WRITE_RESP" | jq -r '.data.version')
          echo "  Vault KV updated (version: ${VERSION}) ✓"
        else
          echo "  ERROR: Failed to update Vault KV"
          echo "$WRITE_RESP" | jq -r '.errors[]' 2>/dev/null
          FAILURES=$((FAILURES + 1))
        fi
      else
        FAILURES=$((FAILURES + 1))
      fi

      # -----------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------
      echo ""
      echo "=== Rotation Summary ==="
      if [ "$FAILURES" -eq 0 ]; then
        echo "All AppRoles rotated successfully ✓"
        echo "  - openclaw: next deploy picks up new role_id + secret_id from CI variables"
        echo "  - jit-approval-svc: next deploy picks up new credentials from Vault KV"
      else
        echo "WARNING: ${FAILURES} rotation(s) failed — check logs above"
        exit 1
      fi
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_COMMIT_BRANCH == "main"

vault:validate:
  extends: .interruptible
  stage: validate
  image: alpine:3.19
  needs: []
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  variables:
    TF_VERSION: "1.7.5"
    VAULT_ADDR: "https://vault.lab.nkontur.com:8200"
    VAULT_SKIP_VERIFY: "true"
  before_script:
    - apk add --no-cache wget unzip curl jq
    - wget -q "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
    - unzip -o "terraform_${TF_VERSION}_linux_amd64.zip" -d /usr/local/bin/
    - chmod +x /usr/local/bin/terraform
  script:
    - cd terraform/vault
    - |
      echo "Attempting JWT authentication with vault-read role..."
      JWT_RESPONSE=$(curl -sk --max-time 10 \
        --request POST \
        --data "{\"role\": \"vault-read\", \"jwt\": \"${VAULT_ID_TOKEN}\"}" \
        "${VAULT_ADDR}/v1/auth/jwt/login" 2>/dev/null) || true

      JWT_TOKEN=$(echo "$JWT_RESPONSE" | jq -r '.auth.client_token // empty' 2>/dev/null)

      if [ -n "$JWT_TOKEN" ]; then
        echo "JWT authentication succeeded — using scoped vault-read token"
        export VAULT_TOKEN="$JWT_TOKEN"
      else
        echo "ERROR: JWT authentication failed — no fallback allowed for MR pipelines"
        echo "Ensure the vault-read JWT role is configured and VAULT_ID_TOKEN is available"
        exit 1
      fi
    - |
      terraform init \
        -backend-config="address=https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/vault" \
        -backend-config="lock_address=https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/vault/lock" \
        -backend-config="unlock_address=https://gitlab.lab.nkontur.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/vault/lock" \
        -backend-config="lock_method=POST" \
        -backend-config="unlock_method=DELETE" \
        -backend-config="username=gitlab-ci-token" \
        -backend-config="password=${CI_JOB_TOKEN}" \
        -backend-config="retry_wait_min=5"
    - terraform validate
    - terraform plan -lock=false -var="vault_addr=${VAULT_ADDR}" -var="vault_token=${VAULT_TOKEN}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - terraform/vault/**/*

# =============================================================================
# NETGEAR switches (networking/switches/netgear, see README.md there)
# =============================================================================
# MR pipelines run offline only: unit tests, file checks, and a plan against
# the export committed on the target branch. Jobs that read switch credentials
# from Vault or write to switches run only on main (protected runner).

netgear:test:
  extends: .interruptible
  stage: validate
  image: willhallonline/ansible:latest
  needs: []
  variables:
    GIT_DEPTH: "50"
  script:
    - python3 -m unittest discover -s networking/switches/netgear -p 'test_*.py' -v
    - python3 networking/switches/netgear/ngswitch.py check
    - |
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      base_dir=$(mktemp -d)
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
      if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
        git fetch -q --depth=50 origin "$base" || true
        git cat-file -e "$base^{commit}" || { echo "ERROR: baseline commit $base not available"; exit 1; }
        for f in networking/switches/netgear/*.running-config.txt; do
          if git cat-file -e "$base:$f" 2>/dev/null; then
            git show "$base:$f" > "$base_dir/${f##*/}"
          fi
        done
      fi
      echo "Baseline: exports at ${base:-none}"
      python3 networking/switches/netgear/ngswitch.py plan --offline --snapshot-dir "$base_dir"
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - networking/switches/netgear/**/*
        - networking/firmware_night.py
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - networking/switches/netgear/**/*

.netgear_vault:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  variables:
    VAULT_ADDR: "https://vault.lab.nkontur.com:8200"
    VAULT_SKIP_VERIFY: "true"
    VAULT_JWT_ROLE: "ci-deploy"

# Writes only the differences between the desired state and the live switch,
# then re-reads and re-exports to verify. No differences: no writes.
netgear:apply:
  extends: .netgear_vault
  stage: deploy
  image: willhallonline/ansible:latest
  resource_group: netgear-switches
  needs:
    - job: netgear:test
  script:
    - python3 networking/switches/netgear/ngswitch.py apply --export-dir netgear-export
  artifacts:
    when: always
    paths:
      - netgear-export/
    expire_in: 30 days
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - networking/switches/netgear/**/*

# Scheduled daily with NETGEAR_TASK=drift: fails and mails the report to root
# via the router's mail when a switch differs from its desired state or export.
netgear:drift:
  extends:
    - .ansible
    - .netgear_vault
  stage: deploy
  needs: []
  resource_group: netgear-switches
  script:
    - rc=0; python3 networking/switches/netgear/ngswitch.py drift --report netgear-drift.txt --export-dir netgear-export || rc=$?
    - |
      if [ "$rc" -ne 0 ]; then
        [ -s netgear-drift.txt ] || echo "ngswitch drift exited with $rc before writing a report." > netgear-drift.txt
        printf '\nJob: %s\n' "$CI_JOB_URL" >> netgear-drift.txt
        ssh -i tmp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$CI_PROJECT_DIR/ansible/known_hosts" -o LogLevel=ERROR \
          root@10.4.0.1 "mail -s 'Homelab: NETGEAR switch drift' root" < netgear-drift.txt \
          || echo "WARN: sending mail failed"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - netgear-drift.txt
      - netgear-export/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $NETGEAR_TASK == "drift" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# Firmware (networking/switches/netgear/README.md, "Firmware updates in CI").
# netgear:firmware-check: weekly schedule with NETGEAR_TASK=firmware-check. Looks
# for a newer release on NETGEAR's download server and opens a bump MR.
netgear:firmware-check:
  extends: .ansible
  stage: deploy
  needs: []
  script:
    - python3 networking/switches/netgear/firmware_ci.py bump-mr
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $NETGEAR_TASK == "firmware-check" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# netgear:firmware: brings the switches to the firmware declared in netgear-*.yml,
# netgear-movie first, one at a time, each passing its post-upgrade checks before
# the next starts. Reboots the switches. Runs from the daily schedule with
# NETGEAR_TASK=firmware, only inside NETGEAR_FIRMWARE_WINDOW (outside the 02:15-04:00
# backup window); a no-op when both are current. Merging a bump MR is the approval.
# Started by hand or by OpenClaw (web/API/trigger pipeline with NETGEAR_TASK=firmware)
# it runs at once; NETGEAR_FIRMWARE_TARGET=<switch> limits it to one switch and
# NETGEAR_FIRMWARE_DRY_RUN=1 checks everything without loading or rebooting.
# Root: the job serves the image to the switch from a built-in TFTP server on UDP 69.
netgear:firmware:
  extends:
    - .ansible
    - .netgear_vault
  image:
    name: willhallonline/ansible:2.21.5-alpine-3.22@sha256:cf26105d35af9e8df0a9eafaecf3c23310cace20687b9044a92e8acc0b6f46af
    docker:
      user: root
  stage: deploy
  # Host-network runner (base/gitlab-runner/config.toml, router-firmware):
  # the TFTP server binds the router's own address.
  tags: [firmware-hostnet]
  needs: []
  resource_group: netgear-switches
  timeout: 90m
  variables:
    NETGEAR_FIRMWARE_WINDOW: "04:45-06:00"
    # The window is local time. The job image has no tzdata, so a POSIX TZ rule
    # (US Eastern, as the schedules) rather than America/New_York.
    TZ: "EST5EDT,M3.2.0,M11.1.0"
    NETGEAR_TFTP_SERVER: "10.4.0.1"
    NETGEAR_FIRMWARE_DIR: "/cache/netgear-firmware"
  script:
    - python3 networking/switches/netgear/firmware_ci.py rollout
  # A failure the script did not report itself (timeout, cancellation, crash) still mails root.
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != success ] && [ ! -e .netgear-firmware-alerted ] && [ "$NETGEAR_FIRMWARE_DRY_RUN" != 1 ]; then
        python3 ci/automerge/automerge.py notify \
          --subject "Homelab: netgear:firmware ${CI_JOB_STATUS}" \
          --message "netgear:firmware ended (${CI_JOB_STATUS}) without reporting an outcome. A switch may be mid-upgrade: check ngswitch.py firmware status and the job log." || true
      fi
    - rm -f tmp
  artifacts:
    when: always
    paths:
      - netgear-firmware.log
      - netgear-backup/
      - netgear-export/
      - netgear-drift-*.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $NETGEAR_TASK == "firmware" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")

# =============================================================================
# Aruba Instant AP cluster (networking/aruba-iap, see README.md there)
# =============================================================================
# MR pipelines run offline only: unit tests and a plan against the config
# committed on the target branch. Jobs that read AP credentials from Vault or
# write to the cluster run only on main (protected runner).

aruba-iap:test:
  extends: .interruptible
  stage: validate
  image: willhallonline/ansible:latest
  needs: []
  variables:
    GIT_DEPTH: "50"
  script:
    - python3 -m unittest discover -s networking/aruba-iap -p 'test_*.py' -v
    - |
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      f=networking/aruba-iap/running-config.conf
      current=$(mktemp)
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
      if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
        git fetch -q --depth=50 origin "$base" || true
        git cat-file -e "$base^{commit}" || { echo "ERROR: baseline commit $base not available"; exit 1; }
        git show "$base:$f" > "$current" 2>/dev/null || : > "$current"
      fi
      echo "Plan: $f at ${base:-none} -> this commit"
      python3 networking/aruba-iap/iapctl.py plan --current "$current"
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - networking/aruba-iap/**/*
        - networking/firmware_night.py
        - networking/switches/netgear/ngswitch.py
        - ci/reports/firmware.py
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - networking/aruba-iap/**/*
        - networking/firmware_night.py

.aruba_iap_live:
  image: willhallonline/ansible:latest
  resource_group: aruba-iap
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  variables:
    VAULT_ADDR: "https://vault.lab.nkontur.com:8200"
    VAULT_SKIP_VERIFY: "true"
    VAULT_JWT_ROLE: "ci-deploy"
    PIP_CACHE_DIR: "/cache/pip"

# Sends only the blocks that differ from the live cluster, commits them, then
# re-exports and verifies. No differences: nothing is sent. Changes to the
# management VLAN, uplink, mesh or controller address are refused here.
aruba-iap:apply:
  extends: .aruba_iap_live
  stage: deploy
  needs:
    - job: aruba-iap:test
  before_script:
    - pip3 install -q --break-system-packages paramiko
  script:
    - python3 networking/aruba-iap/iapctl.py apply
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - networking/aruba-iap/**/*

# Same, with the protected-settings guard lifted. Run by hand after reviewing
# the plan.
aruba-iap:apply-protected:
  extends: .aruba_iap_live
  stage: deploy
  needs: []
  when: manual
  allow_failure: true
  variables:
    IAP_ALLOW_PROTECTED: "1"
  before_script:
    - pip3 install -q --break-system-packages paramiko
  script:
    - python3 networking/aruba-iap/iapctl.py apply --allow-protected
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_COMMIT_BRANCH == "main"

# Scheduled daily with IAP_TASK=drift: fails and mails the report to root via
# the router's mail when the live cluster differs from running-config.conf.
aruba-iap:drift:
  extends:
    - .ansible
    - .aruba_iap_live
  stage: deploy
  needs: []
  script:
    - pip3 install -q --break-system-packages paramiko
    - rc=0; python3 networking/aruba-iap/iapctl.py drift > aruba-iap-drift.txt 2>&1 || rc=$?
    - cat aruba-iap-drift.txt
    - |
      if [ "$rc" -ne 0 ]; then
        printf '\nExit code: %s\nJob: %s\n' "$rc" "$CI_JOB_URL" >> aruba-iap-drift.txt
        ssh -i tmp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$CI_PROJECT_DIR/ansible/known_hosts" -o LogLevel=ERROR \
          root@10.4.0.1 "mail -s 'Homelab: Aruba AP config drift' root" < aruba-iap-drift.txt \
          || echo "WARN: sending mail failed"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - aruba-iap-drift.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $IAP_TASK == "drift" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# Firmware (networking/aruba-iap/README.md, "Firmware updates in CI").
# aruba-iap:firmware-check: weekly schedule with IAP_TASK=firmware-check. The HPE
# portal cannot be read without an account, so it looks for a newer image staged
# on the router and opens a bump MR; "cannot check" exits 3 (a warning, not a failure).
aruba-iap:firmware-check:
  extends:
    - .ansible
    - .aruba_iap_live
  image: willhallonline/ansible:2.21.5-alpine-3.22@sha256:cf26105d35af9e8df0a9eafaecf3c23310cace20687b9044a92e8acc0b6f46af
  stage: deploy
  needs: []
  variables:
    IAP_FIRMWARE_DIR: "/cache/aruba-iap-firmware"
  script:
    - python3 networking/aruba-iap/firmware_ci.py bump-mr
  allow_failure:
    exit_codes: [3]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $IAP_TASK == "firmware-check" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# aruba-iap:firmware: upgrades the whole Instant cluster (both APs reboot together;
# Wi-Fi down ~5-10 min) to the release in networking/aruba-iap/firmware.yml. Runs
# from the daily schedule with IAP_TASK=firmware at 05:20, only inside
# IAP_FIRMWARE_WINDOW, and not on a night when a NETGEAR rollout changed anything
# (shared lock, networking/firmware_night.py); a no-op when the cluster is current.
# Merging a bump MR is the approval. Started by hand or by OpenClaw (web/API/trigger
# pipeline with IAP_TASK=firmware) it runs at once; IAP_FIRMWARE_DRY_RUN=1 checks
# everything without upgrading. Root: the job serves the image on UDP 69.
aruba-iap:firmware:
  extends:
    - .ansible
    - .aruba_iap_live
  image:
    name: willhallonline/ansible:2.21.5-alpine-3.22@sha256:cf26105d35af9e8df0a9eafaecf3c23310cace20687b9044a92e8acc0b6f46af
    docker:
      user: root
  stage: deploy
  # Host-network runner (base/gitlab-runner/config.toml, router-firmware):
  # the TFTP server binds the router's own address.
  tags: [firmware-hostnet]
  needs: []
  timeout: 60m
  variables:
    IAP_FIRMWARE_WINDOW: "04:45-06:00"
    # Local time; the job image has no tzdata (see netgear:firmware).
    TZ: "EST5EDT,M3.2.0,M11.1.0"
    IAP_TFTP_SERVER: "10.4.0.1"
    IAP_FIRMWARE_DIR: "/cache/aruba-iap-firmware"
  script:
    - pip3 install -q --break-system-packages --cache-dir /cache/pip paramiko
    - python3 networking/aruba-iap/firmware_ci.py rollout
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != success ] && [ ! -e .aruba-iap-firmware-alerted ] && [ "$IAP_FIRMWARE_DRY_RUN" != 1 ]; then
        python3 ci/automerge/automerge.py notify \
          --subject "Homelab: aruba-iap:firmware ${CI_JOB_STATUS}" \
          --message "aruba-iap:firmware ended (${CI_JOB_STATUS}) without reporting an outcome. The APs may be mid-upgrade: check iapctl.py firmware status and the job log." || true
      fi
    - rm -f tmp
  artifacts:
    when: always
    paths:
      - aruba-iap-firmware.log
      - aruba-iap-backup/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $IAP_TASK == "firmware" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")

# =============================================================================
# Aruba S2500 core switch (networking/aruba-s2500, see README.md there)
# =============================================================================
# Read-only except aruba-s2500:firmware, which is manual only: it refuses unless
# S2500_FIRMWARE_CONFIRM=I-AM-HOME is set on the run and it is outside the backup
# window. Rebooting the S2500 drops every network service, CI included.

aruba-s2500:test:
  extends: .interruptible
  stage: validate
  image: willhallonline/ansible:latest
  needs: []
  script:
    - python3 -m unittest discover -s networking/aruba-s2500 -p 'test_*.py' -v
    - python3 networking/aruba-s2500/s2500cfg.py check
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - networking/aruba-s2500/**/*
        - networking/switches/aruba-config
        - networking/firmware_night.py
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - networking/aruba-s2500/**/*
        - networking/switches/aruba-config

# Daily, read-only: compares the live running-config with s2500.running-config.txt
# and s2500.yml, and opens, updates or closes the `s2500-drift` issue
# (ci/ipmi/drift_issue.py). It runs on the Aruba AP drift schedule
# (IAP_TASK=drift), so it needs no pipeline schedule of its own; run it by hand
# with Run pipeline and SCHEDULED_TASK=s2500-drift. It never sends a config
# command: s2500cfg.py apply refuses under CI.
# paramiko<4 (also in aruba-s2500:firmware): the switch offers only ssh-rsa
# (SHA-1) host keys, which paramiko 4+ no longer accepts.
aruba-s2500:drift:
  extends: .aruba_iap_live
  stage: deploy
  needs: []
  resource_group: aruba-s2500
  script:
    - pip3 install -q --break-system-packages --cache-dir /cache/pip "paramiko<4"
    - rc=0; python3 networking/aruba-s2500/s2500cfg.py drift --report s2500-drift.md --export s2500-live.running-config.txt || rc=$?
    - |
      python3 ci/ipmi/drift_issue.py --rc "$rc" --report s2500-drift.md --label s2500-drift \
        --title "Aruba S2500 configuration differs from the repo (s2500cfg.py drift)" \
        --check-name "s2500cfg.py drift"
    - |
      if [ "$rc" -ne 0 ]; then
        echo "s2500cfg.py drift exited with $rc (2 = drift; see networking/aruba-s2500/README.md)"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - s2500-drift.md
      - s2500-live.running-config.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($IAP_TASK == "drift" || $SCHEDULED_TASK == "s2500-drift") && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# Manual only. Run pipeline / play with S2500_FIRMWARE_CONFIRM=I-AM-HOME (and be at
# home, with the serial console); S2500_FIRMWARE_DRY_RUN=1 checks everything and
# sends nothing (no confirmation needed). Never scheduled.
aruba-s2500:firmware:
  extends: .aruba_iap_live
  image:
    name: willhallonline/ansible:2.21.5-alpine-3.22@sha256:cf26105d35af9e8df0a9eafaecf3c23310cace20687b9044a92e8acc0b6f46af
    docker:
      user: root
  stage: deploy
  # Host-network runner (base/gitlab-runner/config.toml, router-firmware):
  # the TFTP server binds the router's own address.
  tags: [firmware-hostnet]
  needs: []
  resource_group: aruba-s2500
  timeout: 60m
  variables:
    TZ: "EST5EDT,M3.2.0,M11.1.0"
    S2500_TFTP_SERVER: "10.100.0.2"
    S2500_FIRMWARE_DIR: "/cache/aruba-s2500-firmware"
  script:
    - pip3 install -q --break-system-packages --cache-dir /cache/pip "paramiko<4"
    - |
      if [ "$S2500_FIRMWARE_DRY_RUN" = 1 ]; then
        python3 networking/aruba-s2500/s2500ctl.py firmware upgrade --dry-run
      else
        python3 networking/aruba-s2500/s2500ctl.py firmware upgrade --night-lock
      fi
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

# =============================================================================
# Denon AVR-X6700H (networking/denon, see docs/denon.md)
# =============================================================================
# Read-only. No job sends anything but queries to the receiver; denonctl.py
# apply refuses to send under CI.

denon:test:
  extends: .interruptible
  stage: validate
  image: willhallonline/ansible:latest
  needs: []
  script:
    - python3 -m unittest discover -s networking/denon -p 'test_*.py' -v
    - python3 networking/denon/denonctl.py check
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - networking/denon/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - networking/denon/**/*

# Scheduled daily with DENON_TASK=drift (protected runner, host network, so it
# reaches the IoT VLAN): fails and mails the report to root via the router's
# mail when the receiver differs from denon-x6700h.yaml. A receiver in standby
# is skipped (exit 0): it does not report its settings then.
denon:drift:
  extends: .ansible
  stage: deploy
  needs: []
  resource_group: denon
  script:
    - rc=0; python3 networking/denon/denonctl.py drift > denon-drift.txt 2>&1 || rc=$?
    - cat denon-drift.txt
    - |
      if [ "$rc" -ne 0 ]; then
        printf '\nExit code: %s\nJob: %s\n' "$rc" "$CI_JOB_URL" >> denon-drift.txt
        ssh -i tmp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$CI_PROJECT_DIR/ansible/known_hosts" -o LogLevel=ERROR \
          root@10.4.0.1 "mail -s 'Homelab: Denon AVR settings drift' root" < denon-drift.txt \
          || echo "WARN: sending mail failed"
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - denon-drift.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DENON_TASK == "drift" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# =============================================================================
# Amcrest cameras (networking/amcrest, see docs/amcrest.md)
