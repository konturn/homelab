# =============================================================================
# CI Pipeline - Optimized for Speed
# =============================================================================
# Optimizations:
# - Shallow git clone (GIT_DEPTH: 5)
# - DAG parallelization - all validate jobs run in parallel (needs: [])
# - Path-based rules - jobs only run when relevant files change
# - Interruptible validation - new commits cancel in-progress MR pipelines
# - Aggressive pip/ansible caching with corruption cleanup
#
# Pipeline structure:
#
#   VALIDATE (parallel)
#   ┌────────────────────────┬──────────────┬──────────────┬──────────────┬──────────────────┐
#   router:val [id_tokens]  zwave:val  sat-2:val  vault:validate  jit-approval-svc:test
#   anomaly-detector:test  revert-guard (MR only, ci/revert-guard/README.md)
#   event-router:test
#   canary (MR, on critical-service changes; docs/CANARY.md)  canary:test
#   event-router:tlc (TLA+ model, on docs/design/tla changes + weekly schedule)
#
#   BUILD (parallel, path-triggered)
#   ┌──────────────┬──────────────┬──────────────┬──────────────────────┐
#   openclaw:build  amcrest2mqtt:build  snapcast:build  snapclient:build  jit-approval-svc:build
#   anomaly-detector:build  nginx:build  event-router:build  petlibro-camera:build
#   main: <image>:build builds and pushes :latest and :<sha> (protected runner)
#   MRs:  <image>:build-check builds with kaniko, no push (unprotected runner)
#
#   DEPLOY (main only, parallel; changed-only, see docs/DEPLOY.md)
#   ┌──────────────────────────┬──────────────┬──────────────┬──────────────────────────┐
#   router:deploy [id_tokens]  zwave:deploy [id_tokens]  sat-2:deploy [id_tokens]  vault:configure  vault:rotate [manual]
#   (router:deploy needs vault:configure and the image builds; see the job)
#
#   NETGEAR SWITCHES (see networking/switches/netgear/README.md)
#   netgear:test (MR + main, offline) -> netgear:apply (main, on changes)
#   netgear:drift (scheduled on main, NETGEAR_TASK=drift)
#   netgear:firmware-check (scheduled weekly, NETGEAR_TASK=firmware-check; opens a bump MR)
#   netgear:firmware (scheduled daily in the window, NETGEAR_TASK=firmware; reboots switches)
#
#   ARUBA INSTANT APs (see networking/aruba-iap/README.md)
#   aruba-iap:test (MR + main, offline) -> aruba-iap:apply (main, on changes)
#   aruba-iap:apply-protected (main, manual), aruba-iap:drift (scheduled, IAP_TASK=drift)
#   aruba-iap:firmware-check (scheduled weekly, IAP_TASK=firmware-check; opens a bump MR)
#   aruba-iap:firmware (scheduled daily in the window, IAP_TASK=firmware; reboots every AP)
#   (one firmware rollout per night across NETGEAR and Aruba: networking/firmware_night.py)
#
#   ARUBA S2500 CORE SWITCH (see networking/aruba-s2500/README.md)
#   aruba-s2500:test (MR + main, offline), aruba-s2500:firmware (main, manual only;
#   refuses without S2500_FIRMWARE_CONFIRM=I-AM-HOME)
#   aruba-s2500:drift (scheduled with the AP drift check, IAP_TASK=drift; opens an issue)
#
#   DENON AVR (see docs/denon.md; read-only, CI never changes the receiver)
#   denon:test (MR + main, offline), denon:drift (scheduled, DENON_TASK=drift)
#
#   IOT DEVICES (read-only; CI never writes to them)
#   amcrest:test (MR + main, offline), amcrest:drift (scheduled,
#   SCHEDULED_TASK=iot-device-drift; see docs/amcrest.md)
#   slzb:test (MR + main, offline), slzb:drift (scheduled with amcrest:drift;
#   see docs/slzb.md)
#
#   UPS (see docs/POWER.md; CI never sends a command to the UPS or its card)
#   ups:test (MR + main, offline), ups-card:drift (scheduled, SCHEDULED_TASK=ups-card-drift)
#
#   ROUTER BMC (see docs/IPMI.md; CI never writes to the BMC)
#   ipmi:test (MR + main, offline), ipmi:drift (scheduled, SCHEDULED_TASK=ipmi-drift; opens an issue)
#
#   FACTS (see inventory/README.md; facts:drift only starts stopped declared services)
#   facts:test (MR + main, offline), facts:drift (scheduled with ipmi:drift, or
#   SCHEDULED_TASK=facts-drift; fixes, records or reports drift)
#
#   AUTO-MERGE (see docs/AUTOMERGE.md)
#   automerge:test + automerge:eligibility (MR, informational)
#   automerge:properties-deep (main, on policy changes; SCHEDULED_TASK=automerge-properties)
#   automerge:sweep / automerge:report (scheduled on main, AUTOMERGE_TASK=sweep|report)
#   <host>:deploy-service (main, auto-merged commits only; replaces the full deploys)
#
#   GITLAB SETTINGS (see docs/GITLAB_SETTINGS.md)
#   gitlab:settings (main: scheduled daily SCHEDULED_TASK=gitlab-settings, and on changes)
#
#   REPORTS (see ci/reports/README.md)
#   report:cves / report:app-updates / report:os-patches / report:firmware
#   (scheduled on main, SCHEDULED_TASK=trivy|app-report|os-report|firmware-report)
#
#   BOOTSTRAP (main only, manual)
#   ┌──────────────┬──────────────┐
#   router:bootstrap  router:restore
#
# =============================================================================

# =============================================================================
# Workflow Configuration
# =============================================================================
workflow:
  auto_cancel:
    on_new_commit: interruptible
  # Runner selection (base/gitlab-runner/config.toml): pipelines on protected
  # refs (main, incl. schedules) run on the "protected" runner, everything
  # else (MR and branch pipelines) on the "unprotected" runner. Both runners
  # have run_untagged=false, and the protected runner is registered with
  # access_level=ref_protected, so it never picks up jobs from other refs.
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        RUNNER_TAG: protected
    - when: always
      variables:
        RUNNER_TAG: unprotected

default:
  tags:
    - $RUNNER_TAG
  # Most jobs finish in under 5 minutes. Without this they inherit the
  # project's 60m, so a hung job holds its runner slot (and, for deploys,
  # the host's resource group) for an hour. Longer jobs set their own.
  timeout: 30m

variables:
  GIT_DEPTH: 5
  # Host keys are pinned in ansible/known_hosts (docs/DEPLOY.md, "SSH host keys").
  ANSIBLE_HOST_KEY_CHECKING: "True"
  ANSIBLE_PIPELINING: "True"
  # Per-task timings at the end of every playbook run (top 20 slowest tasks).
  # SSH stays on Ansible's default ControlPersist=60s: with 600s the lingering
  # master added 10-25s to the end of every deploy job.
  ANSIBLE_CALLBACKS_ENABLED: "ansible.posix.profile_tasks"
  PROFILE_TASKS_TASK_OUTPUT_LIMIT: "20"
  PIP_CACHE_DIR: "/cache/pip"
  ANSIBLE_ROLES_PATH: "/cache/ansible-roles"
  MOLTBOT_IMAGE_TAG: "latest"
  # Host deploys (docs/DEPLOY.md): push pipelines deploy only the roles whose
  # inputs changed; DEPLOY_FULL=1 forces a full deploy, and pipelines not
  # started by a push deploy in full unless DEPLOY_SCOPE=changed.
  DEPLOY_FULL:
    value: ""
    description: "1 = full deploy of every host (default for manual and scheduled pipelines)"
  DEPLOY_SCOPE:
    value: ""
    description: "changed = changed-only deploy even in a manual pipeline"

# =============================================================================
# Path-based change detection
# =============================================================================

.router_changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/router.yml
        - ansible/inventory.yml
        - ansible/roles/configure-base/**/*
        - ansible/roles/configure-docker/**/*
        - ansible/roles/configure-router-network/**/*
        - ansible/roles/configure-notifications/**/*
        - ansible/roles/fetch-vault-secrets/**/*
        - ansible/roles/restic/**/*
        - ansible/roles/configure-excel-vm/**/*
        - ansible/roles/zwave-backup/**/*
        - ansible/roles/deadman/**/*
        - docker/docker-compose.yml
        - docker/**/*
        - networking/**/*
        - base/**/*
        - requirements.txt
        - ansible/requirements.yml
        - .gitlab-ci.yml

.zwave_changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/zwave.yml
        - ansible/inventory.yml
        - ansible/roles/configure-zwave/**/*
        - ansible/roles/configure-snapclient/**/*
        - ansible/roles/zwave-security-keys/**/*
        - ansible/roles/configure-pi-watchdog/**/*
        - ansible/roles/deploy-compose/**/*
        - docker/docker-compose-zwave.yml
        - docker/docker-compose-observability.yml
        - docker/docker-compose-satellite.yml
        - docker/promtail/satellite-config.yml
        - docker/telegraf/satellite-telegraf.conf
        - requirements.txt
        - ansible/requirements.yml
        - .gitlab-ci.yml

.satellite2_changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/satellite-2.yml
        - ansible/inventory.yml
        - ansible/roles/configure-satellite/**/*
        - ansible/roles/configure-pi-watchdog/**/*
        - ansible/roles/deploy-compose/**/*
        - docker/docker-compose-observability.yml
        - docker/docker-compose-satellite.yml
        - docker/promtail/satellite-config.yml
        - docker/telegraf/satellite-telegraf.conf
        - requirements.txt
        - ansible/requirements.yml
        - .gitlab-ci.yml

.macmini_changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/macmini.yml
        - ansible/inventory.yml
        - ansible/roles/claude-user-macos/**/*
        - ansible/roles/fetch-vault-secrets/**/*
        - requirements.txt
        - ansible/requirements.yml
        - .gitlab-ci.yml

# =============================================================================
# Job Templates
# =============================================================================
.interruptible:
  interruptible: true

# Auto-merge rule fragments (used via !reference).
# Scheduled pipelines that set AUTOMERGE_TASK, NETGEAR_TASK, IAP_TASK,
# DENON_TASK or SCHEDULED_TASK run only their own jobs (automerge:* /
# netgear:drift / aruba-iap:drift / denon:drift / the firmware jobs / the job
# whose rule names that SCHEDULED_TASK, e.g. renovate).
.automerge_task_skip:
  rules:
    - if: $AUTOMERGE_TASK || $NETGEAR_TASK || $IAP_TASK || $DENON_TASK || $SCHEDULED_TASK
      when: never

# Nightly full deploy of every host (pipeline schedule with
# SCHEDULED_TASK=full-deploy): corrects drift in roles that changed-only
# deploys skipped. Listed before .automerge_task_skip in the deploy jobs.
.full_deploy_schedule:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $SCHEDULED_TASK == "full-deploy" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# Commits merged by the auto-merge policy get <host>:deploy-service instead of
# the full host deploys; those stay available as manual jobs. CI image merges
# (Automerge-Policy: ci-image) change only job image lines and deploy nothing;
# bot-config merges (Automerge-Policy: bot-config) deploy through
# <host>:deploy-service too, or not at all (docs only).
.automerged_commit_manual:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /Automerge-Policy: (image-update|ci-image|bot-config)/'
      when: manual
      allow_failure: true

stages:
  - bootstrap
  - validate
  - build
  - deploy

# =============================================================================
# Bootstrap Stage - Manual disaster recovery (main only)
# =============================================================================
router:bootstrap:
  extends: .ansible
  stage: bootstrap
  environment: admin
  when: manual
  allow_failure: true
  script:
    - ansible-playbook -i ansible/inventory.yml ansible/bootstrap.yml --connection=local
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_COMMIT_BRANCH == "main"

# =============================================================================
# Base ansible job with caching
# =============================================================================
.ansible:
  image: willhallonline/ansible:2.21.5-alpine-3.22@sha256:cf26105d35af9e8df0a9eafaecf3c23310cace20687b9044a92e8acc0b6f46af
  before_script:
    - mkdir -p /cache/pip /cache/ansible-roles
    # willhallonline/ansible:latest now ships an externally-managed (PEP 668) python;
    # the job container is throwaway, so installing into system site-packages is fine
    - pip3 install -q --break-system-packages --cache-dir /cache/pip -r requirements.txt
    # Clean corrupted role directories (ansible-galaxy --force doesn't handle this)
    # Galaxy install only when ansible/requirements.yml lists something (it is
    # `[]` while every role is vendored; the --force reinstall cost ~6s a job).
    - |
      if grep -qvE '^[[:space:]]*(#.*|\[\][[:space:]]*|---[[:space:]]*)?$' ansible/requirements.yml; then
        for d in /cache/ansible-roles/*/; do
          [ -d "$d" ] && [ ! -f "${d}meta/main.yml" ] && [ ! -f "${d}tasks/main.yml" ] && rm -rf "$d" 2>/dev/null
        done
        ansible-galaxy install -r ansible/requirements.yml -p /cache/ansible-roles --force 2>/dev/null || true
      fi
    - mkdir -p ~/.ssh
    - cp ansible/known_hosts ~/.ssh/known_hosts
    # Write SSH key from CI variable (protected — only available on main branch)
    - echo ${ROUTER_PRIVATE_KEY_BASE64}|base64 -d > tmp && chmod 600 tmp
    - |
      if [ ! -s tmp ]; then
        echo "WARN: SSH key is empty (protected variable unavailable on feature branches)"
        export ANSIBLE_SSH_KEY_AVAILABLE=false
      else
        export ANSIBLE_SSH_KEY_AVAILABLE=true
      fi
  after_script:
    - rm -f tmp
  # No `cache:` here: /cache is a runner volume (base/gitlab-runner/config.toml)
  # and persists on its own. GitLab cache paths must be inside the project
  # dir, so the old cache entry archived nothing ("No files to cache") and
  # only cost ~4s per job.

# =============================================================================
# Validation Stage - Parallel execution on MRs (DAG)
# =============================================================================
nginx:validate:
  extends: .interruptible
  stage: validate
  image: nginx:1.31.2-alpine3.23-perl@sha256:b3b337e1ef5b1bc8253dec68bc4522d9027920666a428bf51a022ceb7e3396bc
  needs: []
  before_script:
    - apk add --no-cache openssl
  script:
    - ./scripts/validate-nginx-config.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/nginx/**/*
        - scripts/validate-nginx-config.sh
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docker/nginx/**/*
        - scripts/validate-nginx-config.sh
        - .gitlab-ci.yml

router:validate:
  extends:
    - .ansible
    - .interruptible
    - .router_changes
  stage: validate
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  needs: []
  script:
    - |
      if [ "$ANSIBLE_SSH_KEY_AVAILABLE" = "true" ]; then
        echo "SSH key available — running full check mode"
        ansible-playbook -i ansible/inventory.yml -u root --private-key=tmp ansible/router.yml --check --diff
      else
        echo "SSH key unavailable — running syntax check only"
        ansible-playbook -i ansible/inventory.yml ansible/router.yml --syntax-check
      fi

zwave:validate:
  extends:
    - .ansible
    - .interruptible
    - .zwave_changes
  stage: validate
  needs: []
  script:
    - |
      if [ "$ANSIBLE_SSH_KEY_AVAILABLE" = "true" ]; then
        echo "SSH key available — running full check mode"
        ansible-playbook -i ansible/inventory.yml -u root --private-key=tmp ansible/zwave.yml --check --diff
      else
        echo "SSH key unavailable — running syntax check only"
        ansible-playbook -i ansible/inventory.yml ansible/zwave.yml --syntax-check
      fi

satellite-2:validate:
  extends:
    - .ansible
    - .interruptible
    - .satellite2_changes
  stage: validate
  needs: []
  script:
    - |
      if [ "$ANSIBLE_SSH_KEY_AVAILABLE" = "true" ]; then
        echo "SSH key available — running full check mode"
        ansible-playbook -i ansible/inventory.yml -u root --private-key=tmp ansible/satellite-2.yml --check --diff
      else
        echo "SSH key unavailable — running syntax check only"
        ansible-playbook -i ansible/inventory.yml ansible/satellite-2.yml --syntax-check
      fi

jit-approval-svc:test:
  extends: .interruptible
  stage: validate
  image: golang:1.27-alpine@sha256:eb61c3873c97416fff0116553fff65d67a3549f72e11d9758849a689cdd8b523
  needs: []
  script:
    - cd docker/jit-approval-svc
    - go test -v -count=1 ./...
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/jit-approval-svc/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docker/jit-approval-svc/**/*

# Unit tests (synthetic series: seasonality, spikes, stale, drift) plus a
# strict parse of config.yml and suppressions.yml. See
# docker/anomaly-detector/README.md.
anomaly-detector:test:
  extends: .interruptible
  stage: validate
  image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
  needs: []
  script:
    - apk add --no-cache tzdata
    - cd docker/anomaly-detector
    - pip install -q --root-user-action=ignore --disable-pip-version-check -r requirements.txt
    - python -m unittest discover -s tests -t . -v
    - python -m detector --config config.yml --suppressions suppressions.yml validate
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/anomaly-detector/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docker/anomaly-detector/**/*

# TLA+ model of the event router (docs/design/tla/README.md): the base model
# must pass and every mutation must fail on its named property. Small seed
# instances only (run-tlc.sh ci), 2 workers at nice 19 / ionice idle. Runs when
# the spec changes and weekly (schedule SCHEDULED_TASK=event-router-tlc).
event-router:tlc:
  extends: .interruptible
  stage: validate
  image: eclipse-temurin:21.0.13_9-jre-alpine@sha256:ac05c3c42b7c2f1a52c9bd52f01041fa1958231b15ebeae7420429cbc5baf474
  needs: []
  timeout: 20m
  variables:
    TLC_WORKERS: "2"
    TLC_XMX: "1g"
    TLA_CACHE_DIR: /cache/tla
    TLC_LOGDIR: $CI_PROJECT_DIR/tlc-logs
  script:
    - apk add --no-cache bash curl util-linux-misc
    - docs/design/tla/run-tlc.sh ci
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - tlc-logs/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_TASK == "event-router-tlc"
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/design/tla/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docs/design/tla/**/*

# Event router (docker/event-router/README.md): unit and property tests
# (Hypothesis, the TLA+ properties against the real code) and the playbook
# validator, which rejects non-allowlisted actions and hard-denied targets.
event-router:test:
  extends: .interruptible
  stage: validate
  image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
  needs: []
  script:
    - apk add --no-cache tzdata
    - cd docker/event-router
    - pip install -q --root-user-action=ignore --disable-pip-version-check -r requirements-dev.txt
    - python -m unittest discover -s tests -t . -v
    - >-
      python -m router validate --config config.yml --playbooks playbooks
      --deps ../../inventory/dependencies.yml
      --rules ../grafana/provisioning/alerting --compose ../docker-compose.yml
      --suppressions suppressions.yml
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/event-router/**/*
        - inventory/dependencies.yml
        - docker/grafana/provisioning/alerting/*.yml
        - docker/docker-compose.yml
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docker/event-router/**/*
        - inventory/dependencies.yml
        - docker/grafana/provisioning/alerting/*.yml
        - docker/docker-compose.yml

# Stale-tree revert guard (ci/revert-guard/README.md): fails an MR whose diff
# undoes what other MRs merged in the last 7 days, in files where it changes
# nothing else (e.g. b0ac2497 in !1048). Deliberate reverts: add the
# `revert-intended` label and run a new pipeline. Needs full history to blame.
revert-guard:
  extends: .interruptible
  stage: validate
  image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
  needs: []
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - if [ -f "$(git rev-parse --git-dir)/shallow" ]; then git fetch -q --unshallow origin; fi
    - git fetch -q origin "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - python3 ci/revert-guard/revert_guard.py --target "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" --head "$CI_COMMIT_SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

revert-guard:test:
  extends: .interruptible
  stage: validate
  image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
  needs: []
  script:
    - apk add --no-cache git
    - python3 -m unittest discover -s ci/revert-guard -p "test_*.py" -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ci/revert-guard/**/*

# Offline: runs fetch-vault-secrets against a fake Vault and checks that every
# failure (timeout, 403, missing path/field, empty field, bad auth) stops the
# play before anything is written. See ansible/tests/fetch-vault-secrets/.
fetch-vault-secrets:test:
  extends: .interruptible
  stage: validate
  image: willhallonline/ansible:latest
  needs: []
  script:
    - sh ansible/tests/fetch-vault-secrets/run.sh
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/roles/fetch-vault-secrets/**/*
        - ansible/tests/fetch-vault-secrets/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - ansible/roles/fetch-vault-secrets/**/*
        - ansible/tests/fetch-vault-secrets/**/*

# Throwaway canary (docs/CANARY.md): boots the candidate image and config of
# a changed critical service (gitlab, vault, homeassistant, pihole, the nginx
# instances) in an isolated container on the router and fails the MR pipeline
# unless it comes up healthy. The job only streams the result: the canary
# service (ansible/roles/canary) verifies the job token with GitLab, picks the
# services from the commit's diff against main and runs them one at a time.
# Required for these paths: not allow_failure, so a failing canary blocks the
# merge, Renovate auto-merges included (the sweep needs a passed pipeline).
canary:
  image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
  extends: .interruptible
  stage: validate
  needs: []
  # A GitLab canary boots a fresh omnibus: 10-25 min, longer when the
  # router is busy (services.yml gitlab.timeout is 30 min to ready).
  timeout: 60m
  # One canary at a time across all MR pipelines (the service also queues).
  resource_group: canary
  script:
    - python3 ci/canary/client.py
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - canary-logs/
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/docker-compose.yml
        - docker/gitlab/**/*
        - docker/vault/**/*
        - docker/homeassistant/**/*
        - docker/pihole/**/*
        - docker/nginx/**/*
        - docker/docker-socket-proxy-tls/**/*

# Offline tests of the canary code and spec (no Docker).
canary:test:
  extends:
    - .ansible
    - .interruptible
  stage: validate
  needs: []
  before_script: []
  script:
    - python3 -m unittest discover -s ci/canary -p 'test_*.py' -v
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"
      changes:
        - ci/canary/**/*
        - docker/docker-compose.yml
        - docker/gitlab/**/*
        - docker/vault/**/*
        - docker/homeassistant/**/*
        - docker/pihole/**/*
        - docker/nginx/**/*
        - docker/docker-socket-proxy-tls/**/*
        - .gitlab-ci.yml

# Offline: tag selection for changed-only deploys (sample diffs), and checks
# that ci/deploy-scope/scope.yml maps every file the roles and the inventory
# read. See docs/DEPLOY.md.
deploy-scope:test:
  extends:
    - .ansible
    - .interruptible
  stage: validate
  needs: []
  before_script: []
  script:
    - python3 -m unittest discover -s ci/deploy-scope -p 'test_*.py' -v
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"
      changes:
        - ci/deploy-scope/**/*
        - ansible/**/*
        - docker/**/*
        - base/**/*
        - networking/**/*
        - snapclient/**/*
        - scripts/**/*
        - .gitlab-ci.yml

# =============================================================================
# Build Stage - Container images (GitLab Registry)
# =============================================================================
# All images are built and pushed to GitLab's built-in container registry.
# Registry URL: gitlab-registry.lab.nkontur.com:443/root/homelab/<image>
# CI variables: $CI_REGISTRY, $CI_REGISTRY_USER, $CI_REGISTRY_PASSWORD, $CI_REGISTRY_IMAGE

# main: build on the host daemon (docker-socket-proxy, protected runner only)
# and push :latest and :$CI_COMMIT_SHORT_SHA.
# The router deploy jobs need these builds, so a build job must not have a
# manual rule (the deploy would be skipped until it is played). To rebuild an
# unchanged image, run a pipeline on main (Run pipeline): changes: is always
# true outside push pipelines, so every image builds before the deploy.
.docker_build:
  stage: build
  timeout: 45m
  image: docker:27
  variables:
    DOCKER_HOST: "tcp://lab.nkontur.com:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs"
    # Legacy builder required — BuildKit uses APIs not allowed by docker-socket-proxy
    DOCKER_BUILDKIT: "0"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  needs: []
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$IMAGE_NAME:latest -t $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA $BUILD_CONTEXT/
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME:latest
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  # These builds run on the router's daemon (data-root /persistent_data/docker)
  # and nothing else removes what they leave. The :sha tag only needs to exist
  # in the registry, and each superseded :latest goes dangling. until=24h keeps
  # the untagged intermediates of a build still running in a parallel job.
  # Dangling-only: tagged images (dovi-convert, etc.) and images in use are
  # never touched. after_script, so a cleanup error cannot fail the build.
  after_script:
    - docker rmi $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA || true
    - docker image prune -f --filter "until=24h" || true

# MRs: check that the image builds, with kaniko inside the job container (no
# Docker daemon, nothing is pushed). The last three flags keep memory down:
# with kaniko's defaults openclaw:build-check exceeds the runner's 4g limit
# (peak ~1.7g with them).
.kaniko_check:
  extends: .interruptible
  stage: build
  timeout: 45m
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
  needs: []
  script:
    - >-
      /kaniko/executor
      --context "dir://$CI_PROJECT_DIR/$BUILD_CONTEXT"
      --dockerfile "$CI_PROJECT_DIR/$BUILD_CONTEXT/Dockerfile"
      --no-push
      --compressed-caching=false
      --snapshot-mode=redo
      --use-new-run

