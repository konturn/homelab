# Weekly: versions kept in data volumes (Nextcloud apps, Home Assistant update
# entities, Grafana plugins, WordPress core/themes/plugins).
report:app-updates:
  extends: .scheduled_report
  script:
    - python3 ci/reports/run_remote.py app_updates.py --secret ha=docker/homeassistant
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $SCHEDULED_TASK == "app-report" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# Weekly: pending OS/security updates, reboot-required, kernel, distro EOL.
report:os-patches:
  extends: .scheduled_report
  variables:
    REPORT_FACTS_DIR: "$CI_PROJECT_DIR/.reports/os"
  script:
    - ansible-playbook -i ansible/inventory.yml -u root --private-key=tmp ansible/os-patch-report.yml
    - python3 ci/reports/run_remote.py os_patches.py --data "$REPORT_FACTS_DIR"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $SCHEDULED_TASK == "os-report" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# Monthly: switch / access point / router BIOS, BMC and drive firmware.
report:firmware:
  extends: .scheduled_report
  resource_group: netgear-switches
  script:
    - >-
      python3 ci/reports/run_remote.py firmware.py
      --extra networking/switches/netgear/ngswitch.py
      --secret netgear-movie=network/netgear-movie
      --secret netgear-office=network/netgear-office
      --secret aruba-iap=network/aruba-iap
      --extra networking/aruba-s2500/s2500ctl.py
      --extra networking/aruba-s2500/known_hosts
      --secret aruba-s2500=network/aruba-s2500
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $SCHEDULED_TASK == "firmware-report" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# =============================================================================
# Auto-merge for low-risk image updates (see docs/AUTOMERGE.md)
# =============================================================================
# Jobs that hold AUTOMERGE_TOKEN or deploy credentials run only on main
# (scheduled or post-merge), so they always execute main's copy of
# ci/automerge/. MR content is read as data through the API.

automerge:test:
  extends:
    - .ansible
    - .interruptible
  stage: validate
  needs: []
  script:
    # Hypothesis for test_properties.py (300 examples per property here, ~1 min)
    - pip3 install -q --break-system-packages --cache-dir /cache/pip -r ci/automerge/requirements-test.txt
    - python3 -m unittest discover -s ci/automerge -p 'test_*.py' -v
    - ansible-playbook -i ansible/inventory.yml ansible/service-update.yml -e automerge_host=router.lab.nkontur.com --syntax-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ci/**/*
        - ansible/service-update.yml
        - ansible/inventory.yml
        - ansible/roles/configure-homelab-services/**/*
        - docker/docker-compose*.yml
        - renovate.json
        - CODEOWNERS
        - .gitlab-ci.yml

# The property tests (ci/automerge/test_properties.py) with 5000 examples per
# property instead of automerge:test's 300 (~15 min): on main after a change
# to the policy code or file, off the deploy path (needs: [], last stage), or
# by hand with Run pipeline and SCHEDULED_TASK=automerge-properties. No
# credentials: the .ansible before_script (SSH key) is dropped.
automerge:properties-deep:
  extends: .ansible
  stage: deploy
  needs: []
  timeout: 45m
  variables:
    HYPOTHESIS_PROFILE: deep
  before_script: []
  script:
    - pip3 install -q --break-system-packages --cache-dir /cache/pip -r ci/automerge/requirements-test.txt
    - python3 -m unittest discover -s ci/automerge -p 'test_properties.py' -v
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $SCHEDULED_TASK == "automerge-properties" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
    - !reference [.automerge_task_skip, rules]
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - ci/automerge/*.py
        - ci/automerge/requirements-test.txt
        - ci/automerge-policy.yml

# Informational: MR-local policy checks (no credentials). The authoritative
# decision is made by automerge:sweep from main.
automerge:eligibility:
  extends:
    - .ansible
    - .interruptible
  stage: validate
  needs: []
  allow_failure: true
  variables:
    GIT_DEPTH: "50"
  script:
    # The job image runs as a different user than the checkout owner, so git
    # refuses the repo ("dubious ownership") without this.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch -q --depth=50 origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || true
    - >-
      python3 ci/automerge/automerge.py mr-check
      --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA"
      --author "$GITLAB_USER_LOGIN" --target "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      --labels "$CI_MERGE_REQUEST_LABELS"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/docker-compose*.yml
        - .gitlab-ci.yml

# Scheduled (e.g. every 15 min) with AUTOMERGE_TASK=sweep: labels eligible MRs
# and merges at most one MR whose pipeline has passed.
automerge:sweep:
  extends: .ansible
  stage: deploy
  needs: []
  resource_group: automerge
  script:
    - python3 ci/automerge/automerge.py sweep
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $AUTOMERGE_TASK == "sweep" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# Scheduled daily with AUTOMERGE_TASK=report: mails a summary via the router's msmtp.
automerge:report:
  extends: .ansible
  stage: deploy
  needs: []
  script:
    - python3 ci/automerge/automerge.py daily-report
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $AUTOMERGE_TASK == "report" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# Per-service deploy for commits merged by automerge:sweep, one job per host
# (deploy_hosts in ci/automerge-policy.yml). The sweep writes the trailer
# "Automerge-Deploy: [router] [zwave] ..." from main's policy and inventory;
# plan-deploy derives the hosts again and refuses a job its commit does not
# deploy to. Commits merged before the trailer existed deploy on the router.
.deploy_service:
  extends: .ansible
  stage: deploy
  # Health gate (up to 15m) plus rollback, plus pre-upgrade backups for
  # stateful services (a full InfluxDB backup takes ~25m).
  timeout: 60m
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  variables:
    GIT_DEPTH: "20"
    AUTOMERGE_PLAN: "$CI_PROJECT_DIR/.automerge/plan.json"
    AUTOMERGE_RESULT: "$CI_PROJECT_DIR/.automerge/result.json"
  script:
    - mkdir -p .automerge
    - |
      if ! python3 ci/automerge/automerge.py plan-deploy --host "$AUTOMERGE_DEPLOY_TARGET" --out "$AUTOMERGE_PLAN"; then
        python3 ci/automerge/automerge.py notify \
          --subject "Homelab auto-merge: deploy refused on ${AUTOMERGE_DEPLOY_TARGET} (${CI_COMMIT_SHORT_SHA})" \
          --message "plan-deploy refused this auto-merged commit, so nothing was deployed on ${AUTOMERGE_DEPLOY_TARGET} and main references an image that is not running there. Run the manual ${AUTOMERGE_DEPLOY_TARGET}:deploy job if a full deploy is wanted." \
          && touch .automerge/alerted
        exit 1
      fi
    - AUTOMERGE_HOST=$(python3 -c 'import json,os; print(json.load(open(os.environ["AUTOMERGE_PLAN"]))["host"])')
    - |
      if ansible-playbook -i ansible/inventory.yml -u root --private-key=tmp -e "automerge_host=${AUTOMERGE_HOST}" ansible/service-update.yml; then
        python3 ci/automerge/automerge.py deploy-report --plan "$AUTOMERGE_PLAN" --result "$AUTOMERGE_RESULT" --status success || true
      else
        # deploy-report opens the rollback issue and revert MR and mails root
        python3 ci/automerge/automerge.py deploy-report --plan "$AUTOMERGE_PLAN" --result "$AUTOMERGE_RESULT" --status failed \
          && touch .automerge/alerted
        echo "=================================================================="
        echo "AUTO-MERGE DEPLOY FAILED - services rolled back (see above);"
        echo "a rollback issue and revert MR were opened and auto-merge is paused."
        echo "=================================================================="
        exit 1
      fi
  # Any other failure (timeout, cancellation, a crash before deploy-report)
  # still mails root (over SSH with the key in `tmp`). This replaces .ansible's
  # after_script, so it removes the key itself.
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != success ] && [ ! -e .automerge/alerted ]; then
        python3 ci/automerge/automerge.py notify \
          --subject "Homelab auto-merge: ${CI_JOB_NAME} ${CI_JOB_STATUS} (${CI_COMMIT_SHORT_SHA})" \
          --message "The per-service deploy ended (${CI_JOB_STATUS}) without recording an outcome. The target services may be on either image: check the host and the job log." || true
      fi
    - rm -f tmp
  artifacts:
    when: always
    paths:
      - .automerge/plan.json
      - .automerge/result.json
    expire_in: 30 days

router:deploy-service:
  extends: .deploy_service
  resource_group: deploy-router
  # environment: enables "prevent outdated deployment jobs"; with the
  # resource group in newest_ready_first mode, older queued deploys are skipped.
  # Both settings live in GitLab, enforced by gitlab:settings.
  environment:
    name: router
  variables:
    AUTOMERGE_DEPLOY_TARGET: router
  needs:
    - job: vault:configure
      optional: true
    # The image builds, as in router:deploy (see there).
    - job: amcrest2mqtt:build
      optional: true
    - job: anomaly-detector:build
      optional: true
    - job: event-router:build
      optional: true
    - job: chromium-browser:build
      optional: true
    - job: jit-approval-svc:build
      optional: true
    - job: nginx:build
      optional: true
    - job: novnc:build
      optional: true
    - job: openclaw:build
      optional: true
    - job: petlibro-camera:build
      optional: true
    - job: snapcast:build
      optional: true
    - job: snapclient:build
      optional: true
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /Automerge-Deploy:.*\[router\]/'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /Automerge-Policy: image-update/ && $CI_COMMIT_MESSAGE !~ /Automerge-Deploy:/'

zwave:deploy-service:
  extends: .deploy_service
  resource_group: deploy-zwave
  environment:
    name: zwave
  variables:
    AUTOMERGE_DEPLOY_TARGET: zwave
  needs:
    - job: vault:configure
      optional: true
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /Automerge-Deploy:.*\[zwave\]/'

satellite-2:deploy-service:
  extends: .deploy_service
  resource_group: deploy-satellite-2
  environment:
    name: satellite-2
  variables:
    AUTOMERGE_DEPLOY_TARGET: satellite-2
  needs:
    - job: vault:configure
      optional: true
  rules:
    - !reference [.automerge_task_skip, rules]
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /Automerge-Deploy:.*\[satellite-2\]/'

# =============================================================================
# GitLab project settings that .gitlab-ci.yml cannot express (see docs/GITLAB_SETTINGS.md)
# =============================================================================
# Deploy resource groups in newest_ready_first mode, "Prevent outdated
# deployment jobs" on, the event-router webhooks and outbound allowlist entry. Idempotent: only writes what differs. Scheduled daily on
# main with SCHEDULED_TASK=gitlab-settings, and runs on main when the script or
# this file changes. GITLAB_SETTINGS_TOKEN is the protected APPROLE_ROTATION_PAT
# (Maintainer project access token), so only main's copy of the job sees it.
gitlab:settings:
  stage: deploy
  image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
  needs: []
  # The event-router webhook token is read from Vault (JWT login, ci-deploy).
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.lab.nkontur.com:8200
  variables:
    GITLAB_SETTINGS_TOKEN: $APPROLE_ROTATION_PAT
    # The instance plan limit, the outbound allowlist and the event-router
    # webhooks are checked inside the router's gitlab container over SSH with
    # the deploy key (protected), instead of an admin API token.
    ROUTER_SSH_KEY: $CI_PROJECT_DIR/.router_ssh_key
    VAULT_ADDR: "https://vault.lab.nkontur.com:8200"
    VAULT_SKIP_VERIFY: "true"
    VAULT_JWT_ROLE: "ci-deploy"
  before_script:
    - apk add --no-cache bash curl jq openssh-client
    - (umask 077; echo "${ROUTER_PRIVATE_KEY_BASE64}" | base64 -d > "$ROUTER_SSH_KEY")
  script:
    - scripts/gitlab-settings.sh
  after_script:
    - rm -f "$CI_PROJECT_DIR/.router_ssh_key"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $SCHEDULED_TASK == "gitlab-settings" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
    - !reference [.automerge_task_skip, rules]
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - scripts/gitlab-settings.sh
        - .gitlab-ci.yml

# =============================================================================
# Renovate (self-hosted dependency updates, see docs/RENOVATE.md)
# =============================================================================
# Scheduled on main with SCHEDULED_TASK=renovate, so it runs on the protected
# runner and RENOVATE_TOKEN (protected, masked project access token) is only
# ever available to main's copy of this job. Renovate reads the repository
# through the API/git; it does not execute repository code.
.renovate_image: &renovate_image
  name: renovate/renovate:44.237.2@sha256:6da02401977f6c9658a268e296b98e0f6fac5f9ac2ef8cd80a05feafe24ca566
  entrypoint: [""]

renovate:
  stage: deploy
  image: *renovate_image
  needs: []
  resource_group: renovate
  timeout: 45m
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_BASE_DIR: $CI_PROJECT_DIR/.renovate
    RENOVATE_REPOSITORY_CACHE: enabled
    LOG_LEVEL: info
  script:
    - renovate
  cache:
    key: renovate-v1
    paths:
      - .renovate/cache
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $SCHEDULED_TASK == "renovate" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")

# MR check: renovate.json must stay valid (no credentials).
renovate:validate:
  extends: .interruptible
  stage: validate
  image: *renovate_image
  needs: []
  script:
    # No path argument: given a path the validator checks the file as global
    # config; from the repo root it finds renovate.json and checks it as
    # repository config.
    - renovate-config-validator
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - renovate.json
