all:
  vars:
    mullvad_interface_name: us-chi-wg-201
    inet_interface_name: enx6c1ff76b2ec9
    nginx_ip: 10.2.32.1
    lab_nginx_ip: 10.3.32.1
    pihole_ip: 10.3.32.2
    deluge_ip: 10.3.32.3
    influxdb_ip: 10.3.32.5
    influxdb_iot_ip: 10.6.32.8
    vault_ip: 10.3.32.6
    promtail_ip: 10.3.32.7
    jit_approval_svc_ip: 10.3.32.8
    anomaly_detector_ip: 10.3.32.11
    chromium_browser_ip: 10.3.32.9
    chromium_cdp_ip: 172.30.1.10  # openclaw-browser bridge (CDP)
    bluebubbles_relay_ip: 172.30.2.10  # openclaw-relay bridge
    openclaw_gateway_ip: 10.3.32.10
    docker_persistent_data_path: /persistent_data/application
    docker_compose_version: '3.9'
    movie_switch_mac: 8c:3b:ad:6f:0e:d0
    movie_switch_address: 10.4.128.3
    office_switch_mac: 28:80:88:6e:11:88
    office_switch_address: 10.4.128.4
    ipmi_mac: 00:25:90:ec:88:92
    ipmi_address: 10.4.128.7
    ups_mac: 00:c0:b7:84:80:f4
    ups_address: 10.4.128.8
    privileged_access_point_1_mac: d2:3f:2a:7e:a7:98
    privileged_access_point_1_address: 10.4.128.21
    privileged_access_point_2_mac: 84:2f:57:03:cf:43
    privileged_access_point_2_address: 10.4.128.22
    privileged_access_point_3_mac: 80:a9:97:12:5b:30
    privileged_access_point_3_address: 10.4.128.23
    mac_mini_mac: 1c:f6:4c:56:b5:ba
    mac_mini_address: 10.4.128.24
    # Aruba Instant virtual controller (networking/aruba-iap): served by the conductor AP
    iap_vc_address: 10.4.128.10
    movie_ap_mac: 24:62:ce:cb:82:94
    movie_ap_address: 10.4.128.11
    office_ap_mac: 90:4c:81:cf:49:58
    office_ap_address: 10.4.128.12
    denon_mac: 00:06:78:84:0e:d8
    denon_address: 10.6.128.3
    pc_mac: a8:a1:59:24:84:d7
    projector_mac: dc:cd:2f:d6:aa:0e
    projector_address: 10.6.128.4
    shield_mac: 00:04:4b:b6:cf:95
    shield_address: 10.6.128.5
    zwave_mac: dc:a6:32:74:9e:bf
    zwave_address: 10.6.128.6
    # miniDSP 2x4HD units on the Z-Wave Pi's USB (docs/minidsp.md). The serial
    # is the stable key: minidspd's HTTP API accepts it in place of the device
    # index (/devices/<serial>), and the ALSA card gets the id minidsp_<serial>
    # from a udev rule matching usb_path. The units have no USB serial
    # descriptor, so the physical port is all udev can match on: moving a
    # unit to another USB port means updating usb_path here.
    minidsp_units:
      - serial: 919619
        usb_path: "1-1.3"
      - serial: 921284
        usb_path: "1-1.2"
    amp_mac: 40:d6:3c:28:81:95
    amp_address: 10.6.128.7
    doorbell_mac: 9c:8e:cd:3c:de:33
    doorbell_address: 10.6.128.9
    kitchen_qual_address: 10.6.128.10
    kitchen_qual_mac: 70:88:6b:14:b5:41
    satellite_2_address: 10.6.128.11
    satellite_2_mac: dc:a6:32:74:a1:cf
    back_camera_address: 10.6.128.14
    back_camera_mac: 9c:8e:cd:3a:db:e8
    bedroom_qual_address: 10.6.128.15
    bedroom_qual_mac: 70:88:6b:14:7a:a0
    weather_station_address: 10.6.128.16
    weather_station_mac: 30:83:98:A6:92:7B
    vac_address: 10.6.128.18
    vac_mac: b8:4d:43:98:68:4f
    apple_tv_mac: 8c:26:aa:c7:d0:41
    apple_tv_address: 10.6.128.19
    zigbee_radio_mac: 68:25:dd:2f:51:27
    zigbee_radio_address: 10.6.128.20
    frame_tv_mac: e8:aa:cb:04:64:da
    frame_tv_address: 10.6.128.21
    snapserver_address: 10.6.32.2
    mosquitto_address: 10.6.32.3
    iot_nginx_ip: 10.6.32.5
    weather_mqtt_bridge_ip: 10.6.32.6
    mopidy_address: 10.6.32.7
    # libvirt guest on the router (ansible/roles/configure-excel-vm). Static
    # address: must stay inside 10.3.0.0/18, see the role defaults.
    excel_vm_mac: "52:54:00:3a:48:0a"
    excel_vm_address: 10.3.48.10
    # Host keys are pinned in ansible/known_hosts and checked strictly
    # (docs/DEPLOY.md, "SSH host keys").
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ inventory_dir }}/known_hosts"
    # Secrets come only from fetch-vault-secrets, which fails the play when
    # one is missing. No env/empty fallback: an undefined value must fail.
    omapi_secret: "{{ vault_omapi_secret | trim }}"
    tailscale_api_token: "{{ vault_tailscale_api_token | trim }}"
    tailscale_oauth_client_id: "{{ vault_tailscale_oauth_client_id | trim }}"
    tailscale_oauth_client_secret: "{{ vault_tailscale_oauth_client_secret | trim }}"
    tailscale_tailnet: "tail2360f8.ts.net"
    tailscale_split_dns:
      lab.nkontur.com:
        - "10.3.32.2"
      iot.lab.nkontur.com:
        - "10.3.32.2"
    grafana_url: "http://grafana:3000"
    grafana_token: "{{ vault_grafana_token | trim }}"
    brave_api_key: "{{ vault_brave_api_key | trim }}"
    is_satellite: false
  hosts:
    router.lab.nkontur.com:
      ansible_host: 10.4.0.1
      claude_elevated_access: true
      local_interface_name: bond0
      dhcp_address: 10.4.0.1
      docker_compose_file_names:
        -  "docker-compose.yml"
      docker_compose_dest_path: "{{ docker_persistent_data_path }}/ansible_state"
      # Snapclient zones whose USB sound card is not detected. Each listed zone's
      # container is rendered with deploy.replicas: 0, so compose removes it
      # instead of letting it crash-loop on "Can't open plughw:CARD=<Zone>"
      # (~1,400 restarts/day each, firing Container Restart Loop).
      # Hardware item: the cards named by base/udev/85-my-usb-audio.rules are
      # missing from /proc/asound/cards (checked 2026-10-21).
      # Re-enable a zone: once its card is plugged in and listed under its
      # udev name in /proc/asound/cards, delete its line here and deploy.
      # Ollama models, applied on deploy by configure-ollama-models
      # (docs/ollama.md). paperless-ai uses paperless-qwen3:14b.
      ollama_models:
        - qwen3:14b-q4_K_M
      ollama_custom_models:
        - name: paperless-qwen3:14b
          modelfile: paperless-qwen3.Modelfile
      # Remove any other installed model (e.g. one pulled by hand to test).
      ollama_prune_undeclared: true
      snapclient_disabled_zones:
        - office
        - kitchen
        - main_bedroom
        - main_bathroom
        - guest_bathroom
        - guest_bedroom
      nginx_config:
        - dest: "{{ docker_persistent_data_path }}/lab_nginx"
          network: "internal"
          name: "lab_nginx"
        - dest: "{{ docker_persistent_data_path }}/iot_nginx"
          network: "iot"
          name: "iot_nginx"
        - dest: "{{ docker_persistent_data_path }}/nginx"
          network: "external"
          name: "nginx"
      pihole_dns_hosts:
        - "{{ nginx_ip }} nkontur.com"
        - "{{ nginx_ip }} www.nkontur.com"
        - "{{ nginx_ip }} edge-canary.lab.nkontur.com"
        - "{{ movie_switch_address }} movie-switch.lab.nkontur.com"
        - "{{ office_switch_address }} office-switch.lab.nkontur.com"
        - "{{ ipmi_address }} ipmi.lab.nkontur.com"
        - "{{ ups_address }} ups.lab.nkontur.com"
        - "{{ iap_vc_address }} iap.lab.nkontur.com"
        - "{{ movie_ap_address }} movie-ap.lab.nkontur.com"
        - "{{ office_ap_address }} office-ap.lab.nkontur.com"
        - "{{ shield_address }} shield.lab.nkontur.com"
        - "{{ denon_address }} denon.lab.nkontur.com"
        - "{{ projector_address }} projector.lab.nkontur.com"
        - "{{ frame_tv_address }} frame-tv.lab.nkontur.com"
        - "{{ kitchen_qual_address }} AWAIR-ELEM-14B541.lab.nkontur.com"
        - "{{ bedroom_qual_address }} AWAIR-ELEM-147AA0.lab.nkontur.com"
        - "{{ satellite_2_address }} satellite-2.lab.nkontur.com"
        - "{{ snapserver_address }} snapserver.lab.nkontur.com"
        - "{{ amp_address }} amp.lab.nkontur.com"
        - "{{ mosquitto_address }} mqtt.lab.nkontur.com"
        - "{{ vault_ip }} vault.lab.nkontur.com"
        - "{{ promtail_ip }} promtail.lab.nkontur.com"
        - "{{ lab_nginx_ip }} tempo.lab.nkontur.com"
        - "{{ lab_nginx_ip }} otel.lab.nkontur.com"
        - "{{ lab_nginx_ip }} music.lab.nkontur.com"
        - "{{ lab_nginx_ip }} lidarr.lab.nkontur.com"
        - "{{ lab_nginx_ip }} novnc-dev1.lab.nkontur.com"
        - "{{ lab_nginx_ip }} novnc-dev2.lab.nkontur.com"
        - "{{ lab_nginx_ip }} novnc-dev3.lab.nkontur.com"
        - "{{ jit_approval_svc_ip }} jit-approval-svc.lab.nkontur.com"
        - "{{ excel_vm_address }} excel-vm.lab.nkontur.com"
        - "{{ mac_mini_address }} macmini.lab.nkontur.com"
        - "10.6.0.1 router.lab.nkontur.com"
      docker_config: 
        - src: "docker/pihole/custom.conf"
          dest: "{{ docker_persistent_data_path }}/pihole/dnsmasq/custom.conf"
          name: "pihole"
        - src: "docker/homeassistant/configuration.yaml"
          dest: "{{ docker_persistent_data_path }}/homeassistant/configuration.yaml"
          name: "homeassistant"
        - src: "docker/homeassistant/packages/minidsp_bass_boost.yaml"
          dest: "{{ docker_persistent_data_path }}/homeassistant/packages/minidsp_bass_boost.yaml"
          name: "homeassistant"
        # Runtime state that snapserver rewrites: seeded only when missing.
        # The zone layout in it is enforced by configure-homelab-services.
        - src: "docker/snapserver/server.json"
          dest: "{{ docker_persistent_data_path }}/snapserver/server.json"
          name: "snapserver"
          force: false
        - src: "docker/snapserver/snapserver.conf"
          dest: "{{ docker_persistent_data_path }}/snapserver/snapserver.conf"
          name: "snapserver"
        - src: "docker/nextcloud/custom.config.php"
          dest: "{{ docker_persistent_data_path }}/nextcloud/custom.config.php"
          name: "nextcloud"
          owner: "www-data"
          group: "www-data"
        - src: "docker/mqtt/mosquitto.conf"
          dest: "{{ docker_persistent_data_path }}/mqtt/conf/mosquitto.conf"
          name: "mosquitto"
        - src: "docker/zigbee2mqtt/configuration.yaml"
          dest: "{{ docker_persistent_data_path }}/zigbee2mqtt/configuration.yaml"
          name: "zigbee2mqtt"
        - src: "docker/vault/config.hcl"
          dest: "{{ docker_persistent_data_path }}/vault/config/config.hcl"
          name: "vault"
        - src: "docker/vault/auto-unseal.sh"
          dest: "{{ docker_persistent_data_path }}/vault/scripts/auto-unseal.sh"
          name: "vault"
          mode: "0755"
        - src: "docker/openclaw/mcporter/mcporter.json"
          dest: "{{ docker_persistent_data_path }}/openclaw/mcporter/mcporter.json"
          name: "openclaw-gateway"
          mode: "0644"
          owner: "1000"
          group: "1000"
        - src: "docker/openclaw/entrypoint-wrapper.sh"
          dest: "{{ docker_persistent_data_path }}/openclaw/entrypoint-wrapper.sh"
          name: "openclaw-gateway"
          mode: "0755"
        - src: "docker/openclaw/git-credential-gitlab.sh"
          dest: "{{ docker_persistent_data_path }}/openclaw/git-credential-gitlab"
          name: "openclaw-gateway"
          mode: "0755"
        - src: "docker/openclaw/agents/main/agent/auth-profiles.json"
          dest: "{{ docker_persistent_data_path }}/openclaw/data/agents/main/agent/auth-profiles.json"
          name: "openclaw-gateway"
          mode: "0644"
          owner: "1000"
          group: "1000"
          force: false  # OpenClaw mutates this file at runtime (usageStats, dynamic profiles)
        - src: "docker/grafana/provisioning/datasources/influxdb.yml"
          dest: "{{ docker_persistent_data_path }}/grafana/provisioning/datasources/influxdb.yml"
          name: "grafana"
          mode: "0644"
        - src: "docker/grafana/provisioning/datasources/loki.yml"
          dest: "{{ docker_persistent_data_path }}/grafana/provisioning/datasources/loki.yml"
          name: "grafana"
          mode: "0644"
        - src: "docker/loki/local-config.yaml"
          dest: "{{ docker_persistent_data_path }}/loki/local-config.yaml"
          name: "loki"
          mode: "0644"
        - src: "docker/promtail/config.yml"
          dest: "{{ docker_persistent_data_path }}/promtail/config.yml"
          name: "promtail"
        - src: "docker/gitlab/gitlab.rb"
          dest: "{{ docker_persistent_data_path }}/gitlab/config/gitlab.rb"
          name: "gitlab"
        # license_encryption_key.pub is managed on-host, not from repo
        # (pipeline deploys would overwrite the key and invalidate the license)
        - src: "docker/docker-socket-proxy-tls/docker-proxy-tls.stream.conf"
          dest: "{{ docker_persistent_data_path }}/lab_nginx/conf/stream.d/docker-proxy-tls.conf"
          name: "lab_nginx"
        # lab_nginx conf.d/{http,stream}.conf come from nginx_config
        # (docker/nginx/<host>/internal_*.conf). Listing them here too wrote
        # each file twice per deploy and reloaded lab_nginx every time.
        - src: "docker/bitwarden/global.override.env"
          dest: "{{ docker_persistent_data_path }}/bitwarden/global.override.env"
          name: "bitwarden"
        - src: "docker/tempo/tempo.yaml"
          dest: "{{ docker_persistent_data_path }}/tempo/tempo.yaml"
          name: "tempo"
          mode: "0644"
        - src: "docker/otel-collector/config.yaml"
          dest: "{{ docker_persistent_data_path }}/otel-collector/config.yaml"
          name: "otel-collector"
          mode: "0644"
        - src: "docker/grafana/provisioning/datasources/tempo.yml"
          dest: "{{ docker_persistent_data_path }}/grafana/provisioning/datasources/tempo.yml"
          name: "grafana"
          mode: "0644"
        # Anomaly detector signals and suppressions (read-only mount at /config)
        - src: "docker/anomaly-detector/config.yml"
          dest: "{{ docker_persistent_data_path }}/anomaly-detector/config.yml"
          name: "anomaly-detector"
          mode: "0644"
        - src: "docker/anomaly-detector/suppressions.yml"
          dest: "{{ docker_persistent_data_path }}/anomaly-detector/suppressions.yml"
          name: "anomaly-detector"
          mode: "0644"
        - src: "docker/paperless-ai/paperless-ai.env"
          dest: "{{ docker_persistent_data_path }}/paperless-ai/paperless-ai.env"
          name: "paperless-ai"
          mode: "0600"
        - src: "docker/telegraf/telegraf.conf"
          dest: "/etc/telegraf/telegraf.conf"
          name: "telegraf"
          owner: "root"
          group: "telegraf"
          mode: "0640"
        - src: "docker/telegraf/scripts/pihole-stats.sh"
          dest: "/etc/telegraf/scripts/pihole-stats.sh"
          name: "telegraf"
          mode: "0755"
        - src: "docker/telegraf/scripts/deluge-stats.sh"
          dest: "/etc/telegraf/scripts/deluge-stats.sh"
          name: "telegraf"
          mode: "0755"
        - src: "docker/tileserver/config.json"
          dest: "{{ docker_persistent_data_path }}/tileserver/config.json"
          name: "tileserver"
          owner: "1000"
          group: "1000"
          mode: "0644"
        - src: "docker/headway/nginx.conf.template"
          dest: "{{ docker_persistent_data_path }}/headway/nginx.conf.template"
          name: "headway-frontend"

      docker_data_dirs:
        - path: "{{ docker_persistent_data_path }}/tempo"
          owner: "10001"
          group: "10001"
        - path: "{{ docker_persistent_data_path }}/otel-collector"
          owner: "root"
          group: "root"
        - path: "{{ docker_persistent_data_path }}/loki/data"
          owner: "10001"
          group: "10001"
        - path: "{{ docker_persistent_data_path }}/promtail"
          owner: "root"
          group: "root"
        - path: "{{ docker_persistent_data_path }}/vault/unseal"
          owner: "root"
          group: "root"
          mode: "0700"
        - path: "{{ docker_persistent_data_path }}/tileserver"
          owner: "1000"
          group: "1000"
  children:
    macmini:
      vars:
        # macOS resolves *.lab.nkontur.com through mDNSResponder, which races
        # PiHole (10.3.32.2) against the 1.1.1.1 fallback. Public DNS answers
        # with the WAN IP (75.89.46.11), where nothing listens on 8200, so
        # Python's getaddrinfo hands Ansible's uri module the wrong address and
        # the Vault auth fails instantly with ECONNREFUSED (errno 61 on macOS).
        # Address Vault by IP to bypass the resolver entirely, same as
        # bootstrap.yml. vault_skip_verify is already true, so the TLS SAN
        # mismatch is a non-issue, and the JWT aud claim is unaffected.
        vault_addr: "https://{{ vault_ip }}:8200"
      hosts:
        macmini.lab.nkontur.com:
          ansible_host: 10.4.128.24
          ansible_user: root
    satellites:
      vars:
        docker_compose_file_names: 
          - "docker-compose-satellite.yml"
          - "docker-compose-observability.yml"
        docker_compose_dest_path: "/root/ansible_state"
        docker_compose_project_name: "satellite"
        docker_compose_version: '3.7'
        is_satellite: true
        use_onboard_audio: true
        docker_config:
          - src: "docker/promtail/satellite-config.yml"
            dest: "{{ docker_persistent_data_path }}/promtail/config.yml"
            name: "promtail"
          - src: "docker/telegraf/satellite-telegraf.conf"
            dest: "{{ docker_persistent_data_path }}/telegraf/telegraf.conf"
            name: "telegraf"
      hosts:
        zwave.lab.nkontur.com:
          ansible_host: 10.6.128.6
          claude_elevated_access: true
          gitlab_registry_login: false
          location: "Movie Room"
          docker_compose_file_names: 
            - "docker-compose-zwave.yml"
            - "docker-compose-observability.yml"
          docker_compose_project_name: "zwave"
          snapclient_config:
            - soundcard: "plughw:CARD=b1,DEV=0"
              name: "movie"
              # USB sound card "b1" not detected since the 2026-10-18 reboot
              # (only bcm2835 Headphones in /proc/asound/cards), so the unit
              # failed on every deploy. false = unit stopped and disabled.
              # "b1" no longer exists: the only USB cards are the two miniDSP
              # 2x4HDs. Before re-enabling, point soundcard at the stable id
              # of the unit that carries the movie-room speakers, either
              # plughw:CARD=minidsp_919619,DEV=0 or
              # plughw:CARD=minidsp_921284,DEV=0 (docs/minidsp.md). Which
              # unit that is has not been confirmed yet.
              enabled: false
        satellite-2.lab.nkontur.com:
          ansible_host: 10.6.128.11
          claude_elevated_access: true
          gitlab_registry_login: false
          docker_compose_file_names: 
            - "docker-compose-observability.yml"

