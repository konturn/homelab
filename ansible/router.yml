- hosts: router.lab.nkontur.com
  pre_tasks:
    # Installed package names, so the apt `state: present` tasks in the roles
    # can skip without a remote apt run (~2-6s each) when nothing is missing.
    # Where installed_packages is undefined (other playbooks) they run as before.
    - name: List installed packages
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${db:Status-Abbrev}\\t${Package}\\n"]
      register: _dpkg_installed
      changed_when: false
      check_mode: false
      tags: [always]
    - name: Record installed packages
      ansible.builtin.set_fact:
        installed_packages: "{{ _dpkg_installed.stdout_lines | select('match', '^.i \t') | map('regex_replace', '^...\t', '') | list }}"
      tags: [always]
  # Every role is tagged with its own name: changed-only deploys run
  # `--tags <roles>` (ci/deploy-scope, docs/DEPLOY.md). fetch-vault-secrets is
  # tagged `always`, so it runs, and fails closed, whenever any role runs.
  roles:
  - role: fetch-vault-secrets
    tags: [always]
    vars:
      fetch_ssh_ca_key: true
  - role: configure-base
    tags: [configure-base]
  # Early, and independent of Docker: the heartbeat must be in place even
  # when a later role fails (docs/DEADMAN.md).
  - role: deadman
    tags: [deadman]
  # BMC as code, in-band (docs/IPMI.md): ipmictl, desired state, metrics timer.
  - role: ipmi
    tags: [ipmi]
  - role: claude-user
    tags: [claude-user]
    vars:
      claude_docker_access: false
      claude_user_principal: claude-router
  # Before configure-homelab-services: creates the directories that
  # configuration.yaml includes (automations/, scripts/, scenes/).
  - role: ha-config-sync
    tags: [ha-config-sync]
  - role: configure-router-network
    tags: [configure-router-network]
  - role: configure-tailscale
    tags: [configure-tailscale]
    vars:
      # Optional in Vault; used only when the node is logged out.
      tailscale_auth_key: "{{ vault_tailscale_auth_key | trim }}"
      tailscale_advertised_routes: "10.2.0.0/16,10.3.0.0/16,10.4.0.0/16,10.6.0.0/16"
  - role: configure-docker
    tags: [configure-docker]
    vars:
      nvidia_container_runtime: true
  - role: configure-homelab-services
    tags: [configure-homelab-services]
  - role: configure-wordpress  # after compose is up; see docker/wordpress/README.md
    tags: [configure-wordpress]
  - role: configure-notifications
    tags: [configure-notifications]
  - role: configure-excel-vm
    tags: [excel-vm, configure-excel-vm]
  - role: zwave-backup
    tags: [zwave-backup]
  - role: restic
    tags: [restic]
    vars:
      restic_ssh_enabled: false
      restic_repository: "s3:s3.us-east-005.backblazeb2.com/nkontur-homelab"
      restic_aws_access_key_id: "{{ vault_backblaze_access_key_id | trim }}"
      restic_aws_secret_access_key: "{{ vault_backblaze_secret_access_key | trim }}"
      restic_check: true
      restic_forget_keep_within: 90d
      # Deletion resistance (docs/backups.md): the Vault key at
      # backup/backblaze must be an append-only B2 key (no deleteFiles), and
      # the bucket lifecycle keeps hidden versions >= the minimum below, so
      # this host can hide history but never destroy it.
      restic_b2_policy_check: true
      restic_b2_bucket: nkontur-homelab
      restic_b2_min_hidden_retention_days: 35
      # Weekly instead of after every backup: each pruned pack stays billed
      # for the retention window, so less frequent repacking costs less.
      restic_prune_timer_on_calendar: "Sat *-*-* 12:00:00"
      restic_default_folders: []
      restic_folders:
        - {path: "/mpool/nextcloud"}
        - {path: "/persistent_data/docker/volumes",
           exclude: "/persistent_data/docker/volumes/docker_nextcloud"
          }
        - {path: "/persistent_data/application"}
        - {path: "/mpool/plex/config"}
        - {path: "/mpool/plex/Photos"}
        - {path: "/mpool/plex/Family"}
        - {path: "/var/log"}
        - {path: "/root"}
        # Staging copy of the Mac mini, pulled just before this backup by
        # restic-macmini-pull.service (role macmini-backup). No global
        # excludes: it comes from one APFS snapshot, so its SQLite *-wal files
        # match their databases and are needed to restore them.
        - {path: "/mpool/backups/macmini", tag: macmini, global_excludes: false}
      restic_backup_pre_units:
        - restic-macmini-pull.service
      restic_password: "{{ vault_restic_password | trim }}"
      # Logical dumps before every backup (docs/backups.md, "Logical database
      # dumps"), next to the raw data files restic already copies. Credentials
      # stay inside the database containers; nothing here is secret.
      restic_db_dumps_dir: /persistent_data/application/db-dumps
      restic_db_dumps:
        - {name: gitlab, type: postgres-omnibus, container: gitlab, target: gitlabhq_production}
        - {name: gitlab-registry, type: postgres-omnibus, container: gitlab, target: registry}
        - {name: nextcloud, type: mysql, container: nextcloud_database, target: nextcloud}
        # Compose profile "wordpress": normally stopped, and the volume of a
        # stopped server is already consistent, so a stopped one is skipped.
        - {name: wordpress, type: mysql, container: wordpress_db, target: wordpress, required: false}
        - {name: vaultwarden, type: sqlite, target: /persistent_data/application/bitwarden/data/db.sqlite3}
        - {name: paperless, type: sqlite, target: /persistent_data/application/paperless/db.sqlite3}
        - {name: grafana, type: sqlite, target: /persistent_data/docker/volumes/docker_grafana-storage/_data/grafana.db}
        - {name: navidrome, type: sqlite, target: /persistent_data/application/navidrome/navidrome.db}
        - {name: ombi, type: sqlite, target: /persistent_data/docker/volumes/docker_ombi/_data/Ombi.db}
        - {name: ombi-external, type: sqlite, target: /persistent_data/docker/volumes/docker_ombi/_data/OmbiExternal.db}
        # ~35G of TSM data, ~25 min and 15G of output per run: weekly, on
        # its own timer outside the backup window.
        - {name: influxdb, type: influxdb, container: influxdb, target: all, group: weekly}
  # Offsite backup of Frigate into the same restic repository, own tags and
  # forget policy (docs/frigate.md, "Backup"). After restic: needs its
  # /root/.restic_env and restic-notify-failure@.service.
  - role: frigate-backup
    tags: [frigate-backup]
  # Pull of the Mac mini into /mpool/backups/macmini for the nightly restic
  # run (docs/backups.md, "Mac mini"). After restic: uses its
  # restic-notify-failure@.service.
  - role: macmini-backup
    tags: [macmini-backup]
  # Local-model shadow of the imessage-check OpenClaw job (ansible/roles/llm-shadow/README.md).
  # Records decisions only; it has no tool with a side effect.
  - role: llm-shadow
    tags: [llm-shadow]
  # Last: pulls can take long on a fresh host, and a failed pull or create
  # must not hold up the other roles.
  - role: configure-ollama-models
    tags: [configure-ollama-models]
