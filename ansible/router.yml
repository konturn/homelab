- hosts: router.lab.nkontur.com
  pre_tasks:
    # Installed package names, so the apt `state: present` tasks in the roles
    # can skip without a remote apt run (~2-6s each) when nothing is missing.
    # Where installed_packages is undefined (other playbooks) they run as before.
    - name: List installed packages
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${db:Status-Abbrev}\\t${Package}\\n"]
      register: _dpkg_installed
      changed_when: false
      check_mode: false
      tags: [always]
    - name: Record installed packages
      ansible.builtin.set_fact:
        installed_packages: "{{ _dpkg_installed.stdout_lines | select('match', '^.i \t') | map('regex_replace', '^...\t', '') | list }}"
      tags: [always]
  roles:
  - role: fetch-vault-secrets
    vars:
      fetch_ssh_ca_key: true
  - configure-base
  - role: claude-user
    vars:
      claude_docker_access: false
      claude_user_principal: claude-router
  - configure-router-network
  - role: configure-tailscale
    vars:
      tailscale_auth_key: "{{ vault_tailscale_auth_key | trim }}"
      tailscale_advertised_routes: "10.2.0.0/16,10.3.0.0/16,10.4.0.0/16,10.6.0.0/16"
  - role: configure-docker
    vars:
      nvidia_container_runtime: true
  - configure-homelab-services
  - configure-wordpress  # after compose is up; see docker/wordpress/README.md
  - configure-notifications
  - role: configure-excel-vm
    tags: [excel-vm]
  - role: restic
    vars:
      restic_ssh_enabled: false
      restic_repository: "s3:s3.us-east-005.backblazeb2.com/nkontur-homelab"
      restic_aws_access_key_id: "{{ vault_backblaze_access_key_id | trim }}"
      restic_aws_secret_access_key: "{{ vault_backblaze_secret_access_key | trim }}"
      restic_check: true
      restic_forget_keep_within: 90d
      restic_default_folders: []
      restic_folders:
        - {path: "/mpool/nextcloud"}
        - {path: "/persistent_data/docker/volumes",
           exclude: "/persistent_data/docker/volumes/docker_nextcloud"
          }
        - {path: "/persistent_data/application"}
        - {path: "/mpool/plex/config"}
        - {path: "/mpool/plex/Photos"}
        - {path: "/mpool/plex/Family"}
        - {path: "/var/log"}
        - {path: "/root"}
      restic_password: "{{ vault_restic_password | trim }}"
