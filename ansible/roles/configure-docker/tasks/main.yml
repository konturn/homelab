- name: Look up docker group GID dynamically
  ansible.builtin.getent:
    database: group
    key: docker
  register: docker_group_info

- name: Set docker_gid fact
  ansible.builtin.set_fact:
    docker_gid: "{{ getent_group.docker[1] }}"

# Reports "changed" on every run, and that is a real change: the password is
# the job's CI_REGISTRY_PASSWORD, a new token for each job, so the stored
# credential in /root/.docker/config.json really is rewritten each time.
- name: Log in to GitLab container registry
  docker_login:
    username: "{{ lookup('env', 'CI_REGISTRY_USER') }}"
    password: "{{ lookup('env', 'CI_REGISTRY_PASSWORD') }}"
    registry_url: "https://gitlab-registry.lab.nkontur.com:443"
  when: gitlab_registry_login | default(true)

# 6ec7457..292f2ca put the transcript scrub cron in this role, which also runs
# on the satellites. dfd26c8 moved it to configure-homelab-services (router
# only) but never removed the satellite entries, so satellite-2 and zwave have
# run it every 10 minutes since February. The x64 gitleaks binary can't execute
# there (exit 126) and there are no transcripts to scrub. ansible.builtin.cron
# keys on name, and this is the name both of those commits used.
- name: Remove orphaned transcript scrub cron from satellites
  ansible.builtin.cron:
    name: "Scrub credentials from moltbot transcripts"
    state: absent
  when: is_satellite | default(false)

# Weekly `docker image prune --all` for hosts that set
# docker_image_prune_on_calendar (defaults/main.yml, #118). Only images that
# no container (running or stopped) uses are removed.
- name: Docker image prune units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/docker-image-prune.{{ item.ext }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - ext: service
      content: |
        # {{ ansible_managed }}
        [Unit]
        Description=Remove Docker images that no container uses (configure-docker)
        Requires=docker.service
        After=docker.service

        [Service]
        Type=oneshot
        ExecStart=/usr/bin/docker image prune --all --force --filter until={{ docker_image_prune_until }}
    - ext: timer
      content: |
        # {{ ansible_managed }}
        [Unit]
        Description=Weekly removal of unused Docker images (configure-docker)

        [Timer]
        OnCalendar={{ docker_image_prune_on_calendar }}
        RandomizedDelaySec=30min
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.ext }}"
  register: _docker_prune_units
  when: docker_image_prune_on_calendar | length > 0

- name: Enable the Docker image prune timer
  ansible.builtin.systemd:
    name: docker-image-prune.timer
    enabled: true
    state: started
    daemon_reload: "{{ _docker_prune_units is changed }}"
  when: docker_image_prune_on_calendar | length > 0
