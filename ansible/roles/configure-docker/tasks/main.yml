- name: Set timezone
  community.general.timezone:
    name: America/New_York

- name: Install dependencies
  apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
      - python3-pip
      - git
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Install git
  apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - git
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  check_mode: no

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  check_mode: no

- name: Add docker repository to apt
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present

- name: Install docker
  apt:
    name: "{{ _apt_packages }}"
    # present + hold, not latest: a docker-ce/containerd upgrade restarts
    # dockerd and with it every container on the host (2026-10-18 deploy).
    # To upgrade deliberately:
    #   apt-mark unhold docker-ce docker-ce-cli containerd.io
    #   apt install --only-upgrade docker-ce docker-ce-cli containerd.io
    #   apt-mark hold docker-ce docker-ce-cli containerd.io
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Hold docker engine packages (upgrades are a manual step)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io

- name: Download NVIDIA Container Toolkit GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: '0644'
  when: nvidia_container_runtime
  check_mode: no

- name: Add NVIDIA Container Toolkit repository to APT sources
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc] https://nvidia.github.io/libnvidia-container/stable/deb/amd64 /"
    state: present
  when: nvidia_container_runtime

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: yes
  when:
    - nvidia_container_runtime
    # only needed when the install below has something to do
    - "['nvidia-container-toolkit'] | difference(installed_packages | default([])) | length > 0"

- name: Install NVIDIA Container Toolkit
  apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - nvidia-container-toolkit
  when:
    - nvidia_container_runtime
    - _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Make sure docker is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

### Configure docker daemon on host
- name: Docker daemon config file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/docker/daemon.json' }}"
    dest: '/etc/docker/daemon.json'
    owner: root
    group: root
    mode: 0600
  register: docker_conf

- name: Restart Docker to pick up daemon config changes
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: docker_conf.changed and not ansible_check_mode

# Bridge networks for the GitLab runners' job containers
# (base/gitlab-runner/config.toml): gitlab-ci for the unprotected runner,
# gitlab-ci-protected for router-protected. Docker's iptables management is
# off, so NAT and the egress allowlists for br-ci / br-ci-prot live in
# networking/iptables/rules.v4 (applied earlier in the play by
# configure-router-network).
- name: GitLab CI job networks
  ansible.builtin.shell: |
    set -e
    if docker network inspect {{ item.name }} >/dev/null 2>&1; then
      exit 0
    fi
    docker network create --driver bridge --subnet {{ item.subnet }} \
      -o com.docker.network.bridge.name={{ item.bridge }} {{ item.name }} >/dev/null
    echo created
  loop:
    - { name: gitlab-ci, subnet: 172.28.0.0/24, bridge: br-ci }
    - { name: gitlab-ci-protected, subnet: 172.28.1.0/24, bridge: br-ci-prot }
  loop_control:
    label: "{{ item.name }}"
  register: gitlab_ci_network
  changed_when: "'created' in gitlab_ci_network.stdout"

#- name: ensure required pip-packages are installed on host
#  pip:
