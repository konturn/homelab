# Empty values for an OPTIONAL Vault path that does not exist (404).
# main.yml fails before this point if a required path is missing, so this
# only ever runs for entries marked `optional: true`. Consumers must check
# `| length > 0` before rendering these into a file.

- name: "Empty values for missing optional path {{ _vault_missing.item.path }}"
  ansible.builtin.set_fact:
    "{{ item.key }}": ""
  loop: "{{ _vault_missing.item.fields | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
