- name: Resolve Gmail app password
  ansible.builtin.set_fact:
    _msmtp_password: >-
      {{ vault_gmail_app_password | trim }}
  no_log: true

# fetch-vault-secrets fails the play when this secret is missing or empty, so
# this is a second guard. If it were ever empty, the template would still
# render a syntactically valid msmtprc with a blank password.
# msmtp then fails every send with "authentication method PLAIN needs a
# password", which is how restic failure notifications were lost between
# 2026-08-16 and 2026-08-30. Leaving the previous working /etc/msmtprc in
# place is strictly better than replacing it with one that cannot authenticate.
- name: Warn when Gmail app password is unavailable
  ansible.builtin.debug:
    msg: >-
      WARNING: Gmail app password resolved empty from Vault. Leaving the
      existing /etc/msmtprc untouched so mail keeps working. Outbound mail
      config is now STALE — re-run this deploy once Vault is reachable.
  when: _msmtp_password | length == 0

# Deployed BEFORE msmtprc on purpose: msmtprc is the file that names this
# path, so the reverse order leaves a window where msmtp is configured to read
# an aliases file that does not exist yet.
#
# The path is deliberately /etc/msmtp-aliases and NOT /etc/aliases.
# configure-base installs mailutils, bsd-mailx and msmtp-mta on this host, so
# /etc/aliases is shared ground with other mail tooling that expects sendmail
# aliases format — and msmtp's `default:` catch-all is msmtp-specific syntax
# that is not valid there. A private path removes the collision entirely.
#
# Left ungated by _msmtp_password: the alias map carries no secret, and an
# aliases file with no msmtprc referencing it is inert.
- name: Deploy msmtp alias map
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/msmtp/aliases' }}"
    dest: /etc/msmtp-aliases
    owner: root
    group: root
    mode: '0644'

- name: Deploy msmtp configuration
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/msmtp/msmtprc' }}"
    dest: /etc/msmtprc
    owner: root
    group: root
    mode: '0600'
  when: _msmtp_password | length > 0

- name: Set msmtp as default MTA
  ansible.builtin.file:
    src: /usr/bin/msmtp
    dest: /usr/sbin/sendmail
    state: link
    force: yes

# borgmatic cron removed — backups use restic now
