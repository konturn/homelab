# =============================================================================
# Role: claude-user
# =============================================================================
# Creates a restricted 'claude' user for AI agent SSH access via Vault-signed
# certificates. The user runs rbash with a curated set of read-only commands.
# SSH trust is established via Vault's SSH CA public key.
# =============================================================================

- name: Create claude group
  group:
    name: "{{ claude_user_group }}"
    state: present

- name: Create claude user with restricted shell
  user:
    name: "{{ claude_user_name }}"
    group: "{{ claude_user_group }}"
    shell: /bin/rbash
    home: "/home/{{ claude_user_name }}"
    create_home: yes
    comment: "Restricted read-only user for AI agent SSH access"

# The restriction (PATH, the command set) lives in the home directory, so the
# home directory, bin/ and the dotfiles belong to root: the restricted user can
# read them but not rewrite, replace or add to them. Only the history file is
# the user's.
- name: Set claude home directory permissions
  file:
    path: "/home/{{ claude_user_name }}"
    mode: '0750'
    owner: root
    group: "{{ claude_user_group }}"

- name: Create restricted PATH bin directory
  file:
    path: "/home/{{ claude_user_name }}/bin"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Keep a user-writable history file
  file:
    path: "/home/{{ claude_user_name }}/.bash_history"
    state: touch
    mode: '0600'
    owner: "{{ claude_user_name }}"
    group: "{{ claude_user_group }}"
    modification_time: preserve
    access_time: preserve

# One remote call instead of a stat and a file task per command: the two
# 28-item loops took ~20s on the router and ~40s on each Pi. Not every host
# ships every binary (satellite-2 has no `file` or `dig`), so only commands
# that exist are linked, as <bin>/<basename>. A dest that exists and is not a
# symlink fails the task (as file: state=link would without force). In check
# mode nothing is written; the task only reports what it would link.
- name: Symlink allowed commands into restricted PATH
  ansible.builtin.shell: |
    set -eu
    bin=/home/{{ claude_user_name }}/bin
    for src in {{ claude_allowed_command_paths | map('quote') | join(' ') }}; do
      [ -e "$src" ] || continue
      dest="$bin/$(basename "$src")"
      [ "$(readlink "$dest" 2>/dev/null || true)" = "$src" ] && continue
      if [ -e "$dest" ] && [ ! -L "$dest" ]; then
        echo "$dest exists and is not a symlink" >&2
        exit 1
      fi
      {{ ':' if ansible_check_mode else '' }} ln -sfn "$src" "$dest"
      echo "link $dest -> $src"
    done
  vars:
    claude_allowed_command_paths:
      - /usr/bin/cat
      - /usr/bin/ls
      - /usr/bin/head
      - /usr/bin/tail
      - /usr/bin/grep
      - /usr/bin/df
      - /usr/bin/du
      - /usr/bin/ps
      - /usr/bin/uptime
      - /usr/bin/free
      - /usr/bin/id
      - /usr/bin/whoami
      - /usr/bin/hostname
      - /usr/bin/date
      - /usr/bin/wc
      - /usr/bin/uniq
      - /usr/bin/stat
      - /usr/bin/file
      - /usr/bin/ip
      - /usr/bin/ss
      - /usr/bin/dig
      - /usr/bin/ping
      - /usr/bin/traceroute
  register: claude_allowed_links
  changed_when: claude_allowed_links.stdout | length > 0
  check_mode: false

# These commands can start other programs or a pager (find -exec, sort
# --compress-program, systemctl -H, the systemd pager), which rbash does not
# check. They are installed as root-owned wrappers that refuse those options
# instead of as symlinks; less is not offered at all.
- name: Remove earlier symlinks that the wrappers replace
  ansible.builtin.shell: |
    set -eu
    for n in find journalctl systemctl sort less; do
      f=/home/{{ claude_user_name }}/bin/$n
      if [ -L "$f" ]; then
        {{ ':' if ansible_check_mode else '' }} rm -f "$f"
        echo "removed $f"
      fi
    done
  register: claude_old_links
  changed_when: claude_old_links.stdout | length > 0
  check_mode: false

- name: Install wrapped commands
  copy:
    dest: "/home/{{ claude_user_name }}/bin/{{ item.name }}"
    owner: root
    group: root
    mode: '0755'
    content: "{{ item.content }}"
  loop:
    - name: find
      content: |
        #!/bin/sh
        # find without the actions that run programs, write files or delete.
        for a in "$@"; do
          case "$a" in
            -exec|-execdir|-ok|-okdir|-delete|-fprint|-fprint0|-fprintf|-fls)
              echo "find: $a is not allowed here" >&2; exit 2 ;;
          esac
        done
        exec /usr/bin/find "$@"
    - name: sort
      content: |
        #!/bin/sh
        # sort without --compress-program (getopt accepts any prefix down to --co).
        for a in "$@"; do
          case "$a" in
            --co*) echo "sort: $a is not allowed here" >&2; exit 2 ;;
          esac
        done
        exec /usr/bin/sort "$@"
    - name: journalctl
      content: |
        #!/bin/sh
        # Never page: the pager is a shell escape.
        exec /usr/bin/env -u SYSTEMD_PAGER -u PAGER -u SYSTEMD_LESS SYSTEMD_PAGERSECURE=1 \
          /usr/bin/journalctl --no-pager "$@"
    - name: systemctl
      content: |
        #!/bin/sh
        # Read-only verbs only, verb first; never page; no remote host or
        # machine (-H runs ssh, -M enters a container).
        case "${1:-}" in
          status|show|cat|is-active|is-enabled|is-failed|list-units|list-unit-files|list-timers|list-sockets|list-dependencies) ;;
          *) echo "systemctl: only status, show, cat, is-active, is-enabled, is-failed and list-* (verb first)" >&2; exit 2 ;;
        esac
        for a in "$@"; do
          case "$a" in
            --ho*|--m*|-H*|-M*|-[!-]*H*|-[!-]*M*|--user|--global|--root*|--image*)
              echo "systemctl: $a is not allowed here" >&2; exit 2 ;;
          esac
        done
        exec /usr/bin/env -u SYSTEMD_PAGER -u PAGER -u SYSTEMD_LESS -u SYSTEMD_EDITOR -u EDITOR -u VISUAL \
          SYSTEMD_PAGERSECURE=1 /usr/bin/systemctl --no-pager "$@"

- name: Configure restricted .bashrc
  copy:
    dest: "/home/{{ claude_user_name }}/.bashrc"
    owner: root
    group: root
    mode: '0644'
    content: |
      # Restricted shell configuration
      export PATH=/home/{{ claude_user_name }}/bin
      export HISTFILE=/home/{{ claude_user_name }}/.bash_history
      export HISTSIZE=1000
      readonly PATH
      # No cd allowed in rbash by default
      echo "Restricted shell. Commands: cat ls head tail grep find sort df du ps journalctl systemctl ip ss dig"

- name: Create .profile
  copy:
    dest: "/home/{{ claude_user_name }}/.profile"
    owner: root
    group: root
    mode: '0644'
    content: |
      if [ -f ~/.bashrc ]; then
        . ~/.bashrc
      fi

- name: Deny cron access for claude user
  lineinfile:
    path: /etc/cron.deny
    line: "{{ claude_user_name }}"
    create: yes

- name: Deny at access for claude user
  lineinfile:
    path: /etc/at.deny
    line: "{{ claude_user_name }}"
    create: yes

- name: Add claude user to docker group
  user:
    name: "{{ claude_user_name }}"
    groups: docker
    append: yes
  when: claude_docker_access | default(false)

- name: Ensure claude user is NOT in docker group
  user:
    name: "{{ claude_user_name }}"
    groups: []
    append: no
  when: not (claude_docker_access | default(false))

- name: Ensure sensitive directories are not world-readable
  file:
    path: "{{ item }}"
    mode: '0700'
  loop:
    - /root
  ignore_errors: yes

- name: Ensure sensitive files are not world-readable
  file:
    path: "{{ item }}"
    mode: '0600'
  loop:
    - /etc/shadow
    - /etc/gshadow
  ignore_errors: yes

- name: Disable root login with password
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin prohibit-password"
  notify: restart sshd

- name: Disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: restart sshd

- name: Validate SSH CA key is not empty
  ansible.builtin.assert:
    that:
      - vault_ssh_ca_public_key | length > 0
    fail_msg: "vault_ssh_ca_public_key is empty — refusing to write empty CA file"
  when: fetch_ssh_ca_key | default(false) | bool

- name: Configure SSH to trust Vault CA
  copy:
    dest: /etc/ssh/trusted-user-ca-keys.pem
    content: "{{ vault_ssh_ca_public_key }}"
    mode: '0644'
  when: vault_ssh_ca_public_key | length > 0
  notify: restart sshd

- name: Add TrustedUserCAKeys to sshd_config
  lineinfile:
    path: /etc/ssh/sshd_config
    line: "TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem"
    regexp: "^TrustedUserCAKeys"
  notify: restart sshd

- name: Create AuthorizedPrincipals directory
  file:
    path: /etc/ssh/auth_principals
    state: directory
    mode: '0755'

- name: Configure AuthorizedPrincipals for claude user
  copy:
    dest: "/etc/ssh/auth_principals/{{ claude_user_name }}"
    content: "{{ claude_user_principal }}\n"
    mode: '0644'
  notify: restart sshd

- name: Add AuthorizedPrincipalsFile to sshd_config
  lineinfile:
    path: /etc/ssh/sshd_config
    line: "AuthorizedPrincipalsFile /etc/ssh/auth_principals/%u"
    regexp: "^AuthorizedPrincipalsFile"
  notify: restart sshd

# =============================================================================
# Elevated user (claude-elevated) — full shell with sudo, gated by JIT T2
# =============================================================================

- name: Create claude-elevated group
  group:
    name: "{{ claude_elevated_user_group }}"
    state: present
  when: claude_elevated_access | default(false)

- name: Create claude-elevated user with full shell
  user:
    name: "{{ claude_elevated_user_name }}"
    group: "{{ claude_elevated_user_group }}"
    shell: /bin/bash
    home: "/home/{{ claude_elevated_user_name }}"
    create_home: yes
    comment: "Elevated AI agent SSH access with sudo"
  when: claude_elevated_access | default(false)

- name: Grant claude-elevated passwordless sudo
  copy:
    dest: "/etc/sudoers.d/{{ claude_elevated_user_name }}"
    content: "{{ claude_elevated_user_name }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: '0440'
    validate: 'visudo -cf %s'
  when: claude_elevated_access | default(false)

- name: Configure AuthorizedPrincipals for claude-elevated user
  copy:
    dest: "/etc/ssh/auth_principals/{{ claude_elevated_user_name }}"
    content: "{{ claude_elevated_user_principal }}\n"
    mode: '0644'
  notify: restart sshd
  when: claude_elevated_access | default(false)
