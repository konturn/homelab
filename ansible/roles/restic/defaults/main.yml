---
restic_install: false
restic_version: 0.14.0
restic_path: /usr/local/bin/restic
restic_user: root
restic_user_home: /root

restic_repository_name: restic
restic_default_folders:
  - { path: "/etc" }
  - { path: "/var/log" }
  - { path: "/root", exclude: "--exclude .cache" }
# Paths that must NEVER be included in offsite backups.
# Vault unseal keys on disk + offsite backup = defeat the purpose of seal/unseal.
restic_global_excludes:
  - "/persistent_data/application/vault/unseal"
  # libvirt VMs (configure-excel-vm): the excel-vm disk holds work data and
  # is ~100G; install ISOs are re-downloadable. /persistent_data/vms is outside
  # every restic folder today -- these patterns keep it out even if a folder
  # list or the VM path changes later.
  - "/persistent_data/vms"
  - "*.qcow2"
  - "Win11_*.iso"
  - "virtio-win-*.iso"
  - "excel-vm-unattend.iso"
  # SQLite write-ahead-log sidecars. They are created and removed constantly
  # under live services (radarr, sonarr, homeassistant, ...), so restic scans
  # them and then finds them gone -> "could not be read" -> exit 3. They are
  # also worthless in a file-level backup: a *-wal captured a moment after its
  # .db does not match it, and SQLite would rather see no WAL (and read the
  # database as of the last checkpoint) than a skewed one.
  - "*.db-shm"
  - "*.db-wal"
  - "*.db-journal"
  - "*.sqlite-shm"
  - "*.sqlite-wal"
  # Tempo's live-store and WAL hold in-flight trace blocks that the
  # ingester writes and deletes within seconds, so restic lists a file and
  # then finds it gone (exit 3, restic-backup-incomplete). Neither is useful
  # to restore: completed blocks are flushed to traces/, which stays backed up.
  - "/persistent_data/docker/volumes/docker_tempo-storage/_data/live-store"
  - "/persistent_data/docker/volumes/docker_tempo-storage/_data/wal"

# Each entry: path; optional exclude (one restic --exclude value); optional
# tag (adds --tag to that folder's snapshots); optional global_excludes: false
# to skip restic_global_excludes for a folder that is a static staging copy
# (e.g. the Mac mini pull, whose SQLite *-wal files come from the same APFS
# snapshot as their databases and are needed to restore them).
restic_folders: []
# Units restic-backup.service pulls in and waits for before backing up
# (Wants= + After=), e.g. a job that stages data into a restic folder.
restic_backup_pre_units: []
restic_databases: []
restic_dump_compression_enabled: false
# Logical database dumps, written to restic_db_dumps_dir by
# /usr/local/sbin/restic-db-dumps (docs/backups.md, "Logical database dumps").
# restic_db_dumps_dir must sit inside one of the restic_folders. Each entry:
#   name       file name of the dump (<name>.pgdump.zst, <name>.sql.zst, <name>/)
#   type       postgres-omnibus | mysql | sqlite | influxdb
#   container  running container the dump goes through (not used by sqlite)
#   target     database name; for sqlite the database file on the host
#   group      nightly (default): before every backup; weekly: on
#              restic_db_dumps_weekly_on_calendar, for databases too large to
#              dump every night
#   required   false: a stopped container is skipped, not a failure (default true)
# restic_databases above streams a dump straight into its own snapshot instead;
# it is kept for compatibility and unused on the router.
restic_db_dumps: []
restic_db_dumps_dir: /var/backups/db-dumps
restic_db_dumps_timeout_sec: 3600
restic_db_dumps_weekly_on_calendar: "Sat *-*-* 21:00:00"
restic_db_dumps_units:
  - {unit: restic-db-dumps, group: nightly, nice: 10, io_class: best-effort, timeout: 2h}
  - {unit: restic-db-dumps-weekly, group: weekly, nice: 19, io_class: idle, timeout: 4h}
restic_forget: true
restic_forget_keep_within: 30d
restic_prune: true
# Empty: prune runs as ExecStartPost of every backup (the original behaviour).
# A systemd OnCalendar expression: prune moves to its own restic-prune.service
# and restic-prune.timer. On a bucket that keeps hidden versions (see
# restic_b2_policy_check below) every pruned pack is still billed until the
# lifecycle rule expires it, so pruning less often means less repacking churn.
restic_prune_timer_on_calendar: ""
# prune takes an exclusive lock; wait for an overrunning backup or check.
restic_prune_retry_lock: "2h"
restic_check: true
restic_check_timer_on_calendar: "Sun *-*-* 09:00:00"
restic_check_read_data_subset: "5%"
# How long `restic check` waits for the repository lock before giving up.
# The daily backup holds the lock for hours, so with the restic default of
# 0s an overlapping check fails immediately instead of waiting its turn.
restic_check_retry_lock: "2h"
# How long the nightly backup's own lock-taking steps (the pre-backup check,
# each backup, forget) wait for the repository lock. frigate-backup-events
# runs at :05 and :35 against the same repository, and since the Mac mini pull
# (restic_backup_pre_units) pushes the backup start to about 03:05, the
# pre-backup check can land on its lock; with restic's default of 0s it then
# fails the whole unit (2026-11-10). An events run holds the lock for ~2 min.
restic_backup_retry_lock: "30m"

# Deletion resistance on Backblaze B2 (docs/backups.md, "Deletion resistance").
# The design relies on two B2 properties: a key without deleteFiles can only
# *hide* a file (restic's forget/prune "deletes" become hide markers), and the
# bucket lifecycle rule keeps hidden or superseded versions for
# daysFromHidingToDeleting days. When enabled, restic-b2-policy-check runs
# before every backup and logs "restic-b2-policy: OK" only if the key restic
# uses is bucket-scoped, holds none of the capabilities below, the lifecycle
# rules keep hidden versions at least restic_b2_min_hidden_retention_days, and
# a live probe confirms B2 refuses to delete a specific file version.
restic_b2_policy_check: false
restic_b2_bucket: ""
restic_b2_min_hidden_retention_days: 30
restic_b2_probe_object: ".restic-b2-policy-probe"
restic_b2_forbidden_capabilities:
  - deleteFiles
  - writeBuckets
  - deleteBuckets
  - writeKeys
  - deleteKeys
  - bypassGovernance
  - writeBucketRetentions
  - writeFileRetentions
  - writeFileLegalHolds
  - writeBucketReplications

restic_ssh_enabled: true
restic_ssh_host: backup
restic_ssh_port: 22
restic_ssh_private_key_path: "/root/.ssh/backup"

restic_systemd_timer_on_calender: "*-*-* 03:00:00"
restic_systemd_timer_randomized_delay_sec: 0

restic_arch_map:
  i386: '386'
  x86_64: 'amd64'
  aarch64: 'arm64'
