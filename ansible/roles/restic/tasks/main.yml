---
- name: Check if restic is installed
  ansible.builtin.stat:
    path: "{{ restic_path }}"
  register: restic_binary

- name: Include install.yml if restic is not installed or restic_install is true
  ansible.builtin.include_tasks: install.yml
  when: not restic_binary.stat.exists or restic_install

- name: Overwrite SSH config for backup server
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ restic_user_home }}/.ssh/config"
    owner: root
    group: root
    mode: "0600"
  when: restic_ssh_enabled

- name: Add SSH private key
  ansible.builtin.template:
    src: ssh_private_key.j2
    dest: "{{ restic_ssh_private_key_path }}"
    mode: "0600"
  when: restic_ssh_private_key is defined and restic_ssh_enabled

- name: Add restic_env in home folder
  ansible.builtin.template:
    src: restic_env.j2
    dest: "{{ restic_user_home }}/.restic_env"
    owner: root
    group: root
    mode: "0600"

- name: Install B2 deletion-resistance check
  ansible.builtin.template:
    src: restic-b2-policy-check.j2
    dest: /usr/local/sbin/restic-b2-policy-check
    owner: root
    group: root
    mode: "0750"
  when: restic_b2_policy_check

- name: Add systemd service for restic
  ansible.builtin.template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    mode: "0644"
  vars:
    restic_folders_combined: "{{ restic_default_folders + restic_folders }}"
  notify: Reload systemd

- name: Add systemd timer for restic
  ansible.builtin.template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    mode: "0644"
  notify: Reload systemd

- name: Add failure notification service
  ansible.builtin.template:
    src: restic-notify-failure@.service.j2
    dest: /etc/systemd/system/restic-notify-failure@.service
    mode: "0644"
  notify: Reload systemd

- name: Add systemd service for restic check
  ansible.builtin.template:
    src: restic-check.service.j2
    dest: /etc/systemd/system/restic-check.service
    mode: "0644"
  when: restic_check
  notify: Reload systemd

- name: Add systemd timer for restic check
  ansible.builtin.template:
    src: restic-check.timer.j2
    dest: /etc/systemd/system/restic-check.timer
    mode: "0644"
  when: restic_check
  notify: Reload systemd

- name: Add systemd service for restic prune
  ansible.builtin.template:
    src: restic-prune.service.j2
    dest: /etc/systemd/system/restic-prune.service
    mode: "0644"
  when: restic_prune and restic_prune_timer_on_calendar | length > 0
  notify: Reload systemd

- name: Add systemd timer for restic prune
  ansible.builtin.template:
    src: restic-prune.timer.j2
    dest: /etc/systemd/system/restic-prune.timer
    mode: "0644"
  when: restic_prune and restic_prune_timer_on_calendar | length > 0
  notify: Reload systemd

- name: Enable and start restic timer
  ansible.builtin.systemd:
    name: restic-backup.timer
    enabled: true
    state: started

- name: Enable and start restic check timer
  ansible.builtin.systemd:
    name: restic-check.timer
    enabled: true
    state: started
  when: restic_check

# Flush the daemon-reload before enabling a timer that may be brand new.
- name: Flush handlers before enabling the prune timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start restic prune timer
  ansible.builtin.systemd:
    name: restic-prune.timer
    enabled: true
    state: started
  when: restic_prune and restic_prune_timer_on_calendar | length > 0
