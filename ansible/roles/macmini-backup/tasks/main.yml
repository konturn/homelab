---
# Offsite backup of the Mac mini (docs/backups.md, "Mac mini"). Needs the
# restic role's restic-notify-failure@.service; restic-backup.service starts
# restic-macmini-pull.service through restic_backup_pre_units (router.yml).
# No timer: it only runs as part of the nightly backup, or by hand.
# The staging directory is created by the script, after it has checked that
# the pool is mounted, so it can never land on the root filesystem.
- name: Install the Mac mini pull script
  ansible.builtin.template:
    src: restic-macmini-pull.j2
    dest: /usr/local/sbin/restic-macmini-pull
    owner: root
    group: root
    mode: "0750"

- name: Install the Mac mini pull unit
  ansible.builtin.template:
    src: restic-macmini-pull.service.j2
    dest: /etc/systemd/system/restic-macmini-pull.service
    mode: "0644"
  register: _macmini_backup_unit

- name: Reload systemd for the Mac mini pull unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: _macmini_backup_unit is changed
