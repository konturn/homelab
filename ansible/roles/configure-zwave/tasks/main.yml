### Install docker daemon
- name: Install dependencies
  apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Set minidsp package architecture
  set_fact:
    minidsp_arch: >-
      {%- if ansible_architecture == 'x86_64' -%}amd64
      {%- elif ansible_architecture == 'aarch64' -%}arm64
      {%- elif ansible_architecture in ['armv7l', 'armv6l'] -%}armhf
      {%- else -%}{{ ansible_architecture }}
      {%- endif -%}

- name: Install minidsp-rs package
  ansible.builtin.apt:
    deb: "https://github.com/mrene/minidsp-rs/releases/download/v0.1.7/minidsp_0.1.7_{{ minidsp_arch }}.deb"
  register: minidsp_package
  retries: 3
  delay: 5
  until: minidsp_package is success

- name: Make sure minidsp is started and enabled
  service:
    name: minidsp
    state: started
    enabled: yes
  # Skip in check mode if package was just installed (service won't exist yet)
  when: not (ansible_check_mode and minidsp_package.changed)

- name: Template out minidsp file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/minidsp/config.toml' }}"
    dest: "/etc/minidsp/config.toml"
    owner: root
    group: root
    mode: '0644'
  register: minidsp

- name: Restart minidsp if config change
  service:
    name: minidsp
    state: restarted
  when: minidsp.changed

# Stable ALSA card ids (minidsp_<serial>) for the two miniDSP 2x4HDs, keyed by
# USB port (minidsp_units in the inventory; docs/minidsp.md). Only the rules
# are reloaded here; the new ids take effect at the next boot (or replug).
# Nothing in this role triggers udev "add" events, because those re-run
# alsa-restore against the units.
- name: Template out miniDSP ALSA id udev rule
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/minidsp/85-minidsp-alsa-ids.rules' }}"
    dest: /etc/udev/rules.d/85-minidsp-alsa-ids.rules
    owner: root
    group: root
    mode: '0644'
  register: minidsp_udev

- name: Reload udev rules (no trigger)
  ansible.builtin.command: udevadm control --reload-rules
  when: minidsp_udev.changed

# alsa-restore looks mixer state up by card id. Without a state.minidsp_<serial>
# section it would fall back to `alsactl init` for the renamed cards, so seed
# one with the exact values the units already get at every boot. Skipped once
# the sections exist without the marker (an `alsactl store` rewrote the file),
# so they are never duplicated or overwritten. This writes a file on the Pi
# only; nothing is sent to the units until the next boot, and what is sent then
# is unchanged.
- name: Read ALSA state file
  ansible.builtin.slurp:
    src: /var/lib/alsa/asound.state
  register: _asound_state
  failed_when: false

- name: Seed ALSA state for the stable miniDSP card ids
  ansible.builtin.blockinfile:
    path: /var/lib/alsa/asound.state
    create: true
    owner: root
    group: root
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED BLOCK minidsp stable card ids"
    block: "{{ lookup('template', lookup('env', 'CI_PROJECT_DIR') + '/base/minidsp/asound-state-minidsp.conf') }}"
  vars:
    _asound_text: "{{ (_asound_state.content | default('')) | b64decode }}"
  when: >-
    'ANSIBLE MANAGED BLOCK minidsp stable card ids' in _asound_text
    or 'state.minidsp_' not in _asound_text
