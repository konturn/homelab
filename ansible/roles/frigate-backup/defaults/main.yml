---
# Offsite backup of Frigate to the restic repository of the restic role
# (docs/frigate.md, "Backup"). Reuses the restic role's /root/.restic_env
# (repository, password and the append-only B2 key from Vault); nothing new
# is stored. Own tags and forget policy: the main snapshots are untouched.
frigate_backup_config_dir: /persistent_data/application/frigate
frigate_backup_media_dir: /mpool/frigate
# Inside the container, Frigate stores paths under /media/frigate
frigate_backup_container_media_dir: /media/frigate
frigate_backup_work_dir: /var/backups/frigate
frigate_backup_tag: frigate
# Kept per mode: event clips/snapshots/db for 30 days; the full recordings
# mirror for 7 days, which caps the cloud copy near 1 TB (66 GB/day per
# camera x 7 days x 2 cameras = ~925 GB), matching the 1 TB local quota.
frigate_backup_keep_within_events: 30d
frigate_backup_keep_within_recordings: 7d

# events: database, snapshots, review thumbnails, previews, exports, and the
# recording segments around alerts and detections of the last
# frigate_backup_events_window_hours. Small and frequent.
frigate_backup_events_on_calendar: "*-*-* *:05,35:00"
frigate_backup_events_window_hours: 48
frigate_backup_events_timeout: 25min

# recordings: the segments of the last frigate_backup_recordings_window_hours
# matching frigate_backup_recordings_filter, once a night after the main
# backup:
#   objects  segments with tracked objects (~5-10% of the footage)
#   motion   segments with motion (Frigate's own long-term set; ~20-40%)
#   all      everything, continuous footage included (66 GB/day per camera)
frigate_backup_recordings_on_calendar: "*-*-* 07:15:00"
frigate_backup_recordings_window_hours: 26
frigate_backup_recordings_filter: all
frigate_backup_recordings_timeout: 4h

# The main restic-backup.service runs `restic check` before and `restic
# forget` after its backups, both exclusive locks. They now wait up to
# restic_backup_retry_lock for a Frigate lock, but the Frigate jobs still
# keep out of the way: they never start while restic-backup, restic-db-dumps
# or restic-macmini-pull (its pre-backup units) is active, nor after this
# hour until the main backup has run (its timer fires at 03:00; the
# pre-backup units push the actual start to about 03:05).
frigate_backup_quiet_from_hour: 2
frigate_backup_quiet_until_hour: 3
