### Install docker daemon
- name: Install dependencies
  apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Set timezone
  community.general.timezone:
    name: America/New_York

# Bookworm layout: the FAT boot partition is mounted at /boot/firmware and
# /boot/config.txt is only a stub the firmware never reads (configure-pi-boot,
# docs/raspberry-pi.md). Legacy layout: /boot is the boot partition.
- name: Check whether the boot partition is at /boot/firmware
  ansible.builtin.command:
    argv: [mountpoint, -q, /boot/firmware]
  register: _snapclient_fw_mount
  changed_when: false
  failed_when: _snapclient_fw_mount.rc not in [0, 1]
  check_mode: false

# Replaces the whole firmware config, so the template also carries what other
# roles would otherwise add to it (auto_initramfs, the watchdog dtparam).
- name: Template out base configuration file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/snapclient/config.txt"
    dest: "{{ '/boot/firmware/config.txt' if _snapclient_fw_mount.rc == 0 else '/boot/config.txt' }}"

- name: Add armhf architecture for snapclient
  command: dpkg --add-architecture armhf
  changed_when: false

- name: Update apt cache after adding armhf architecture
  apt:
    update_cache: yes

# Bookworm and later ship snapclient 0.26 themselves (0.26.0+dfsg1, which
# sorts above the GitHub build below and replaces it on upgrade). That GitHub
# .deb was built for bullseye and depends on libflac8, which bookworm no longer
# has, so it cannot be installed there. Both keep the armhf architecture.
- name: Install snapclient (bullseye, GitHub release)
  apt:
    deb: https://github.com/badaix/snapcast/releases/download/v0.26.0/snapclient_0.26.0-1_armhf.deb
  retries: 3
  delay: 5
  register: snapclient_install
  until: snapclient_install is success
  when: ansible_distribution_release == 'bullseye'

- name: Install snapclient (bookworm and later, Debian package)
  apt:
    name: "snapclient:armhf"
    state: present
  when: ansible_distribution_release != 'bullseye'

- name: Stop snapclient
  ansible.builtin.systemd:
    name: snapclient
    state: stopped
    enabled: no

- name: Template out snapclient config file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/snapclient/snapclient_default' }}"
    dest: '/etc/default/snapclient_{{ item.name }}'
    mode: 0600
  register: snapclient
  loop: "{{ snapclient_config }}"

- name: Template out snapclient service file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/snapclient/snapclient.service' }}"
    dest: '/etc/systemd/system/snapclient_{{ item.name }}.service'
    mode: 0644
  loop: "{{ snapclient_config }}"

# A client with `enabled: false` in snapclient_config (its USB sound card is
# missing) is kept stopped and disabled rather than started into a
# "No such device" failure on every deploy. Its files are still templated, so
# flipping the flag back to true is the only change needed to re-enable it.
- name: Make sure snapclient daemons started
  ansible.builtin.systemd:
    name: "snapclient_{{ item.name }}"
    state: "{{ 'started' if item.enabled | default(true) else 'stopped' }}"
    daemon_reload: yes
    enabled: "{{ item.enabled | default(true) }}"
  loop: "{{ snapclient_config }}"

- name: Restart snapclient daemon when config changed
  ansible.builtin.systemd:
    name: "snapclient_{{ item.item.name }}"
    state: restarted
  loop: "{{ snapclient.results }}"
  when: item.changed and item.item.enabled | default(true)
