# state: present, not latest: an upgrade of dnsmasq/isc-dhcp-server/netfilter
# restarts the service mid-deploy. Upgrades are a deliberate manual step
# (`apt install --only-upgrade <pkg>`); Ubuntu security updates still arrive
# via unattended-upgrades.
- name: Ensure proper packages are installed
  apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - dnsmasq
      - isc-dhcp-server
      - wireguard
      - netfilter-persistent
      - iptables-persistent
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Populate route table list
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/iproute2/rt_tables' }}"
    dest: /etc/iproute2/rt_tables
    owner: root
    group: root
    mode: '0640'

- name: Make sure Mullvad is started and enabled
  service:
    name: "wg-quick@{{ mullvad_interface_name }}"
    state: started
    enabled: yes

# Retired WireGuard interfaces: wg0/wg1 (old remote-access tunnels, replaced
# by Tailscale) and wg-mullvad (target of the removed mullvad-failover timer;
# the Mullvad tunnel in use is {{ mullvad_interface_name }}).
- name: Stop and disable retired WireGuard interfaces
  ansible.builtin.systemd:
    name: "wg-quick@{{ item }}"
    state: stopped
    enabled: no
  loop: [wg0, wg1, wg-mullvad]
  failed_when: false

- name: Stop and disable the retired mullvad-failover timer/service
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop: [mullvad-failover.timer, mullvad-failover.service]
  failed_when: false

- name: Remove retired WireGuard / failover files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/wireguard/wg0.conf
    - /etc/wireguard/wg1.conf
    - /etc/wireguard/wg-mullvad.conf
    - /etc/wireguard/mullvad.conf.template
    - /etc/systemd/system/mullvad-failover.timer
    - /etc/systemd/system/mullvad-failover.service
    - /usr/local/bin/mullvad-failover.sh
    - /var/lib/mullvad-failover
  register: retired_files

- name: Reload systemd after removing retired units
  ansible.builtin.systemd:
    daemon_reload: yes
  when: retired_files is changed

- name: Template the netplan config file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/netplan/config.yaml' }}"
    dest: /etc/netplan/config.yaml
    owner: root
    group: root
    mode: '0640'
    # Render the candidate into a scratch root first so a malformed config
    # never reaches /etc/netplan (and never gets `netplan apply`-ed).
    validate: >-
      bash -c 'd=$(mktemp -d) && trap "rm -rf $d" EXIT &&
      install -D -m 600 %s $d/etc/netplan/config.yaml &&
      netplan generate --root-dir $d'
  register: netplan

# Only runs when the rendered config actually changed (and passed validation).
- name: Run Netplan config
  ansible.builtin.command: netplan apply
  become: yes
  when: netplan.changed

- name: Template the iptables rules file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/iptables/rules.v4' }}"
    dest: /etc/iptables/rules.v4
    owner: root
    group: root
    mode: '0640'
    validate: /usr/sbin/iptables-restore --test %s
  register: iptables

- name: Template the ip6tables rules file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/iptables/rules.v6' }}"
    dest: /etc/iptables/rules.v6
    owner: root
    group: root
    mode: '0640'
    validate: /usr/sbin/ip6tables-restore --test %s
  register: iptables6

- name: Copy the ipset rules file
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/iptables/rules.ipset' }}"
    dest: /etc/iptables/rules.ipset
    owner: root
    group: root
    mode: '0640'
  register: ipset

- name: Copy the ipset netfilter plugin
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/iptables/10-ipset' }}"
    dest: /usr/share/netfilter-persistent/plugins.d/10-ipset
    owner: root
    group: root
    mode: '0755'
  register: netfilter

# `netfilter-persistent reload` flushes every table and deletes the chains
# Docker (DOCKER*), Tailscale (ts-*) and libvirt (LIBVIRT_*) install at
# runtime; the deploy used to restart Docker afterwards (restarting every
# container) and Tailscale/libvirt stayed broken. fw-apply loads rules.v4
# atomically while keeping those chains, so nothing needs a restart.
# Boot still uses netfilter-persistent (it runs before those daemons start).
- name: Install fw-apply helper
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/iptables/fw-apply' }}"
    dest: /usr/local/sbin/fw-apply
    owner: root
    group: root
    mode: '0755'

- name: Reload ipsets
  ansible.builtin.command: /usr/share/netfilter-persistent/plugins.d/10-ipset reload
  when: ipset.changed or netfilter.changed

- name: Load iptables rules (keeps Docker/Tailscale/libvirt chains)
  ansible.builtin.command: /usr/local/sbin/fw-apply 4 /etc/iptables/rules.v4
  register: fw_apply_v4
  when: iptables.changed or ipset.changed or netfilter.changed

- name: Show iptables changes
  ansible.builtin.debug:
    var: fw_apply_v4.stdout_lines
  when: fw_apply_v4 is changed

- name: Load ip6tables rules (keeps Docker/Tailscale/libvirt chains)
  ansible.builtin.command: /usr/local/sbin/fw-apply 6 /etc/iptables/rules.v6
  register: fw_apply_v6
  when: iptables6.changed

- name: Show ip6tables changes
  ansible.builtin.debug:
    var: fw_apply_v6.stdout_lines
  when: fw_apply_v6 is changed

- name: Setup cron script directory
  ansible.builtin.file:
    path: /root/cron
    state: directory
    mode: '0700'

- name: Setup cron script log directory
  ansible.builtin.file:
    path: /root/cron/logs
    state: directory
    mode: '0700'
  
- name: Template out cron script to populate wan ipset
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/iptables/ip_update.sh' }}"
    dest: /root/cron/ip_update.sh
    owner: root
    group: root
    mode: '0700'

- name: Sets up cronjob to populate wan ipset
  ansible.builtin.cron:
    name: "Update wan ipset"
    minute: "*/5"
    job: "{{ \"bash -c 'set -o pipefail; /bin/bash /root/cron/ip_update.sh 2>&1 | logger -t ip-update-cron'\" }}"

- name: Template out cron script for DDNS
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/dns/ddns.py' }}"
    dest: /root/cron/ddns.py
    owner: root
    group: root
    mode: '0700'

- name: Refuse to write DDNS credentials without Cloudflare secrets
  ansible.builtin.assert:
    that:
      - vault_cloudflare_api_key | default('') | trim | length > 0
      - vault_cloudflare_zone_id | default('') | trim | length > 0
    fail_msg: "Cloudflare secrets are empty (Vault read failed?). Not touching /root/cron/.ddns.env."
    quiet: true

- name: Deploy DDNS credentials to environment file
  ansible.builtin.copy:
    content: |
      CLOUDFLARE_API_KEY={{ vault_cloudflare_api_key | trim }}
      CLOUDFLARE_ZONE_ID={{ vault_cloudflare_zone_id | trim }}
      CLOUDFLARE_EMAIL=konoahko@gmail.com
    dest: /root/cron/.ddns.env
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Sets up cronjob for DDNS
  ansible.builtin.cron:
    name: "Update public DNS records"
    minute: "*/5"
    job: >-
      bash -c 'set -o pipefail; set -a; source /root/cron/.ddns.env; set +a; /usr/bin/python3 /root/cron/ddns.py -d nkontur.com -r @ \* -p lab 2>&1 | logger -t ddns-cron'

- name: Template out cron script for SSL renewal
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/ssl/renew.sh' }}"
    dest: /root/cron/renew.sh
    owner: root
    group: root
    mode: '0700'

- name: Sets up cronjob for SSL Certs
  ansible.builtin.cron:
    name: "Renew ssl certs"
    minute: "0"
    hour: "4"
    weekday: "1"
    # renew.sh takes no arguments; certbot reads its Cloudflare credentials
    # from /root/cron/credentials.
    job: "bash -c 'set -o pipefail; /bin/bash /root/cron/renew.sh 2>&1 | logger -t ssl-renew-cron'"

- name: Template out cron script for ISO conversion
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/docker/plex/convert_isos_makemkv.sh' }}"
    dest: /root/cron/convert_isos.sh
    owner: root
    group: root
    mode: '0700'

- name: Sets up cronjob for ISO conversion
  ansible.builtin.cron:
    name: "Convert ISO files to MKV"
    minute: "0"
    hour: "2"
    job: "{{ \"bash -c 'set -o pipefail; /bin/bash /root/cron/convert_isos.sh 2>&1 | logger -t iso-convert-cron'\" }}"


- name: Sync systemd-networkd drop-in files
  ansible.posix.synchronize:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/networkd/' }}"
    dest: /etc/systemd/network
    rsync_opts:
    - "--chmod=D755,F644"
  register: networkd

- name: Make sure systemd-networkd is started and enabled
  service:
    name: systemd-networkd
    state: started
    enabled: yes

# Not applied automatically. On systemd 255 both `networkctl reload` and a
# networkd restart reconfigure *every* link, including the WAN: its DHCP
# lease is dropped and the ISP may hand out a new public IP. Apply networkd
# changes by hand in a maintenance window:
#   networkctl reload            # reconfigures all links (brief blip)
# Setting networkd_apply=true for a run applies them automatically.
- name: Apply systemd-networkd changes (opt-in)
  ansible.builtin.command: networkctl reload
  when: networkd.changed and (networkd_apply | default(false) | bool)

- name: Warn about pending systemd-networkd changes
  ansible.builtin.debug:
    msg: >-
      networkd files under /etc/systemd/network changed but were NOT applied.
      Run `networkctl reload` on the router in a maintenance window (it
      reconfigures every link, including the WAN).
  when: networkd.changed and not (networkd_apply | default(false) | bool)

# The systemd-networkd [Ethtool] EnergyEfficientEthernet=false directive in
# 10-wan-usb-ethernet.link only applies at device-setup time; the r8152 USB
# driver re-enables EEE on link renegotiation, which causes WAN carrier
# flapping. Re-assert EEE-off every minute as a belt-and-braces fix.
- name: Sets up cronjob to keep EEE disabled on WAN interface
  ansible.builtin.cron:
    name: "Disable EEE on WAN interface (r8152 renegotiation workaround)"
    minute: "*"
    job: "[ -d /sys/class/net/enx6c1ff76b2ec9 ] && /usr/sbin/ethtool --set-eee enx6c1ff76b2ec9 eee off >/dev/null 2>&1 || true"

# Route *.lab.nkontur.com lookups made by systemd-resolved to the global DNS
# server (Pi-hole) only; the WAN link's DHCP-provided servers keep serving
# everything else. Equivalent to DNSDefaultRoute=no for these names without
# reconfiguring the WAN link.
- name: Ensure resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'

- name: Route internal names to the internal resolver
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/dns/resolved-internal.conf' }}"
    dest: /etc/systemd/resolved.conf.d/10-internal-routing.conf
    owner: root
    group: root
    mode: '0644'
  register: resolved_conf

- name: Restart systemd-resolved when its drop-in changes
  service:
    name: systemd-resolved
    state: restarted
  when: resolved_conf.changed

- name: Populate dnsmasq conf file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/dns/dnsmasq.conf' }}"
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: '0640'
    validate: /usr/sbin/dnsmasq --test -C %s
  register: dnsmasq

- name: Restart dnsmasq when the drop-in files change
  service:
    name: dnsmasq
    state: restarted
    enabled: yes
  when: dnsmasq.changed

- name: Populate avahi conf file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/avahi/avahi-daemon.conf' }}"
    dest: /etc/avahi/avahi-daemon.conf
    owner: root
    group: root
    mode: '0640'
  register: avahi_conf

- name: Populate avahi hosts file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/avahi/hosts' }}"
    dest: /etc/avahi/hosts
    owner: root
    group: root
    mode: '0640'
  register: avahi_hosts

- name: Populate avahi service file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/avahi/services/spotify.service' }}"
    dest: /etc/avahi/services/spotify.service
    owner: root
    group: root
    mode: '0640'
  register: avahi_services

- name: Restart avahi when the drop-in files change
  service:
    name: avahi-daemon
    state: restarted
    enabled: yes
  when: avahi_conf.changed or avahi_services.changed or avahi_hosts.changed

# fetch-vault-secrets already fails the play on a missing secret; this keeps
# dhcpd.conf safe even if the role is skipped or the variable is overridden.
- name: Refuse to render dhcpd.conf without an OMAPI secret
  ansible.builtin.assert:
    that:
      - omapi_secret | default('') | length > 0
    fail_msg: "omapi_secret is empty (Vault read failed?). Not touching dhcpd.conf."

# dhcpd -t runs on the rendered candidate before it replaces the live file
# (dhcpd-check copies it into /etc/dhcp because of dhcpd's AppArmor profile).
# A config that fails the test is never installed and dhcpd is not restarted.
- name: Install dhcpd config check helper
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/dhcp/dhcpd-check' }}"
    dest: /usr/local/sbin/dhcpd-check
    owner: root
    group: root
    mode: '0755'

- name: Populate DHCP conf file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/dhcp/dhcpd.conf' }}"
    dest: /etc/dhcp/dhcpd.conf
    owner: root
    group: root
    mode: '0640'
    validate: /usr/local/sbin/dhcpd-check %s
  register: dhcp

- name: Populate isc-dhcp-server defaults (listen interfaces)
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/dhcp/isc-dhcp-server' }}"
    dest: /etc/default/isc-dhcp-server
    owner: root
    group: root
    mode: '0644'
  register: dhcp_defaults

- name: Restart isc-dhcp-server when the drop-in files change
  service:
    name: isc-dhcp-server
    state: restarted
    enabled: yes
  when: dhcp.changed or dhcp_defaults.changed

# The restart above reports success even when dhcpd exits right after
# starting, so check that it is still running.
- name: Check isc-dhcp-server is running after the restart
  ansible.builtin.command: systemctl is-active isc-dhcp-server
  register: dhcpd_active
  changed_when: false
  until: dhcpd_active.stdout == 'active'
  retries: 5
  delay: 3
  when:
    - dhcp.changed or dhcp_defaults.changed
    - not ansible_check_mode

