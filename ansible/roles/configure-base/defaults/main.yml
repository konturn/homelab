---
# /etc/cron.d/zfs-auto-snapshot (tasks/main.yml, docs/backups.md). Coverage:
# 2 hours of 15-minute, 24 hours of hourly, 14 days of daily, 4 weeks of
# weekly and 6 months of monthly snapshots.
zfs_auto_snapshot_schedule:
  - {label: frequent, cron: "*/15 * * * *", keep: 8}
  - {label: hourly, cron: "0 * * * *", keep: 24}
  - {label: daily, cron: "59 23 * * *", keep: 14}
  - {label: weekly, cron: "59 23 * * 0", keep: 4}
  - {label: monthly, cron: "0 0 1 * *", keep: 6}

# Per-dataset exceptions to the schedule above.
#   disable: labels this dataset gets no snapshots for. Applied as
#     com.sun:auto-snapshot:<label>=false on the dataset; any other label of
#     the schedule set locally on it is reverted to inherited. zfs-auto-snapshot
#     then skips the dataset for that label even when it is named explicitly,
#     and also stops pruning its existing snapshots of that label.
#   prune: keep fewer snapshots of a label than the global keep. A
#     --destroy-only run for this dataset alone, scheduled after the global run,
#     trims it back to `keep` (the global run still creates them).
# mpool/plex keeps about a week: 2 h of frequent, 24 h of hourly, 7 daily.
zfs_auto_snapshot_dataset_overrides:
  - dataset: mpool/plex
    disable: [weekly, monthly]
    prune:
      - {label: daily, cron: "15 0 * * *", keep: 7}
