### OpenZFS PPA — upgrade beyond Ubuntu's bundled 2.2.2
### Fixes LUKS2 4k-sector + ashift-12 write errors (openzfs/zfs#14533)
- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  check_mode: no

# The keyserver re-sends the key on every request, with armor headers that
# differ by the node that answered ("Comment: Hostname: ..."), so get_url
# rewrote the keyring now and then with the same key. Fetch it (read-only),
# and write the keyring only when the key itself differs.
- name: Download OpenZFS PPA signing key
  ansible.builtin.uri:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x71D641738AA0BEA26DA949516BA7349C5FD45AE1&options=mr"
    return_content: true
  register: openzfs_ppa_key_dl
  check_mode: no

- name: Read the installed OpenZFS PPA signing key
  ansible.builtin.slurp:
    src: /etc/apt/keyrings/openzfs-ppa.asc
  register: openzfs_ppa_key_cur
  failed_when: false
  check_mode: no

- name: Install OpenZFS PPA signing key
  ansible.builtin.copy:
    content: "{{ openzfs_ppa_key_dl.content }}"
    dest: /etc/apt/keyrings/openzfs-ppa.asc
    owner: root
    group: root
    mode: '0644'
  when: >-
    openzfs_ppa_key_cur.content is not defined
    or (openzfs_ppa_key_cur.content | b64decode).splitlines() | reject('match', '^(Version|Comment):') | list
       != openzfs_ppa_key_dl.content.splitlines() | reject('match', '^(Version|Comment):') | list

- name: Add OpenZFS PPA repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/openzfs-ppa.asc] https://ppa.launchpadcontent.net/arter97/zfs/ubuntu {{ ansible_distribution_release }} main"
    state: present

- name: Update apt cache for ZFS packages
  apt:
    update_cache: yes
    cache_valid_time: 300
  register: zfs_cache_update
  retries: 3
  delay: 10
  until: zfs_cache_update is success
  ignore_errors: yes
  # only needed when the install below has something to do
  when: "['zfsutils-linux', 'zfs-dkms', 'zfs-zed'] | difference(installed_packages | default([])) | length > 0"

# present + hold, not latest: a zfs-dkms upgrade rebuilds the module and
# leaves the loaded module out of sync with userland until a reboot. Upgrade
# deliberately: apt-mark unhold zfsutils-linux zfs-dkms zfs-zed && apt install
# --only-upgrade zfsutils-linux zfs-dkms zfs-zed && apt-mark hold ... (reboot).
- name: Install ZFS packages
  apt:
    name: "{{ _apt_packages }}"
    state: present
  register: zfs_packages
  vars:
    _apt_packages:
      - zfsutils-linux
      - zfs-dkms
      - zfs-zed
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Hold ZFS packages (upgrades are a manual step)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - zfsutils-linux
    - zfs-dkms
    - zfs-zed

- name: Check if ZFS kernel module needs reload (reboot required)
  ansible.builtin.shell: |
    LOADED=$(cat /sys/module/zfs/version 2>/dev/null || echo "unknown")
    INSTALLED=$(dpkg-query -W -f='${Version}' zfsutils-linux 2>/dev/null | sed 's/-.*//')
    echo "loaded=${LOADED} installed=${INSTALLED}"
    [ "$LOADED" = "$INSTALLED" ] && echo "match=yes" || echo "match=no"
  register: zfs_version_check
  changed_when: false
  when: zfs_packages.changed

- name: Warn if ZFS reboot is needed
  ansible.builtin.debug:
    msg: "ZFS REBOOT REQUIRED — {{ zfs_version_check.stdout_lines | default(['version check skipped']) }}"
  when: zfs_packages.changed and zfs_version_check.stdout is defined and 'match=no' in zfs_version_check.stdout

### Configure mounts and cryptodisks
- name: fstab
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/disk/fstab' }}"
    dest: '/etc/fstab'
    owner: root
    group: root
    mode: 0600

- name: crypttab
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/disk/crypttab' }}"
    dest: '/etc/crypttab'
    owner: root
    group: root
    mode: 0600

# /etc/password_file.txt unlocks the data disks at boot (see crypttab), so it
# is only ever replaced by a key that is known to work: the value from Vault
# must be non-empty and non-trivial, and the candidate file must open at least
# one LUKS device that crypttab unlocks with it (luks-keyfile-check, run as
# the copy's validate step). The previous file is kept as a timestamped
# backup next to it.
- name: Install LUKS key file check helper
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/disk/luks-keyfile-check' }}"
    dest: /usr/local/sbin/luks-keyfile-check
    owner: root
    group: root
    mode: '0755'

- name: Check the LUKS key from Vault before writing it
  ansible.builtin.assert:
    that:
      - vault_secrets_verified | default(false) | bool
      - vault_luks_password_base64 | default('') | trim | length > 0
      - vault_luks_password_base64 | trim | b64decode | length >= 16
    fail_msg: "LUKS key from Vault is missing, empty or too short. Not touching /etc/password_file.txt."
    quiet: true

- name: Write the LUKS password file
  block:
    - name: write to LUKS password file
      ansible.builtin.copy:
        content: "{{ vault_luks_password_base64 | trim | b64decode }}"
        dest: '/etc/password_file.txt'
        owner: root
        group: root
        mode: 0600
        backup: true
        validate: /usr/local/sbin/luks-keyfile-check %s
      no_log: true
  rescue:
    # The task above is no_log, so say what happened without its output.
    - name: LUKS password file was not replaced
      ansible.builtin.fail:
        msg: >-
          Writing /etc/password_file.txt failed (most likely the key from Vault
          does not open any crypttab device). The existing file was left in
          place. Run /usr/local/sbin/luks-keyfile-check on the host to check.

- name: Set max memory per process for non-root users
  community.general.pam_limits:
    domain: "*"
    limit_type: soft
    limit_item: as
    value: 40000000

- name: Set max memory per process for root user
  community.general.pam_limits:
    domain: "root"
    limit_type: soft
    limit_item: as
    value: 40000000

# Elasticsearch (Pelias/Headway) needs memlock for mlockall.
# Fixes pam_limits warning: invalid line .hard memlock 8499200. - skipped
# Previous manual edit was missing the domain field.
- name: Set memlock soft limit
  community.general.pam_limits:
    domain: "*"
    limit_type: soft
    limit_item: memlock
    value: unlimited

- name: Set memlock hard limit
  community.general.pam_limits:
    domain: "*"
    limit_type: hard
    limit_item: memlock
    value: unlimited

### Configure monthly zpool scrub
- name: Zpool systemd timer
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/systemd/zpool-scrub.timer' }}"
    dest: '/etc/systemd/system/zpool-scrub.timer'
    owner: root
    group: root
    mode: 0600

- name: Zpool systemd service
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/systemd/zpool-scrub.service' }}"
    dest: '/etc/systemd/system/zpool-scrub.service'
    owner: root
    group: root
    mode: 0600

- name: ZFS Zed
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/disk/zed.rc' }}"
    dest: '/etc/zfs/zed.d/zed.rc'
    owner: root
    group: root
    mode: 0644

- name: ZFS Tunables
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/disk/zfs.conf' }}"
    dest: '/etc/modprobe.d/zfs.conf'
    owner: root
    group: root
    mode: 0644

- name: Make sure timer enabled
  ansible.builtin.systemd:
    name: zpool-scrub.timer
    state: started
    enabled: yes
    daemon_reload: yes

- name: Download GitLab Runner GPG key
  ansible.builtin.get_url:
    url: "https://packages.gitlab.com/runner/gitlab-runner/gpgkey"
    dest: /etc/apt/keyrings/runner_gitlab-runner-archive-keyring.asc
    mode: '0644'
    force: true
  check_mode: no

- name: Add GitLab Runner repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/runner_gitlab-runner-archive-keyring.asc] https://packages.gitlab.com/runner/gitlab-runner/ubuntu/ {{ ansible_distribution_release }} main"
    state: present

- name: Install gitlab-runner and glab
  apt:
    name: "{{ _apt_packages }}"
    # present + hold, not latest: upgrading gitlab-runner restarts the runner
    # that is executing this very deploy. Upgrade manually between pipelines
    # (apt-mark unhold gitlab-runner && apt install --only-upgrade
    # gitlab-runner && apt-mark hold gitlab-runner).
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - gitlab-runner
      - glab
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Hold gitlab-runner (upgrades are a manual step)
  ansible.builtin.dpkg_selections:
    name: gitlab-runner
    selection: hold

- name: Add gitlab-runner user to docker group
  user:
    name: gitlab-runner
    append: yes
    groups: docker

### Create directories for gitlab-runner volume mounts
- name: Ensure gitlab-runner volume mount directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /certs/client
    - /cache/gitlab-runner

# Mounted as /cache in MR/branch jobs; job images that run as a non-root user
# (e.g. willhallonline/ansible runs as "ansible") create /cache/pip etc.
- name: Ensure unprotected runner cache directory exists
  ansible.builtin.file:
    path: /cache/gitlab-runner-unprotected
    state: directory
    owner: root
    group: root
    mode: '1777'

### Configure gitlab-runner on host
# The protected runner's authentication token lives only on the host (written
# when the runner was registered). slurp fails if the file is missing, so a
# deploy never renders a config without that runner.
- name: Read protected runner token
  ansible.builtin.slurp:
    src: /etc/gitlab-runner/protected-runner.token
  register: _protected_runner_token
  no_log: true

- name: Set protected runner token fact
  ansible.builtin.set_fact:
    gitlab_runner_protected_token: "{{ _protected_runner_token.content | b64decode | trim }}"
  no_log: true

- name: Check protected runner token is set
  ansible.builtin.assert:
    that: gitlab_runner_protected_token | length > 0
    quiet: true
  no_log: true

- name: Gitlab runner config file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/gitlab-runner/config.toml' }}"
    dest: '/etc/gitlab-runner/config.toml'
    owner: root
    group: root
    mode: 0600
  # contains runner tokens
  diff: false

- name: Sets up base cronjob for nextcloud
  ansible.builtin.cron:
    name: "Nextcloud base cronjob"
    minute: "*/5"
    job: "docker exec -t -u www-data nextcloud php -f /var/www/html/cron.php"

- name: Sets up periodic file scan cronjob for nextcloud
  ansible.builtin.cron:
    name: "Nextcloud file scan cronjob"
    minute: "0"
    hour: "2"
    weekday: "0"
    job: "docker exec -u www-data nextcloud php occ files:scan --all"

- name: Sets up perodic plex chown
  ansible.builtin.cron:
    name: "Plex dir chown"
    minute: "0"
    hour: "0"
    job: "chown -R konoahko:konoahko /mpool/plex"

- name: Install msmtp
  apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - msmtp
      - mailutils
      - bsd-mailx
      - msmtp-mta
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Install nfs
  apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: yes
  vars:
    _apt_packages:
      - nfs-kernel-server
  # skipped when all are installed (installed_packages: playbook pre_tasks)
  when: _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Make sure nfs is started and enabled
  service:
    name: nfs-server
    state: started
    enabled: yes

- name: nfs config file
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/networking/nfs/exports' }}"
    dest: '/etc/exports'
    owner: root
    group: root
    mode: 0644
  register: nfs

- name: Reload nfs to pick up changes
  ansible.builtin.systemd:
    name: nfs-server
    state: restarted
  when: nfs.changed

- name: udev rule for sound cards
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/udev/85-my-usb-audio.rules' }}"
    dest: '/lib/udev/rules.d/85-my-usb-audio.rules'
    owner: root
    group: root
    mode: 0644

### Rotate the nginx containers' logs (base/logrotate/nginx)
# Replaces the host nginx package's stanza, whose postrotate never reached the
# containers. See the comment in the file.
- name: nginx container logs logrotate config
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/base/logrotate/nginx' }}"
    dest: '/etc/logrotate.d/nginx'
    owner: root
    group: root
    mode: 0644
    validate: 'logrotate -d %s'

### Stale logrotate stanzas that make logrotate.service exit 1
# wokd: not owned by any package; /var/log/wok does not exist and the stanza
#   sets nomissingok, so every run ends with "stat of /var/log/wok failed".
# mumble-server: dpkg marks it an obsolete conffile (the current package no
#   longer ships it). Its postrotate calls /usr/sbin/murmurd, which was renamed
#   to /usr/bin/mumble-server, so every weekly rotation fails.
# Each stanza is removed only while the path it depends on is missing. Only
# the config is removed; existing log files are left in place.
- name: Check paths the stale logrotate stanzas depend on
  ansible.builtin.stat:
    path: "{{ item.needs }}"
  loop:
    - { conf: wokd, needs: /var/log/wok }
    - { conf: mumble-server, needs: /usr/sbin/murmurd }
  loop_control:
    label: "{{ item.conf }}"
  register: stale_logrotate

- name: Remove stale logrotate stanzas
  ansible.builtin.file:
    path: "/etc/logrotate.d/{{ item.item.conf }}"
    state: absent
  loop: "{{ stale_logrotate.results }}"
  loop_control:
    label: "{{ item.item.conf }}"
  when: not item.stat.exists

- name: Disable rsyslog (replaced by Promtail journal scraping)
  ansible.builtin.systemd:
    name: rsyslog
    state: stopped
    enabled: false

- name: Add loopback alsa module
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: snd-aloop
    create: yes
