# Off-box heartbeat (docs/DEADMAN.md): deadman-check runs every 5 minutes
# and pings healthchecks.io only when the critical services are healthy.
# Everything lives on the root filesystem, outside Docker.

- name: Install deadman-check
  ansible.builtin.copy:
    src: deadman-check.sh
    dest: /usr/local/sbin/deadman-check
    owner: root
    group: root
    mode: "0755"

- name: Install the deadman-check units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - deadman-check.service
    - deadman-check.timer
  notify: Reload systemd for deadman-check

- name: Flush handlers (units must be loaded before the timer is changed)
  ansible.builtin.meta: flush_handlers

- name: Write the ping URL env file
  ansible.builtin.copy:
    dest: "{{ deadman_env_file }}"
    content: "DEADMAN_PING_URL={{ deadman_ping_url }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: deadman_ping_url | length > 0

- name: Enable the deadman-check timer
  ansible.builtin.systemd:
    name: deadman-check.timer
    state: started
    enabled: true
  when:
    - deadman_ping_url | length > 0
    - not ansible_check_mode  # unit files are not written in check mode

- name: Remove the ping URL env file (no Vault entry)
  ansible.builtin.file:
    path: "{{ deadman_env_file }}"
    state: absent
  when: deadman_ping_url | length == 0

- name: Disable the deadman-check timer (no Vault entry)
  ansible.builtin.systemd:
    name: deadman-check.timer
    state: stopped
    enabled: false
  when:
    - deadman_ping_url | length == 0
    - not ansible_check_mode

- name: Note that the heartbeat is not active
  ansible.builtin.debug:
    msg: >-
      NOTE: deadman-check is installed but its timer is DISABLED because Vault
      homelab/monitoring/healthchecks (field ping_url) is not set. Store the
      healthchecks.io ping URL there (scripts/set-deadman-ping-url.sh) and
      redeploy to start the heartbeat. Dry run: deadman-check --dry-run.
  when: deadman_ping_url | length == 0
