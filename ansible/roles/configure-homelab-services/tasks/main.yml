### Transcript credential scrubbing cron
# Uses gitleaks (~160 rules) to detect and redact secrets from OpenClaw
# session transcripts. Also purges archived sub-agent transcripts older
# than 7 days. Gitleaks runs natively on the host.
- name: Install gitleaks binary
  ansible.builtin.shell: |
    set -euo pipefail
    # renovate: datasource=docker depName=zricethezav/gitleaks
    GITLEAKS_VERSION="8.30.0"
    DEST="/usr/local/bin/gitleaks"
    if [[ -x "$DEST" ]] && "$DEST" version 2>/dev/null | grep -q "$GITLEAKS_VERSION"; then
      echo "gitleaks ${GITLEAKS_VERSION} already installed"
      exit 0
    fi
    URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
    TMP=$(mktemp -d)
    curl -fsSL -o "${TMP}/gitleaks.tar.gz" "$URL"
    tar xzf "${TMP}/gitleaks.tar.gz" -C "$TMP" gitleaks
    install -m 0755 "${TMP}/gitleaks" "$DEST"
    rm -rf "$TMP"
  args:
    executable: /bin/bash
  register: gitleaks_install
  changed_when: "'already installed' not in gitleaks_install.stdout"

- name: Create scrub-transcripts config directory
  ansible.builtin.file:
    path: /etc/scrub-transcripts
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy transcript scrub script
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/docker/scrub-transcripts/scrub-transcripts.sh' }}"
    dest: "/usr/local/bin/scrub-transcripts.sh"
    owner: root
    group: root
    mode: '0755'

- name: Deploy gitleaks config for transcript scrubbing
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/docker/scrub-transcripts/gitleaks-transcripts.toml' }}"
    dest: "/etc/scrub-transcripts/gitleaks-transcripts.toml"
    owner: root
    group: root
    mode: '0644'

- name: Set up transcript scrub cron job (every 10 minutes)
  ansible.builtin.cron:
    name: "Scrub credentials from openclaw transcripts"
    minute: "*/10"
    job: >-
      /usr/local/bin/scrub-transcripts.sh {{ docker_persistent_data_path }}/openclaw/data/agents/main/sessions 2>&1 | logger -t scrub-transcripts

# The moltbot -> openclaw rename changed this task's name, and
# ansible.builtin.cron keys entries on name, so the pre-rename entry was left
# in root's crontab unmanaged. Manage it under its original name so it is
# tracked here. The [ -d ] guard makes it a no-op (exit 0) once the old
# directory is removed; delete this task then.
- name: Set up legacy transcript scrub cron job (every 10 minutes)
  ansible.builtin.cron:
    name: "Scrub credentials from moltbot transcripts"
    minute: "*/10"
    job: >-
      [ -d {{ docker_persistent_data_path }}/moltbot/data/agents/main/sessions ] || exit 0;
      /usr/local/bin/scrub-transcripts.sh {{ docker_persistent_data_path }}/moltbot/data/agents/main/sessions 2>&1 | logger -t scrub-transcripts

- name: Daily chromium-browser restart (clear tabs and free memory)
  ansible.builtin.cron:
    name: "Restart chromium-browser daily"
    minute: "0"
    hour: "4"
    job: "docker restart chromium-browser 2>&1 | logger -t chromium-restart"

- name: Template homelab repo sync script
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-repo-sync.sh
    content: |
      #!/bin/bash
      REPO={{ docker_persistent_data_path }}/openclaw/workspace/homelab
      cd "$REPO" || exit 1
      git fetch origin main --quiet 2>/dev/null
      git reset --hard origin/main --quiet 2>/dev/null
      git clean -fd --quiet 2>/dev/null
    owner: root
    group: root
    mode: '0755'

- name: Mark homelab repo as safe directory for git
  ansible.builtin.command:
    cmd: git config --global --add safe.directory {{ docker_persistent_data_path }}/openclaw/workspace/homelab
  changed_when: false

- name: Sync homelab repo to latest main every 5 minutes
  ansible.builtin.cron:
    name: "Sync homelab repo for openclaw agent"
    minute: "*/5"
    job: "/usr/local/bin/homelab-repo-sync.sh 2>&1 | logger -t homelab-sync"

- name: Template Grafana cleanup env file
  ansible.builtin.copy:
    dest: /etc/grafana-cleanup.env
    content: |
      GRAFANA_URL=https://grafana.lab.nkontur.com
      GRAFANA_ADMIN_TOKEN={{ vault_jit_admin_token }}
      GRAFANA_SA_ID={{ vault_grafana_service_account_id }}
    owner: root
    group: root
    mode: '0600'

- name: Deploy Grafana token cleanup script
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/scripts/grafana-token-cleanup.sh"
    dest: /usr/local/bin/grafana-token-cleanup.sh
    owner: root
    group: root
    mode: '0755'
  when: "'router' in inventory_hostname"

- name: Daily Grafana expired token cleanup
  ansible.builtin.cron:
    name: "Clean expired Grafana JIT service account tokens"
    minute: "30"
    hour: "5"
    job: >-
      /usr/local/bin/grafana-token-cleanup.sh 2>&1 | logger -t grafana-token-cleanup
  when: "'router' in inventory_hostname"

### Router boot optimization
# Mask Hyper-V guest services that are unnecessary on bare metal (not a VM).
# Saves ~30s boot time by eliminating timeout waits for missing vmbus.
- name: Mask Hyper-V guest services (bare metal, not a VM)
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - hv-fcopy-daemon.service
    - hv-kvp-daemon.service
    - hv-vss-daemon.service
  when: "'router' in inventory_hostname"

# Disable GUI/desktop services not needed on a headless router.
# Saves 5-10s boot time.
- name: Disable unnecessary GUI services on router
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - gdm3.service
    - pulseaudio.service
    - cups.service
    - snapd.service
  failed_when: false
  when: "'router' in inventory_hostname"
