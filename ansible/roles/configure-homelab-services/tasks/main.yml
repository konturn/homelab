### Docker socket proxy TLS certificates
# Generate self-signed CA + server + client certs for mTLS between CI runners
# and lab_nginx (which proxies to docker-socket-proxy). Certs are 10-year validity.
- name: Create docker-proxy-tls cert directory
  ansible.builtin.file:
    path: "{{ docker_persistent_data_path }}/docker-proxy-tls"
    state: directory
    mode: '0755'

- name: Check docker-proxy-tls cert files
  ansible.builtin.stat:
    path: "{{ docker_persistent_data_path }}/docker-proxy-tls/{{ item }}"
  loop:
    - ca.pem
    - cert.pem
    - key.pem
    - server-cert.pem
    - server-key.pem
  register: docker_proxy_tls_certs

- name: Purge docker-proxy-tls directory if any cert is missing or a directory
  ansible.builtin.file:
    path: "{{ docker_persistent_data_path }}/docker-proxy-tls"
    state: absent
  when: docker_proxy_tls_certs.results | selectattr('stat.exists', 'equalto', false) | list | length > 0 or
        docker_proxy_tls_certs.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir', 'equalto', true) | list | length > 0

- name: Recreate docker-proxy-tls cert directory after purge
  ansible.builtin.file:
    path: "{{ docker_persistent_data_path }}/docker-proxy-tls"
    state: directory
    mode: '0755'

- name: Generate docker-proxy-tls certificates
  ansible.builtin.script:
    cmd: "{{ lookup('env', 'CI_PROJECT_DIR') }}/docker/docker-socket-proxy-tls/generate-certs.sh {{ docker_persistent_data_path }}/docker-proxy-tls"
  when: docker_proxy_tls_certs.results | selectattr('stat.exists', 'equalto', false) | list | length > 0 or
        docker_proxy_tls_certs.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir', 'equalto', true) | list | length > 0
  register: docker_proxy_tls_generated

### Telegraf — baremetal host agent for hardware and service monitoring
# Telegraf runs as a systemd service (not containerized) for direct access to
# host hardware (SMART, IPMI, sensors, systemd D-Bus). Config files are
# templated from docker/telegraf/ to /etc/telegraf/ via docker_config entries.
- name: Download InfluxData GPG key
  ansible.builtin.get_url:
    # Rotated Jan 2026 — influxdata-archive.key includes both old (exp 2026)
    # and new (exp 2029) signing subkeys under the same primary key.
    url: https://repos.influxdata.com/influxdata-archive.key
    dest: /tmp/influxdata-archive.key
    mode: '0644'
    force: true
  when: "'router' in inventory_hostname"
  check_mode: no

# Dearmor to a temp file and install it only if it differs from the keyring.
- name: Dearmor and install InfluxData GPG key
  ansible.builtin.shell: |
    set -eu
    k=/usr/share/keyrings/influxdata-archive-keyring.gpg
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    gpg --batch --yes --dearmor -o "$tmp" /tmp/influxdata-archive.key
    if [ -f "$k" ] && cmp -s "$tmp" "$k"; then exit 0; fi
    install -m 0644 -o root -g root "$tmp" "$k"
    echo changed
  register: influxdata_keyring
  changed_when: "'changed' in influxdata_keyring.stdout"
  when: "'router' in inventory_hostname"

- name: Add InfluxData APT repository (signed-by)
  ansible.builtin.apt_repository:
    # InfluxData does not publish packages for Noble (24.04); use Jammy (22.04) which is compatible
    repo: "deb [signed-by=/usr/share/keyrings/influxdata-archive-keyring.gpg] https://repos.influxdata.com/ubuntu jammy stable"
    filename: influxdata
    state: present
  when: "'router' in inventory_hostname"

- name: Install Telegraf and hardware monitoring dependencies
  ansible.builtin.apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  vars:
    _apt_packages:
      - telegraf
      - smartmontools
      - lm-sensors
      - ipmitool
      - snmp
      - snmp-mibs-downloader
      - nvme-cli
  when:
    - "'router' in inventory_hostname"
    - _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Grant Telegraf passwordless sudo for SMART collection
  # The telegraf user cannot open block devices, so [[inputs.smart]] returns
  # exit_status=2 on every disk and writes no smart_attribute points. Scope the
  # grant to the two binaries the smart plugin shells out to.
  ansible.builtin.copy:
    dest: /etc/sudoers.d/telegraf-smartctl
    content: |
      telegraf ALL=(root) NOPASSWD: /usr/sbin/smartctl
      telegraf ALL=(root) NOPASSWD: /usr/sbin/nvme
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  when: "'router' in inventory_hostname"

- name: Create Telegraf scripts directory
  ansible.builtin.file:
    path: /etc/telegraf/scripts
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: "'router' in inventory_hostname"

- name: Enable and start Telegraf service
  ansible.builtin.systemd:
    name: telegraf
    enabled: true
    state: started
  when:
    - "'router' in inventory_hostname"
    - not ansible_check_mode

### Fix systemd-networkd-wait-online boot timeout
# Default waits for ALL interfaces, causing 2min+ timeout on boot.
# Override to wait only for WAN interface (USB NIC with DHCP).
- name: Create systemd-networkd-wait-online override directory
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'router' in inventory_hostname"

- name: Override systemd-networkd-wait-online to wait for WAN interface only
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/lib/systemd/systemd-networkd-wait-online --interface=enx6c1ff76b2ec9
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  when: "'router' in inventory_hostname"

- ansible.builtin.import_tasks: render_compose.yml

# nginx configs are now plain conf files committed to the repo in docker/nginx/{hostname}/
# nginx configs are plain conf files committed to the repo

### Generate Loki htpasswd file for push authentication
# Promtail and Docker logging driver authenticate to Loki via nginx reverse proxy
# A fixed salt per credential (derived from the host and file name, not from
# the password) keeps the hash stable, so the file is only rewritten when the
# username or password changes. A random salt changed it on every run.
- name: Generate Loki htpasswd file
  ansible.builtin.shell: |
    printf '%s:%s\n' '{{ vault_loki_push_username }}' \
      "$(openssl passwd -apr1 -salt '{{ ((inventory_hostname ~ ':loki.htpasswd') | hash('sha1'))[:8] }}' '{{ vault_loki_push_password }}')"
  register: loki_htpasswd_content
  delegate_to: localhost
  check_mode: no
  changed_when: false
  no_log: true

- name: Write Loki htpasswd file
  ansible.builtin.copy:
    content: "{{ loki_htpasswd_content.stdout }}"
    dest: "{{ docker_persistent_data_path }}/lab_nginx/conf/loki.htpasswd"
    owner: root
    group: systemd-journal
    mode: '0640'
  no_log: true

# Push-only credential for satellite promtail on the IoT VLAN. It lives in a
# separate file that only iot_nginx reads, so it cannot be used against the
# query API on lab_nginx.
- name: Generate Loki IoT push htpasswd
  ansible.builtin.shell: |
    printf '%s:%s\n' '{{ vault_loki_iot_push_username }}' \
      "$(openssl passwd -apr1 -salt '{{ ((inventory_hostname ~ ':loki-iot.htpasswd') | hash('sha1'))[:8] }}' '{{ vault_loki_iot_push_password }}')"
  register: loki_iot_htpasswd_content
  delegate_to: localhost
  check_mode: no
  changed_when: false
  no_log: true

- name: Write Loki IoT push htpasswd file
  ansible.builtin.copy:
    content: "{{ loki_iot_htpasswd_content.stdout }}"
    dest: "{{ docker_persistent_data_path }}/iot_nginx/conf/loki-iot.htpasswd"
    owner: root
    group: systemd-journal
    mode: '0640'
  no_log: true

- name: Ensure nginx conf directory is traversable by workers
  ansible.builtin.file:
    path: "{{ docker_persistent_data_path }}/{{ item }}/conf"
    state: directory
    mode: '0711'
  loop:
    - lab_nginx
    - iot_nginx

- name: initialize nginx conf file dicts
  set_fact: 
    docker_config_nginx: []

- name: create nginx conf file dicts
  set_fact:
    docker_config_nginx: "{{ docker_config_nginx + [{'src': 'docker/nginx/nginx.conf',
                        'dest': item.dest + '/conf/nginx.conf',
                        'name': item.name }, 
                         {'src': 'docker/nginx/' + inventory_hostname + '/' + item.network + '_stream.conf',
                        'dest': item.dest + '/conf/conf.d/stream.conf',
                        'name': item.name },
                        {'src': 'docker/nginx/' + inventory_hostname + '/' + item.network +  '_http.conf',
                        'dest': item.dest + '/conf/conf.d/http.conf',
                        'name': item.name },
                        {'src': 'docker/nginx/ssl_config',
                        'dest': item.dest + '/conf/ssl_config',
                        'name': item.name,
                        'owner': 'systemd-resolve',
                        'group': 'systemd-journal',
                        'mode': '0700'  }] }}"
  loop: "{{ nginx_config | default([]) }}"

# All config files, used by the directory, cleanup and copy tasks below.
- name: Collect docker config files
  ansible.builtin.set_fact:
    _docker_config_all: "{{ docker_config + (docker_config_nginx | default([])) }}"

# One remote call for every config directory (a file-module loop over ~40
# items took ~15s). mkdir -p fails on a path that exists as a file, as
# file: state=directory does. In check mode nothing is created.
- name: Create docker conf directories
  ansible.builtin.shell: |
    set -eu
    for d in {{ _docker_config_all | map(attribute='dest') | map('dirname') | unique | map('quote') | join(' ') }}; do
      [ -d "$d" ] && continue
      {{ ':' if ansible_check_mode else '' }} mkdir -p "$d"
      echo "created $d"
    done
  register: _docker_conf_dirs
  changed_when: _docker_conf_dirs.stdout | length > 0
  check_mode: false

- name: Create docker data directories with specific ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ docker_data_dirs | default([]) }}"

### Deploy static website files for nkontur.com
- name: Create nkontur.com webroot directory
  ansible.builtin.file:
    path: "{{ docker_persistent_data_path }}/nginx/webroot/nkontur.com"
    state: directory
    mode: '0755'
  when: "'external' in (nginx_config | default([]) | map(attribute='network') | list)"

- name: Synchronize nkontur.com website files
  ansible.posix.synchronize:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/docker/nginx/sites/nkontur.com/"
    dest: "{{ docker_persistent_data_path }}/nginx/webroot/nkontur.com/"
    delete: yes
    recursive: yes
    # By content, with fixed modes. The CI checkout (umask 0) has 0777/0666
    # modes and new mtimes on every run: rsync copied both, so this task and
    # the 0755 directory task above reported changes on every deploy, and the
    # webroot was world-writable.
    checksum: true
    times: false
    rsync_opts:
      - "--chmod=D755,F644"
  when: "'external' in (nginx_config | default([]) | map(attribute='network') | list)"

# A config dest that is a directory (Docker creates one when it bind-mounts a
# missing file) is removed so the file can be written. One remote call lists
# them instead of a stat per file.
- name: Check if config destinations are directories (cleanup stale state)
  ansible.builtin.shell: |
    for f in {{ _docker_config_all | map(attribute='dest') | map('quote') | join(' ') }}; do
      if [ -d "$f" ] && [ ! -L "$f" ]; then echo "$f"; fi
    done
  register: _config_dest_dirs
  changed_when: false
  check_mode: false

- name: Remove config dest that is a directory instead of a file
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _config_dest_dirs.stdout_lines }}"

# Pre-restart checks for rendered, secret-bearing configs. Used as the
# `validate:` step of the template tasks below: a file that fails is never
# written, the task fails, and the play stops before the restart that would
# have loaded it. See the script header for what each check covers.
- name: Install config check helper
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/base/validate/homelab-config-check"
    dest: /usr/local/sbin/homelab-config-check
    owner: root
    group: root
    mode: '0755'
  when: "'router' in inventory_hostname"

# Change detection for the copy task below. The template module costs a
# remote round trip per file even when nothing changed (~40 files, ~34s).
# Instead: render every file on the controller and hash it, read the hash,
# owner, group and mode of every dest in one remote call, and pass to the
# template task only the files that are missing or differ in content or in
# the owner/group/mode the template task would set. A file that differs only
# by a stale hash or an unreadable stat is written (when in doubt, write).
# force: false files are written only when missing, as before.
- name: Render docker configuration files on the controller (change detection)
  ansible.builtin.set_fact:
    _docker_config_sha1: "{{ lookup('template', lookup('env', 'CI_PROJECT_DIR') ~ '/' ~ item.src) | hash('sha1') }}"
  loop: "{{ _docker_config_all }}"
  loop_control:
    label: "{{ item.dest }}"
  register: _docker_config_rendered

- name: Read current docker configuration files
  ansible.builtin.shell: |
    for f in {{ _docker_config_all | map(attribute='dest') | unique | map('quote') | join(' ') }}; do
      if [ -f "$f" ] && [ ! -L "$f" ]; then
        printf '%s\t%s\t%s\n' "$f" "$(sha1sum < "$f" | cut -d' ' -f1)" "$(stat -c '%U %G %u %g %a' "$f")"
      fi
    done
  register: _docker_config_current
  changed_when: false
  check_mode: false

- name: Select docker configuration files that need writing
  ansible.builtin.set_fact:
    _docker_config_to_write: >-
      {%- set cur = {} -%}
      {%- for line in _docker_config_current.stdout_lines -%}
      {%-   set f = line.split('\t') -%}
      {%-   if f | length == 3 -%}
      {%-     set a = f[2].split(' ') -%}
      {%-     set _ = cur.update({f[0]: {'sha1': f[1], 'owner': [a[0], a[2]], 'group': [a[1], a[3]], 'mode': a[4]}}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- set out = [] -%}
      {%- for r in _docker_config_rendered.results -%}
      {%-   set i = r.item -%}
      {%-   set c = cur.get(i.dest) -%}
      {%-   set owner = (i.owner | default('root')) | string -%}
      {%-   set group = (i.group | default(i.owner | default('root'))) | string -%}
      {%-   set mode = '%o' % ((i.mode | default('0640')) | string | int(base=8)) -%}
      {%-   if c is none -%}
      {%-     set _ = out.append(i.dest) -%}
      {%-   elif (i.force | default(true) | bool)
                and (c.sha1 != r.ansible_facts._docker_config_sha1
                     or owner not in c.owner or group not in c.group or mode != c.mode) -%}
      {%-     set _ = out.append(i.dest) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

- name: Show docker configuration files that need writing
  ansible.builtin.debug:
    msg: "{{ _docker_config_to_write | length }} of {{ _docker_config_all | length }} config files differ: {{ _docker_config_to_write | join(', ') }}"

# Grafana provisioning YAML (datasources) gets a parse + non-empty-secret check.
- name: Copy docker configuration files
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default(item.owner | default('root')) }}"
    mode: "{{ item.mode | default('0640') }}"
    force: "{{ item.force | default(true) }}"
    validate: >-
      {{ '/usr/local/sbin/homelab-config-check yaml %s'
         if item.dest is search('/grafana/provisioning/.+[.]ya?ml$') else omit }}
  register: docker_config_copy
  loop: "{{ _docker_config_all }}"
  when: item.dest in _docker_config_to_write

### Snapserver zone layout (server.json)
# snapserver keeps its runtime state in server.json and rewrites it while
# running: client connected flag, host/IP, lastSeen, volume and mute. Writing
# the repo copy on every deploy therefore restarted snapserver every time.
# The file is now seeded only when missing (force: false in the inventory),
# and only the zone layout is enforced: the groups, the stream each group
# plays and the clients in each group. If the live file differs in those, the
# repo copy is written and snapserver restarted, as before.
- name: Find the snapserver server.json entry
  ansible.builtin.set_fact:
    _snapserver_state: "{{ _docker_config_all | selectattr('name', 'equalto', 'snapserver') | selectattr('src', 'equalto', 'docker/snapserver/server.json') | first | default(none) }}"

- name: Read the live snapserver server.json
  ansible.builtin.slurp:
    src: "{{ _snapserver_state.dest }}"
  register: _snapserver_live
  failed_when: false
  check_mode: false
  when: _snapserver_state is not none

- name: Compare the snapserver zone layout with the repo
  ansible.builtin.set_fact:
    _snapserver_zones_drift: >-
      {%- macro zones(d) -%}
      {%-   set out = [] -%}
      {%-   for g in (d.Groups | default([])) | sort(attribute='id') -%}
      {%-     set _ = out.append({'id': g.id, 'stream_id': g.stream_id | default(''),
                                 'clients': g.clients | default([]) | map(attribute='id') | sort | list}) -%}
      {%-   endfor -%}
      {{- out | to_json -}}
      {%- endmacro -%}
      {%- set want = lookup('template', lookup('env', 'CI_PROJECT_DIR') ~ '/' ~ _snapserver_state.src) | from_json -%}
      {%- if _snapserver_live.content is not defined -%}
      {#- missing or unreadable: the config copy above seeds it -#}
      false
      {%- else -%}
      {%-   set live = _snapserver_live.content | b64decode | from_json -%}
      {{ zones(want) != zones(live) }}
      {%- endif -%}
  when: _snapserver_state is not none

- name: Show snapserver zone layout drift
  ansible.builtin.debug:
    msg: "snapserver groups/streams/clients differ from docker/snapserver/server.json; writing the repo copy"
  when: _snapserver_zones_drift | default(false) | bool

- name: Reset snapserver server.json to the repo zone layout
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/{{ _snapserver_state.src }}"
    dest: "{{ _snapserver_state.dest }}"
    owner: root
    group: root
    mode: "0640"
    force: true
  register: _snapserver_zones_reset
  when: _snapserver_zones_drift | default(false) | bool

- name: Template Grafana alerting contact points (injects Vault secrets)
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/docker/grafana/provisioning/alerting/contactpoints.yml.j2"
    dest: "{{ docker_persistent_data_path }}/grafana/provisioning/alerting/contactpoints.yml"
    owner: root
    group: root
    mode: "0640"
    validate: /usr/local/sbin/homelab-config-check yaml %s
  register: grafana_contactpoints
  when: "'router' in inventory_hostname"

- name: Copy Grafana alerting provisioning files (no Jinja2 templating)
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  register: grafana_alerting_copy
  loop:
    - src: "docker/grafana/provisioning/alerting/policies.yml"
      dest: "{{ docker_persistent_data_path }}/grafana/provisioning/alerting/policies.yml"
    - src: "docker/grafana/provisioning/alerting/infrastructure.yml"
      dest: "{{ docker_persistent_data_path }}/grafana/provisioning/alerting/infrastructure.yml"
  when: "'router' in inventory_hostname"

# Vaultwarden's admin-panel settings (/data/config.json) take precedence over
# env vars, so SIGNUPS_ALLOWED=false in global.override.env alone is not
# enough once the panel has saved a config. Keep the key false there too.
- name: Keep Vaultwarden sign-ups disabled in config.json
  ansible.builtin.shell: |
    f={{ docker_persistent_data_path }}/bitwarden/data/config.json
    [ -f "$f" ] || exit 0
    python3 - "$f" <<'EOF'
    import json, os, sys
    p = sys.argv[1]
    d = json.load(open(p))
    if d.get("signups_allowed") is False:
        sys.exit(0)
    d["signups_allowed"] = False
    tmp = p + ".tmp"
    with open(tmp, "w") as f:
        json.dump(d, f, indent=2)
    os.chmod(tmp, 0o700)
    os.replace(tmp, p)
    print("changed")
    EOF
  register: vaultwarden_signups
  changed_when: "'changed' in vaultwarden_signups.stdout"
  when: "'router' in inventory_hostname"

- name: Restart Vaultwarden after config.json change
  ansible.builtin.command:
    cmd: docker restart -t 30 bitwarden
  when:
    - vaultwarden_signups is changed
    - not ansible_check_mode

# One action per container, not per changed file. Looping over
# docker_config_copy.results directly restarted lab_nginx once for each of its
# four templated files, so a single deploy took it down up to 4 times in a row.
# Each `docker restart -t 30` sends nginx SIGQUIT, waits out the full 30s on
# long-lived connections, then SIGKILLs. Measured 2026-10-18: 25 lab_nginx
# starts in 3h during a merge batch, each one a connection-refused window on
# *.lab.nkontur.com (Grafana's Loki datasource included).
- name: Collect containers whose config changed
  ansible.builtin.set_fact:
    _changed_config_containers: "{{ (docker_config_copy.results | selectattr('changed') | map(attribute='item.name') | list
                                     + (['snapserver'] if _snapserver_zones_reset is changed else [])) | unique | list }}"
    _nginx_container_names: "{{ nginx_config | default([]) | map(attribute='name') | list }}"

# nginx mounts its whole conf dir, so the new files are already visible inside
# the container and a graceful reload applies them with no downtime. nginx -t
# runs first: a bad config fails the deploy while the old config keeps serving,
# where a restart would have left nginx dead. A container that is not running
# is skipped; compose-up below starts it with the new config.
#
# `nginx -s reload` only signals the master and returns 0 either way. If the
# master then rejects the config, it logs [emerg] and keeps serving the old
# one, and the deploy used to pass. After the reload, fail if the error log
# gained an [emerg] line, or if the master started no new worker processes
# (a successful reload always replaces its workers).
- name: Reload nginx containers if config changed
  ansible.builtin.shell: |
    set -eu
    c={{ item }}
    if [ "$(docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' "$c" 2>/dev/null)" != "true" ]; then
      echo "$c not running, compose-up will start it"
      exit 0
    fi
    docker exec "$c" nginx -t
    log=/data/log/error.log
    before=" $(docker exec "$c" pgrep -P 1 | tr '\n' ' ') "
    off=$(docker exec "$c" sh -c "wc -c < $log" 2>/dev/null || echo 0)
    docker exec "$c" nginx -s reload
    i=0
    while [ "$i" -lt 30 ]; do
      sleep 0.5
      i=$((i + 1))
      emerg=$(docker exec "$c" sh -c "tail -c +$((off + 1)) $log 2>/dev/null | grep -F '[emerg]'" || true)
      if [ -n "$emerg" ]; then
        echo "$c rejected the new config, still running the old one:" >&2
        echo "$emerg" >&2
        exit 1
      fi
      for p in $(docker exec "$c" pgrep -P 1); do
        case "$before" in
          *" $p "*) ;;
          *) echo "$c reloaded (new worker $p)"; exit 0 ;;
        esac
      done
    done
    echo "$c started no new workers within 15s of reload; new config not applied" >&2
    exit 1
  timeout: 60
  when: not ansible_check_mode
  loop: "{{ _changed_config_containers | intersect(_nginx_container_names) }}"

- name: Restart containers if config change
  ansible.builtin.command:
    cmd: "docker restart -t 30 {{ item }}"
  timeout: 60
  when: not ansible_check_mode
  loop: "{{ _changed_config_containers | difference(_nginx_container_names + ['telegraf']) }}"
  ignore_errors: yes

- name: Restart Telegraf systemd service if config changed
  ansible.builtin.systemd:
    name: telegraf
    state: restarted
  when:
    - "'router' in inventory_hostname"
    - docker_config_copy.results | selectattr('item.name', 'equalto', 'telegraf') | selectattr('changed', 'equalto', true) | list | length > 0
    - not ansible_check_mode

- name: Rebuild Docker images for changed Dockerfiles
  ansible.builtin.command:
    cmd: "docker compose -f {{ docker_compose_dest_path }}/docker-compose.yml build --no-cache {{ item.item.name }}"
  loop: "{{ docker_config_copy.results | selectattr('item.src', 'search', 'Dockerfile$') | selectattr('changed', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode

### Nextcloud post-deploy upgrade
# After image updates, Nextcloud requires `occ upgrade` to migrate the DB schema.
# We capture the container image ID before and after compose-up to detect changes.
# Only runs occ upgrade when the image actually changed, avoiding unnecessary
# maintenance mode on every deploy.
- name: Capture Nextcloud image ID before compose-up
  ansible.builtin.command:
    cmd: docker inspect --format '{% raw %}{{.Image}}{% endraw %}' nextcloud
  register: nextcloud_image_before
  changed_when: false
  failed_when: false
  check_mode: no
  when: "'router' in inventory_hostname"

### NUT (Network UPS Tools) — baremetal installation
# Runs directly on the host so upsmon can call shutdown without container tricks.
# Monitors CyberPower UPS via SNMP and shuts down the host on critical battery.

- name: Install NUT packages
  ansible.builtin.apt:
    name: "{{ _apt_packages }}"
    state: present
    update_cache: true
  vars:
    _apt_packages:
      - nut
      - nut-snmp
  when:
    - "'router' in inventory_hostname"
    - _apt_packages | difference(installed_packages | default([])) | length > 0

- name: Set NUT mode to netserver
  ansible.builtin.copy:
    content: |
      # Managed by Ansible
      MODE=netserver
    dest: /etc/nut/nut.conf
    owner: root
    group: nut
    mode: '0640'
  register: nut_conf
  when: "'router' in inventory_hostname"

- name: Deploy NUT config files
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/base/nut/{{ item.src }}"
    dest: "/etc/nut/{{ item.dest }}"
    owner: root
    group: nut
    mode: "{{ item.mode }}"
    # upsd 2.8 has no config-test mode, so the files that carry the monitor
    # password get structural checks instead (homelab-config-check).
    validate: "{{ item.validate | default(omit) }}"
  loop:
    - { src: "ups.conf", dest: "ups.conf", mode: "0640" }
    - { src: "upsd.conf", dest: "upsd.conf", mode: "0640" }
    - { src: "upsd.users", dest: "upsd.users", mode: "0640", validate: "/usr/local/sbin/homelab-config-check nut-users %s" }
    - { src: "upsmon.conf", dest: "upsmon.conf", mode: "0640", validate: "/usr/local/sbin/homelab-config-check nut-upsmon %s" }
    - { src: "notify.sh", dest: "notify.sh", mode: "0755" }
  register: nut_configs
  when: "'router' in inventory_hostname"

# nut-driver-enumerator.service is a oneshot (no RemainAfterExit): it is
# never "active", so state=started ran it on every deploy. It is enabled
# here and run by its .path unit when ups.conf changes, and by the restart
# task below when a NUT config changes. The drivers it creates belong to
# nut-driver.target, which is kept started.
- name: Enable NUT driver enumerator
  ansible.builtin.systemd:
    name: nut-driver-enumerator.service
    enabled: true
  when:
    - "'router' in inventory_hostname"
    - not ansible_check_mode
    - vault_nut_monitor_password | default('') | length > 0

- name: Enable and start NUT driver units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nut-driver-enumerator.path
    - nut-driver.target
  when:
    - "'router' in inventory_hostname"
    - not ansible_check_mode
    - vault_nut_monitor_password | default('') | length > 0

- name: Enable and start NUT server (upsd)
  ansible.builtin.systemd:
    name: nut-server
    enabled: true
    state: started
  when:
    - "'router' in inventory_hostname"
    - not ansible_check_mode
    - vault_nut_monitor_password | default('') | length > 0

- name: Enable and start NUT monitor (upsmon)
  ansible.builtin.systemd:
    name: nut-monitor
    enabled: true
    state: started
  when:
    - "'router' in inventory_hostname"
    - not ansible_check_mode
    - vault_nut_monitor_password | default('') | length > 0

- name: Restart NUT services on config change
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - nut-driver-enumerator
    - nut-server
    - nut-monitor
  when:
    - "'router' in inventory_hostname"
    - not ansible_check_mode
    - nut_configs.changed or nut_conf.changed
    - vault_nut_monitor_password | default('') | length > 0

- name: Warn if NUT password not in Vault
  ansible.builtin.debug:
    msg: "NUT services NOT started — vault secret 'infrastructure/nut' is missing. Create it with a 'password' field."
  when:
    - "'router' in inventory_hostname"
    - vault_nut_monitor_password | default('') | length == 0

### Snapserver FIFO pipe
# Snapserver reads Bluetooth audio from /tmp/snapfifo (a named pipe).
# If the path doesn't exist, Docker creates it as a directory on bind-mount,
# causing a type mismatch error. Ensure the FIFO exists before compose-up.
- name: Ensure /tmp/snapfifo is a named pipe (FIFO) for snapserver
  ansible.builtin.shell: |
    if [ -e /tmp/snapfifo ] && [ ! -p /tmp/snapfifo ]; then
      rm -rf /tmp/snapfifo
      mkfifo /tmp/snapfifo
      echo changed
    elif [ ! -e /tmp/snapfifo ]; then
      mkfifo /tmp/snapfifo
      echo changed
    fi
  register: snapfifo_ensure
  changed_when: "'changed' in snapfifo_ensure.stdout"
  when:
    - "'router' in inventory_hostname"
    - not ansible_check_mode

# compose up starts every exited container again, so the run-once init
# containers below (no restart policy, exit 0 when there is nothing to do)
# are re-run, in under a second, on every deploy. That alone is not reported
# as a change; anything else is (create, recreate, start of any other
# container, pull, an init container recreated for a new image or config).
- name: Create and start Docker services
  community.docker.docker_compose_v2:
    project_name: "{{ docker_compose_project_name | default('docker') }}"
    project_src: "{{ docker_compose_dest_path }}/"
    files: "{{ docker_compose_file_names }}"
    state: present
    remove_orphans: true
  timeout: 300
  register: _compose_up
  changed_when: >-
    _compose_up.actions is not defined and _compose_up is changed
    or (_compose_up.actions | default([])
        | rejectattr('id', 'in', _compose_oneshot_inits)
        | list | length > 0)
    or (_compose_up.actions | default([])
        | selectattr('id', 'in', _compose_oneshot_inits)
        | rejectattr('status', 'equalto', 'Starting')
        | list | length > 0)
  vars:
    _compose_oneshot_inits:
      - headway-frontend-init
      - headway-travelmux-init
      - pelias-config-init
      - pelias-elasticsearch-init
      - pelias-placeholder-init
  when: not ansible_check_mode

- name: Force recreate containers after daemon config change
  community.docker.docker_compose_v2:
    project_name: "{{ docker_compose_project_name | default('docker') }}"
    project_src: "{{ docker_compose_dest_path }}/"
    files: "{{ docker_compose_file_names }}"
    state: present
    recreate: always
    remove_orphans: true
  timeout: 300
  # docker_conf is registered by configure-docker, which a partial
  # (changed-only) deploy may skip.
  when: docker_conf is defined and docker_conf is changed and not ansible_check_mode

- name: Capture Nextcloud image ID after compose-up
  ansible.builtin.command:
    cmd: docker inspect --format '{% raw %}{{.Image}}{% endraw %}' nextcloud
  register: nextcloud_image_after
  changed_when: false
  failed_when: false
  check_mode: no
  when: "'router' in inventory_hostname"

- name: Run Nextcloud occ upgrade after image change
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ upgrade
  register: nextcloud_occ_upgrade
  retries: 5
  delay: 15
  until: nextcloud_occ_upgrade.rc == 0
  changed_when: "'Update successful' in nextcloud_occ_upgrade.stdout"
  when:
    - "'router' in inventory_hostname"
    - not ansible_check_mode
    - nextcloud_image_after.rc == 0
    - nextcloud_image_before.rc != 0 or nextcloud_image_before.stdout != nextcloud_image_after.stdout

- name: Print Nextcloud occ upgrade output
  ansible.builtin.debug:
    var: nextcloud_occ_upgrade.stdout_lines
  when:
    - nextcloud_occ_upgrade is defined
    - nextcloud_occ_upgrade is not skipped

- name: Enable dnsmasq.d config loading for Pi-hole
  ansible.builtin.replace:
    path: "{{ docker_persistent_data_path }}/pihole/conf/pihole.toml"
    regexp: '^\s*etc_dnsmasq_d\s*=\s*false'
    replace: '  etc_dnsmasq_d = true'
  register: pihole_dnsmasq_d
  when: not ansible_check_mode
  ignore_errors: yes

- name: Set Pi-hole listening mode to ALL for cross-VLAN DNS
  ansible.builtin.replace:
    path: "{{ docker_persistent_data_path }}/pihole/conf/pihole.toml"
    regexp: '^\s*listeningMode\s*=\s*"LOCAL"'
    replace: '  listeningMode = "ALL"'
  register: pihole_listening_mode
  when: not ansible_check_mode
  ignore_errors: yes

- name: Restart Grafana if alerting config changed
  ansible.builtin.command:
    cmd: "docker restart -t 30 grafana"
  timeout: 60
  when: >-
    ((grafana_alerting_copy is defined and grafana_alerting_copy.changed) or
     (grafana_contactpoints is defined and grafana_contactpoints.changed))
    and not ansible_check_mode

- name: Restart pihole if pihole.toml was modified
  ansible.builtin.command:
    cmd: "docker restart -t 30 pihole"
  timeout: 60
  when: (pihole_dnsmasq_d is changed or pihole_listening_mode is changed) and not ansible_check_mode

# Set dns.hosts only when the current value differs. pihole-FTL prints the
# array as "[ a, b ]"; any other format compares unequal and is just set.
- name: Configure Pi-hole local DNS records via pihole-FTL
  ansible.builtin.shell: |
    set -eu
    want={{ ('[ ' ~ (pihole_dns_hosts | join(', ')) ~ ' ]') | quote }}
    cur=$(docker exec pihole pihole-FTL --config dns.hosts)
    [ "$cur" = "$want" ] && exit 0
    docker exec pihole pihole-FTL --config dns.hosts {{ pihole_dns_hosts | to_json | quote }} >/dev/null
    echo changed
  register: pihole_dns_hosts_set
  changed_when: "'changed' in pihole_dns_hosts_set.stdout"
  when:
    - pihole_dns_hosts is defined
    - not ansible_check_mode

# Deluge cache fix: reduce libtorrent disk cache to prevent excessive RAM usage.
# Default cache_size of 512 pieces causes 28GB+ memory consumption with large torrents.
# Repo-managed core.conf sets cache_size to 128, keeping usage under 2GB.
- name: Check if deluge data directory exists
  ansible.builtin.stat:
    path: "{{ docker_persistent_data_path }}/deluge"
  register: deluge_dir

# Compare content only. The linuxserver image chowns /config to abc on every
# start, so asserting owner here made every deploy report "changed" and
# restart deluge. Without owner/group, copy keeps the existing owner.
# deluged saves its in-memory config on shutdown, so a real change is
# written while the container is stopped (stop -> copy -> start), not before
# a restart.
- name: Check Deluge core.conf for drift (managed cache_size, listen port)
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/docker/deluge/core.conf' }}"
    dest: "{{ docker_persistent_data_path }}/deluge/core.conf"
    mode: '0644'
  check_mode: true
  register: deluge_config_check
  when: deluge_dir.stat.exists and not ansible_check_mode

- name: Stop deluge before updating core.conf
  ansible.builtin.command:
    cmd: "docker stop deluge"
  when: deluge_dir.stat.exists and deluge_config_check is changed and not ansible_check_mode

- name: Deploy Deluge core.conf
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') + '/docker/deluge/core.conf' }}"
    dest: "{{ docker_persistent_data_path }}/deluge/core.conf"
    mode: '0644'
  when: deluge_dir.stat.exists and deluge_config_check is changed and not ansible_check_mode

- name: Start deluge after updating core.conf
  ansible.builtin.command:
    cmd: "docker start deluge"
  when: deluge_dir.stat.exists and deluge_config_check is changed and not ansible_check_mode

### OpenClaw config
# Deploy the main OpenClaw config (openclaw.json) from the repo template.
# The template injects the gateway token from Vault.
- name: Deploy OpenClaw config
  ansible.builtin.template:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/docker/openclaw/openclaw.json.j2"
    dest: "{{ docker_persistent_data_path }}/openclaw/data/openclaw.json"
    owner: konoahko
    group: konoahko
    mode: "0600"
    # Must parse as JSON and be at least half the size of the current file and
    # of OpenClaw's last-known-good copy. OpenClaw restores an older config when
    # a new one shrinks by more than 50%, while the deploy still reports
    # success. A deliberate large shrink needs that baseline cleared first.
    validate: >-
      /usr/local/sbin/homelab-config-check json-size %s
      {{ docker_persistent_data_path }}/openclaw/data/openclaw.json
      {{ docker_persistent_data_path }}/openclaw/data/openclaw.json.last-good
  register: openclaw_config
  when: "'router' in inventory_hostname"

- name: Restart OpenClaw gateway if config changed
  ansible.builtin.command:
    cmd: "docker restart openclaw-gateway"
  when: openclaw_config is changed and not ansible_check_mode

### OpenClaw webhook hook transforms
# Deploy hook transform scripts used by the OpenClaw gateway hooks system.
# These parse incoming webhooks (e.g. Grafana alerts) into wake events.
- name: Ensure OpenClaw hooks transforms directory exists
  ansible.builtin.file:
    path: "{{ docker_persistent_data_path }}/openclaw/data/hooks/transforms"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: "'router' in inventory_hostname"

- name: Deploy OpenClaw hook transforms
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: konoahko
    group: konoahko
    mode: "0600"
  loop:
    - src: "docker/openclaw/hooks/transforms/grafana.js"
      dest: "{{ docker_persistent_data_path }}/openclaw/data/hooks/transforms/grafana.js"
  when: "'router' in inventory_hostname"

### OpenClaw approved lessons
# Reviewed lessons file, injected into every agent session by the
# bootstrap-extra-files hook (see openclaw.json.j2). Deployed root-owned so it
# only changes through the repo. Bootstrap files are read per session, so no
# restart is needed. Other workspace files are managed by the agent and are
# not touched here.
- name: Ensure OpenClaw lessons directory exists
  ansible.builtin.file:
    path: "{{ docker_persistent_data_path }}/openclaw/workspace/lessons"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'router' in inventory_hostname"

- name: Deploy OpenClaw approved lessons
  ansible.builtin.copy:
    src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/docker/openclaw/workspace/lessons/AGENTS.md"
    dest: "{{ docker_persistent_data_path }}/openclaw/workspace/lessons/AGENTS.md"
