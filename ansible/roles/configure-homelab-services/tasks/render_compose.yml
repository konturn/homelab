# Render the Jinja2 compose file(s) into the host's ansible state directory.
# Shared by the full deploy (main.yml) and the per-service deploy
# (ansible/service-update.yml). `compose_src_dir` defaults to the
# repo's docker/ directory; the per-service deploy points it at the pre-merge
# copy when rolling back.
#
# The images of the out-of-band services (GitLab, Vault) are pinned on the
# host (docs/AUTOMERGE.md, "Out-of-band updates"): the rendered file names the
# image in <oob_services.<svc>.state_dir>/image, not the one on main, so no
# deploy run from CI changes those images. Only oob-upgrade@<svc> (a host
# timer) moves a pin, with a restore point and rollback. The first deploy
# writes each pin from the running container.
- name: Bootstrap the out-of-band image pins from the running containers
  ansible.builtin.shell: |
    set -eu
    f={{ item.value.state_dir | quote }}/image
    [ -s "$f" ] && exit 0
    img=$(docker inspect {{ item.key | quote }} 2>/dev/null \
      | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["Config"]["Image"])') || exit 0
    printf '%s\n' "$img" | grep -Eq {{ ('^(' + item.value.image_re + '):[A-Za-z0-9][A-Za-z0-9._-]*@sha256:[a-f0-9]{64}$') | quote }} || exit 0
    mkdir -p {{ item.value.state_dir | quote }}
    printf '%s\n' "$img" > "$f"
    echo created
  loop: "{{ (oob_services | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _oob_bootstrap
  changed_when: "'created' in _oob_bootstrap.stdout"
  when: not ansible_check_mode

- name: Read the out-of-band image pins
  ansible.builtin.slurp:
    src: "{{ item.value.state_dir }}/image"
  loop: "{{ (oob_services | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _oob_pins
  failed_when: false

- name: Use the out-of-band image pins
  ansible.builtin.set_fact:
    oob_pins: >-
      {{ dict(_oob_pins.results | selectattr('content', 'defined')
              | map(attribute='item.key')
              | zip(_oob_pins.results | selectattr('content', 'defined')
                    | map(attribute='content') | map('b64decode') | map('trim'))) }}

- name: Check the out-of-band image pins
  ansible.builtin.assert:
    that:
      - oob_pins[item.key] is match('^(' + item.value.image_re + '):[A-Za-z0-9][A-Za-z0-9._-]*@sha256:[a-f0-9]{64}$')
    fail_msg: "{{ item.value.state_dir }}/image is not a digest-pinned {{ item.key }} image"
  loop: "{{ (oob_services | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key in oob_pins

- name: Template out compose file to ansible state directory on host
  ansible.builtin.template:
    src: "{{ (compose_src_dir | default(lookup('env', 'CI_PROJECT_DIR') + '/docker')) + '/' + item }}"
    dest: "{{ docker_compose_dest_path + '/' + item }}"
    owner: root
    group: root
    mode: '0700'
  no_log: true
  loop: "{{ docker_compose_file_names }}"

- name: Apply the out-of-band image pins to the rendered compose file(s)
  ansible.builtin.replace:
    path: "{{ docker_compose_dest_path + '/' + item.1 }}"
    regexp: >-
      ^(\s+image:\s*['"]?)(?:{{ oob_services[item.0].image_re }}):[A-Za-z0-9][A-Za-z0-9._-]*@sha256:[a-f0-9]{64}(['"]?\s*)$
    replace: '\g<1>{{ oob_pins[item.0] }}\g<2>'
  no_log: true
  loop: "{{ (oob_pins | default({})).keys() | list | product(docker_compose_file_names) | list }}"
