# Render the Jinja2 compose file(s) into the host's ansible state directory.
# Shared by the full deploy (main.yml) and the per-service deploy
# (ansible/router-service-update.yml). `compose_src_dir` defaults to the
# repo's docker/ directory; the per-service deploy points it at the pre-merge
# copy when rolling back.
- name: Template out compose file to ansible state directory on host
  ansible.builtin.template:
    src: "{{ (compose_src_dir | default(lookup('env', 'CI_PROJECT_DIR') + '/docker')) + '/' + item }}"
    dest: "{{ docker_compose_dest_path + '/' + item }}"
    owner: root
    group: root
    mode: '0700'
  no_log: true
  loop: "{{ docker_compose_file_names }}"
