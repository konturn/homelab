# Targeted deploy for auto-merged image updates (see docs/AUTOMERGE.md), on
# any host with compose files (router, zwave, satellite-2).
#
# Renders the host's compose files exactly like the full deploy, then pulls
# and recreates ONLY the services listed in the plan (no dependencies, no
# orphan removal), and waits for them to become healthy. On any failure it
# renders the pre-merge compose files, recreates the same services on their
# previous image, re-checks health, records the outcome and fails.
#
# Inputs:
#   -e automerge_host=<inventory host>  the plan's `host` (selects the play's host)
#   AUTOMERGE_PLAN    JSON plan written by `ci/automerge/automerge.py plan-deploy --host`
#   AUTOMERGE_RESULT  path where the outcome JSON is written (on the controller)
#
# Pre-upgrade backups: a version update of a service with
# `pre_upgrade_backup` in ci/automerge-policy.yml (Home Assistant, InfluxDB)
# is backed up by ci/automerge/pre-upgrade-backup.sh before the new image
# starts, and the backup is restored before the rollback starts the previous
# image (docs/AUTOMERGE.md, "Pre-upgrade backups").
#
# Bot-config merges (docs/AUTOMERGE.md, "Bot-config class") also use this
# playbook: changed services (resource limits, log levels) are recreated like
# image updates, and changed Grafana provisioning files (plan `grafana_files`,
# router only) are copied and reloaded through Grafana's API instead of
# restarting it; the rollback copies the previous files back and reloads.
- hosts: "{{ automerge_host }}"
  vars:
    automerge_plan: "{{ lookup('file', lookup('env', 'AUTOMERGE_PLAN')) | from_json }}"
    automerge_result_file: "{{ lookup('env', 'AUTOMERGE_RESULT') }}"
    automerge_services: "{{ automerge_plan.services | map(attribute='service') | list }}"
    automerge_project: "{{ docker_compose_project_name | default('docker') }}"
    automerge_health_script: "{{ lookup('env', 'CI_PROJECT_DIR') }}/ci/automerge/wait-healthy.sh"
    automerge_pre_upgrade_script: "{{ lookup('env', 'CI_PROJECT_DIR') }}/ci/automerge/pre-upgrade-backup.sh"
    automerge_backups: >-
      {{ automerge_plan.services | selectattr('pre_upgrade_backup', 'defined')
         | selectattr('pre_upgrade_backup') | list }}
    automerge_pre_upgrade: "{{ automerge_plan.pre_upgrade | default({}) }}"
    automerge_grafana_files: "{{ automerge_plan.grafana_files | default([]) }}"
    automerge_grafana_script: "{{ lookup('env', 'CI_PROJECT_DIR') }}/ci/automerge/grafana-reload.py"
    automerge_grafana_args: >-
      --host grafana.lab.nkontur.com --ip {{ lab_nginx_ip | quote }}
      {% for kind, flag in [('alerts', '--alerts'), ('dashboard', '--dashboard')] %}
      {%- set fs = automerge_grafana_files | selectattr('kind', 'equalto', kind) | map(attribute='dest') | list %}
      {%- if fs %} {{ flag }}{% for f in fs %} {{ (docker_persistent_data_path ~ '/' ~ f) | quote }}{% endfor %}{% endif %}
      {%- endfor %}

  pre_tasks:
    - name: Validate deploy plan
      ansible.builtin.assert:
        that:
          - automerge_services | length > 0 or automerge_grafana_files | length > 0
          - automerge_result_file | length > 0
          - automerge_plan.host | default('router.lab.nkontur.com') == inventory_hostname
          - automerge_plan.host_files | default(['docker/docker-compose.yml'])
            | map('basename') | difference(docker_compose_file_names | map('trim')) | length == 0
        fail_msg: >-
          AUTOMERGE_PLAN has no services, AUTOMERGE_RESULT is unset, or the plan is for
          another host or for compose files this host does not render

    - name: Validate pre-upgrade backup targets
      ansible.builtin.assert:
        that:
          - automerge_pre_upgrade.dir | default('') | length > 1
          - item.backup_dir.startswith(automerge_pre_upgrade.dir ~ '/' ~ item.service ~ '/')
          - "'..' not in item.backup_dir"
        fail_msg: "{{ item.service }}: backup_dir is not under pre_upgrade.dir/{{ item.service }}"
      loop: "{{ automerge_backups }}"
      loop_control:
        label: "{{ item.service }}"

    - name: Show deploy plan
      ansible.builtin.debug:
        msg: "{{ item.service }}: {{ item.old }} -> {{ item.new }}"
      loop: "{{ automerge_plan.services }}"
      loop_control:
        label: "{{ item.service }}"

  roles:
    - role: fetch-vault-secrets

  tasks:
    - name: Deploy target services with health gate
      block:
        - name: Render post-merge compose file
          ansible.builtin.include_role:
            name: configure-homelab-services
            tasks_from: render_compose

        # A same-tag digest refresh must not change the packaged Nextcloud
        # version: a new version upgrades the installed code and database on
        # start, which rolling back the image cannot undo. Checked before
        # anything is recreated, so a refusal leaves the running container as is.
        - name: Nextcloud - refuse an image whose packaged version differs from the installed one
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              img={{ (automerge_plan.services | selectattr('service', 'equalto', 'nextcloud') | first).new | quote }}
              docker pull -q "$img" >/dev/null
              ver='include $argv[1]; echo implode(".", $OC_Version);'
              want=$(docker run --rm --entrypoint php "$img" -r "$ver" /usr/src/nextcloud/version.php)
              have=$(docker exec nextcloud php -r "$ver" /var/www/html/version.php)
              echo "installed ${have}, image ${want}"
              [ -n "$want" ] && [ "$want" = "$have" ]
            executable: /bin/bash
          changed_when: false
          when: "'nextcloud' in automerge_services"

        # A version update of a service whose new version migrates its data one
        # way: back up that data first. The script pulls the new image, takes
        # any online copy, then stops the container and copies the rest, so
        # the service is down about as long as the recreate below takes.
        - name: Pre-upgrade backup
          ansible.builtin.script:
            cmd: >-
              {{ automerge_pre_upgrade_script }} backup
              --type {{ item.pre_upgrade_backup | quote }}
              --project {{ automerge_project | quote }}
              --service {{ item.service | quote }}
              --dir {{ item.backup_dir | quote }}
              --new-image {{ item.new | quote }}
              --rate {{ automerge_pre_upgrade.rate_mb | default(40) | int }}
            executable: /bin/bash
          loop: "{{ automerge_backups }}"
          loop_control:
            label: "{{ item.service }}"
          register: automerge_backup_out
          timeout: "{{ automerge_pre_upgrade.timeout | default(1800) | int }}"

        - name: Pre-upgrade backup output
          ansible.builtin.debug:
            msg: "{{ automerge_backup_out.results | map(attribute='stdout_lines') | list }}"
          when: automerge_backups | length > 0

        # Keep the newest `keep` backups per service (this one included). A
        # failure here does not fail the deploy.
        - name: Prune old pre-upgrade backups
          ansible.builtin.script:
            cmd: >-
              {{ automerge_pre_upgrade_script }} prune
              --dir {{ item.backup_dir | dirname | quote }}
              --keep {{ automerge_pre_upgrade.keep | default(2) | int }}
            executable: /bin/bash
          loop: "{{ automerge_backups }}"
          loop_control:
            label: "{{ item.service }}"
          ignore_errors: true

        # From here on the new image may have run (and migrated its data), so
        # the rollback restores the pre-upgrade backups.
        - name: Mark the upgrade as started
          ansible.builtin.set_fact:
            automerge_upgrade_started: true

        - name: Pull and recreate only the target services
          community.docker.docker_compose_v2:
            project_name: "{{ automerge_project }}"
            project_src: "{{ docker_compose_dest_path }}/"
            files: "{{ docker_compose_file_names }}"
            services: "{{ automerge_services }}"
            dependencies: false
            remove_orphans: false
            pull: missing
            state: present
          timeout: 900
          # an empty service list would mean every service
          when: automerge_services | length > 0

        - name: Wait for target services to become healthy
          ansible.builtin.script:
            cmd: >-
              {{ automerge_health_script }}
              --project {{ automerge_project | quote }}
              --service {{ item.service | quote }}
              --expect-digest {{ item.new_digest | quote }}
              --timeout {{ item.timeout | int }}
              {% if item.probe %}--probe {{ item.probe | quote }} --probe-ip {{ (nginx_ip if item.probe_via | default('') == 'external' else lab_nginx_ip) | quote }}{% endif %}
            executable: /bin/bash
          loop: "{{ automerge_plan.services }}"
          loop_control:
            label: "{{ item.service }}"
          register: automerge_health
          timeout: 1200

        - name: Health gate output
          ansible.builtin.debug:
            msg: "{{ automerge_health.results | map(attribute='stdout_lines') | list }}"

        - name: Nextcloud - must not be in maintenance mode or need a database upgrade
          ansible.builtin.command:
            cmd: docker exec -u www-data nextcloud php occ status --output=json
          register: automerge_nc_status
          changed_when: false
          retries: 5
          delay: 10
          until: >-
            automerge_nc_status.rc == 0
            and (automerge_nc_status.stdout | from_json).installed
            and not (automerge_nc_status.stdout | from_json).maintenance
            and not (automerge_nc_status.stdout | from_json).needsDbUpgrade
          when: "'nextcloud' in automerge_services"

        # Bot-config: Grafana provisioning files. Reloaded through the API
        # (no restart), then every rule and dashboard in the changed files must
        # read back as the file says.
        - name: Grafana - mark provisioning as changed
          ansible.builtin.set_fact:
            automerge_grafana_started: true
          when: automerge_grafana_files | length > 0

        - name: Grafana - copy merged provisioning files
          ansible.builtin.copy:
            src: "{{ lookup('env', 'CI_PROJECT_DIR') }}/{{ item.src }}"
            dest: "{{ docker_persistent_data_path }}/{{ item.dest }}"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ automerge_grafana_files }}"
          loop_control:
            label: "{{ item.src }}"

        - name: Grafana - reload provisioning and check it took effect
          ansible.builtin.script:
            cmd: "{{ automerge_grafana_script }} {{ automerge_grafana_args }}"
            executable: python3
          environment:
            GRAFANA_ADMIN_PASSWORD: "{{ vault_grafana_admin_password | trim }}"
          register: automerge_grafana_reload
          timeout: 300
          when: automerge_grafana_files | length > 0

        - name: Grafana - reload output
          ansible.builtin.debug:
            msg: "{{ automerge_grafana_reload.stdout_lines | default([]) }}"
          when: automerge_grafana_files | length > 0

      rescue:
        - name: Record failure
          ansible.builtin.set_fact:
            automerge_failure: >-
              {{ ansible_failed_task.name | default('unknown task') }}:
              {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined')
                  | selectattr('failed') | map(attribute='stdout_lines', default=[]) | flatten
                  | select('search', 'FAILED') | list | join(' / '))
                 or (ansible_failed_result.msg | default('see job log')) }}

        - name: Health gate output (failure)
          ansible.builtin.debug:
            msg: "{{ ansible_failed_result.results | default([]) | map(attribute='stdout_lines', default=[]) | list }}"
          when: ansible_failed_result.results is defined

        - name: ROLLBACK - render pre-merge compose file
          ansible.builtin.include_role:
            name: configure-homelab-services
            tasks_from: render_compose
          vars:
            compose_src_dir: "{{ automerge_plan.prev_compose_dir }}"

        # Only once the new image may have started: a failed backup leaves
        # the data as it was. The script stops the container first; the next
        # task starts the previous image on the restored data. A failed
        # restore still starts the previous image, but the rollback counts as
        # unhealthy, so the issue says to restore by hand.
        - name: ROLLBACK - restore pre-upgrade backups
          ansible.builtin.script:
            cmd: >-
              {{ automerge_pre_upgrade_script }} restore
              --type {{ item.pre_upgrade_backup | quote }}
              --project {{ automerge_project | quote }}
              --service {{ item.service | quote }}
              --dir {{ item.backup_dir | quote }}
              --rate {{ automerge_pre_upgrade.rate_mb | default(40) | int }}
            executable: /bin/bash
          loop: "{{ automerge_backups }}"
          loop_control:
            label: "{{ item.service }}"
          register: automerge_restore
          timeout: "{{ automerge_pre_upgrade.timeout | default(1800) | int }}"
          ignore_errors: true
          when: automerge_upgrade_started | default(false)

        - name: ROLLBACK - restore output
          ansible.builtin.debug:
            msg: "{{ automerge_restore.results | default([]) | map(attribute='stdout_lines', default=[]) | list }}"
          when: automerge_upgrade_started | default(false) and automerge_backups | length > 0

        - name: ROLLBACK - record restores
          ansible.builtin.set_fact:
            automerge_restored: "{{ automerge_restored | default([]) + [{'service': item.item.service, 'ok': item is succeeded}] }}"
          loop: "{{ automerge_restore.results | default([]) }}"
          loop_control:
            label: "{{ item.item.service | default('?') }}"
          when: item is not skipped

        - name: ROLLBACK - recreate target services on their previous image
          community.docker.docker_compose_v2:
            project_name: "{{ automerge_project }}"
            project_src: "{{ docker_compose_dest_path }}/"
            files: "{{ docker_compose_file_names }}"
            services: "{{ automerge_services }}"
            dependencies: false
            remove_orphans: false
            pull: missing
            state: present
          timeout: 900
          register: automerge_rollback_up
          ignore_errors: true
          when: automerge_services | length > 0

        - name: ROLLBACK - wait for previous image to become healthy
          ansible.builtin.script:
            cmd: >-
              {{ automerge_health_script }}
              --project {{ automerge_project | quote }}
              --service {{ item.service | quote }}
              --expect-digest {{ item.old_digest | quote }}
              --timeout {{ item.timeout | int }}
              {% if item.probe %}--probe {{ item.probe | quote }} --probe-ip {{ (nginx_ip if item.probe_via | default('') == 'external' else lab_nginx_ip) | quote }}{% endif %}
            executable: /bin/bash
          loop: "{{ automerge_plan.services }}"
          loop_control:
            label: "{{ item.service }}"
          register: automerge_rollback_health
          timeout: 1200
          ignore_errors: true
          when: automerge_rollback_up is succeeded

        - name: ROLLBACK - health gate output
          ansible.builtin.debug:
            msg: "{{ automerge_rollback_health.results | default([]) | map(attribute='stdout_lines', default=[]) | list }}"

        - name: ROLLBACK - Grafana - copy previous provisioning files
          ansible.builtin.copy:
            src: "{{ item.prev }}"
            dest: "{{ docker_persistent_data_path }}/{{ item.dest }}"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ automerge_grafana_files }}"
          loop_control:
            label: "{{ item.src }}"
          register: automerge_grafana_rb_copy
          ignore_errors: true
          when: automerge_grafana_started | default(false)

        - name: ROLLBACK - Grafana - reload previous provisioning
          ansible.builtin.script:
            cmd: "{{ automerge_grafana_script }} {{ automerge_grafana_args }}"
            executable: python3
          environment:
            GRAFANA_ADMIN_PASSWORD: "{{ vault_grafana_admin_password | trim }}"
          register: automerge_grafana_rb
          timeout: 300
          ignore_errors: true
          when: automerge_grafana_started | default(false) and automerge_grafana_rb_copy is succeeded

        - name: ROLLBACK - Grafana - reload output
          ansible.builtin.debug:
            msg: "{{ automerge_grafana_rb.stdout_lines | default([]) }}"
          when: automerge_grafana_started | default(false)

        - name: ROLLBACK - outcome
          ansible.builtin.set_fact:
            automerge_restores_ok: "{{ automerge_restored | default([]) | rejectattr('ok') | list | length == 0 }}"
            automerge_rollback_ok: >-
              {{ automerge_rollback_up is succeeded and automerge_rollback_health is succeeded
                 and automerge_restored | default([]) | rejectattr('ok') | list | length == 0
                 and (not (automerge_grafana_started | default(false))
                      or (automerge_grafana_rb_copy is succeeded and automerge_grafana_rb is succeeded)) }}

        - name: Write failure result
          ansible.builtin.copy:
            content: "{{ {'status': 'failed', 'failure': automerge_failure,
                          'rollback_healthy': automerge_rollback_ok | bool,
                          'upgrade_started': automerge_upgrade_started | default(false),
                          'restored': automerge_restored | default([])} | to_nice_json }}"
            dest: "{{ automerge_result_file }}"
            mode: '0644'
          delegate_to: localhost

        - name: Fail the deploy
          ansible.builtin.fail:
            msg: >-
              Per-service deploy of {{ automerge_services | join(', ') }} failed ({{ automerge_failure }}).
              Rolled back to the previous image:
              {{ 'healthy' if automerge_rollback_ok | bool else 'STILL UNHEALTHY' }}{{
                 '' if automerge_restores_ok | bool else ' (a pre-upgrade restore FAILED)' }}.

    - name: Write success result
      ansible.builtin.copy:
        content: "{{ {'status': 'success'} | to_nice_json }}"
        dest: "{{ automerge_result_file }}"
        mode: '0644'
      delegate_to: localhost
